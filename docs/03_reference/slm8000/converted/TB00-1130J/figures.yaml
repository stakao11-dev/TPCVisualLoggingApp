# TB00-1130J（SLM8000 ユーザーズマニュアル メンテナンス編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

f7b9c0e3:
  alt: 1-1 制御用DC電源の電圧の測定箇所（CN3）
  text: |
    電源コネクタを SLM8000 の CN3 に差した絵。CN3 の端子（24V、024、FG と読める）のうち、矢印で示した 2 本の間を「この間で測定」。

7bb59a16:
  alt: 1-1 セッティングPC起動時のエラー（サイド バイ サイド構成）
  text: |
    ダイアログ「C:¥Users¥TP-E580¥Desktop¥Slm8000¥Slm8000drv.exe」。「C:¥Users¥TP-E580¥Desktop¥Slm8000¥Slm8000drv.exe　このアプリケーションのサイド バイ サイド構成が正しくないため、アプリケーションを開始できませんでした。詳細については、アプリケーションのイベント ログを参照するか、コマンド ライン ツール sxstrace.exe を使用してください。」、OK ボタン。

ccb51e8d:
  alt: 1-1 エクスプローラーの vcredist_x86.exe
  text: |
    エクスプローラーで「D:¥vcredist¥32bit」を開いた画面。ファイル「vcredist_x86.exe」（2019/02/23 13:14、アプリケーション、4,034 KB）。左のツリーに BD-RE ドライブの Slm8000、vcredist（32bit、64bit）。

5e721a81:
  alt: 1-1 Microsoft Visual C++ 2008 Redistributable セットアップ（ようこそ）
  text: |
    「Microsoft Visual C++ 2008 Redistributable セットアップへようこそ」「このウィザードに従ってインストールを進めます。」。「次へ(N)」ボタンが赤丸で囲まれている。

00ec3edf:
  alt: 1-1 Microsoft Visual C++ 2008 Redistributable セットアップ（ライセンス条項）
  text: |
    「ライセンス条項」の画面。「同意する(A)」のチェックボックスと「インストール(I)」ボタンが赤丸で囲まれている。

3ec5bbbc:
  alt: 1-1 Microsoft Visual C++ 2008 Redistributable セットアップ（インストール中）
  text: |
    「コンポーネントのインストール」の画面。「選択した項目がインストールされます。」、インストールの進行状況のバー、「インストールを初期化しています。」。

03a017ac:
  alt: 1-1 Microsoft Visual C++ 2008 Redistributable セットアップ（完了）
  text: |
    「セットアップ完了」の画面。「Microsoft Visual C++ 2008 Redistributable が正常にインストールされました。」、「完了(F)」ボタン。

c18c7e22:
  alt: 1-1 Microsoft Visual C++ 2008 Redistributable セットアップ（メンテナンス モード）
  text: |
    「メンテナンス モード」の画面。「下のオプションから選択してください。」、選択肢「修復(R)」（Microsoft Visual C++ 2008 Redistributable を元の状態に修復します。）と「アンインストール(U)」（Microsoft Visual C++ 2008 Redistributable をこのコンピュータから削除します。）。

d128f74a:
  alt: 1-1 7セグLEDの表示内容と状態
  text: |
    | LED表示内容 | 発生エラー |
    |---|---|
    | 0 点滅 | 正常動作 |
    | 1 点灯 | システム初期化中 |
    | 5 点灯 | RTC動作待ち |
    | 8 点滅 | FPU例外 |
    | 11 (b) 点滅 | 不正割り込み |
    | 12 (c) 点滅 | NMI発生(電源電圧(5V)低下) |
    | 14 (E) 点滅 | ウォッチドッグエラー |
    | h 点滅 | IPアドレス初期化モード |

19e8c9a3:
  alt: 3-1 一部の入力が不可の時の調査（チェック箇所）
  text: |
    - 「センサ」→「A：中継端子台」→ SLM の「B：入力コネクタ」→「通信」→ PC の「セッティングPCソフト 入出力モニタ画面」
    - 「センサにLED等あれば ON/OFFチェック」
    - 表: センサが ON のとき I/Oモニタ画面は A接 ●（黒）・B接 ○（白）、OFF のとき A接 ○・B接 ●

ceda11e5:
  alt: 3-2 一部の出力が不可の時の調査（チェック箇所）
  text: |
    - PC の「セッティングPCソフト 入出力モニタリング画面（強制出力）」→「通信」→ SLM →（B）→ 中継端子台（A）→「ソレノイド、リレーコイル等」
    - 「出力回路の ON/OFF状態」。下に「制御盤回路図」「機体配線図」の範囲を示す括弧

e2df5213:
  alt: 3-3 サーボ関連異常の調査（ケーブルをはずして JOG）
  text: |
    SLM と X軸のサーボアンプをつなぐケーブルの、サーボアンプ側を「はずす」。サーボアンプの先にモータ（M）。「オペレーションパネルよりサーボNO．JOG移動指令を行います。」

69509cd0:
  alt: 「注意」の見出しの絵

99f1a775:
  alt: 3-3-1 配線の入れ替え、軸の交換による調査（構成）
  text: |
    SLM から X軸・Y軸のサーボアンプへケーブル、サーボアンプから「エンコーダケーブル」「モータケーブル」で X軸モータ・Y軸モータへ。Y軸モータが「異常動作」。下に調べる部位: a コントローラ、b ケーブル、c アンプ、d モータケーブル、e モータ/PG。

40dcd571:
  alt: 3-3-1 配線の入れ替え、軸の交換による調査（判定表）
  text: |
    例: Y軸のモータが異常動作した場合。○ は正常、？ は原因の可能性あり。

    | 入れ替え | セッティングPC操作 異常/正常 | SLM | ケーブル SLM-SV | サーボアンプ | ケーブル サーボモータ | モータ/PG |
    |---|---|---|---|---|---|---|
    | 通常 | X軸指令 正常 | ○ | ○ | ○ | ○ | ○ |
    | 通常 | Y軸指令 異常 | ？ | ？ | ？ | ？ | ？ |
    | SLM～サーボケーブル交換 | X軸指令 正常 | ○ | ？ | ？ | ？ | ？ |
    | SLM～サーボケーブル交換 | Y軸指令 異常 | ？ | ○ | ○ | ○ | ○ |
    | アンプ～モータケーブル交換（注意） | X軸指令 正常 | ○ | ○ | ○ | ？ | ？ |
    | アンプ～モータケーブル交換（注意） | Y軸指令 異常 | ？ | ？ | ？ | ○ | ○ |

    各行の左の絵: SLM の X軸指令・Y軸指令が XS・YS（サーボアンプ）を経て M・PG へつながる。「SLM～サーボケーブル交換」では SLM と XS・YS の間を、「アンプ～モータケーブル交換」では XS・YS と M・PG の間を入れ替える。

7fc95af2:
  alt: 3-4 SLM8000 基板のバッテリーの位置
  text: |
    SLM8000 基板の配置図。上辺に 電源（CN3）、Ethernet（CNETR）、CN1サーボ 8軸、CN2 I/O。右辺に CNEXT FB10ch。左辺に CN5、CN5A、CN5DA、CN7。中央に LED1、SHCPU、外部フラッシュ（と読める）、SRAM、SDRAM、DSW1、MAX10 (FPGA)、CR2032。「バッテリー」の吹き出しが CR2032 を指す。

f4ba829f:
  alt: 5-2-2 FLASH書き込みソフトの画面
  text: |
    ウィンドウ「標準SLM8000 Flash書込ソフト ( C:¥Slm8000¥sl…」。
    - ファイル名: C:¥Slm8000¥flash¥SLM02001.ufd（矢印で指す）
    - シリアルNo.: SLM － 02001、SUM: 203B
    - ボタン: グループファイル読出、ファイル読出、ダウンロード、終了

5ec1f400:
  alt: 5-3-1 SLM8000 Installer
  text: |
    ダイアログ「SLM8000 Installer」。「インストールするフォルダを設定して下さい。」、フォルダ「c:¥Slm8000」、ボタン: 参照、OK、キャンセル。

6f8201a8:
  alt: 6-2 SLM8000 基板のディップスイッチ（DSW1）の位置
  text: |
    3-4 と同じ基板の配置図で、DSW1 が赤丸で囲まれている。

15bbd7de:
  alt: 6-2 ディップスイッチ（DSW1）の設定
  text: |
    | モード | DSW1 1 | DSW1 2 | DSW1 3 |
    |---|---|---|---|
    | 通常 | OFF | OFF | OFF |
    | 初期IPアドレス一時変更モード | ON | OFF | ON |
    | 初期IPアドレス書き換えモード | ON | ON | ON |

    スイッチ 4 は、絵ではどのモードでも OFF 側。
