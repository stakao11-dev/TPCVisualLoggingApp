# TB00-1130C（SLM8000 ユーザーズマニュアル ハードウェア編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# - 配線図・接続図は細かいため、読める信号名と接続を中心に書いた。縮小されて読めない文字は「（判読できず）」とした。
# - AS710 は SLM8000 の基板の型式として図に書かれている名前。

daee018a:
  alt: 「注記」の吹き出し

16ecd05f:
  alt: 3-3-1 電気的仕様一覧（サーボ軸関連）
  text: |
    | 種別 | コネクタ | 信号名 | 機能名称 | 電気的仕様 |
    |---|---|---|---|---|
    | サーボ軸関連 | CN1（第1～8軸） | POUT□、PDIR□ | パルス軸指令 | ラインドライバ出力 MC3487相当 |
    | サーボ軸関連 | CN1（第1～8軸） | PGC□、*PGC□ | PG FB 入力 C(Z)相 | 受信IC（AM26LV32相当）。PGA・*PGA (O.C) を 1.5K、1K、4.7kΩ、1000p の回路で受けて PAI (PBI) へ |
    | サーボ軸関連 | CNEXT 軸FB 8CH | PGFBA□、*PGFBA□、PGFBB□、*PGFBB□ | PG FB（A/B相） | 同上 |
    | サーボ軸関連 | CNEXT 手パ 2CH | HPGA1/2、*HPGA1/2、HPGB1/2、*HPGB1/2 | PG FB（A/B相） | 同上 |
    | サーボ軸関連 | CN1（第1～8軸） | SALM□ | 入力。COM□の24V(ソース入力)/024(シンク入力)の選択で入力電流方向を可変 ※"②"を参照 | COM1 から 3.9K、フォトカプラ TLP292、1K（2線式対応）を経て 入力 SALM□ |
    | サーボ軸関連 | CN1（第1～8軸） | SVON□、SVRST□ | 出力 | オープンコレクタ出力 最大100mA 耐圧 50V ※"①"を参照 |
    | サーボ軸関連 | CNEXT | SEN□ | 出力 | トランジスタ出力(安川電機絶対値エンコーダ仕様)。AS710 内のフォトカプラ TLP292（5V）から SEN□出力、0V |

8ae26909:
  alt: 3-3-1 誘導負荷の対策（サージサプレッサダイオード）
  text: |
    トランジスタ出力と 24V の間のリレーコイルに、並列にサージサプレッサダイオードを付ける。

eec252d2:
  alt: 3-3-1 入力信号のソース/シンク切替
  text: |
    - シンク入力（ソース出力を接続する場合）: 24V → スイッチ → RI□□、SALM□、OT□ etc.。COM□ は 0₂₄
    - ソース入力（シンク出力を接続する場合）: 0₂₄ → スイッチ → RI□□、SALM□、OT□ etc.。COM□ は 24V

eb32137b:
  alt: 3-3-2 エンコーダFBパルスの受信回路
  text: |
    受信IC。PGA と *PGA (O.C) を、1.5K・1K のプルアップ、1K・470Ω、1000p のコンデンサの回路で受け、PAI (PBI) を出力する。

5e63dc5b:
  alt: 3-3-2 PAI と PBI の位相差
  text: |
    PAI と PBI の波形。各エッジの間隔が T1、T2、T3、T4。

c5c85c40:
  alt: 3-4-1 パルス指令ドライバ（アンプ）との接続の電気的仕様
  text: |
    左が AS710 ボード、右が「パルス指令型サーボ/パルスモータドライバ」。
    - MC3487（5V、EN12、EN34）の出力 POUT1+、POUT1−、PDIR1+、PDIR1−、POUT2+、POUT2−、PDIR2+、PDIR2− → ドライバ側【差動】100～470Ω とフォトカプラ（VF）。「第３～８軸も同様な回路です」
    - 24V供給コネクタ: +24V CN3−1、CN3−2（GND）← 外部電源 DC24V
    - SALM: +24V から 3.9K、330 とフォトカプラ ← ドライバ側【出力信号】サーボアラーム出力
    - SVON サーボオン、SVRST アラームリセット: トランジスターアレー（東芝 TD62083AP 相当）最大出力 100mA 耐圧 50V ※1 → ドライバ側【入力信号】サーボオン、アラームリセット（+24V）
    - +OT□、−OT□、原点□: +24V から 3.9K、330 とフォトカプラ ← ±OT、原点信号のスイッチ。「+24Vは、AS-700内でコモン」
    - ※1: ソレノイドやマグネットコイルなどの誘導性負荷には、必らずサージサプレッサ(ダイオードなど)を付けて下さい！

4d1bac4f:
  alt: 3-4-1 誘導負荷の対策（サージサプレッサダイオード）
  text: |
    ■誘導負荷の対策。トランジスタ出力と 24V の間のリレーコイルに、並列にサージサプレッサダイオードを付ける。

fe2cf6c1:
  alt: 3-4-2 差動出力波形の立上り/立下り時間
  text: |
    パルス 1 つの波形。パルス幅 TH、立上り時間 TR、立下り時間 TF。

9dbbef82:
  alt: 3-4-3 指令極性と信号極性
  text: |
    「指令(座標) +方向/−方向」→ ? →「モータ回転方向 CW/CCW」→ ? →「ドライバ(アンプ)の信号極性 パルス波形」。最初の ? は「指令回転方向」、次の ? は「信号極性」。注記: ドライバ(アンプ)メーカにより異なります。

8afb171e:
  alt: 3-4-3 P.PLS/DIR 形態の波形
  text: |
    POUT+ にパルス列、PDIR+ は (L)。

5e938278:
  alt: 3-4-3 A.A/B 相形態 (+指令) の波形
  text: |
    POUT+ (PA+) と PDIR+ (PB+) が位相をずらしたパルス。(A相進み)

fea32a79:
  alt: 3-4-3 モータの回転方向（CCW・CW）
  text: |
    モータ軸を正面から見た絵。左回りが CCW、右回りが CW。

dace9f0d:
  alt: 3-5 入力信号の漏れ電流と残留電圧（2線式センサ）
  text: |
    「ユーザ殿センサ」と「SLM 内部回路」（24V、3.9K、330、フォトカプラ）。センサに流れる電流 Iʟ と、センサの残留電圧 Vr。

f7713a8f:
  alt: 「注意」の吹き出し

24ae41f6:
  alt: 3-4-3 C.CW/CCW 形態 (+指令) の波形
  text: |
    【C.CW/CCW 形態 (+指令)】POUT+ (CW) にパルス列、PDIR+ (CCW) は (L)。

368885dc:
  alt: 4-1 周辺接続概観図
  text: |
    SLM8000 コントローラの基板と周辺機器の接続。読める範囲:
    - パソコンとの RS-232C 接続、パソコンとの Ethernet 接続
    - 8ch AD入力 (0～5V)、2ch DA出力 (DA001基板との接続)
    - 電源 24V（DC電源）
    - パルス指令 8軸（DRV → P.S (SVM) など）
    - CN2 I/O: ±OT、DEC、専用出力、汎用入出力、機械操作パネル、中継コネクタ（端子台）
    - CNEXT: エンコーダFB、手動パルサ（HPG）
    - 外部バッテリ
    - 注記: 他パルス指令接続(CN1→サーボアンプ)と、エンコーダFB接続(エンコーダ→CNEXT) は…（以降判読できず）
    細部は小さくて判読できず。

20114cbf:
  alt: 4-2 全体接続図とサーボ主電源回路
  text: |
    AS710 を中心にした全体の接続図。読める範囲:
    - 24V 電源 → CN3
    - CN5（シーケンサ等の RS232C）、CN5A（PC のセッティングPC RS232C）
    - CN1 サーボ（第1軸～）→ サーボアンプ（SV/PWD など）→ 各軸モータ
    - CNEXT → PG（同期送り、手動パルサー）
    - CNETR ← 市販LANケーブル ← PC
    - CN2 I/O（1～40、41～80）→ 機械操作パネル、汎用入出力 など
    - 【サーボ主電源回路】AC200V、非常停止、サーボ主電源MC、SVM
    - CNBAT: PANSY BAT（電池）、Lithium 3.6v
    細部は小さくて判読できず。

645a1a84:
  alt: 4-3 DC電源ケーブル
  text: |
    (1) ケーブル外観。【SLM】AS710 CN3 の 1 +24V（オレンジ）、2 0₂₄V（クロ）、3 FG（ミドリ）→【DC電源】。AWG#20、長さ 3m。
    - ケーブル型式: CB-C-004-00
    - ケーブル側: 日圧 VHR-3N
    - コンタクト: SVH-21T-P1.1 ×3コ

451aa734:
  alt: 4-4 セッティングPC用ケーブルの外観
  text: |
    「SLM側」と「PC側」の D-SUB コネクタをつなぐケーブル。長さ 2m～3m。

d70b0c92:
  alt: 4-4 セッティングPC用ケーブルの結線
  text: |
    | DSUB 9P オス（SLM側） | DSUB 9P メス（PC側） |
    |---|---|
    | SD 2 | 2 RD |
    | RD 3 | 3 SD |
    | RS 4 | 8 CS |
    | (CS) 5 | 7 RS |
    | 0V 7 | 5 0V |
    | （シールド） | (5 FG)(シールド付きの場合) |

8b0fa6f5:
  alt: 4-5 CN1 パルス列指令形サーボとの接続（安川 SGDH-Ⅱ の例）
  text: |
    AS710 の CN1・CNEXT と 安川 SGDH-Ⅱ の 1CN の接続。
    | AS710 | ピン | SGDH-Ⅱ 1CN |
    |---|---|---|
    | CN1 POUT1+ | 1 | 7 PULS |
    | CN1 POUT1− | 2 | 8 /PULS |
    | CN1 0V | 7 | 1 SG |
    | CN1 PDIR1+ | 3 | 11 SIGN |
    | CN1 PDIR1− | 4 | 12 /SIGN |
    | CN1 *PGC1 | 5 | 20 /PCO |
    | CN1 PGC1 | 6 | 19 PCO |
    | CN1 SALM1 | 10 | 31 ALM+ |
    | CN1 024 | 8 | 32 ALM− |
    | CN1 +24V | 9 | 47 +24VIN |
    | CN1 SVON1 | 11 | 40 S-ON |
    | CN1 SVRST1 | 12 | 44 /ALM-RST |
    | CNEXT PGFBA1 | 3 | 33 PAO |
    | CNEXT *PGFBA1 | 4 | 34 /PAO |
    | CNEXT PGFBB1 | 5 | 35 PBO |
    | CNEXT *PGFBB1 | 6 | 36 /PBO |
    | CNEXT 0V | 2 | 1 SG |
    | CNEXT SEN1 ※ | 31 | 4 SEN ※ |

    SGDH-Ⅱ の U・V・W・E → X軸モータ、2CN ← 安川ケーブル（エンコーダ）、r・t（AC200V）。※絶対値エンコーダの場合のみ配線

127b5bd5:
  alt: 4-5 CN1 パルス列指令形サーボとの接続（三菱 MR-J2 の例）
  text: |
    改訂マーク ◆1.3。SLM-8000 (AS710) の CN1 (100P/20R) と サーボアンプ MR-J2-10A の CN1A・CN1B・CN2 の接続、SERVOMOTOR HC-MF13(-S)(1/12) への配線。CN1 の POUT1+、POUT1−、0V、PDIR1+、PDIR1−、C相入力、SALM1、+24、SVON1、ARST1 と、アンプ側の PP、PG、LG、NP、NG、LZ、ALM、COM(+24V)、S-ON、ARST、SG、EMG、ABSM、ABSR、D01、ZSP、TLC などがつながる。注記 ※1～※3（J2との接続ではGND補強すべき、J2の接続では外部非常停止 (EMG) を接続してください、絶対値エンコーダの場合のみ配線 と読める）。
    細部は小さくて判読しにくい。

ea02b085:
  alt: 4-6-1 CNEXT標準ケーブル
  text: |
    型式: CB-F-H68。CNEXT（1～68）から 68芯フラットケーブル、長さ 4m。

1ab3c1c9:
  alt: 4-6-2 CNEXT標準例（PG FB）
  text: |
    改訂マーク ◆1.1。「PG FB リニアスケール (一般のPG)」の PGA、*PGA、PGB、*PGB、PGC、*PGC、+5V、0V → AS710 CNEXT の 3 PGFBA1、4 *PGFBA1、5 PGFBB1、6 *PGFBB1、6(CN1) PGC1、5(CN1) *PGC1、1 +5V、2 0V。CNEXT 内は受信IC（1K、1K、470Ω、1000p）。CNEXTのPG FBの用途: 手動パルサー入力（オプション）、コンベア(同調/同期)追従送り＜専用化＞。

89e3fe8c:
  alt: 4-6-2 CNEXT標準例（手動パルサー）
  text: |
    「手動パルサーユニット (O.Cの場合)」の HPGA、HPGB、5V、0V → AS710 CNEXT の 56 *HPGA1 (OC)、58 *HPGB1 (OC)、53 +5V、54 0V。CNEXT 内は受信IC。手動パルサーユニットの 手パ、HAX0、HAX1、HMP0、HMP1、024 は「CN2 機械操作パネル I/F」へ。

b847a334:
  alt: 4-7 CN7 AD入力
  text: |
    改訂マーク ◆1.3。「アナログ信号 0～+3.3V <オプション>」→ AS710 CN7 の 1 +3.3V、2 0V、3 PF0/AD10、4 PF1/AD11、5 PF2/AD12、6 PF3/AD13、7 PF4/AD14、8 PF5/AD15、9 PF6/AD16、10 PF7/AD17。AD入力 (10Bit AD) 0～+3.3V。

b149d64c:
  alt: 5-1 SLM8000 システム起動時シーケンス
  text: |
    タイミングチャート。読める範囲:
    - 5V、24V の立ち上がり → CPUリセット（リセット幅 120～150msec）→ 初期化処理 → 制御割込（OT、ESP、SALM チェック）
    - SVRST出力（TARST：サーボリセット保持時間(ROMSW)）
    - 【システム起動時サーボON の場合】(ROMSW): SVM（TSMSL：サーボアラーム無視時間(ROMSW)）、SVON□（TONDELAY：サーボON遅延時間(ROMSW)）、SVRST出力、その他の処理、自動原点復帰(オプション)（TORG：自動原点復帰ディレイ(ROMSW)）
    - 【システム起動時サーボON でない場合】(ROMSW): ONSW入力又は…、リセット操作(入力、パネル、PC)、SVON/SVM。(A) 上記の(A)以降のシーケンス
    細部は小さくて判読しにくい。

acc0d1ae:
  alt: 5-2 電源断時の処理
  text: |
    タイミングチャート。5V・24V が下がり、4.8～4.85VでNMI発生(停電検出) → NMI処理で軸指令クリア → SVM、SVON はサーボOFF → その他の出力は出力OFF（ONアクティブ）。注記: ただし、OFFアクティブ指定の出力は、一度ON(ノンアクティブ)して、電源の低下とともにOFFします。

3a6d37d7:
  alt: 5-3 アラーム時の処理
  text: |
    タイミングチャート。アラーム検知（非常停止、±OT、SALM、SPALM、外部アラームA、各種内部エラー）→ アラーム処理で軸指令クリア → SVM は主電源OFF(SVONと同時にOFF)、EMO は外部非常停止出力、SVON はサーボOFF（TOFFDELAY 後）。TOFFDELAY：アラーム時サーボOFF遅延時間(ROMSW)。
