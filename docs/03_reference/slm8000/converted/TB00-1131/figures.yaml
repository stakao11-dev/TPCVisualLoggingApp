# TB00-1131（SLM8000 セッティングPC マニュアル）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# 3-1 画面ツリーの図（60c88090～cdd96143）は、各画面の縮小画像。画面の詳しい内容は 4 章の同じ画面の図に書いた。

60c88090:
  alt: 3-1 画面ツリー（全体）
  text: |
    メインメニュー（運転、パラメータ、表示設定、バージョン情報、終了）から開く画面のつながりを、縮小画像で示した図。
    運転 → 運転操作パネル（各画面）、パラメータ → サーボパラメータ設定画面・バックアップデータ初期化・ピッチエラー補正データ（オプション）・工具長補正データ（オプション）・工具径補正機能パラメータ（オプション）・補間前加減速パラメータ（オプション）、表示設定 → 通信設定・セッティングPC動作設定・ポジション表示設定・入出力表示設定、バージョン情報。
    縮小画像の文字は小さくて判読できず。

39798c37:
  alt: 3-1 運転操作パネルのメニュー
  text: |
    運転操作パネルのメニュー: ポジション(A)、入出力(B)、制御軸(C)、プログラム設定(D)、ティーチング(E)、マクロ変数(F)、オプション(G)、エラー情報(H)。右に「運転画面」の縮小画像。

28e0c766:
  alt: 3-1 A ポジション表示
  text: |
    A ポジション表示のメニュー: 指令位置、機械位置、偏差量、アブソ位置、相対移動量。それぞれの表示画面（■指令位置、■機械位置、■偏差量、■アブソ位置、■相対移動量）の縮小画像。

fd68741c:
  alt: 3-1 B 入出力（入出力状態・機械パネル入力）の縮小画像

d4b48b9e:
  alt: 3-1 C 制御軸（軸設定）の縮小画像

39c79763:
  alt: 3-1 C 制御軸（各軸ステータス）の縮小画像

cbc26feb:
  alt: 3-1 D プログラム管理の縮小画像

1a98f7c4:
  alt: 3-1 E ティーチングの縮小画像

3ff6f134:
  alt: 3-1 F マクロ変数の縮小画像

244baae8:
  alt: 3-1 G オプションメニュー
  text: |
    オプションメニューの項目: 主軸操作、TPCロギング、手動パルサモード、センサーラッチ、FBカウンターモニタ、工具長補正情報、工具径補正情報、制御周期モニタ、工具径補正エラー情報、位置決めポイントテーブル作成、位置決めポイントテーブルモニタ。

44f7cea4:
  alt: 3-1 主軸操作の縮小画像

bea18725:
  alt: 3-1 マクロ変数書き込みの縮小画像

61a5ba53:
  alt: 3-1 ■TPCロギングの縮小画像（4-2-8-2 と同じ画面）

a734bab5:
  alt: 3-1 手動パルサモードの縮小画像

653b09ba:
  alt: 3-1 フィードバックカウンタモニタの縮小画像

3fcd2e07:
  alt: 3-1 ■センサーラッチモニタの縮小画像

e2ffb1a4:
  alt: 3-1 工具長補正情報の縮小画像

ecf1e090:
  alt: 3-1 工具径補正情報の縮小画像

9c3e3bb0:
  alt: 3-1 制御周期モニタ（RtcMonitor）の縮小画像（4-2-8-8 と同じ画面）

70f38a65:
  alt: 3-1 ■工具径補正エラー情報の縮小画像

36892d1c:
  alt: 3-1 位置決めポイントテーブル作成の縮小画像

04b603e0:
  alt: 3-1 位置決めポイントテーブルモニタの縮小画像

cdd96143:
  alt: 3-1 ■エラー情報の縮小画像

421592b9:
  alt: 4-1 メインメニュー
  text: |
    ウィンドウ「標準SLM8000 セッティングPCソフト（C:¥Slm8000¥slm8000drv.ini）」。タイトルに、使っている ini ファイルのパスが表示される。
    メニュー: 運転、パラメータ、表示設定、バージョン情報、終了。

fcc2a832:
  alt: 4-2 運転画面
  text: |
    運転画面の構成: 上が「ポジション表示表示」（X、Y、Z、A の位置）、中が「操作メニュー」（ポジション、入出力、制御軸、プログラム設定、ティーチング、マクロ変数、オプション、エラー情報）、下が「運転操作画面」。

5b217234:
  alt: 4-2-1 運転操作画面（各部の番号）
  text: |
    運転操作パネルに、本文の番号が付いている。
    - メニュー A～H（ポジション、入出力、制御軸、プログラム設定、ティーチング、マクロ変数、オプション、エラー情報）
    - ① タスク選択（タスク0）、② 動作モード（自動運転）、③ プログラム情報、④ オーバライド・補間オーバライド・主軸オーバライド（100）、⑤ 接線制御、⑥ 巻線 最終層異常、⑦ 選択プログラム番号、⑧ Mコード、⑨ 送りモード（JOG、インチングx1000～x1、手動原点復帰、自動原点復帰）、⑩ 軸キー（各軸の手動操作。X-/X+ など）
    - ⑪～⑰ 下のボタン: スタート、ストップ、1ショット位置決め、原点設定、原点復帰、ホーム位置、リセット

d9de301c:
  alt: 4-2-1 1ショット位置決め画面
  text: |
    「位置決めモード」: インクレPTP、論理座標系アブソPTP、機械座標系アブソPTP、インクレ直線補間、論理座標系アブソ補間、機械座標系アブソ補間、SPIN（無限回転軸回転動作）、同期軸無視 インクレPTP・論理アブソPTP・機械アブソPTP（灰色）。
    「移動量/目標位置」X、Y、Z、A（パルス）、「補間速度」（パルス/秒）。ボタン: 移動開始、移動再開、移動停止、閉じる。

61a7d110:
  alt: 4-2-2 指令位置の表示
  text: |
    「指令位置」の表示（緑の背景）。X 0.000、Y 0.000、Z 0.000、A 0.000。

65c6f420:
  alt: 4-2-2 機械位置の表示
  text: |
    「機械位置」の表示（黄色の背景）。X、Y、Z、A とも 0.000。

06cab22d:
  alt: 4-2-2 アブソ位置の表示
  text: |
    「アブソ位置」の表示（青の背景）。X、Y、Z、A とも 0.000。

df044912:
  alt: 4-2-2 偏差量の表示
  text: |
    「偏差量」の表示（赤の背景）。X、Y、Z、A とも 0.000。

59e8fd69:
  alt: 4-2-2 相対移動量の表示
  text: |
    「相対移動量」の表示（灰色の背景）。X、Y、Z、A とも 0.000。

2d29e962:
  alt: 4-2-3-1 汎用入出力画面
  text: |
    「入出力状態」画面。入力と出力それぞれに、チャンネル、Pin No.、標準信号名、ユーザー信号名の列。ON の信号は色付きで表示される。
    細部の値は小さくて判読できず。

d014ad23:
  alt: 4-2-3-2 機械パネル入力画面
  text: |
    「機械パネル入力」画面の「機械パネルスイッチ」: CH1 PI0 MP_INCH_1、CH1 PI1 MP_INCH_10、CH1 PI2 MP_INCH_100、CH1 PI3 MP_INCH_1000、CH1 PI4 MP_HSEL_X（チェックあり、黄色）、CH1 PI5 MP_HSEL_Y（チェックあり、青）、CH1 PI6 MP_HSEL_Z、CH1 PI7 MP_HSEL_A。ボタン: 前、∧、∨、次、閉じる。

cc1cd5ce:
  alt: 4-2-4-1 軸設定画面
  text: |
    「軸設定」画面。「無効軸」「インタロック軸」「サーボオフ軸」のそれぞれに X～T 軸のチェック欄（B 軸以降は灰色）。「閉じる」ボタン。

4f0438c9:
  alt: 4-2-4-2 軸ステータス画面
  text: |
    「各軸ステータス」画面。X、Y、Z、A、B、C、R、Q、T の列に、位置決め完了、加減速たまり、サーボオン、原点復帰済、原点確定済、SPIN動作中、SPIN停止中の表示。
    「FG状態」: FG完了（選択）、FG停止中、FG分配中。「各種シーケンス完了」。「閉じる」ボタン。

98c4fe68:
  alt: 4-2-5 プログラム管理画面
  text: |
    「プログラム管理」画面。矢印の説明: 読み込みファイル名、テクノコード/Gコード選択、対象タスク選択、運転プログラム編集。左に BLK・TSK・PNO の一覧。

e79a0868:
  alt: 4-2-6 プログラムティーチング画面
  text: |
    「ティーチング」画面の「プログラム」欄:
    ```
    1: PTP X40000 Y20000;   （選択中）
    2: PTP X40000 Y-20000;
    3: PTP X-40000 Y-20000;
    4: PTP X-40000 Y20000;
    5: END;
    ```
    ボタン: ステップ変更 ＋ －、サイクル、シングル、ティーチング、逆行、スキップ、挿入、置換、原点シフト、削除、実行、閉じる。

79b67779:
  alt: 4-2-7-1 マクロ変数表示画面
  text: |
    「マクロ変数」画面。表示範囲「#1000 - #1199（LONG）: グローバルマクロ変数」、DEC/HEX の切り替え、#1000～#1019 の値（すべて 0）。ボタン: 一括アップロード SLM8000->PC、一括ダウンロード PC->SLM8000、閉じる。

435c9551:
  alt: ボタン「一括アップロード」

c8e35b65:
  alt: 4-2-7-2 マクロ変数書き込み画面
  text: |
    「マクロ変数書き込み」画面。「# 1000」の現在値 0 と、書き込む値の欄、「書込」「閉じる」ボタン。

9b0aaba6:
  alt: ボタン「一括ダウンロード」

fae85930:
  alt: 4-2-8-1 主軸操作画面
  text: |
    「主軸操作」画面。速度指令 0 [rpm/Hz/%]、「速度指令送信」。操作: 正転(M3)、逆転(M4)、停止(M5)、「操作指令送信」。回転数モニタ 0 [rpm/Hz/%]。「閉じる」。

c97df746:
  alt: 4-2-8-2 TPCロギング画面
  text: |
    ダイアログ「TPCロギング」。
    - 「ロギング中」の表示、「バッファデータ [0] ポイント」「保存データ [0] ポイント」
    - タブ「ポジション」と「64CH」。ポジションのタブでは、左右それぞれに「軸番号 [1]」（◀ ▶）と「指令位置」「機械位置」の選択（左右とも機械位置が選ばれている）
    - 「ロギング周期 [0] msec」（0msec:制御周期毎）
    - 「ファイル保存(アップロード)方法」: 手動([ファイルに保存]ボタン)（選択中）、ロギング停止時、常時
    - 「ロギングファイル」の欄と「参照」（灰色）
    - ボタン: 開始(新規)、開始(追加)、停止、ファイルに保存、閉じる

    本文は「任意の2軸分の座標をロギング」と書いているが、画面には「64CH」のタブもある。

f74363d9:
  alt: 4-2-8-3 手動パルサモード画面
  text: |
    「手動パルサモード」画面。手動パルサモード、ジョイスティックモードのチェック欄、「手パ/ジョイスティック 無効」の表示。倍率: X1、X10、X100（選択中）、X1000。手動パルサー軸: 1 第1軸(X)、2 第1軸(X)。「閉じる」。

818e7b74:
  alt: 4-2-8-4 センサーラッチモニタリング画面
  text: |
    「センサーラッチモニタリング」画面。X、Y、Z、A の機械位置とアブソ位置（すべて 0.000）。「センサーラッチ完」の表示、「閉じる」。

8425fe9a:
  alt: 4-2-8-5 フィードバックカウンタモニタ画面
  text: |
    「フィードバックカウンタモニタ」画面。FB1～FB10 の現在値（すべて 0）と設定値の欄、「変更」「閉じる」。

5002ea55:
  alt: 4-2-8-6 工具長補正情報画面
  text: |
    「工具長補正情報」画面。「長補正中」の表示、長補正No. 0、「閉じる」。

c1eb44f5:
  alt: 4-2-8-7 工具径補正情報画面
  text: |
    「工具径補正情報」画面。「径補正中」の表示、径補正No. 0、「閉じる」。

262f1060:
  alt: 4-2-8-8 制御周期モニタ（RtcMonitor）画面
  text: |
    ウィンドウ「RtcMonitor」。
    - 表示の切り替え: RTC（選択中）、Foreground
    - 「計測周期」: 最大値 192 μsec、平均値 93 μsec、現在値 93 μsec
    - ボタン: 計測値クリア、閉じる

    本文: RTC は「割り込み処理の実行時間」で、割り込み周期以下である必要がある。Foreground は「その他の処理時間」。

e77fe593:
  alt: 4-2-8-9 工具径補正エラー情報画面
  text: |
    「工具径補正エラー情報」画面。エラー発生ステップ番号、エラー内容の欄、「閉じる」。

1df2b1f0:
  alt: 4-2-8-10 位置決めポイントテーブル作成画面
  text: |
    「位置決めポイントテーブル作成」画面（緑の背景）。P1～P20 の行に X、Y、Z、A の値と、N/A の欄、DL の欄。「テーブル編集」: ポイント番号、挿入、削除、全表示クリア、ファイルから読出、ファイルに保存、全ポイントアップロード SLM8000->PC、全ポイントダウンロード PC->SLM8000、閉じる。
    細部の値は小さくて判読できず。

2fdb0839:
  alt: ボタン「∧」

f0051f02:
  alt: ボタン「∨」

0d911e76:
  alt: 4-2-8-11 位置決めポイントテーブルモニタ画面
  text: |
    「位置決めポイントテーブルモニタ」画面。移動時速度（パルス/秒）の欄と、P1～P20 への移動ボタン、X、Y、Z、A の値（N/A の欄を含む）。
    細部の値は小さくて判読できず。

ef31b3be:
  alt: ボタン「次」

8ab43d3e:
  alt: ボタン「∧」「∨」

735e8c11:
  alt: 4-2-9 エラー表示画面
  text: |
    「エラー情報」画面。表示対象「全タスク」、エラーの一覧の欄、「リセット」「閉じる」。

e1cdadd6:
  alt: 4-3-1 サーボパラメータ設定画面
  text: |
    「サーボパラメータ」画面。タスク0 の第1軸～第4軸（X、Y、Z、A）について、INPOS量、偏差上限値、補間加減速方式、補間加減速時定数、S字加減速、PTP時定数、PTP速度、JOG速度、ソフトリミット、原点復帰関係、バックラッシュ補正量などの値。ボタン: ファイルから読出、ファイルに保存、アップロード、ダウンロード、編集前に戻す、閉じる。
    値は小さくて判読できず。

b32a0499:
  alt: 4-3-2 ピッチエラー補正データ設定画面
  text: |
    「ピッチエラー補正データ」画面。第1物理軸（軸割り当て タスク0 第1軸(X)）、補正倍率 0、補正間隔 1000、－区間数 0、＋区間数 0、補正データ No.0～19（すべて 0）。ボタン: CSVファイルから読出、CSVファイルに保存、ファイルから読出、ファイルに保存、アップロード SLM8000->PC、ダウンロード PC->SLM8000、編集前に戻す、閉じる。

5f6bc770:
  alt: 4-3-3 工具長補正データ設定画面
  text: |
    「工具長補正機能パラメータ」画面。タスク0、工具長補正データ No.0～19（すべて 0）。ボタン: ファイルから読出、ファイルに保存、アップロード SLM8000->PC、ダウンロード PC->SLM8000、編集前に戻す、閉じる。

f50a1fdd:
  alt: 4-3-4 工具径補正データ設定画面
  text: |
    「工具径補正機能パラメータ」画面。タスク0、工具径補正データ No.0～19（すべて 0）。ボタンは工具長補正と同じ。

6b493e32:
  alt: 4-3-5 バックアップデータ初期化画面
  text: |
    「バックアップデータ初期化」画面。ボタン: パラメータ初期化、運転プログラム初期化、全軸アブソポジション初期化、各軸アブソポジション設定（タスク、X・Y・Z・A の欄）、マクロ変数初期化、位置決めポイントテーブル初期化（灰色）、論理座標オフセット初期化、運転プログラムバックアップ、絶対値エンコーダオフセット（アップロード SLM8000->PC、ダウンロード PC->SLM8000）、位置決めポイントテーブルバックアップ（灰色）、閉じる。

8842feb6:
  alt: 4-3-6 補間前加減速パラメータ設定画面
  text: |
    「補間前加減速パラメータ」画面（タスク0）。補間前加減速時定数 330 msec（0:補間前加減速無効）。最小オーバライド設定（加速度[pls/sec^2] の範囲 → 最小オーバライド[%]）:

    | 加速度の範囲 | 最小オーバライド [%] |
    |---|---|
    | 0 ～ 500000 | 100 |
    | 500000 ～ 700000 | 90 |
    | 700000 ～ 1000000 | 70 |
    | 1000000 ～ 1200000 | 40 |
    | 1200000 ～ 1500000 | 20 |
    | 1500000 ～ 2000000 | 10 |
    | 2000000 ～ 2500000 | 5 |

    「※加速度は絶対値を設定して下さい。」ボタン: ファイルから読出、ファイルに保存、アップロード、ダウンロード、編集前に戻す、閉じる。

42b055a7:
  alt: 4-4-1-1 通信設定画面
  text: |
    「通信設定」画面。
    - 通信形態: イーサネット通信
    - シリアル通信(RS232C)設定（灰色）: シリアルポート COM1
    - イーサネット設定: IPアドレス 192.168.0.2、設定履歴
    - 通信エラーログ: ログファイル名、チェック欄（ログ無効、全てロギング、初期化/終了、データ送信、データ受信、コマンド、通信エラー(全て)、通信エラー(伝送)、通信リトライ）
    - ボタン: 設定、閉じる

b470e77e:
  alt: 4-4-1-2 セッティングPC動作設定画面
  text: |
    「セッティングPCソフト動作設定」画面。運転プログラム設定: DNC送信データ長 8192、DNC実行開始データ長 16384、DNC運転プログラムタイプ テクノコード（選択）/Gコード、起動時編集プログラムタイプ テクノコード（選択）/Gコード。起動位置 X 0、Y 0、「現在位置取得」。ボタン: 設定、編集前に戻す、閉じる。

2db0f97a:
  alt: 4-4-2 ポジション表示形式設定画面
  text: |
    「ポジション表示形式設定」画面（タスク0）。
    - 第1軸～第9軸の軸名称（X、Y、Z、A、B、C、R、Q、T）とパルス/表示単位（すべて 1000）。注記: 「軸名称を変更しても運転プログラムの軸アドレスは変わりません。(X,Z,Y...R,Q,T のまま) セッティングPC/ROMSW設定ソフトの表示が変わるだけですので御注意下さい。」
    - 円弧処理 SLM8000内部、円弧精度 1、運転プログラム小数点桁数 1000、補間送り速度単位 1 ﾊﾟﾙｽ/sec、X-Z円弧平面 XZ平面（選択）/ZX平面
    - ボタン: 設定、編集前に戻す、閉じる

806c26e8:
  alt: 4-4-2 補間送り速度単位の設定例
  text: |
    | 設定 | 速度単位 |
    |---|---|
    | ①:1 ②:sec | pps(pulse/sec) |
    | ①:1000 ②:min | 1000p/min |

81d17a59:
  alt: 4-4-2 X-Z 円弧平面の向き
  text: |
    - XZ平面: 縦軸 +Z、横軸 +X。G03/CIRL と G02/CIRR の回る向きが矢印で示されている
    - ZX平面: 縦軸 +X、横軸 +Z。同じく G03/CIRL と G02/CIRR の回る向きが示されている

ad6593b3:
  alt: 4-4-3 入出力表示設定画面
  text: |
    「入出力表示設定」画面。入力と出力それぞれに、チャンネル、Pin No.、標準信号名、表示のチェック、ユーザー信号名の欄。ボタン: 設定、編集前に戻す、閉じる。
    細部は小さくて判読できず。

cf468a08:
  alt: 4-5-1 セッティングPCソフトのバージョン情報
  text: |
    「バージョン情報(Slm8000drv)」画面。標準SLM8000運転ソフト。
    - パッケージ Version 0.8.0A
    - セッティングPC Version 0.8.0、CommDLL Version 0.8.0、TcnvDLL Version 0.5.0、GcnvDLL Version 0.5.0
    - ファームウェア(motion controller) Version 0.8.0
    - シリアル番号、SUM(Flash)、MAC アドレス、IP アドレスの表示（画面の例の値）
    - Copyright (C) 2018
