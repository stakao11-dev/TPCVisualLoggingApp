# TB00-1130G（SLM8000 ユーザーズマニュアル 機械操作パネル・サーボパラメータ編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# - 8-4 の原点復帰の図の a・b・c・S・A は、8-4 の冒頭の本文にある凡例（原点復帰の各速度、原点距離、
#   原点信号～C(Z)相間距離）を指す。図には記号だけが書かれている。

761b0200:
  alt: 7-1 標準機械操作パネル
  text: |
    パネルの部品: 非常停止、電源（LED）、READY・RUN・ERROR のランプ、起動（LED）、停止（LED）、原点設定、リセット、モード選択のロータリースイッチ（シングル、連続、原点復帰、手動、手パ など）、オーバライドのロータリースイッチ、手パ軸選択（X、Y、Z、A）、手動パルス/インチング倍率（×1、×10、×100、×1000）、プログラム選択のロータリースイッチ、軸キー（−X/+X、−Y/+Y、−Z/+Z、−A/+A）、手動パルサー。
    細部の小さい文字は判読しにくい。

295b68dd:
  alt: 7-2 ハンディー形機械操作BOX
  text: |
    ブザー、非常停止、インターロックスイッチ（側面）、ロータリースイッチ 2 個、ランプ（原点復帰、高速/低速、自動運転中、エラー発生 など）、押しボタン（アーク ON/OFF、高速/低速、溶接 CW/CCW、起動・補点1、停止・補点2、リセット、トーチ上下 など）。用途別の専用化された例。
    細部の小さい文字は判読しにくい。

3383cd5b:
  alt: 7-3 機械パネルI/Fを応用したシーケンサ接続
  text: |
    - 左: 「シーケンサ I/O モジュール」の接点（スイッチ）。中央: 【機械パネル I/F】のダイオード
    - 右: 「SLM8000」の端子 T□PI1 ～ T□PI7、SWSEL1 ～ SWSEL2。これらは「CN11 機械パネル I/F」
    - シーケンサの別の接点は「専用操作入力（起動、停止、リセット）」へつながる

2390de0f:
  alt: 7-4 機械操作パネルの配線
  text: |
    「機械操作パネル（　）【コード仕様】」の配線図。点線の枠はロータリーSW。各スイッチはダイオードを経て T□PI0 ～ T□PI7 へつながり、グループごとに SWSEL で選ばれる。
    - **SWSEL1**: 手パ倍率 ×1、×10、×100、×1000（T□PI0 ～ T□PI3）、手パ軸選択（インチング）X (HAX0)、Y (HAX1)、Z (HAX2)、A（T□PI4 ～ T□PI7）
    - **SWSEL2**: オーバライド 0V1 (0VD0) ～ 0V8 (0VD7)
    - **SWSEL3**: モード選択 自動、シングルステップ、原点復帰、手動(ジョグ)、インチング、手パ、パネル有効、原点設定
    - **SWSEL4**: 軸動作 +X (AX0)、−X (AX1)、+Y (AX2)、−Y (AX3)、+Z (+AX)、−Z (−AX)、+A、−A
    - **SWSEL5**: プログラム選択 P選択1 (PSEL0)、2 (PSEL1)、3 (PSEL2)、4 (PSEL3)、5 ～ 8
    - 専用入力: 起動 T□START、停止 T□STOP、リセット T□RESET、非常停止 T□EMS（コモンは 0₂₄）
    - 出力（24V(5V)、オープンコレクタ出力 MAX 100 mA、LED表示は、一般に5～10mAです）: READY T□READY、RUN T□RUN、ERROR T□ERROR、INPOS T□INPOS、途中停止 T□PAUSE、P起動可 T□PRDY
    - 手動パルサー → CNEXT の 56 HPGA1、58 HPGB1、54 0V、53 5V。※ 手パ軸は選択可
    - ダイオード: 複数SWの同時ONによるご認識を避けるために必要
    - **PIデータの読み込みタイミング**: SWSELi が下がったあと、SWSELi+1 が下がる。それぞれの立ち下がりから PI□ の確定までの時間 Tpi。Tpi ＞ 200μsec
    - **ご注意**: SWSEL信号やT□PI□信号に外部遅延が生じると、PIデータの読み込み不良となる場合があります。

185bab59:
  alt: 7-6 機械操作パネル入力チャンネルの意味
  text: |
    | CH | 項目 | 意味 |
    |---|---|---|
    | CH1 | 手パ軸選択 | 軸コードと選択軸との対応はROMSW設定ソフトにて設定します。HAX3～HAX0 が OFF～ON で軸コード 0～15 |
    | CH1 | 手パ倍率/インチング送り量 | ×1000、×100、×10、×1 倍率 ＝ 1000、100、10、1 パルス |
    | CH2 | オーバライド | 【Bit仕様】OV8～OV1 : 200%～25%（25%ステップ）。全bitOFF時は無効。（PC/操作パネル有効）／【Code仕様】8bitバイナリデータで0～200%を選択。有効範囲外は無視され、直前の値を保持。 |
    | CH3 | モード選択 | 連続運転、シングルステップ、原点復帰、JOG、インチング、手パ（全bitOFF時はPC/操作パネル有効）。※DNC運転を行う場合は、全bitOFFにして、PCからDNC運転モードに変更します。※原点復帰モード時は以下の動作が可能です。STRTSW入力：全軸自動原点復帰、軸動作入力(CH4)：各軸手動原点復帰 |
    | CH3 | その他 | パネル有効: この入力がONの時、機械パネル有効／原点設定: 信号の立上がりエッジで実行／ティーチング: 自動モード、かつ運転プログラムがステップ間で一時停止中の場合、ONでティーチングモード、OFFでティーチング解除 |
    | CH4 | 軸動作 | 軸移動の立上がりエッジで動作開始、JOG.原点復帰は立下り検出で移動停止。【Bit仕様】+X～-A : 各軸移動（JOG、各軸手動原点復帰、インチング）／【Code仕様】AX3～AX0 が OFF,OFF,OFF,OFF で第1軸、OFF,OFF,OFF,ON で第2軸 … ON,OFF,OFF,OFF で第9軸。+AX/-AX : 選択軸移動（JOG、各軸手動原点復帰、インチング） |
    | CH5 | プログラム選択 | 【Bit仕様】PS8～PS1 : プログラム8番～1番（選択なし及び無効番号選択時はPC/操作パネルによる選択が有効）／【Code仕様】PSEL3～PSEL0 が すべて OFF で選択なし、OFF,OFF,OFF,ON で NO.1 … ON,ON,OFF,OFF で NO.12（選択なし及び無効番号選択時はPC/操作パネルによる選択が有効） |

ff63e3f4:
  alt: 8 サーボパラメータ設定画面
  text: |
    画面「サーボパラメータ」。タスク0 の 第1軸(X)～第4軸(A) の列に、INPOS幅、偏差上限値、補間加減速方法（指数形）、補間加減速時定数、S字加減速時定数、PTP時定数、PTP速度、JOG速度、+側ソフトリミット、-側ソフトリミット、原点復帰実行、原点距離、原点復帰逃げ量、原点復帰早送り速度、原点復帰アプローチ速度、原点復帰最終サーチ速度、原点復帰順位、ホームポジション距離、ホームポジション順位、バックラッシュ補正量 などの値が並ぶ。右側にボタン: ファイルから読出、ファイルに保存、アップロード SLM8000->PC、ダウンロード PC->SLM8000、編集前に戻す、閉じる。
    値は小さくて判読しにくい。

6ad88284:
  alt: 8-1 PTP時定数の計算式
  text: |
    PTP時定数[msec] ＝ 加速時間[msec] × 100000[pps] ／ PTP速度[pps]

0faf67dc:
  alt: 8-1 PTP時定数と加速時間（PTP速度が100Kpps以上の場合）
  text: |
    指令速度の台形。PTP速度まで上がる時間が「加速時間[msec]」、100Kpps に達するまでの時間が「PTP時定数[msec]」。注記: 100Kpps以下でもPTP時定数の計算式は同じ。

dad6e5b7:
  alt: 8-1 PTP時定数と加速時間（PTP速度に達するまでの時間）
  text: |
    指令速度の台形。PTP速度に達するまでの時間が「PTP時定数[msec] ＝加速時間[msec]」。

977805f7:
  alt: 8-1 指数形補間加減速
  text: |
    指令速度へ向かって指数関数的に立ち上がる曲線。原点での接線（点線）が指令速度と交わるまでの時間（下の矢印）が時定数。

693d1cba:
  alt: 8-1 直線形補間加減速
  text: |
    LIN命令が 3 つ続くときの速度の変化。各 LIN命令の速度変化（加速・減速）が、それぞれ一定の時間（「直線形補間時定数」、下の矢印）の直線で行われる。

2427eed2:
  alt: 8-1 S字加減速（S字補間時定数）
  text: |
    台形の速度（点線）の角が丸められた曲線（実線）。速度の変化点ごとに、Ｔs の区間で平均化する。Ｔa は加減速の時間。

9efaa266:
  alt: 8-2 ストロークリミットの領域
  text: |
    - 左から: ハードOT領域（マシンエンド）、ソフトOT領域、正常領域、ソフトOT領域、ハードOT領域（マシンエンド）
    - 正常領域の両端が「ソフトOTパラメタ +側」と「ソフトOTパラメタ −側」。その間に機械原点
    - ソフトOT領域: ソフトウェアにて停止。SVM ON（サーボ主電源オン）、SV ON（サーボオン）
    - ハードOT領域: ソフトにて、SVM OFF、SV OFF。（ブレーキ動作）
    - 復旧: OT無視モードにて SVM ON、SV ON。（ブレーキ解除）

66467033:
  alt: 「参考」の見出しの絵

fae8800b:
  alt: 8-4-1 DECサーチ方式 ±2段原点復帰の速度と原点信号
  text: |
    速度（原点復帰方向）の時間変化と原点信号(DEC)。速度 a で原点復帰方向へ進み、原点信号が ON になると減速して速度 b で逆方向に戻り、原点信号が OFF になると速度 c で再び原点方向へ進み、原点信号の変化で止まったあと、原点距離 S だけ移動する。

0b3f1409:
  alt: 8-4-2 DECサーチ方式 ±1段原点復帰の速度と原点信号
  text: |
    改訂マーク ◆1.2。速度 a で進み（原点信号の状態により逆方向へ速度 a で戻る場合を点線で示す）、原点信号が ON から変化した位置から速度 c でサーチし、原点距離 S だけ移動する。

d972d726:
  alt: 8-4-3 OTサーチ原点復帰の速度と OT信号
  text: |
    改訂マーク ◆1.2。速度 a で進み、OT信号が ON になると止まって逆方向へ c で戻り、OT信号が OFF になったあと原点距離 S だけ移動する（S は逆方向で、速度 a まで下がる）。

02c886c5:
  alt: 8-4-4 C(Z)相サーチ方式(原点信号無し)の速度と C(Z)相パルス
  text: |
    速度 b で進み、速度 c に落としてサーチし、C(Z)相パルスで止まったあと、原点距離 S だけ移動する。

c026cc40:
  alt: 8-4-5 C(Z)相サーチ方式(DEC信号) ±2段原点復帰の速度と原点信号・C(Z)相パルス
  text: |
    改訂マーク ◆1.1、1.2。速度 a で進み、原点信号(DEC)が ON で b に減速、OFF で c に減速して逆方向へサーチし、原点信号 OFF から距離 A の後の C(Z)相パルスで止まり、原点距離 S だけ移動する。

c6e461e5:
  alt: 8-4-6 C(Z)相サーチ方式(DEC信号) ±1段原点復帰の速度と原点信号・C(Z)相パルス
  text: |
    改訂マーク ◆1.1、1.2。8-4-5 と同様だが 1 段。原点信号の状態により逆方向へ速度 a で戻る場合を点線で示す。原点信号の変化から距離 A の後の C(Z)相パルスで止まり、原点距離 S だけ移動する。

eda2758d:
  alt: 8-4-7 C(Z)相サーチ方式(OT信号)の速度と OT信号・C(Z)相パルス
  text: |
    改訂マーク ◆1.2。速度 a で進み、OT信号が ON で逆方向へ戻り、OT信号 OFF から距離 A の後の C(Z)相パルスを速度 c・b でサーチして止まり、原点距離 S だけ移動する。

3f86dc23:
  alt: 8-4-8 C(Z)相ラッチ方式(原点信号無し)の速度と C(Z)相パルス
  text: |
    速度 a で進み、C(Z)相パルスの位置をラッチし、そこから原点距離 S の位置で止まる（減速しながら移動）。

5d8f6774:
  alt: 8-4-9 C(Z)相ラッチ方式(DEC信号) ±2段原点復帰の速度と原点信号・C(Z)相パルス
  text: |
    速度 a で進み、原点信号(DEC)が ON で b に減速し、原点信号 OFF から距離 A の後の C(Z)相パルスをラッチして、原点距離 S の位置で止まる。

59196392:
  alt: 8-4-10 C(Z)相ラッチ方式(DEC信号) ±1段原点復帰の速度と原点信号・C(Z)相パルス
  text: |
    速度 a で進み（原点信号の状態により逆方向へ速度 a で戻る場合を点線で示す）、原点信号の変化から距離 A の後の C(Z)相パルスをラッチして、原点距離 S の位置で止まる。

859bd39e:
  alt: 8-4-11 C(Z)相ラッチ方式(OT信号)の速度と OT信号・C(Z)相パルス
  text: |
    改訂マーク ◆1.2。速度 a で進み、OT信号が ON で逆方向へ速度 b で戻り、OT信号 OFF の後の C(Z)相パルスをラッチし、原点距離 S だけ移動する（S は逆方向で、速度 a まで下がる）。

76228b95:
  alt: 8-4-12 原点復帰未完でOTに到達した場合（DEC信号）
  text: |
    -OT と +OT の間。開始位置 Ⓐ から ① +OT まで進み、② 逆方向へ戻って DEC信号を通り過ぎ、③ 再び原点方向へ進んで DEC信号の位置で機械原点を決める。

234aa065:
  alt: 8-4-13 原点復帰未完でOTに到達した場合（ラッチ信号）
  text: |
    開始位置 Ⓐ から ① +OT まで進み、② 逆方向へ戻ってラッチ信号を通り過ぎ、③ 再び原点方向へ進んでラッチ信号を確認し、機械原点を決める。

4785104b:
  alt: 8-4-14 1段原点復帰でベタドグの場合
  text: |
    -OT と +OT の間。原点(DEC)信号は機械原点の手前から +OT 側まで ON のまま（ベタドグ）。開始位置 Ⓐ（原点信号 ON の側）からは一度戻ってから原点へ、開始位置 Ⓑ（原点信号 OFF の側）からはそのまま原点へ進み、機械原点に止まる。

02d9eb60:
  alt: 8-5 全軸原点復帰の逃げ動作（速度）
  text: |
    横軸 時間、縦軸 速度。原点付近に軸がある場合、まず逆方向へ移動し（斜線部の面積 ＝ 原点位置＋逃げ量－現在位置）、その後 a) または b) の速度で原点方向へ進んで原点に止まる。

e7cbdb4d:
  alt: 8-5 全軸原点復帰の逃げ動作（領域）
  text: |
    8-2 の領域の図（ハードOT領域、ソフトOT領域、正常領域、マシンエンド、ソフトOTパラメタ +側／−側、機械原点）に、「逃げ動作」「原点復帰」の矢印と、「原点復帰逃げ量」「A」の範囲を書き加えたもの。
