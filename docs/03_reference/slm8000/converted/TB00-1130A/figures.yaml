  alt: 2-2 マニュアル「SLM-8000 ユーザーズマニュアル」「セッティングPC マニュアル」「ROM SW設定 マニュアル」の絵

629db749:
  alt: 2-3 出荷CDとインストールされるソフト
  text: |
    CD（□セッティングPCソフト、□ROMSW設定ソフト）から、Slm8000drv.exe と Slm8000swset.exe のアイコンがデスクトップにできる様子。

6b0981d1:
  alt: 2-3 SLM8000 Installer
  text: |
    ダイアログ「SLM8000 Installer」。「インストールするフォルダを設定して下さい。」、フォルダ「c:¥Slm8000」、ボタン: 参照、OK、キャンセル。

e8b76d56:
  alt: 「注意」の吹き出し

7b04d863:
  alt: 「注意」の吹き出しと「SLM8000DRV1」
  text: |
    「注意」の吹き出しの下に「SLM8000DRV1」。

e31e5ee4:
  alt: 2-3 ショートカットの作成
  text: |
    Windows の「ショートカットの作成」画面。「どの項目のショートカットを作成しますか?」、項目の場所: `C:¥Slm8000¥Slm8000drv.exe slm8000drv.ini`。ボタン: 参照(R)...、次へ(N)、キャンセル。

e21e591b:
  alt: 2-3 ショートカット「Slm8000drv1」のアイコン

6464b441:
  alt: 2-3 ショートカット「Slm8000swset1」のアイコン

bbd36a02:
  alt: 2-4-1 通信形態（接続図）
  text: |
    - ① PC-AT (Windows) と AS-710 の Ethernet（CNETR）を「市販のLANケーブル」でつなぐ
    - ② RS-232C の場合: PC-AT から「RS-232Cケーブル」→「AS232 小さいPCB(別売)」→「0.5mケーブル CB-C-012（別売）」→ AS-710 の CN5A（シリアルポート）
    - ③ AS-710 の LED1: LED点滅(2秒周期)
    - ④ AC100V (AC200V) → 24V DC電源（アース）→「CB-C-004-01」→ AS-710 の 電源（CN3）
    - PC-AT には CD から「インストール」
    - AS-710 の基板: 上辺に 電源、Ethernet、CN1サーボ 8軸、CN2 I/O。右辺に CNEXT FB10ch。左辺に CN3、CN5、CN5A、CN5DA、CN7。中央に SHCPU、外部フラッシュ（と読める）、SRAM、SDRAM、DSW1、MAX10 (FPGA)、バッテリー

5ca5d24d:
  alt: CD の絵

47d18183:
  alt: 2-4-2 DC電源の仕様と配線
  text: |
    | 電源仕様 | 配線 |
    |---|---|
    | 24V±10 % 0.6A 以上。詳細は、<Ⅱハードウェア編 1-1.電源仕様>（TB00-1130B）参照 | CB-C-004-01: 24V → 1、0V → 2、FG → 3（AS710 CN3（電源コネクタ））、4 |

715b8f42:
  alt: 2-4-2 初期設定ファイルがないときのメッセージ
  text: |
    ダイアログ「Slm8000drv」。警告アイコンと「初期設定ファイル"C:¥Slm8000¥slm8000drv.ini"がありません。デフォルト情報で実行しますか？」、ボタン: OK、キャンセル。

cb0ca598:
  alt: 2-4-2 通信ライブラリの初期化エラー
  text: |
    ダイアログ「Slm8000drv」。警告アイコンと「通信ライブラリの初期化エラーです」、OK ボタン。

9de2d72e:
  alt: 2-4-2 セッティングPCソフトのメニュー（終了）
  text: |
    ウィンドウ「標準SLM8000 セッティングPCソフト ( C:¥Slm8000¥slm8000drv.ini )」のメニュー: 運転、パラメータ、表示設定、バージョン情報、終了（赤丸で囲み）。

72b8f761:
  alt: 2-4-2 セッティングPC起動時のエラー（サイド バイ サイド構成）
  text: |
    ダイアログ「C:¥Users¥TP-E580¥Desktop¥Slm8000¥Slm8000drv.exe」。「このアプリケーションのサイド バイ サイド構成が正しくないため、アプリケーションを開始できませんでした。詳細については、アプリケーションのイベント ログを参照するか、コマンド ライン ツール sxstrace.exe を使用してください。」、OK ボタン。

9e60c0e7:
  alt: 2-5 ROMSW設定ソフトの画面
  text: |
    ウィンドウ「標準SLM8000 ROMSW設定ソフト ( C:¥Slm8000¥slm8000drv.ini )」。ファイル名欄と、ボタン: 基本、入力、出力、軸設定、手動パルサ ジョイスティック、主軸、ファイルから読出、ファイルに保存、アップロード SLM8000->PC（強調表示）、ダウンロード PC->SLM8000、オプション、閉じる。

a05b59f4:
  alt: 2-6 セッティングPCソフトの運転画面
  text: |
    ウィンドウ「標準SLM8000 セッティングPCソフト ( C:¥slm8000¥slm8000drv.ini )」の運転画面。矢印が位置表示（X 0.000、Y 0.000、Z 0.000、A 0.000）を指している。下部は運転操作パネル（タスク選択 タスク0、動作モード 自動運転、プログラム情報、オーバライド 100、送りモード、軸キー、操作ボタン）。

4f07cd05:
  alt: 2-6-1 セッティングPCソフトのメニュー（パラメータ）
  text: |
    メニュー: 運転、パラメータ（丸で囲み）、表示設定、バージョン情報、終了。

fd7ecf75:
  alt: 2-6-1 バックアップデータ初期化の画面
  text: |
    画面「バックアップデータ初期化」。ボタン: パラメータ初期化、運転プログラム初期化、全軸アブソポジション初期化、各軸アブソポジション設定（タスク0、X・Y・Z・A）、マクロ変数初期化、位置決めのポイントテーブル初期化（灰色）、論理座標オフセット初期化、運転プログラムバックアップ、絶対値エンコーダオフセット（アップロード SLM8000->PC、ダウンロード PC->SLM8000）、位置決めのポイントテーブルバックアップ（灰色）、閉じる。

bcc0380a:
  alt: 「注意」の吹き出し

a31ea91a:
  alt: 2-6-2 サーボパラメータの画面
  text: |
    画面「サーボパラメータ」。タスク0 の 第1軸(X)～第4軸(A) の列に、INPOS量、偏差上限値、補間加減速方法（指数形）、補間加減速時定数、S字加減速時定数、PTP時定数、PTP速度、JOG速度、+側ソフトリミット、−側ソフトリミット、原点復帰実行、原点距離、原点復帰逃げ量、原点復帰早送り速度 などの値が並ぶ。ボタン: ファイルから読出、ファイルに保存、アップロード SLM8000->PC、ダウンロード PC->SLM8000、編集前に戻す、閉じる。
    値は小さくて判読しにくい。

1d6ef794:
  alt: 「注意」の吹き出し

177d2dbd:
  alt: 2-6-3 通信設定の画面（インタフェース設定）
  text: |
    画面「通信設定」。
    - 通信形態: イーサネット通信
    - シリアル通信(RS232C)設定（灰色）: シリアルポート COM1
    - イーサネット設定: IPアドレス 192.168.0.2、設定履歴
    - 通信エラーログ: ログファイル名、チェック（ログ無効、全てロギング、初期化/終了、データ送信、データ受信、コマンド、通信エラー(全て)、通信エラー(伝送)、通信リトライ）はすべて未選択
    - ボタン: 設定、閉じる

7d2eaf22:
  alt: 2-6-3 ポジション表示形式設定の画面
  text: |
    画面「ポジション表示形式設定」。タスク0。第1軸～第9軸の軸名称（X、Y、Z、A、B、C、R、Q、T）とパルス/表示単位（すべて 1000。第5軸以降は灰色）。円弧処理 SLM8000内部、円弧精度 1、運転プログラム小数点桁数 1000、補間送り速度単位 1 パルス/sec、X-Z円弧平面（XZ平面 / ZX平面）。
    注記: 軸名称を変更しても運転プログラムの軸アドレスは変わりません。(X,Z,Y…R,Q,T のまま) セッティングPC/ROMSW設定ソフトの表示が変わるだけですので御注意下さい。

223a9b7c:
  alt: 2-6-3 入出力表示設定の画面
  text: |
    画面「入出力表示設定」。左が入力、右が出力。それぞれ チャンネル、Pin No.、標準信号名、ユーザー信号名 の一覧。入力は I000 000～015（CN1 のピンに SALM1～SALM8 など）、出力は O000 200～215（CN1 のピンに SVON1、SVRST1 など）。ボタン: 設定、編集前に戻す、閉じる。
    細部は小さくて判読しにくい。

5a3dd8f0:
  alt: 「注意」の吹き出し

1601c2e8:
  alt: 「設定」ボタンの絵

8aceb959:
