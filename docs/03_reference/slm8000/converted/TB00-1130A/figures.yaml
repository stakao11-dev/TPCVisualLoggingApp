  text: |
    メニュー: 運転（丸で囲み）、パラメータ、表示設定、バージョン情報、終了。

f7aaddde:
  alt: 4-2 正しく接続できたときの運転画面
  text: |
    「標準SLM8000 セッティングPCソフト」の運転画面。位置表示（X、Y、Z、A すべて 0.000）、運転操作パネル（タスク選択 タスク0、動作モード 自動運転、プログラム情報: 実行モード 自動運転、動作状態 プログラム実行待機、オーバライド 100、送りモード、軸キー X-/X+ ～ A-/A+、ボタン: スタート、ストップ、1ショット位置決め、原点設定、原点復帰、ホーム位置、リセット、閉じる）。

29f24fe4:
  alt: 7-1 SLM8000 電源ON（接続図）
  text: |
    2-4-1 と同じ接続図（① 市販のLANケーブル、② RS-232Cケーブル CB-C-008-01(別売) と AS232 小さいPCB(別売)・CB-C-012、③ LED点滅(2秒周期)、④ DC電源 CB-C-004-01）。CD から「セッティングPCソフト」「ROMSWソフト」（Slm8000drv.exe、Slm8000swset.exe）をインストール。

4f084f49:
  alt: 7-2 セッティングPCソフトのアイコン

736d3101:
  alt: 7-3 セッティングPCソフトの運転画面の構成
  text: |
    運転画面の各部の名前: 「メインメニュー」、「位置表示」（X、Y、Z、A）、「操作メニュー」、「軸キー」（右側の X-/X+ などのボタン）、「操作ボタン」（下部のボタン列）。

bb1da9f6:
  alt: 7-3-2 1ショット位置決めの画面
  text: |
    画面「1ショット位置決め」。
    - 位置決めのモード: インクレPTP（選択）、論理座標系アブソPTP、機械座標系アブソPTP、インクレ直線補間、論理座標系アブソ補間、機械座標系アブソ補間、SPIN(無限回転軸回転動作)、同期軸無視 インクレPTP、同期軸無視 論理アブソPTP、同期軸無視 機械アブソPTP（最後の 3 つは灰色）
    - 移動量/目標位置: X、Y、Z、A（単位 パルス）、ほかの軸は灰色
    - 補間速度: パルス/秒
    - ボタン: 移動開始、移動再開、移動停止、閉じる

50cd8271:
  alt: 注意を促す亀の絵

53d5ec16:
  alt: 注意を促す亀の絵

367d2889:
  alt: 7-3-4 プログラム管理の画面
  text: |
    画面「プログラム管理」。ファイル名「C:¥Slm8000¥L_PTP.txt」。左にプログラムメモリ使用状況（BLK、TSK、PNO）。「タスク0(カレントタスク)」、Tコード（選択）/ Gコード。プログラム:
    ```
    PNO10;
    /****************************/
    /*  L_PTP.TXT              */
    /****************************/
    PTP X40000 Y20000;      /* (0,0)から、(40000,20000)へ
    PTP X40000 Y-20000;     /* (40000,20000)から、(80000…
    PTP X-40000 Y-20000;    /* (80000,0)から、(40000,-20…
    PTP X-40000 Y20000;     /* (40000,-20000)から、(0,0)…
    END;
    ```
    （行末のコメントは画面で切れている。）ボタン: 移動、コピー、削除、ファイルから読出、ファイルに保存、アップロード SLM8000->PC、ダウンロード PC->SLM8000、閉じる。

7808bd8a:
  alt: 7-3-5 X/Y軸の合成軌跡
  text: |
    軌跡表示ウィンドウ。青い線で、左端から右上へ上がり、水平に進み、右端へ下がる台形と、左端から右下へ下がり、水平に進み、右端へ上がる台形が描かれ、全体で六角形の軌跡になっている。

