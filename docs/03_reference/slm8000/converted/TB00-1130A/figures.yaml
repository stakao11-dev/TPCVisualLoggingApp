# TB00-1130A（SLM8000 ユーザーズマニュアル Ⅰ 導入編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# - 図の多くはセッティングPCソフト・ROMSW設定ソフト・Windows の画面。丸や矢印で示された操作箇所と、読める表示を中心に書いた。
# - 縮小されて小さい文字は「（判読できず）」とした。

cae8d4aa:
  alt: 2-1 出荷表の見方
  text: |
    「出荷表」の各欄の説明:
    - 「御社/ディーラ」→ 宛先の欄（様）
    - 「オーダNO.」「ソフトバージョン」の欄 →「オーダNO. TH00-○○○○○（問い合わせ時に必要）」
    - 「ハードウェア」「付属品」「ソフトウェア」「オプション」の各行 →「員数/オプションを確認！」
    - 注意: 出荷リストは、メンテナンスのため必ず保管して下さい。

