  text: |
    ウィンドウ「標準SLM8000 セッティングPCソフト ( C:¥Slm8000¥slm8000drv.ini )」のメニュー: 運転、パラメータ、表示設定（丸で囲み）、バージョン情報、終了。

bc978ec0:
  alt: 4-1 通信設定の画面
  text: |
    画面「通信設定」。丸と矢印で示された箇所: 通信形態「イーサネット通信」、シリアル通信(RS232C)設定のシリアルポート「COM1」（灰色）、イーサネット設定の IPアドレス「192.168.0.2」。通信エラーログのチェックはすべて未選択。ボタン: 設定、閉じる。

