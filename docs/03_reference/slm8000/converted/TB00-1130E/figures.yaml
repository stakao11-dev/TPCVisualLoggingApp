# TB00-1130E（SLM8000 ユーザーズマニュアル 機能説明編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# - PLMC-M3EX の機能説明編（TB00-0980E）と同じ図が多い。同じ図はそちらと同じ書き方にした。
# - 4-18-3（工具径補正）の図は、補正前の経路と補正後の経路、交点を示す作図。主な点と線の関係を書いた。

03b30638:
  alt: 4-2 A→Bへの移動命令
  text: |
    論理原点を原点とする X-Y 座標。A(500, 500) から B(1500, 1000) への矢印。

e09f7b35:
  alt: 4-2 インクレ指令（現在位置からの移動量）
  text: |
    A から現在位置 (X、Y) を経て B へ。x、y は A からの移動量。

74d22881:
  alt: 4-2 機械座標系と論理座標系のアブソ指令
  text: |
    機械原点 (0, 0, 0) と論理原点 (0, 0, 0)。「PTPB Xa Yb」は機械原点からの a、b の位置へ、「PTPA命令（アブソ命令）」は論理原点基準の位置へ移動する。

339b5704:
  alt: 4-3 指数形補間加減速の軸速度
  text: |
    LIN命令が 2 つ続くときの軸速度。各 LIN命令の速度変化が、指数関数の曲線（時定数）で行われる。

9af03f88:
  alt: 4-3 直線形補間加減速の軸速度
  text: |
    LIN命令が 3 つ続くときの軸速度。各速度変化が一定の時間（直線形補間時定数）の直線で行われる。

a96536bd:
  alt: 4-3 S字加減速
  text: |
    台形の速度（点線）の角を、速度の変化点ごとに Ｔs の区間で丸めた曲線（実線）。

47870f16:
  alt: 4-4 PTP命令の直線形加減速
  text: |
    縦軸 指令速度 FP、横軸 時間。PTP命令の台形と、次のPTP命令の台形。100Kpps に達するまでの時間が PtpT(msec)、FP に達するまでの時間が T。

efc033b0:
  alt: 4-5 PTP X1,Y1 の例
  text: |
    始点から目標点 (X1, Y1) へ。始めは斜め 45° に進み、移動量の少ない Y 軸が先に到着したあと X 軸だけが進む軌跡。

ff4aa962:
  alt: 4-6 LIN Xa Yb F□ の例
  text: |
    目標点 (a, b) へ送り速度 F で直線補間。各軸の速度:
    - fx = a × F ／ √(a² + b²)
    - fy = b × F ／ √(a² + b²)
    - F = √(fx² + fy²)
    右に X軸速度（fx）と Y軸速度（fy）の時間変化。

d01bb499:
  alt: 4-6 X軸・Y軸の速度（PTP速度）
  text: |
    X軸速度は台形で PTP速度（X軸）に達し、Y軸速度は移動量が少ないため三角形で、PTP速度（Y軸）に届かない。横軸 時間。

c2d36124:
  alt: 4-9 INPOSチェックの位置
  text: |
    「軌跡発生」→「補間加減速」→「サーボアンプ内の位置ループ制御」（点線の枠）。FB無しの場合は補間加減速の出力で INPOSチェック、FB有りの場合はサーボアンプの位置ループの後で INPOSチェック。

9de5d269:
  alt: 4-9 インポジションチェック（INPOS待ちあり）
  text: |
    ステップN からステップN+1 への速度。① 軌跡発生完了、② 次命令開始。①と②の間が ③ INPOS待ち。

a4bed441:
  alt: 4-9 インポジションチェック（F(速度)、①②が同時）
  text: |
    ステップN からステップN+1 への F(速度)。①② が同じ時刻（INPOS待ちなし）。

eac23236:
  alt: 4-9 インポジションチェック（速度が重なる場合）
  text: |
    ステップN の速度が下がる途中（点線）でステップN+1 が始まる。

bd61c15e:
  alt: 4-10 微小連続ブロック（パス制御）
  text: |
    曲線を細かい矢印でつないだ軌跡。「微小連続ブロック(ステップ)」「微小なLIN命令(直線補間)の連続」。各々の移動ステップ(ブロック)の例: ブロック長 ℓ=1mm、F=2m/min、1ステップ時間=約30msec。

836a5ad3:
  alt: 4-11 シングルステップ動作
  text: |
    シングルステップ: シングルステップ モードの間は ON、通常モード(自動運転) で OFF。スタート信号のパルスごとに、動作ステップ n、n+1、n+2 を 1 つずつ実行（移動 → 停止）。通常モードでは n+3、n+4、n+5 を連続動作。

3c997d50:
  alt: 4-12 サイクル運転
  text: |
    サイクル運転モードが ON の間、起動で運転プログラムが 1サイクルずつ繰り返す。OFF にするとその回のサイクルの終わりで止まる。

973159f8:
  alt: 4-14 ストロークリミットの領域
  text: |
    - 左から: ハードOT領域（マシンエンド）、ソフトOT領域、正常領域、ソフトOT領域、ハードOT領域（マシンエンド）
    - 正常領域の両端が「ソフトOTパラメタ +側」と「ソフトOTパラメタ −側」。その間に機械原点
    - ソフトOT領域: ソフトウェアにて停止。SVM ON（サーボ主電源オン）、SV ON（サーボオン）
    - ハードOT領域: ソフトにて、SVM OFF、SV OFF。（ブレーキ動作）
    - 復旧: OT無視モードにて SVM ON、SV ON。（ブレーキ解除）

df72aaa0:
  alt: 4-15-2 軸ストロークと機械原点
  text: |
    ストロークリミットの領域の図（ハードOT領域、ソフトOT領域、正常領域、マシンエンド、ソフトOTパラメータ +側／−側、機械原点）に、原点復帰の動き（原点復帰開始位置、原点復帰逃げ量、逃げ動作、原点復帰動作）と、原点 (DEC) 信号・C相パルスの位置を重ねたもの。
    - SD: DECサーチ方式における原点距離
    - SC: C相サーチ方式における原点復帰

95a58d1d:
  alt: 4-16-2 回転軸の角度
  text: |
    円の右が 0°、上が 90°(−270°)、左が 180°(−180°)、下が 270°(−90°)。左上に「…ルス数」（左が切れている）。

a5df7515:
  alt: 4-16-3 ねじ切りの Gコード
  text: |
    【Gコード】G32 X＿ Y＿ F＿;
    - X＿: X軸インクレ移動量(±)
    - Y＿: Y軸インクレ移動量(±)
    - F＿: ねじピッチ

730375f2:
  alt: 4-16-6 接線制御軸（L1、L2）
  text: |
    X-Y 座標。L1（右向き）のあと L2（下向き）へ曲がる経路。

459de3d7:
  alt: 4-16-6 接線制御の各軸速度
  text: |
    X は右、Y は下の向き。① 右へ移動して A で ② 右下へ向きを変える。k: X軸速度は A で下がり、l: Y軸速度は A から始まり、m: Z軸速度は A で向きを変えるためのパルス状の動き。

d72139fd:
  alt: 4-16-6 接線制御基準位置
  text: |
    (1) X 軸を基準に角度 θ、「接線制御基準位置」、「(k)」、「指令極性」、「メカ機構一周パルス」。左端の文字は切れている。

2d8c47c1:
  alt: 4-16-8 コンベア追従送り同調
  text: |
    - 【X軸】X軸原点から Im の位置で「同調送り」を開始し、「追従送り」で ワーク A → B を追う。Ib は「ここまで来たらエラー」の距離。終了後に「もどり」
    - 【コンベア軸(Y)】(ベルト駆動): ベルトコンベア上のワーク。LM はコンベア軸原点からの距離
    - コンベア軸原点の信号はワーク毎に発生

b8278d77:
  alt: 4-16-10 フレキシブル電子カムのデータの流れ
  text: |
    ① EXCEL編集（② I～V のコンディションデータ・ポイントデータ（全6種）、③ 各軸のグラフ表示 I～II）→ テクノコードプログラム（PTPA X～）。セッティングPCソフトでファイル選択・編集し、④ SLM8000 コントローラへダウンロード。コントローラから読出したプログラムをアップロード。

0d6f75f7:
  alt: 4-16-11 巻線指令の軸
  text: |
    第１軸～第９軸（X、Y、Z、A、B、C、R、Q、T）のうち、A を「主軸」、残りの軸のうち何れか１軸を「トラバース軸」とする。

5b28efbf:
  alt: 4-16-11 巻線指令 RE0（自然終了）
  text: |
    横軸 時間。主軸角度は鋸歯状に繰り返し、トラバース位置は三角形に往復する。RE0 は往復の途中で自然に終了する。

412593c4:
  alt: 4-16-11 巻線指令 RE1（トラバース始端側終了）
  text: |
    主軸角度（鋸歯状）とトラバース位置（三角形）。RE1 はトラバースの始端側で終了する。終わりの部分は「2)のピッチ調整」。

1989a8d3:
  alt: 4-16-11 巻線指令（3)のピッチ調整）
  text: |
    主軸角度（鋸歯状）とトラバース位置（往復）。終わりの部分で「3)のピッチ調整」。

61386c10:
  alt: 4-16-11 巻線指令 RE2（トラバース終端側終了）
  text: |
    主軸角度（鋸歯状）とトラバース位置。RE2 はトラバースの終端側で終了する。「3)のピッチ調整」。

18d2798a:
  alt: 4-16-11 巻線指令（2)のピッチ調整）
  text: |
    主軸角度（鋸歯状）とトラバース位置。矢印の箇所で「2)のピッチ調整」。

78e6604b:
  alt: 4-16-11 巻線指令（終端の動き）
  text: |
    主軸角度（鋸歯状）とトラバース位置（三角形の往復）。矢印の箇所で、最後の往復が終端まで進む。横軸 時間。

37f4c2e5:
  alt: 4-16-11 運転画面の巻線の警告表示
  text: |
    「標準SLM8000 セッティングPCソフト ( C:¥Slm8000¥slm8000drv.ini )」の運転画面。運転操作パネルの右側に「巻線 最終層異常」の表示（丸で囲み）。

c6c46233:
  alt: 4-18-1 バックラッシュ補正の概念図
  text: |
    凡例: ガタの量、機構(テーブル)、モータ軸位置、機構の動き（実線の矢印）、モータの動き（点線の矢印）、バックラッシュ補正による動作（太い矢印）。移動方向が反転するときに、モータをガタの量だけ余分に動かして機構の位置を合わせる。

925cd562:
  alt: 4-18-2 工具長補正の指令コード
  text: |
    `G43 H□□;` / `THSET□□;`（□□ の部分に波線）

42529b15:
  alt: 4-18-2 工具長補正の例（Z の論理座標）
  text: |
    Z の論理座標（( )は Z の論理座標）。機械原点から ②(1000) ③(3000)、④(1000) ⑤(−2000)、⑥(1000) ⑦(2000) へ移動する軌跡。

2cced77c:
  alt: 4-18-2 工具長補正の例（補正後）
  text: |
    同じ動作の補正後の軌跡。②→③→④→⑤→⑥→⑦ と、Z 方向の移動が段状になる。

f4967a38:
  alt: 4-18-3 工具径補正（G41・G42）
  text: |
    「指令プログラム」の直線に対し、工具（半径 D）が G41（左側）または G42（右側）にずれた位置を通る。

407cdf7b:
  alt: 4-18-3-3 径補正モードへの入り方
  text: |
    凡例: 指令軌跡（青）、移動軌跡（緑）、指令軌跡を法線方向に径補正分シフトした線（点線）、● はその交点。工具の始点から、DL / G41 と DR / G42 のそれぞれで、補正後の経路が交点を経て直線に入る様子。

f50c1852:
  alt: 4-18-3-4 径補正の終了
  text: |
    - 例1. `G40 G01 X__ Y__`（終了）
    - 例2. `G40` → `G01 Z__` … `G00 X__`（終了）
    G41 で補正中の経路から、G00での終了（点線）と G01での終了（実線）の違い。「プログラム指令」の経路。

5f93cfa3:
  alt: 4-18-3-4 径補正の終了（①・②）
  text: |
    ① A へ水平に移動し、② 下向きに移動する。工具の円と、補正後の経路（点線）。

0c5a0126:
  alt: 4-18-3-5 X/Y指令なしのステップ
  text: |
    例:
    ```
    G41 G01 X__ Y__ D__
    G01 Z__
     ～
    G00 Z__
    G01 X__ Y__
    ```
    `G01 Z__` から `G00 Z__` までが「X/Y指令なしのステップ（9ステップ以下）」。

33af474f:
  alt: 4-18-3-5 先読みステップカウント
  text: |
    例:
    ```
    G41 G01 X__ Y__ D__
    G01 Z__          ①
    M98 Pxx          ②
     ～
    G01 X__ Y__
    Nxx G90 G01 Z__  ③ ④⑤⑥⑦⑧⑨
     ～
    G01 X__ Y__      ⑩
    ```
    右の番号が先読みステップカウント。

0bfc86e9:
  alt: 4-18-3-6 補正中の G00 の動作
  text: |
    波線の経路（G00）と、工具の円・補正後の経路（点線）。G00 のステップでも最終的なオフセット位置へ移動する。

acb21232:
  alt: 4-18-3-7 工具径補正機能パラメータの画面
  text: |
    画面「工具径補正機能パラメータ」。工具径補正データ（タスク0）No.0～19 の値（すべて 0）。ボタン: ファイルから読出、ファイルに保存、アップロード SLM8000->PC、ダウンロード PC->SLM8000、編集前に戻す、閉じる。

6bc56332:
  alt: 4-18-3-9 ROMSW設定ソフト「基本」画面（角度一致閾値）
  text: |
    ROMSW設定ソフトの「基本」画面。「工具径補正 角度一致閾値」の欄（単位 [1/1000pls] と読める）が赤丸で囲まれている。ほかの項目は小さくて判読できず。

20b2390c:
  alt: 4-18-3-9 角度一致閾値（pls）
  text: |
    2 本の線が角度 θ で開いている。開いた先の幅が「角度一致閾値(pls)」。下の線の名前は「円弧半径」（下が切れている）。

7f7df6c0:
  alt: 4-18-3-10 工具径補正情報画面
  text: |
    画面「工具径補正情報」。「径補正中」（未選択）、径補正No. 0、「閉じる」ボタン。

f9f4d120:
  alt: 4-18-3-11 工具径補正エラー情報画面
  text: |
    画面「工具径補正エラー情報」。エラー発生ステップ番号（空）、エラー内容（空）、「閉じる」ボタン。

0eb5be8f:
  alt: 下向きの矢印

ffea0f0b:
  alt: 下向きの矢印

9d346e9b:
  alt: 4-18-3-12 エラー例（DL① と DL② が重なる）
  text: |
    DL①（点線）と DL②（実線）が同じ直線上で重なる。下向きの矢印は次の図へ続くことを示す。

5c879333:
  alt: 4-18-3-12 エラー例（直線と円弧で交点ができない）
  text: |
    DL①、DL②、DL③ の補正経路（点線）。指令経路は細長いコの字。

946fb550:
  alt: 4-18-3-12 エラー例（交点が出来ない）
  text: |
    DL①（上向きの直線）と DL②（円弧）。補正後の経路（点線）に交点が出来ない。下向きの矢印は次の図へ続く。

9b93db0d:
  alt: 4-18-3-12 対策例（ステップ間に直線を入れる）
  text: |
    DL①、DL②（短い直線を追加）、DL③（円弧）。ステップ間に直線を入れて交点が出来るようにした例。

82a7c960:
  alt: 4-18-3-12 エラー例（DR①・DR②）
  text: |
    `J0;`。DR①（円弧）と DR②（上向きの直線）。補正後の経路（点線）。下向きの矢印は次の図へ続く。

e7d7050a:
  alt: 4-18-3-12 対策例（DR① ～ DR③）
  text: |
    DR①（円弧）、DR②（追加した直線）、DR③（上向きの直線）。

0cc736aa:
  alt: 4-18-3-12 対策例（DL① ～ DL③）
  text: |
    DL①（円弧）、DL②（追加した直線）、DL③（円弧）。

dd174920:
  alt: 4-18-3-12 エラー例（DR② の移動方向が逆）
  text: |
    DR①、DR②、DR③ の経路。"DR②"の移動方向が、"ステップ②"の移動方向と逆になる。※線「-----」は交点を出すための補助線。

8e37d1ff:
  alt: 4-18-3-12 エラー例（DR① ～ DR③、矩形）
  text: |
    矩形の指令経路と、DR①、DR②、DR③ の補正経路（点線）。補助線（細い点線）で交点を示す。

45cb803e:
  alt: 4-18-3-12 エラー例（DR①・DR②）
  text: |
    DR①、DR② の補正経路（点線）と指令経路（実線）。※線「-----」は交点を出すための補助線。下向きの矢印は次の図へ続く。

24b92689:
  alt: 4-18-3-12 対策例（DR①・DR②）
  text: |
    DR①、DR② の補正経路（点線）と指令経路（実線）。※線「-----」は交点を出すための補助線。

acfe399d:
  alt: 4-18-3-12 エラー例（DL① ～ DL③、円の交点）
  text: |
    DL①、DL②、DL③ と、交点を求めるための円（点線）。※線「-----」は交点を出すための補助線。

fdb059c4:
  alt: 4-18-3-12 対策例（DL① ～ DL③、円の交点）
  text: |
    DL①、DL②、DL③ と、交点を求めるための円（点線）。

8ef1fa5a:
  alt: 4-18-3-12 エラー例（DR① ～ DR③、円弧）
  text: |
    DR①（下向きの直線）、DR②、DR③（円弧）の補正経路（点線）と指令経路。※線「-----」は交点を出すための補助線。下向きの矢印は次の図へ続く。

a0f6bea7:
  alt: 4-18-3-12 対策例（DR① ～ DR③、円弧）
  text: |
    DR①、DR②、DR③（円弧）の補正経路（点線）と指令経路。上に「…軌跡です。」の文字（左が切れている）。

b4dffd07:
  alt: 4-18-3-12 エラー例（DL① ～ DL④、DL②・DL③ の軌跡）
  text: |
    DL①（下向き）、DL④（右向き）と、円弧の指令経路。「DL②軌跡」「DL③軌跡」を拡大して示す。※線「-----」は交点を出すための補助線。

d1efbc52:
  alt: 4-18-3-12 エラー例（DL② が１周以上移動）
  text: |
    DL①（下向き）、DL②（円、点線）、DL③（右向き）。"DL②"は１周以上移動します。

afbb4ada:
  alt: 下向きの矢印

8957e9e9:
  alt: 4-18-3-13 円弧の中心の調整
  text: |
    「始点」「運転プログラムで指定された終点」「運転プログラムで指定された中心」と「調整後の中心」。始点と終点から等距離になるように中心を調整する。

ec952a9d:
  alt: 4-18-3-13 円弧の中心の調整（座標の例）
  text: |
    始点 (0, 0)、運転プログラムで指定された終点 (800, 0)、運転プログラムで指定された中心座標 (1000, 0)。

5eacd8e0:
  alt: 4-18-3-13 円弧の中心の調整（調整後）
  text: |
    始点 (0, 0) から 運転プログラムで指定された終点 (800, 0) への円弧。R600 となるように調整後の中心座標 (400, 447)。

0a5f30c7:
  alt: 4-18-3-13 円弧の半径の調整
  text: |
    始点から運転プログラムで指定された終点への半円。「運転プログラムで指定された半径」と「調整後の半径」。

0de3e7b7:
  alt: 4-18-3-13 補正後の交点（円弧どうし）
  text: |
    `…5000 J19365;`（左が切れている）。2 つの円弧の指令経路と補正経路（点線）、交点を求める円。矢印で示す 2 つの点（左側の説明文は切れていて判読できず）。

c5922510:
  alt: 下向きの矢印

d10108f9:
  alt: 4-18-3-13 補正前図形の終点と補正後図形の交点
  text: |
    2 つの円弧の補正経路（点線）。「補正後図形の交点」と「補正前図形の終点」。

9a4ffdff:
  alt: 4-18-3-13 補正後の交点（円弧と直線）
  text: |
    `J0;`。円弧と上向きの直線の指令経路と補正経路（点線）。矢印で示す 2 つの点（左側の説明文は図に含まれていない）。

39b7991c:
  alt: 下向きの矢印

4d01a1e6:
  alt: 4-18-3-13 補正前図形の終点と補正後図形の交点（円弧と直線）
  text: |
    円弧と上向きの直線。「補正後図形の交点」と「補正前図形の終点」。

f8d60047:
  alt: 4-18-4 ピッチエラー補正の区間
  text: |
    基点＝機械原点。X軸座標の − 側に ③区間～①区間、+ 側に ①区間～⑧区間。各区間の補正間隔＝100000パルス。ピッチエラー計測誤差の階段状のグラフ。

08132e6b:
  alt: 4-18-4 ピッチエラー補正の設定例
  text: |
    X軸: 補正倍率 :1、補正間隔 :100000、補正データ先頭番号 :0、−側補正区間数 :3、+側補正区間数 :8。
    補正データ（No. → 補正値）: 000 → 3、001 → 2、002 → 0、003 → 0、004 → −2、005 → −3、006 → −4、007 → −5、008 → −5、009 → −6、010 → −6（ここまで X軸で使用）、011～4159 は他の軸で使用。

e5878f0e:
  alt: 4-18-5 形状補正（コーナー部の軌跡）
  text: |
    直角のコーナーで、「指令」の軌跡に対して「従来の軌跡」（点線）は大きく内側を回り、「補正有の場合の軌跡」は指令に近い。

f9743e14:
  alt: 4-18-5 形状補正（円弧の縮み）
  text: |
    円弧の指令（実線）と実軌跡（点線）。「この縮みを小さくします。」

13f56603:
  alt: 4-18-5 形状補正なしの軌跡
  text: |
    複雑な曲線の指令と実軌跡。「指示と実軌跡のずれ」が見える。

2e97ddf3:
  alt: 4-18-5 形状補正ありの軌跡
  text: |
    同じ曲線の指令と実軌跡。「指令と実軌跡のずれなし」。

d831bf45:
  alt: 4-18-5 円弧動作での各軸の速度（通常）
  text: |
    「サーボ応答チェック」画面（サンプリング 8msec）。上が X軸、下が Y軸の速度 [PPS]（±99875、±49937.5 の目盛、横軸 0～5 [sec]）。正弦波状の速度で、始まりと終わりに角がある。

d88be396:
  alt: 4-18-5 円弧動作での各軸の速度（プリ解加減速）
  text: |
    「サーボ応答チェック」画面（サンプリング 8msec）。始まりと終わりがなめらかな正弦波状の速度。

c1ae7044:
  alt: 4-18-5 真円精度解析の例
  text: |
    当社モーションアナライザでの真円精度解析の例。3 つの条件ごとに、円の指令（黒）と実軌跡（赤）を拡大した図と、条件の文字。
    条件の文字は小さくて判読できず。

64253ae9:
  alt: 4-18-5 加速ステップへの分解
  text: |
    - 【元の指令】L1 (F) のあと L2 (F)。X速度は Fx1 → Fx2、Y速度は Fy1 → Fy2 に段で変わる
    - 【L1を加速した例】L1 を L11、L12、L13 の加速ステップに分解。X速度は Fx11 → Fx12 → Fx13 → Fx2、Y速度は Fy11 → Fy12 → Fy13 → Fy2。「加速区間としてブロックを分解」

64e3778a:
  alt: 4-18-5 CAD/CAMによる加減速と加減速なし
  text: |
    - 【CAD/CAMによる加減速】(高精度輪郭制御の精度良好): F1、F2、F3、F4 と速度が段階的に上がり F に達する
    - 【加減速なし】F1～F4 のブロックが同じ速度 F

0452a100:
  alt: 4-19-1 ティーチングの画面
  text: |
    画面「ティーチング」。プログラム:
    ```
    1: LIN X40000 Y20000 F40000;
    2: LIN X40000 Y-20000 F40000;   （選択中）
    3: LIN X-40000 Y-20000 F40000;
    4: LIN X-40000 Y20000 F40000;
    5: END;
    ```
    ステップ変更（+、−）、ティーチング開始ステップ、チェック: サイクル、シングル（チェック）、ティーチング（灰色）。ボタン: 逆行、スキップ、挿入、置換、原点シフト、削除、実行、閉じる。

e13630c5:
  alt: 4-19-2 「逆行」動作（JOG/インチング後）
  text: |
    A からステップn で B へ向かう途中で JOG/インチングで移動したあと、「ティーチング移動量の戻り」で A へ戻る。

dec8c3cb:
  alt: 4-19-2 「逆行」動作（ステップn-1）
  text: |
    A → B（ステップn-1）→ C（ステップn）。B から「逆行」で A へ戻る。

ad5d75b1:
  alt: 4-19-4 「挿入」動作（A′・B・C′）
  text: |
    A → ステップn → B → ステップn+1 → C。JOG で A′ へ移動したあと、挿入により A′ → B → C、または A′ → C′（ステップn+1）と点線で示す経路。

5aca9c71:
  alt: 4-19-4 「挿入」された ステップn
  text: |
    A（ステップn-1）から D への「挿入されたステップn」、D から B′ へのステップn+1。もとのステップn は A から B（元々の目標値）。

9559c5d5:
  alt: 4-19-5 「置換」動作（修正したい位置）
  text: |
    A から B（元の目標値）へのステップn を、JOG/インチングで B′（修正したい位置）へ移動して置き換える（ステップn′）。次は C′ または C へ。

5d18791f:
  alt: 4-19-5 「置換」動作（ステップn-1）
  text: |
    A から B（元の目標値）へのステップn-1 を、JOG/インチングで B′（修正したい位置）へ置き換える（ステップn-1′）。次のステップn は C′ または C へ。

658a77e7:
  alt: 4-19-7 「削除」動作
  text: |
    A（ステップn-1）から B への「削除したステップ」を削除すると、次の移動指令がPTP/LIN(インクレ)の場合は C′ へ、元の n+1 であるステップn は C へ移動する。

c13dbee9:
  alt: 4-19-7 「削除」動作（座標シフト）
  text: |
    A(1000, 2000) から JOG/インチングで A′ へ。(1000, 3000) → (1000, 2000) に座標シフト。ステップn で B′(3000, 4000) → C′、または B(3000, 4000) → C。

0127d6c1:
  alt: 4-20-2 補間前加減速の処理の流れ
  text: |
    「加速度判定&補間前加減速（自動コーナオーバーライド）今回追加」→「軌跡発生 直線補間 円弧補間など」→「従来の各軸加減速(例:10msec)」の 加減速 → X軸指令、加減速 → Y軸指令。

02227905:
  alt: 4-20-3 補間前加減速(自動コーナオーバーライド)の速度
  text: |
    補間1、補間2、補間3 の速度。補間の境目 ①、② で速度が最小オーバーライドまで下がる。

5a01be93:
  alt: 4-20-5 加速度(速度変化量)
  text: |
    V1 から V2 へ向きが変わる。速度変化量 VA = V2 − V1（点線の矢印）。

22556132:
  alt: 4-20-6 補間前加減速パラメータの画面
  text: |
    画面「補間前加減速パラメータ」。タスク0。補間前加減速時定数 330 msec（0:補間前加減速無効）。最小オーバーライド設定（加速度 [pls/sec^2] → 最小オーバーライド [%]）:

    | 加速度 | 最小オーバーライド |
    |---|---|
    | 0 ～ 500000 | 100 |
    | 500000 ～ 700000 | 90 |
    | 700000 ～ 1000000 | 70 |
    | 1000000 ～ 1200000 | 40 |
    | 1200000 ～ 1500000 | 20 |
    | 1500000 ～ 2000000 | 10 |
    | 2000000 ～ 2500000 | 5 |

    ※加速度は絶対値を設定して下さい。ボタン: ファイルから読出、ファイルに保存、アップロード SLM8000->PC、ダウンロード PC->SLM8000、編集前に戻す、閉じる。

f5e6a08c:
  alt: 4-20-6 補間前加減速の時定数とオーバーライド
  text: |
    オーバーライド(%) が 100% から 0% まで、補間前加減速(自動コーナーオーバーライド)時定数で階段状に下がり、最小オーバーライドで止まる。

a5885a43:
  alt: 4-20-7 動作例（V1 から V2 へ 90° の曲がり）
  text: |
    V1（右向き）から V2（上向き）へ曲がる。

2dd83ced:
  alt: 4-20-7 動作例の合成速度（最小OVR20%）
  text: |
    合成速度 [pps]。① と ② の境目で最小OVR20% まで下がり、② の終わりで最小OVR40%。横軸 時間。

a51ee60e:
  alt: 4-20-7 動作例（V1 から V2 へ下向きに曲がる）
  text: |
    V1（右向き）から V2（下向き）へ曲がる。

e20395ef:
  alt: 4-20-7 動作例の合成速度（最小OVR100%）
  text: |
    合成速度 [pps]。① と ② の境目は最小OVR100%（速度が下がらない）、② の終わりで最小OVR40%。

50a354e8:
  alt: 4-20-7 動作例の合成速度（最小OVR80%）
  text: |
    合成速度 [pps]。① と ② の境目で最小OVR80% まで下がり、② の終わりで最小OVR40%。

bd76ec47:
  alt: 4-20-8 動作例（V1 から V2 へ緩やかに曲がる）
  text: |
    V1（右向き）から V2（右上向き）へ緩やかに曲がる。
