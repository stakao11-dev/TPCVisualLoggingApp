8d68ad49:
  alt: 全体ステータス #1500
  text: |
    ① 全体ステータス #1500（全タスク共通）。16 ビット:

    | ビット | 内容 |
    |---|---|
    | D0 | アラーム発生中 |
    | D1 | 全タスクセッティングモード |
    | D4 | 高速センサーラッチ完 |
    | D6 | 運転プログラムデータ変更 |
    | D7 | 制御周期負荷ワーニング |
    | D8 | 制御周期負荷過大 |
    | D9 | バッテリー電圧低下ワーニング |

58914ec1:
  alt: 全体アラーム #1501
  text: |
    ② 全体アラーム #1501（全タスク共通）。16 ビット:

    | ビット | 内容 |
    |---|---|
    | D1 | バックアップエラー |
    | D2 | パラメータ未設定エラー |
    | D3 | ROMSWバックアップエラー |
    | D14 | 特殊モード中エラー |
    | D15 | システムエラー |

e20c6dbb:
  alt: 軸ステータス #1510～#1518 と軸アラーム #1520～#1528
  text: |
    ① 軸ステータス #1510～#1518（タスク毎）。16 ビット:

    | ビット | 内容 |
    |---|---|
    | D0 | インポジション |
    | D1 | 加減速たまり有り |
    | D2 | サーボON |
    | D3 | 原点復帰完了 |
    | D6 | SPIN動作中 |
    | D7 | SPIN停止中 |
    | D9 | 原点確定済み |

    ② 軸アラーム #1520～#1528（タスク毎）。16 ビット:

    | ビット | 内容 |
    |---|---|
    | D0 | +方向偏差過大 |
    | D1 | −方向偏差過大 |
    | D2 | サーボアンプアラーム |
    | D3 | +方向ソフトリミット |
    | D4 | −方向ソフトリミット |
    | D5 | +方向ハードリミット |
    | D6 | −方向ハードリミット |
    | D7 | +方向パルス発生過大 |
    | D8 | −方向パルス発生過大 |
    | D10 | アブソリードエラー |

7d38d0c6:
  alt: タスクステータス #1530
  text: |
    ① タスクステータス #1530（タスク毎）。32 ビット:

    | ビット | 内容 |
    |---|---|
    | D0 | アラーム発生中 |
    | D1 | 軌跡発生完 (FG完了) ※1 |
    | D2 | 途中停止中 (FG途中停止中) ※1 |
    | D3 | 軌跡発生中 (途中停止中はOFF) ※1 |
    | D4 | プログラム運転中 |
    | D5 | プログラム停止中 |
    | D6 | ステップ途中停止 |
    | D7 | 各種シーケンス完 ※2 |
    | D8 | シングルステップモード |
    | D9 | ティーチングモード |
    | D10 | サイクル運転モード |
    | D11 | マシンロック（未対応） |
    | D12～D15 | 運転モード 0:セッティング、1:手動、2:自動、3:OT無視、4:DNC |
    | D16 | 割当軸インポジション |
    | D17 | 割当軸ACCたまり有り |
    | D18 | 割当軸サーボON |
    | D19 | 割当軸原点復帰完 |
    | D24 | 高速センサーラッチ完 |
    | D25 | 割当軸接線制御 |
    | D26 | 最終層巻数異常警告(巻線) |
    | D27 | ポイントテーブル変更フラグ |

44904040:
  alt: ※1 FGステータスタイミングチャート
  text: |
    コマンドで軌跡発生が始まり、ストップで止まり、スタート（再開）で再び始まり、終わると次コマンド受付可。加減速(指数) の曲線。ステータスは D1 軌跡発生完（軌跡発生中は OFF、終わると ON）、D2 途中停止中（ストップからスタートまで ON）、3 軌跡発生中（軌跡発生の間 ON、途中停止中は OFF）。図の下端は切れている。

8bfe8818:
  alt: タスクアラーム #1531
  text: |
    ② タスクアラーム #1531（タスク毎）。16 ビット:

    | ビット | 内容 |
    |---|---|
    | D0 | プログラム実行エラー |
    | D1 | Mコード実行エラー |
    | D2 | 割り当て軸エラー |
    | D3 | FG内部演算エラー |
    | D4 | サーボOFFエラー |
    | D5 | 外部アラームAエラー |
    | D6 | 外部アラームBエラー |
    | D7 | 外部アラームCエラー |
    | D8 | 非常停止 |
    | D9 | 主軸アラーム |

c4e5705b:
  alt: 入出力ポートのビット指定
  text: |
    16 ビット（MSB ～ LSB）。LSB から D0指定、D1指定 … D14指定、D15指定。
