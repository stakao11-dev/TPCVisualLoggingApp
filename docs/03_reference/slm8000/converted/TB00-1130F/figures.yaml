# TB00-1130F（SLM8000 ユーザーズマニュアル 運転プログラム編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# - PLMC-M3EX の運転プログラム編（TB00-0980F）と同じ図が多い。同じ図はそちらと同じ書き方にした。
# - マクロ変数のステータスのビット図は LSB = D0 として、引き出し線の位置を画素から求めた。
#   結果は TB00-1134（送受信データ説明書）のステータスのビットと一致する。
#   PLMC-M3EX とは項目が違う（#1500 の D9、#1501 の D14、軸ステータス・軸アラーム、#1530 の D27、#1531 の D8・D9 など）。

ab1ae511:
  alt: 5-1 プログラム管理の画面（プログラムメモリ使用状況）
  text: |
    画面「プログラム管理」。プログラムメモリ使用状況の列見出し BLK、TSK、PNO が赤丸で囲まれ、矢印で指されている。タスク0(カレントタスク)、Tコード / Gコード。ボタン: 移動、コピー、削除、ファイルから読出、ファイルに保存、アップロード SLM8000->PC、ダウンロード PC->SLM8000、閉じる。
    一覧の値は小さくて判読しにくい。

bb0b64c3:
  alt: 5-1 運転プログラムの保存の仕組み
  text: |
    - 「テキストファイル」（テクノコード/Gコードプログラム。市販エディターにて編集可能）を、セッティングPCソフトで ファイル読出し・ファイル書込み
    - セッティングPCソフト内: 「テキスト→バイナリ変換処理」と「逆変換」、「編集操作、ティーチング、トレース運転なども含む」
    - SLM8000本体へ ① 書込み（ダウンロード）、② 読出し（アップロード）。セッティングPC［プログラム設定画面］による編集
    - 本体のブロック表（BLK、TSK、PNO）: BLK 0・1 = TSK 0・PNO 10「PN010タスク0用 (59～116)」、BLK 5 = TSK 0・PNO 1「PN01タスク0用 (1～58)」、BLK 6 = TSK 1・PNO 1「PN01タスク6用 (1～58)」（図の表記のまま）、BLK 7～9 = TSK 0・PNO 100「PN0100 タスク0用 (117～174)」。BLK は 0～63。"( )"内はステップ数

b4631543:
  alt: 5-2 運転プログラムの事例（①・② の移動）
  text: |
    X-Y 座標。① (0,0) から (3000, 2000) へ、② (3000, 2000) から (6000, 4000) へ。

3a79cbf9:
  alt: 5-2 運転プログラムの事例（速度と入出力のタイミング）
  text: |
    - X軸速度: 速度Fx、PTP速度X(パラメタ)。Y軸速度: 速度Fy、PTP速度Y(パラメタ)
    - 出力0: ステップ① の間 ON、そのあと OFF。出力1: OFF からステップ② で ON。入力0: WNR0 で OFF → ON を待つ
    - 速度Fx = F値(pps) × X移動量 ／ √(X移動量² + Y移動量²) = 1000 × 3000 ／ √(3000² + 3000²) = 832pps
    - 速度Fy = F値(pps) × Y移動量 ／ √(X移動量² + Y移動量²) = 1000 × 2000 ／ √(3000² + 2000²) = 555pps

ec1f8ec5:
  alt: 5-2 運転プログラムの事例（PTP・円弧・PTPA）
  text: |
    論理原点(0, 0) から: ① 論理原点、② 入力01 をチェックして PTP で (1000, 500) 付近へ、③ 0.5秒停止、④ 入力02=ONの時のみ 円弧動作、⑤ PTPA、⑤の時間とのトータルが1秒となるように停止、⑥ そのあと出力05, 01 をOFF。

058d2632:
  alt: 5-2 パス制御の速度（L1～L6）
  text: |
    X軸の速度 L1、L2、L3 と Y軸の速度 L4、L5、L6。補間加減速(指数形)で、各ステップの間で速度が止まらずにつながる。L1～L6 は移動量。横軸 時間。

010ccc62:
  alt: 5-3-5 逆行(ステップ逆行)
  text: |
    n（ステップNO.）から n+1 へ進む経路。● : ステップ間停止、○ : ステップ途中停止、点線の矢印 : 逆行。

47651ca6:
  alt: 5-4 プリ解析処理（テキスト→バイナリ）
  text: |
    PC（PC通信ライブラリ）の「テクノコードプログラム又はGコードプログラム」→「プリ解析処理（テキスト→バイナリ変換）」→ ダウンロード →「SLM8000内運転プログラム（中間言語）」。逆方向は アップロード →「逆変換（バイナリ→テキスト変換）」。

bf1cdcd0:
  alt: 5-4 プリ解処理（円弧補間命令）
  text: |
    円弧補間命令(1本) →「プリ解処理」→ 直線補間命令（数10～数100本）

11db1418:
  alt: 5-5 DNC(Direct NC)方式
  text: |
    PC の「動作プログラム（Gコード/Tコード）」ファイル →「プリ解処理」→ データ送信（・RS232C ・イーサネット）→ SLM8000 の「バッファーメモリー（一時的に蓄積）」→ 実行(動作)。

923f9ef6:
  alt: 5-6 単独コマンド運転
  text: |
    - 「動作プログラムや運転シーケンスの発生」→「動作指示コマンド」→「PC通信ライブラリー」→「PLMCシリーズ」
    - 「動作プログラムコード（・Gコード ・テクノコード）」→「プログラム変換ライブラリー」→「動作プログラムバイナリーデータ」→「動作プログラム書込み」→ PLMCシリーズ

