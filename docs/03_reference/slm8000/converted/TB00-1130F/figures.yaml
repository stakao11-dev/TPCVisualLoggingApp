f822ff1a:
  alt: 6-1-10-1 MOUT の信号タイミング
  text: |
    - Mコード SLM出力: OFF → ON
    - MSTRB SLM出力: Mコード出力後に ON（Ⓐ）、MFIN が ON になると OFF
    - MFIN SLM入力: MSTRB を受けて ON
    - MOK SLM入力: ON のパルス
    - ※MSTRBがOFFしている間のMコードは不定です。下に「1ステップ」の範囲。

