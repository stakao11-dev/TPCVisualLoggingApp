  text: |
    運転プログラム(メインプログラム) NO.1～NO.3 から CALL [AAA] → サブルーチン [AAA]（ネスティング1回）→ CALL [BBB] → サブルーチン [BBB]（ネスティング2回）→ END で戻る。メインから CALL [CCC] → [CCC] → END で戻り、メインの END。

