# TB00-1130D（SLM8000 ユーザーズマニュアル 機能編 1～2 章）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

f8ff24e5:
  alt: 1-1 PC と AS710 ボードの接続
  text: |
    「PC」（セッティングPC ソフトを CD で提供）と「AS710ボード」をつなぐ図。
    - 「イーサネット」: PC と AS710 ボードの Ethernet コネクタ（CNETR）をつなぐ
    - 「RS232C」: PC から「AS232」（変換器）を経て AS710 ボードの CN5A につなぐ
    - AS710 ボード上の部品（MAX10 FPGA、SDRAM、CN1～CN5A、LED など）が描かれている。細部の文字は小さくて判読できない箇所がある

8dd53d57:
  alt: 1-1-2 ユーザーアプリケーションソフトによる運転（システム構成）
  text: |
    - **パソコン（Windows7 / 10）**: 「ユーザアプリケーションソフト」（・オリジナルソフト ・市販ソフトウェア）が「関数コール」で「PC通信ライブラリDLL（テクノ）」を呼ぶ
    - PC通信ライブラリから「SLMシリーズ」の「ファインモーションコントローラ SLM シリーズ（テクノ）」へ、【イーサネット】◆1.2 または【RS232C】でつなぐ。やりとりは「◆データ送信」「◆動作指示」（PC → SLM）、「◆データ受信」（SLM → PC）
    - SLM シリーズには「表示/スイッチ」「機械操作パネル」（破線）がつながる
    - SLM シリーズから: サーボアンプ・パルスモータ（多軸制御）、入出力制御（操作・制御・監視）、DA、AD

a78534e2:
  alt: 1-2 入出力信号による運転（配線例）
  text: |
    - 「運転・操作SW」（SWパネル/外部コントローラ）の接点が、CN2 を経て「SLM-8000(AS-710)」の入力 STARTSW、STOPSW、RSTSW、ZRTNSW、ZSETSW、EMS につながる
    - SLM-8000 の出力 READY、RUN、ERROR、INPOS、PAUSE、PRDY が、CN2 を経て「運転状態出力」（表示/外部コントローラ（シーケンサ））につながる

972fd34f:
  alt: 1-3 サーボ（軸）制御のブロック図
  text: |
    - **ソフトウェア**: 「軌跡発生」から、第1軸～第8軸それぞれの「加減速制御」「直線/指数」
    - **ハードウェア（専用LSI）**: 各軸の「パルス発生回路」が「パルス」を出す
    - 各軸の「パルス指令型サーボ／パルスモータAMP」がモータ(M) を動かし、「PGパルス（オプション）」が戻る
    - 第1軸（パルス軸）～第8軸（パルス軸）

39a55a3e:
  alt: 1-4-1 SLM8000本体機能リスト 自動送り（運転プログラム、PC コマンド）
  text: |
    区分: B:標準、O:オプション（原本の「O」）。◆ は改訂マーク。

    | 機能 | 内容 | 区分 |
    |---|---|---|
    | パス機能 | ブロック間停止 0（コンタリング） | B |
    | 自動原点復帰 | 電源投入時に自動的に原点復帰順序指定可能 | B |
    | オーバライド ◆1.3 | 運転中の速度変更 0～200%（補間/主軸） | B |
    | 位置決め(INC)PTP | 1軸～8軸 位置決め命令 | B |
    | 位置決め(ABS)PTPA | 1軸～8軸 位置決め命令・論理座標絶対値指令 | B |
    | 位置決め(ABS)PTPB | 1軸～8軸 位置決め命令・機械座標絶対値指令 | B |
    | 直線補間(INC)LIN | 1軸～8軸 直線補間 同時8軸 インクレ | B |
    | 直線補間(ABS)LINA | 1軸～8軸 直線補間 同時8軸 絶対値 | B |
    | 高精度ラッチSLIN ◆1.3 | 位置ラッチ（スキップ有/無） | O |
    | 中心指定円弧補間(I,J) | 中心指定円弧補間 任意2軸（プリ解/ボード内） | B |
    | 半径指定円弧補間(CR) | 半径指定円弧補間 任意2軸（プリ解/ボード内） | B |
    | ３点指定円弧補間(T_) ◆1.3 | ３点指定円弧補間 任意2軸（プリ解/ボード内） | B |
    | ヘリカル補間 | 円弧2軸 + 残りの1軸（プリ解/ボード内） | B |
    | ポイント位置決PTMA | パレタイザ用（ポイントテーブル） | O |
    | ポイント直線補間LIMA | ポイントテーブルの直線補間 | O |
    | 巻線命令REEL ◆1.3 | 巻線命令 | O |

6a008d83:
  alt: 2-1-5 信号の動作タイミング（A と B）
  text: |
    信号が OFF から ON に変わる時点が A、ON から OFF に変わる時点が B。一般の信号は A（OFF → ON）で動作し、例外的に B（ON → OFF）で動作するものがある（本文）。

40badb79:
  alt: 2-3 標準入出力の割り当て（入力論理画面）
  text: |
    ROMSW 設定ソフトの「入力論理」画面。入力ごとに、チャンネル、ピン番号、標準信号名、ユーザー信号名、A接点／B接点の選択。
    表示されている割り当て（チャンネル、ピン番号、標準信号名）:

    | チャンネル | ピン番号 | 標準信号名 |
    |---|---|---|
    | i#01 D00 | CN2-01 | DEC1 |
    | i#01 D01 | CN2-02 | T0RESET |
    | i#01 D02 | CN2-03 | T0STOP |
    | i#01 D03 | CN2-04 | T0CRCLR |
    | i#01 D04 | CN2-05 | OTP1 |
    | i#01 D05 | CN2-06 | OTM1 |
    | i#01 D06 | CN2-08 | DEC2 |
    | i#01 D07 | CN2-09 | T0EMS |
    | i#01 D08 | CN2-10 | T0START |
    | i#01 D09 | CN2-11 | T0RETURN |
    | i#01 D10 | CN2-13 | OTP2 |
    | i#01 D11 | CN2-14 | OTM2 |
    | i#01 D12 | CN2-15 | DEC3 |
    | i#01 D13 | CN2-16 | DEC5 |
    | i#01 D14 | CN2-17 | T0ONSW |
    | i#01 D15 | CN2-18 | T0MFIN |

    すべて A接点が選ばれている。ボタン: 前、次、設定、編集前に戻す、閉じる。
    ピン番号は小さくて読みにくく、自信がない。

d2b1ac5c:
  alt: 2-3 入出力信号チェック（重複の警告）
  text: |
    ダイアログ「入出力信号チェック」。「以下の信号が重複しています。」
    ```
    DEC1    i#01 D00 － i#01 D04
            i#01 D00 － i#01 D10
            i#01 D00 － i#02 D14
    ```
    「閉じる」ボタン。
