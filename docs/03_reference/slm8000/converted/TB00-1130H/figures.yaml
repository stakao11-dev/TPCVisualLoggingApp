# TB00-1130H（SLM8000 ユーザーズマニュアル 実機試運転・調整編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

60bb0cbf:
  alt: 2 導入から試運転・調整までの作業フロー
  text: |
    （SLM の購入）から（実稼働）までの流れ。
    - 導入編: 初期導入作業（Ⅰ導入編 2.）PC環境準備・インストール・セッティングPCの表示確認（イーサネット/RS232C）→ ROMSWの設定（Ⅰ導入編 2.）基本的にデフォルト設定 → ダミー運転（Ⅰ導入編 7.）セッティングPCの操作に慣れる、サンプル運転プログラムを使う → モータ単体運転（Ⅰ導入編 8.）メカ駆動させずに、モータの回転のみ。使用するサーボアンプに応じた設定(ROMSW)、セッティングPC操作の習熟
    - 並行して「周辺設計・配線（ユーザ殿）」: 周辺回路、制御盤、強電回路、サーボパルスモータアンプ、アンプ・モータ/PG接続（Ⅱハードウェア編 6.）
    - 実機試運転・調整編: 実機試運転・調整（Ⅳ実機試運転・調整編）メカ駆動を含めたサーボ調整 → 運転プログラムの作成と実施（実稼働のためのいろいろな準備）
    - 注記: 導入編に沿って作業していただければ、徐々に試運転調整が完了します。標準設定ソフトの操作にも自然に慣れていただけます。実機での試運転作業をなるべく具体的に説明いたします。

    縮小されていて細部の文字は判読できない箇所がある。

cde0714e:
  alt: 3 実機試運転・調整の手順
  text: |
    手順説明の項目（上から順に）: 6-1 制御電源投入とセッティングPC接続、6-2 サーボパラメータの再確認、6-3 ROMSWの再確認、6-4 入力信号のチェック、6-5 非常停止関係のチェック、6-6 出力信号のチェック、6-7 サーボアンプの制御電源投入、6-8 サーボアンプのパラメータ設定、6-9 サーボ主電源投入、6-10 指令単位の確認、6-11 原点復帰の確認と調整、6-12 ソフトリミットの設定、6-13 メモリ運転、6-14 サーボ調整運転プログラム、6-15 モータ駆動能力の確認、6-16 サーボ系の調整、6-17 サーボ応答の確認、6-18 TPCによる精度チェック、6-19 パラメータの保存、完了。
    縮小されていて一部の項目名は判読しにくい。

e8280bb2:
  alt: 6-2 サーボパラメータ画面
  text: |
    セッティング PC の「サーボパラメータ」画面（タスク0、第1軸～第4軸）。※1 と ※2 の印が、画面の上の方の行（INPOS量・偏差上限値付近）と補間加減速の行付近に付いている。
    値は小さくて判読できず。

57ffac8e:
  alt: 6-4 入出力状態画面
  text: |
    セッティング PC の「入出力状態」画面。入力と出力のチャンネル、Pin No.、標準信号名、ユーザー信号名。ON の信号が色付き（黄、緑）で表示されている。
    細部は小さくて判読できず。

23765325:
  alt: 「注意」の絵

691842b6:
  alt: 6-7 サーボアンプの電源の配線例
  text: |
    - AC100V(200V) から「MC」（電磁接触器）を経て、サーボアンプの L1・L2（サーボ主電源）へ
    - AC100V(200V) から直接、サーボアンプの L1C・L2C（制御電源）へ。E は接地
    - MC のコイルは、「RL1」の接点（SVM）と「ESP」（非常停止）を直列に通して動かす
    - 「SLM SVM出力」が RL1 のコイル（ダイオード付き、24V）を動かす

31f46c0f:
  alt: 6-8 サーボアンプのパラメータ設定の流れ
  text: |
    「サーボアンプの電源を入れます」→「サーボメーカのPCソフトや設定器でパラメータ設定」→「可能であれば、パラメータはバックアップ(PCファイル)」→「仮設定完了（調整は別途）」

addba483:
  alt: 6-11-1 各軸ストロークの整理（例）
  text: |
    左から ハードOT（+OT）、ソフトOT、機械原点、ソフトOT、ハードOT（-OT）。
    - +OT からソフトOT まで 50、ソフトOT から機械原点まで +1500、機械原点からソフトOT まで -100、ソフトOT から -OT まで -50
    - 原点ドグ(DEC) は機械原点の手前 50 から ON

37e625de:
  alt: 6-11-1 原点復帰逃げ動作とストローク
  text: |
    - 「原点復帰開始位置」から「逃げ動作」で「原点復帰逃げ量」だけ離れ、「原点復帰動作」で機械原点へ向かう
    - 中央が「正常領域」、両側が「ソフトOT領域」、外側が「ハードOT領域」、両端に「マシンエンド」。機械原点の左右に「ｿﾌﾄOTﾊﾟﾗﾒﾀ ＋側」「－側」
    - 原点(DEC) の信号は機械原点の手前から ON。DEC の切り替わりから機械原点までが「SD」、C相パルスから機械原点までが「SC」
    - SD：DECサーチ方式における原点距離、SC：C相サーチ方式における原点距離

8acddaae:
  alt: 6-11-3 原点復帰方式の選択（DEC サーチ）
  text: |
    ① POS+OT と ① POS-OT の間に ② POSDEC と機械原点がある。③ の動きで DEC を検出し、④ 原点復帰逃げ量だけ動く。原点ドグ(DEC) は機械原点の手前から ON。

4400d351:
  alt: 6-11-3 原点ドグと C 相パルス
  text: |
    「原点ドグ（減速ＬＳ）」が ON になってから、次の「Ｃ相パルス」までの距離が A、C 相パルスから「機械原点」までが B。C 相パルスの間隔が C。

464cfe5d:
  alt: 6-12 ソフトリミットの設定
  text: |
    中央が「正常領域」、両側が「ソフトＯＴ領域」、外側が「ハードＯＴ領域」、両端に「マシンエンド」。機械原点から左右に「ｿﾌﾄOTﾊﾟﾗﾒﾀ ＋側」「－側」。マシンエンドからソフトOTの境界までが A（左）、B（右）。

4f7a3675:
  alt: 6-13 メモリ運転の概略手順
  text: |
    1. プログラム作成（編集）（サンプル運転プログラム）
    2. ローディング
    3. 自動運転モード、シングルステップ（「ティーチング画面」）
    4. スタート信号（1ステップ動作）（ティーチング画面では「実行」ボタン）
    5. 停止位置や出力信号の確認
    6. 運転完了？ N なら 4 に戻る。Y なら次へ
    7. シングルステップ解除（通常モード）
    8. スタート信号（連続動作）（ティーチング画面では「実行」ボタン）
    9. 運転完了

b7e68850:
  alt: 6-15 モータの駆動能力の確認（波形）
  text: |
    区間: 「LIN X+」「TIM」「LIN X-」。
    - 「速度指令波形（補間時定数：0 ms）」: LIN X+ で正の一定値、TIM で 0、LIN X- で負の一定値
    - 「サーボ応答波形（位置ループゲインによる一次遅れ）」: 指令に一次遅れで追従する（Ⓐ は減速の始まり）
    - 「モータ電流波形」: 加速時に Ⓑ のピーク、定速時は Ⓒ の一定値、減速時に Ⓓ の逆向きの電流
    - 下の区間: 加速、定速、減速

b06f3a8f:
  alt: 6-17 サーボ応答の確認（PTP）
  text: |
    台形の速度の波形。(A) PTP時定数（立ち上がりの傾き）、(B) PTP速度（一定の高さ）、(C) オーバーシュート（立ち上がりと停止のあとの揺れ）。

82df5267:
  alt: 6-17 サーボ応答の確認（補間）
  text: |
    補間の速度の波形。(A) 補間時定数（立ち上がりと立ち下がりの幅）、(B) 補間速度（動作プログラムによる指令）、(C) オーバーシュート。

072d622d:
  alt: 6-18 TPC による精度チェック（TPC-EXCEL の解析例）
  text: |
    - 左: 「サーボ応答」のグラフ。「指令速度」（緑）と「応答速度」（ピンク）の台形の速度。応答は指令に遅れて追従する
    - 右: 真円精度解析のグラフ。理想円（ピンク）の周りで、実際の軌跡（紫）が凹凸を持って一周している

    軸の目盛りの値は小さくて判読できず。

102a1392:
  alt: 7-3 制御系の良さ
  text: |
    「制御系の良さ」←「軌跡指令どおりに正確にメカが動く」。その中身は 3 つ:
    - 応答性: 指令の変化に高速に追従
    - 精度: 指令どおりの速度、位置
    - 安定性: 外力などの影響を受けない

e0aec8d9:
  alt: 7-4 サーボ系の 3 重ループ
  text: |
    - 「速度パターン」（台形）から「パルス列」が出て、「偏差カウンタ」→「KP(D/A変換器)」（位置ループ）→「速度 Kv 制御部Ti」（速度ループ）→「電流制御部」→「電力変換部」（電流ループ）→「モータ」。「PG」（エンコーダ）の信号が各ループに戻る
    - 点線の枠: 「位置制御の場合」は位置ループから、「速度制御の場合」は速度ループからがサーボパック側
    - 下: 「SLM」（1～8軸）と「サーボパック」の範囲。「位置制御用ｻｰﾎﾞｱﾝﾌﾟ使用時」

4d9e6942:
  alt: 7-5 SLM とサーボ系の関係（パルス指令サーボアンプ）
  text: |
    「SLM」の「軌跡発生」から「パルス指令」が「パルス指令サーボアンプ」へ。アンプの中は「位置制御」→「速度制御」→「電流制御」→ モータ(M)、PG の信号が戻る。

a20fc439:
  alt: 7-5-1 パルスモータの場合
  text: |
    SLM8000 の「サーボパラメータ」（PTP時定数、PTP速度、JOG速度、補間時定数）と「ROM SW設定」（ﾊﾟﾙｽ形態 P/D,CW/CCW,A/B、MAX PPS、ﾊﾟﾙｽ幅、差動/O.C）から「パルス指令」が「P. M DRV」（パルスモータドライバ）へ行き、「P.M」（パルスモータ）を動かす。ドライバ側の設定: フルｽﾃｯﾌﾟ/ハーフｽﾃｯﾌﾟ、最適電流など（各メーカの説明書参照）。

8137b6fb:
  alt: 7-5-2 パルス指令型サーボの場合
  text: |
    SLM8000 の「サーボパラメータ」と「ROM SW設定」（前の図と同じ項目）から「パルス指令」が「パルス指令型サーボアンプ」（位置ループ制御、速度ループ・電流ループ制御）へ行き、モータ(M)と PG につながる。
    - 「各メーカの説明書に従ってパラメタ設定下さい。」
    - 「パソコン又は設定器」: サーボアンプメーカは試・調用のソフトや設定器を準備しています。まず、サーボ単独で正常動作を確認して下さい。
