# TB00-1132（SLM8000 ROMSW 設定ソフト マニュアル）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
# 縮小された画面で小さくて読めない箇所は「（判読できず）」とした。

716bbb47:
  alt: 3-1 SLM8000 で記憶している情報
  text: |
    - **ファイル(バックアップ)**: 動作プログラム .TXT、サーボパラメータ .PRM、P.E補正データ .PIT、工具長補正データ .TOL、工具径補正データ .TOD、補間前加減速パラメータ .ACO、位置決めポイントテーブルデータ .PNT、絶対値エンコーダオフセット .AEO、ROMSWファイル .ROM、INIファイル .INI
    - **Windows**: 「セッティングPCソフト」（PC通信LIB）と「ROMSW設定ソフト」（どちらも CD で提供）。イーサネットまたは RS232C で SLM8000 とつながる
    - **SLM8000**: 「FLASH(バックアップ) ※1」に ROMSW〈オプション〉、ROMSW〈ユーザ〉、サーボパラメータ、P.E補正データ、工具長/径補正データ、補間前加減速パラメータ、動作プログラム ※2、ポイントテーブル ※3、絶対値ｴﾝｺｰﾀﾞｵﾌｾｯﾄ。「RAM(バッテリバックアップ)」にマクロ変数、論理座標系、アブソ位置
    - Windows → SLM8000: 「初期化」「ダウンロード」、SLM8000 → Windows: 「アップロード」
    - 右端の注記（●PC側でもファイル管理…、○SLM…）は切れていて判読できず
    - SLM8000 の下に「記憶の不良」（× の付いた矢印）

fb59d3a5:
  alt: 3-2 ROMSW の目的
  text: |
    「PC」の「ROMSW」（設定ソフト）から、「イーサネット」または「RS232C」で「SLM8000」の「ROMSW設定」を「フラッシュメモリ」に書き込む。

5c5c39ca:
  alt: 「注意！」の絵

cf425147:
  alt: 「※」と中かっこ（本文の項目をまとめる記号）

90aff4cb:
  alt: 5 メインメニュー
  text: |
    ウィンドウ「標準SLM8000 ROMSW設定ソフト（C:¥Slm8000¥slm8000drv.ini）」。タイトルに、使っている ini ファイルのパスが表示される。
    「ファイル名」の欄、ボタン: 基本、入力、出力、軸設定、手動パルサ ジョイスティック、主軸、ファイルから読出、ファイルに保存、アップロード SLM8000->PC、ダウンロード PC->SLM8000、オプション、閉じる。

f8f531b3:
  alt: 6-1 基本パラメータ画面
  text: |
    「基本」画面。
    - サーボ制御周期(msec) 2.0、サーボ制御周期ワーニングレベル 87.50 %、パルスジェネレータクロック(kHz) 512
    - イーサネット設定: IPアドレス 192.168.0.2、サブネットマスク 255.255.255.0、デフォルトゲートウェイ 192.168.0.1
    - 自動原点復帰ディレイ(msec) 2048、サーボアラーム無視時間(msec) 2048、サーボリセット保持時間(msec) 128、サーボオン遅延時間(msec) 0、アラーム時サーボオフ遅延時間(msec) 0、工具径補正 角度一致閾値 3000 [1/1000pls]
    - ユーザーフリーオプション（チェックあり: OT時のサーボオフ、アラーム時のサーボオフ、アブソ位置ステータス指令基準指定）。システム起動時論理座標系「クリアしない」、原点復帰時論理座標系「クリアしない」、プログラム実行時原点復帰チェック条件「原点確定済」。ほかに システム起動時サーボオン、ONSW(オンスイッチ)、自動原点復帰、PTP時定数PTP速度基準、原点復帰時ホーム位置、原点復帰時ソフトリミット（灰色）、MOK入力、M00/M01停止、Gコード途中再開、補間オーバライド個別指定、主軸オーバライド個別指定（灰色）、バッテリーアラーム無視
    - バックアップ方法: 運転プログラム・各種パラメータとも「自動バックアップ」（位置決めポイントテーブルは灰色）。【注意】バックアップは10万回の回数制限があります。
    - 機械パネル:コード仕様（オーバライド選択、動作軸選択）、巻線命令設定（トラバース軸移動無し巻数 0）、エラー発生/リセット時の軸停止方法選択「全て減速停止」
    - ボタン: 設定、編集前に戻す、閉じる

31ce421c:
  alt: 6-1-10 工具径補正角度一致閾値
  text: |
    2 本の直線のなす角 θ と「円弧半径」。開きの大きさが「角度一致閾値(pls)（判定は円弧の長さ）」。

4e9412ed:
  alt: 6-1-14 サーボ ON 動作（状態遷移の表）
  text: |
    見出しは「サーボON許可/不許可状態遷移」。

    | トリガー | サーボOFFにするエラー発生中 | サーボOFFにするエラー未発生 |
    |---|---|---|
    | リセット入力ON、リセットコマンド、ONSW(オンスイッチ)入力 ON ※1 | （斜線） | サーボON許可（サーボOFFエラー解除） |
    | 全軸サーボONコマンド | （斜線） | （上の行と同じ欄） |
    | サーボOFFにするエラー発生 ※2、全軸サーボOFFコマンド、ONSW(オンスイッチ)入力 OFF | サーボON不許可（サーボOFFエラー） | サーボON不許可（サーボOFFエラー） |

bc2f36a1:
  alt: 6-2 入力信号の設定画面
  text: |
    「入力論理」画面。矢印の説明:
    - 「入力信号アドレス」（左の列）
    - 標準信号名の欄（上の矢印。本文の一部「…します。」）
    - 「この信号名はユーザーが自由に変更できます（セッティングPCソフトから変更可能）」（ユーザー信号名の欄）
    - 「A接点はB接点を選択」（右の列）
    表示されている信号は TB00-1130D 2-3 の画面と同じ（DEC1、T0RESET、T0STOP、T0CRCLR、OTP1、OTM1 …）。細部は小さくて判読できず。

0dd3eb76:
  alt: 6-2 入力信号の論理（A 接点）
  text: |
    「入力信号 SW」が閉（ON）、開（OFF）になると、「SLM内部の入力回路」の信号が ON、OFF になる波形。

372424cc:
  alt: 6-3 出力信号の設定画面
  text: |
    「出力論理」画面。矢印の説明:
    - 「出力信号アドレス」（左の列）
    - 「出力ピンに割り当てる出力信号はこの信号名で選択します。」（標準信号名の欄）
    - 「この信号名はユーザーが自由に変更できます。（セッティングPCソフト）」（ユーザー信号名の欄）
    - 「ONアクティブ又はOFFアクティブを選択」（右の列）
    表示されている信号は SVON1、SVRST1、SVON2、SVRST2 …。細部は小さくて判読できず。

e38e0964:
  alt: 6-3 出力回路（トランジスタ出力）
  text: |
    トランジスタの出力が負荷（コイル）を経て 24V につながる回路。「トランジスタ(出力)ONで信号レベルはLになります。」（左上に本文の一部「…ランジスターON」）

89e198ff:
  alt: 6-3 出力信号の割り当て（0#0002）
  text: |
    | チャンネル | Bit | コネクタ名 | ピンNO. | 信号名 | 出力論理 | 初期状態 |
    |---|---|---|---|---|---|---|
    | 0#0002 | D00 | AS700 CN2 | 68 | Ro00 | ON | OFF |
    | 0#0002 | D01 | AS700 CN2 | 69 | Ro01 | ON | OFF |
    | 0#0002 | D02 | AS700 CN2 | 71 | Ro02 | ON | OFF |
    | 0#0002 | D03 | AS700 CN2 | 72 | Ro03 | ON | OFF |
    | 0#0002 | D04 | AS700 CN2 | 73 | Ro04 | ON | OFF |
    | 0#0002 | D05 | AS700 CN2 | 74 | Ro05 | ON | OFF |
    | 0#0002 | D06 | AS700 CN2 | 75 | Ro06 | ON | OFF |
    | 0#0002 | D07 | AS700 CN2 | 77 | Ro07 | ON | OFF |
    | 0#0002 | D08～D15 | （斜線） | （斜線） | （斜線） | （斜線） | （斜線） |

97b8c0dd:
  alt: 6-4 軸設定画面
  text: |
    「軸設定」画面。有効物理軸選択（第1軸～第8軸のチェック）、軸選択、各軸設定（論理軸割り当て、メカ機構1回転パルス数、指令パルス出力設定、フィードバック設定、絶対値エンコーダ設定、原点復帰設定など）。
    値は小さくて判読できず。

79a5ed6e:
  alt: 6-4 パルスの出力形態（差動とオープンコレクタ）
  text: |
    | 方式 | 信号名 | High(正論理) | Low(負論理) |
    |---|---|---|---|
    | 差動 | ＊PGC□、PGC□ | 信号波形（2 本が逆向き） | 信号波形（2 本が逆向き、極性が逆） |
    | オープンコレクタ O.C | PGC□ | （信号波形） | （信号波形） |

6411126d:
  alt: 6-4 パルス幅の倍率
  text: |
    - 1倍: MAX PPS まで使用可
    - 2倍: MAX PPS の 1/2まで使用可
    - 3倍: MAX PPS の 1/3まで使用可
    （倍率が大きいほどパルスの幅が広い）

1b2bce5f:
  alt: 6-5 手動パルサ／ジョイスティック設定画面
  text: |
    「手動パルサ/ジョイスティック」画面（タスク0）。
    - 手動パルサ/ジョイスティック使用数 1
    - 手動パルサ: FB割付 FB無し、FB入力極性 標準
    - ジョイスティック: AD割付 AD無し、AD入力極性 標準、AD入力最小電圧 -20000、AD入力最大電圧 20000、AD入力不感帯 4000
    - 軸選択設定（0～15）: 1 手動パルサ 第1軸(X)、2 手動パルサ 第2軸(Y)、4 手動パルサ 第3軸(Z)、8 手動パルサ 第4軸(A)、ほかは無効
    - ボタン: 設定、編集前に戻す、閉じる

074e0a31:
  alt: 6-5 ジョイスティックの電圧と速度の関係
  text: |
    横軸「入力電圧」、縦軸「指令速度」。「AD最小電圧」以下では「－最大速度」、「AD最大電圧」以上では「＋最大速度」。中央の「0速」の区間が「不感帯」。「ジョイスティック有効立ち上がり時ADの電圧」が中央。

65b6184b:
  alt: 6-6 主軸設定画面
  text: |
    「主軸設定」画面（タスク0）。主軸機能選択「無し」、主軸指令Mコード出力。アナログ指令設定（DAチャンネル DA1、最大指令電圧 10000 [mV]、主軸最高回転数 3000 [rpm]、主軸時定数 200 [msec]）、主軸オーバライド、主軸DA出力片極、フィードバック設定（FBポート FB無し、FB入力極性、任意分周値、主軸１回転パルス数）。多くの項目は灰色。

f749abad:
  alt: 6-7 オプション画面
  text: |
    「オプション」画面。オプションのチェック欄（表示のみ）: 補間ブロックつなぎ処理、パネルによるティーチング操作、プログラム逆行操作、ポイント位置決め、手動パルサ/ジョイスティック、DNC運転、ピッチエラー補正、高精度輪郭制御(形状補正)、同一指令2軸制御、工具長補正、摩耗補正、マルチタスク（マルチタスク有効、最大タスク数）、定時直線型補間加減速、S字補間加減速、接線制御、直径指令、高精度ラッチ（センサーラッチ:G31/SLIN）、マクロ機能、フレキシブル電子カム、工具径補正、補間前加減速、巻線、主軸 ON/OFF(信号出力)、主軸 アナログ指令、最大軸数。
    「ファイル名」、「シリアル番号 SLM - 02005」。ボタン: ファイルから読出、ファイルに保存、アップロード SLM8000->PC、ダウンロード PC->SLM8000（灰色）、ROMSWデータに反映（灰色）、閉じる。
    どれにチェックが入っているかは小さくて判読できず。

a6ca8f13:
  alt: 7-2 指令/FB の設定
  text: |
    「ユーザ上位ソフト」から「移動命令」が SLM8000 の「位置制御」へ。位置制御から「6-4.(3)⑧(D) 電子ギヤ」→「6-4.(3)⑧(C) 指令極性」→「サーボアンプ」→ モータ → 【メカ】。
    モータのエンコーダから「6-4.(3)⑤(B) FB極性」→「6-4.(3)⑤(C) 任意分周」→ 位置制御へ戻る。

a6e2a78c:
  alt: 7-2-1 指令極性／FB 極性の設定の流れ
  text: |
    機械の諸元により決定:
    1. 機械の＋方向を確認
    2. 機械が＋方向へ動くときのモータの回転方向を確認（ボールネジ、ギヤなどのメカ構造を考慮する）

    サーボアンプの諸元により決定（左右 2 系統）:
    - 左: 「この方向へモータを動かす為の指令パルス形態を確認」→「1)の表の「パルス出力波形」と同じ波形？」→ YES なら「正」に設定、NO なら「逆」に設定（指令極性）
    - 右: 「この方向へモータを動かした時のFBパルスの波形を確認」→「A相進み？」→ YES なら「正」に設定、NO なら「逆」に設定（FB極性）
