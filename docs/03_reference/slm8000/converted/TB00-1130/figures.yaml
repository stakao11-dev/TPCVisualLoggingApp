# TB00-1130（SLM8000 ユーザーズマニュアル 表紙・目次・お願い）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

cfd8debf:
  alt: 座標系と移動指令の関係
  text: |
    - 「機械原点（原点復帰）」を原点とする「機械座標系（アブソ位置）」と、「論理原点（原点設定）」を原点とする「論理座標系（指令位置／機械位置）」
    - 「LIN指令」の矢印: ① と ② はインクレの移動量。①a・②a は論理座標系、①b・②b は機械座標系での目標位置
    - 【移動指令】
      - インクレ指令 (PTP/LIN): LIN X① Y②（G91 G01）
      - 論理座標系アブソ指令 (PTPA/LINA): LINA X①a Y②a（G90 G01）
      - 機械座標系アブソ指令 (PTPB/LINB): LINB X①b Y②b
    - 【位置データ】（座標／表示）: 論理座標系 ─ 指令位置、機械位置（FB位置）。機械座標系 ─ アブソ位置
