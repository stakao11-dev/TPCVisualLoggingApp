58e7fb67:
  alt: 4-1-7 タスクステータス・軸ステータスのタイミングチャート
  text: |
    イベント: 「コマンド」→「ストップ」→「スタート（再開）」→「次コマンド受付可」。
    - 軌跡発生: コマンドで ON、ストップで OFF、スタート（再開）で ON、次コマンド受付可で OFF
    - 補間加減速(指数): 軌跡発生に合わせて指数関数的に上がり下がりする
    - タスクステータス「D0 軌跡発生完」: コマンドで OFF、次コマンド受付可で ON
    - タスクステータス「D1 途中停止中」: ストップからスタート（再開）までの間 ON
    - タスクステータス「D2 軌跡発生中」: 軌跡発生と同じ（ストップの間は OFF）
    - 軸ステータス「D0 インポジション」: 軌跡発生中は OFF。ストップのあと（* の時点）と、次コマンド受付可のあと（* の時点）に ON
    - 軸ステータス「D1 加減速たまり有り」: 軌跡発生中は ON。ストップの少しあとと、次コマンド受付可の少しあとに OFF
    - 注記の「*」は本文の「*：サーボパラメータのINPOS量に応じ…」を指す

    この図のタスクステータスのビット番号（D0 軌跡発生完、D1 途中停止中、D2 軌跡発生中）は、ビット割り当ての図（D1 軌跡発生完、D2 途中停止中、D3 軌跡発生中）と 1 つずれている。原文のまま写した。

