# TB00-1133（SLM8000 通信ライブラリ リファレンスマニュアル）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
# ビット図のビット番号は LSB=D0 として、引き出し線と括弧の位置（画素）から求めた。

ad2fdf39:
  alt: 通信ロギングフラグのビット割り当て
  text: |
    | ビット | 内容 |
    |---|---|
    | D0 | ロギング無効 |
    | D1 | 常時ロギング |
    | D2 | 常時ロギング（初期化/終了のみ） |
    | D3 | 常時ロギング（データ送信のみ） |
    | D4 | 常時ロギング（データ受信のみ） |
    | D5 | 常時ロギング（コマンド要求のみ） |
    | D6 | エラーロギング |
    | D7 | エラーロギング（伝送エラーのみ） |
    | D8 | リトライロギング |

    パッケージのヘッダー（`Slm8000comnt.h` の `COML_*`）の値と一致する。

8f11bbc2:
  alt: 付加パラメータの例（運転プログラム）
  text: |
    32 ビット。
    | ビット | 内容 |
    |---|---|
    | D0～D15 | プログラム番号（1～32767） |
    | D16～D31 | 先頭ブロック番号 |

1dc6aa51:
  alt: 付加パラメータの例（ポイントテーブル書込）
  text: |
    32 ビット。
    | ビット | 内容 |
    |---|---|
    | D0～D9 | 書込ポイント数（1～400） |
    | D10～D19 | 書込開始番号（1～400） |
    | D20～D28 | 対象軸（軸フラグ） |

dbef80a0:
  alt: 付加パラメータの例（軸番号と送受信の指定）
  text: |
    32 ビット。
    | ビット | 内容 |
    |---|---|
    | D0～D3 | 0～軸数-1 |
    | D15 | 0:受信、1:送信 |

    どのデータタイプの例かは、図だけでは分からない（本文の例の並びの中にある）。

2a0d9e78:
  alt: 付加パラメータの例（ポイントテーブル読出）
  text: |
    32 ビット。
    | ビット | 内容 |
    |---|---|
    | D0～D9 | 読出ポイント数（1～400） |
    | D10～D19 | 読出開始番号（1～400） |
    | D20～D28 | 対象軸（軸フラグ） |
