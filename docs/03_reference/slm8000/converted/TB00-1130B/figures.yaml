# TB00-1130B（SLM8000 ユーザーズマニュアル ハードウェア編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

5062ad2d:
  alt: 1-1 電源仕様（電源電圧の低下）
  text: |
    電源電圧の変化の図。縦軸の目盛りは 5V、4.8V、1V、0V。
    - Ⓐ（実線）: 電圧が 4.8V 付近まで下がってから 5V に戻る
    - Ⓑ（破線）: 電圧が 4.8V を下回り、1V 付近まで下がってから 5V に戻る
    （本文の電源シーケンスの説明に対応する）

eb24bd9f:
  alt: 1-4 ノイズ対策とシールド処理（配線例）
  text: |
    - SLM8000 の「サーボ」とサーボアンプなど、「I/O」と中継端子台などを、シールド線（破線）でつなぎ、シールドは相手側で接地する
    - DC電源の +24V、0V、FG を SLM8000 につなぐ。「0Vはアースしない。」
    - 下端の文は切れている（「DC電源側でFGを落とせない」場合の説明）

f8f58a4b:
  alt: 1-4 アースプレート
  text: |
    「アースプレート」に M3タップ（又は M4）の穴が並び、「各ユニットのアース」「制御盤のアース」を「2mm²以上のライン（3～6mm²程度の丸ﾗｸﾞ線/平ﾗｸﾞ線）」でつなぐ。

a54c3776:
  alt: 「注意」の絵

5bdf380f:
  alt: 2-1 AS710 コントローラボードの外形
  text: |
    AS710 ボードの外形と部品配置。外形 230 × 100（取付穴の間隔 220 × 90、端から 5）。
    上辺: 電源、Ethernet（CNETR）、CN1 サーボ 8軸（幅 146）、CN2 I/O（幅 84）。左辺: CN3、FG2、FG1、CN5、CN5A、CNSDA、CN7、LED1。右辺: CNEXT FB10ch。中央: SHCPU、外部ﾌﾗｯｼｭ、SRAM、SDRAM、DSW1、MAX10(FPGA)、BT1。
    細部の文字は小さくて判読しにくい。

7350449e:
  alt: 2-1 DA001 接続時の高さ
  text: |
    「DA001接続」: CNSDA に DA001 をつないだときの高さ 19、CNETR の高さ 16。

84f3dc0f:
  alt: 2-2-1 AS232 の外観
  text: |
    - 「コネクタ面」: D SUB コネクタ、幅 45（両側 5）、高さ 15 + 15、取付穴 φ3.5
    - 「部品面」: CN1（1～6）。「※ CN1でAS710（SLM）CN5/CN5Aと接続します。」
    - 側面: DSUB 9P、M3ボルト L=10mm、取付用板金、スペーサ L=7mm、M3ナット、CN1

21d2523c:
  alt: 2-2-2 取付板金加工図
  text: |
    取付板金の加工寸法: 穴 φ3.5 の間隔 45、切り欠き 34 × 13.5。
    - 「ナット溶接の場合」: M3ナット、L 7mm
    - 「貫通穴の場合」: φ3.5、この場合はスペーサが必要です。

0aa0aa32:
  alt: 2-2-3 AS710 CN5/CN5A ～ AS232 CN1 ケーブル（CB-C-012-00）の結線
  text: |
    | ピン | 信号 |
    |---|---|
    | 1 | 5V |
    | 2 | TXD |
    | 3 | RTS |
    | 4 | RXD |
    | 5 | 0V |
    | 6 | CTS |

    3 番（RTS）と 4 番（RXD）の線が途中で交差して描かれている。ケーブル長は「1m以下」。
