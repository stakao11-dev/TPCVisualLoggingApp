# TB00-1136（SLM8000 Gコード変換ライブラリ リファレンスマニュアル） の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

e09092ba:
  alt: 戻り値のビット構成（エラー発生ステップ番号と発生エラーコード）
  text: |
    16 ビット（D15～D0）。ビットの範囲は図の括弧の位置から求めた（RTMC64 の TB00-1045・1046 と同じ構成）。
    - D15～D12: 発生エラーコード
    - D11～D0: エラー発生ステップ番号

f47e3fb2:
  alt: 戻り値のビット構成（引き出し線の先の文字が切れている）
  text: |
    16 ビット（D15～D0）。ほかの図と同じく、D15～D12 と D11～D0 の 2 つの範囲に括弧がある。引き出し線の先の文字（発生エラーコード、エラー発生ステップ番号）は画像の右端で切れていて写っていない。

