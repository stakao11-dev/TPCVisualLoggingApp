# TB00-1216（SLM8000 イーサネット通信仕様）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

5f9c261e:
  alt: 3 TCP/IP 通信手順
  text: |
    1. 開始
    2. TCP/IPソケットオープン
    3. TCP/IPコネクション要求
    4. 接続成功？ いいえ → 3 に戻る。はい → 次へ
    5. （必要に応じて）繰り返し開始
    6. TCP/IPデータ送信（SLM8000データ受信、動作要求）※
    7. TCP/IPデータ受信（SLM8000結果応答）※
    8. （必要に応じて）繰り返し終了
    9. 終了

630e0c0d:
  alt: 4-1 受信要求のデータ構成
  text: |
    先頭の「ヘッダーデータ（16Byte）」だけで構成される。

9f01c0f8:
  alt: 4-1 受信データの構成
  text: |
    先頭の「ヘッダーデータ（16Byte）」のあとに、データが続く。

59347e9b:
  alt: 4-2 動作要求のデータ構成
  text: |
    先頭の「ヘッダーデータ（16Byte）」のあとに、データが続く。

c93ba94f:
