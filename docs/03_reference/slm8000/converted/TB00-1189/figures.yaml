# TB00-1189（SLM8000 テキストコマンド通信仕様）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

4d13b77b:
  alt: 3-2 コマンドデータのフォーマット
  text: |
    - 動作要求（書込要求）: チェックサム（2 文字）、タグ「REQ」（52 45 51）、データタイプ、タスク番号、コマンドパラメータ（可変長）、ターミネートコード（CR、0DH）
    - 受信要求: チェックサム、タグ「RCV」（52 43 56）、データタイプ、タスク番号、コマンドパラメータ（可変長）、ターミネートコード（CR、0DH）

6c47c81c:
  alt: 3-3 応答データ 1) ACK コード
  text: |
    ≪フォーマット≫ 1 文字の「ACK」（06H）。「ACKｺｰﾄﾞ」。

41e9bae2:
  alt: 3-3 応答データ（受信データ）のフォーマット
  text: |
    チェックサム、タグ「DAT」（44 41 54）、受信データ（可変長）、ターミネートコード（CR、0DH）。

1237e742:
  alt: 3-3 応答データ（動作要求受付不可）のフォーマット
  text: |
    チェックサム、タグ「ANS」（41 4E 53）、エラーコード、ターミネートコード（CR、0DH）。

35cda543:
  alt: 3-4 異常発生時の応答データのフォーマット
  text: |
    チェックサム、タグ「RTY」（52 54 59）、エラーコード、ターミネートコード（CR、0DH）。

9263aba4:
  alt: 4-2 1) マクロ変数書込コマンド（REQ_MCRREG）の例
  text: |
    外部機器から SLM8000 へ「動作要求」:
    `"5AREQ84000000003E8FFFFF830CR"`（CR はターミネートコード）
    - サム「5A」、タグ「REQ」、データタイプ（矢印）、タスク、コマンドパラメータ。本文: マクロ変数#1000へ－2000を書き込む例
    - SLM8000: 「動作要求受付」。コマンドを正常に実行した時は「ACK」を返し、外部機器は「通信終了」

c14f23ed:
  alt: 4-2 2) プログラム実行情報の受信の例
  text: |
    外部機器から SLM8000 へ「受信要求」: `"CBRCV0C00CR"`（サム「CB」、タグ「RCV」、データタイプ、タスク番号）。SLM8000: 「受信要求受付」。
    コマンドを正常に受付けた時、SLM8000 から: `"6BDAT0201000000001000000000001CR"`（サム「6B」、タグ「DAT」、受信データ）。外部機器は「通信終了」。

a7ad80bb:
  alt: 4-2 受信データの内訳
  text: |
    受信データ「0201000000001000000000001」（図の上端は一部切れている）を区切ったもの:
    - プログラム実行ステータス
    - プログラム番号
    - 実行ステップ番号
    本文: プログラム実行ステータスが 02010000h、選択されたプログラム番号が 1、実行ステップ番号 1。

399a95f8:
  alt: 6-1 正常処理（通信の流れ）
  text: |
    1) 動作要求コマンド: 外部機器 → SLM8000「テキストデータ（REQ/RCV）」。
    - 動作要求受付不可の場合: SLM8000 → 外部機器「テキストデータ（ANS）」（動作要求受付不可通知）で通信終了
    - 受付けた場合: SLM8000 → 外部機器「ACK/テキストデータ（DAT）」（動作要求受付通知）で通信終了

4d3b7400:
  alt: 6-2 異常処理 ＜リトライ＞
  text: |
    外部機器 → SLM8000「データ」の送信中に、SLM8000 で「ハードエラー発生 RS OFF」。外部機器は「CS OFFによる、送信停止」。
    SLM8000 は「再送要求送信 受信不許可タイマ開始」で「RTYコマンド」を送る。外部機器は「送信中の場合、送信中断」。
    SLM8000 は「受信不許可タイムアップ 受信バッファクリア RS ON」。外部機器は「データ再送」で「正常データ」を送り、「通常のプロトコルに戻る」。

96a8eb75:
  alt: 6-2 異常処理 ＜マルチリトライ＞
  text: |
    外部機器 → SLM8000「不正データ」、SLM8000 → 外部機器「RTYコマンド」、外部機器 → SLM8000「RTYコマンド」。SLM8000 は「通信処理終了」。

70f5c293:
  alt: 6-2 異常処理 ＜リトライオーバー＞
  text: |
    外部機器 → SLM8000「不正データ」と、SLM8000 → 外部機器「RTYコマンド」を 3 回くり返し、4 回目の「不正データ」で「通信処理終了」。

5538820a:
  alt: 6-2 異常処理（タイムアウト）
  text: |
    外部機器 → SLM8000「正常データ」が届かない（×）まま「3秒」たつと、もう一度「正常データ」を送る。2 回目も届かず（×）、3 回目の「正常データ」で「通常のプロトコルに戻る」。

a4053f7e:
  alt: 6-2 異常処理 ＜ハードエラーのリトライ＞
  text: |
    ＜リトライ＞と同じ流れで、SLM8000 が送るのが「RTYコマンド(NAK)」。ハードエラー発生 RS OFF → CS OFFによる送信停止 → 再送要求送信 受信不許可タイマ開始 → 送信中の場合、送信中断 → 受信不許可タイムアップ 受信バッファクリア RS ON → データ再送「正常データ」→ 通常のプロトコルに戻る。
