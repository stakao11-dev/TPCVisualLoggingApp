# TB00-1040（RTMC64 ユーザーズマニュアル 表紙・目次・お願い）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

a895a934:
  alt: 座標系と移動指令の関係
  text: |
    - 「機械原点(原点復帰)」を原点とする「機械座標系(アブソ位置)」と、そこからずれた「論理原点(原点設定)」を原点とする「論理座標系(指令位置/機械位置)」
    - 右上の矢印は移動の例で、① と ② はインクレの移動量
    - ①a・②a は論理座標系での目標位置、①b・②b は機械座標系での目標位置
    （本文の LIN X① Y②、LINA X①a Y②a、LINB X①b Y②b に対応する）
