f7a7fd92:
  alt: 7-3-3 マクロ変数番号の構成
  text: |
    「#1□□□□□」の番号のうち、上の桁（波線の部分）と下の桁にそれぞれ引き出し線がある（意味は本文にある）。

429a911e:
  alt: 7-3-8-1 全体情報（#1500 全体ステータス、#1501 全体アラーム）
  text: |
    ◆1.3。ビット番号は LSB を D0 として、図の引き出し線の位置から求めた。

    ① 全体ステータス #1500（全タスク共通）
    | ビット | 内容 |
    |---|---|
    | D0 | アラーム発生中 |
    | D1 | 全タスクセッティングモード |
    | D4 | 高速センサーラッチ完（予約） |
    | D6 | 運転プログラムデータ変更 |
    | D7 | 制御周期負荷ワーニング |
    | D8 | 制御周期負荷過大 |
    | D9 | FDT読込ワーニング |
    | D10 | サイクルタイム有効 [EC] |

    ② 全体アラーム #1501（全タスク共通）
    | ビット | 内容 |
    |---|---|
    | D1 | バックアップエラー |
    | D2 | パラメータ未設定エラー |
    | D3 | ROMSWバックアップエラー |
    | D4 | メカトロリンク初期化エラー [M3] ／ EtherCAT初期化エラー [EC] |
    | D5 | メカトロリンク全体通信エラー [M3] ／ EtherCAT全体通信エラー [EC] |
    | D7 | FDT読込エラー |
    | D8 | メカトロリンク通信ボード無しエラー |
    | D9 | メカトロリンクIO通信エラー |
    | D15 | システムエラー |

57471540:
  alt: 7-3-8-2 軸ステータス（#1510～ 軸ステータス、#1520～ 軸アラーム）
  text: |
    ◆1.3。ビット番号は LSB を D0 として、図の引き出し線の位置から求めた。

    ① 軸ステータス #1510～#1518（タスク毎）
    | ビット | 内容 |
    |---|---|
    | D0 | インポジション |
    | D1 | 加減速たまり有り |
    | D2 | サーボオン |
    | D3 | 原点復帰完了 |
    | D4 | 独立位置決め中 |
    | D5 | 独立位置決め停止中 |
    | D6 | SPIN動作中 |
    | D7 | SPIN停止中 |
    | D8 | トルク制御中 |
    | D9 | 原点確定済み |

    ② 軸アラーム #1520～#1528（タスク毎）
    | ビット | 内容 |
    |---|---|
    | D0 | +方向偏差過大 |
    | D1 | -方向偏差過大 |
    | D2 | サーボアンプアラーム |
    | D3 | +方向ソフトリミット |
    | D4 | -方向ソフトリミット |
    | D5 | +方向ハードリミット |
    | D6 | -方向ハードリミット |
    | D7 | +方向パルス発生過大（予約） |
    | D8 | -方向パルス発生過大（予約） |
    | D9 | サーボ主電源OFF |
    | D10 | メカトロリンク各軸通信エラー [M3] ／ EtherCAT各軸通信エラー [EC] |
    | D11 | メカトロリンク多重コマンド [M3] ／ EtherCAT多重コマンド [EC] |
    | D12 | EtherCAT未対応コマンド [EC] |

52daa2b8:
  alt: 7-3-8-3 タスク情報（#1530 タスクステータス）
  text: |
    ◆1.3。① タスクステータス #1530（タスク毎）、32 ビット。ビット番号は LSB を D0 として、図の引き出し線の位置から求めた。

    | ビット | 内容 |
    |---|---|
    | D0 | アラーム発生中 |
    | D1 | 軌跡発生完（FG完了）※1 |
    | D2 | 途中停止中（FG途中停止中）※1 |
    | D3 | 軌跡発生中（途中停止中はOFF）※1 |
    | D4 | プログラム運転中 |
    | D5 | プログラム停止中 |
    | D6 | ステップ途中停止 |
    | D7 | 各種シーケンス完 ※2 |
    | D8 | シングルステップモード |
    | D9 | ティーチングモード |
    | D10 | サイクル運転モード |
    | D11 | マシンロック（未対応） |
    | D12～D15 | 運転モード（0:セッティング、1:手動、2:自動、3:OT無視、4:DNC） |
    | D16 | 割当軸インポジション |
    | D17 | 割当軸ACCたまり有り |
    | D18 | 割当軸サーボON |
    | D19 | 割当軸原点復帰完 |
    | D20 | 割当軸独立位置決め中 |
    | D21 | 割当軸独立位置決め停止中 |
    | D24 | 高速センサーラッチ完 |
    | D25 | 割当軸接線制御 |
    | D26 | 最終層巻数異常警告(巻線) |
    | D27 | ポイントテーブル変更フラグ |

cd27f972:
  alt: ※1 FG ステータスタイミングチャート
  text: |
    イベント: 「コマンド」→「ストップ」→「スタート（再開）」→「次コマンド受付可」。
    - 軌跡発生: コマンドで ON、ストップで OFF、スタート（再開）で ON、次コマンド受付可で OFF
    - 加減速(指数): 軌跡発生に合わせて指数関数的に上がり下がりする
    - ステータス D1 軌跡発生完: コマンドで OFF、次コマンド受付可で ON
    - D2 途中停止中: ストップからスタート（再開）までの間 ON
    - 3 軌跡発生中: 軌跡発生と同じ（ストップの間は OFF）

7e2c24b2:
  alt: ② タスクアラーム #1531（タスク毎）
  text: |
    ビット番号は LSB を D0 として、PDF（90 ページ）の引き出し線の位置から求めた。この画像は左端が切れていて、非常停止の線が写っていない。

    | ビット | 内容 |
    |---|---|
    | D0 | プログラム実行エラー |
    | D1 | Mコード実行エラー |
    | D2 | 割り当て軸エラー |
    | D3 | FG内部演算エラー |
    | D4 | サーボOFFエラー |
    | D5 | 外部アラームAエラー |
    | D6 | 外部アラームBエラー |
    | D7 | 外部アラームCエラー |
    | D8 | 非常停止 |

f0b300a6:
  alt: 7-3-9 入／出力パターンのビット
  text: |
    16 ビット（MSB～LSB）。D0 が「D0指定」、D1 が「D1指定」、…、D14 が「D14指定」、D15 が「D15指定」（各ビットが入出力 1 点に対応する）。

774d0a47:
  alt: 7-3-21 マクロ変数番号の構成（#2□□□□□）
  text: |
    「#2□□□□□」の 5 桁のうち、上の 2 桁と下の 3 桁にそれぞれ引き出し線がある。本文: 上の 2 桁が「物理局番号(0～63)」、下の 3 桁が「局毎の通信データの先頭アドレスからのオフセットByte数(0～255)」。

7f8a93ce:
  alt: 7-3-22 マクロ変数番号の構成（#3□□□□□）
  text: |
    「#3□□□□□」の 5 桁。上の 2 桁が「物理局番号(0～63)」、下の 3 桁が「局毎の通信データの先頭アドレスからのオフセットByte数(0～255)」。
