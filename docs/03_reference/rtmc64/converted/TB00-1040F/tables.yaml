# TB00-1040F の表の手修正
# 結合セルなどで docling が正しく読めなかった表を、PDF と照合して書き直したもの。
# scripts/convert_pdf.py が変換時に、after を含む行の後ろにある最初の表をこの内容に差し替える。
#
# 「指令グループ」の列は、PDF では「Gr1」などのグループ名と、a/b/c（同じステップの Gr2/Gr3 の扱い）、
# ア/イ（実行の順番）の小さな列に分かれている。a/b/c とア/イの意味は表の下の本文にある。
# 斜線（ア/イの欄が「／」）は、その組み合わせがないことを示す。

