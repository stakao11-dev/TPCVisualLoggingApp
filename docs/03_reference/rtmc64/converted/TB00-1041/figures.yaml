# TB00-1041 の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# 図の大半はセッティングPCの画面のスクリーンショット。
# TPC ロギングに関係する図（62335970、6b88e2d2、96e21926、eaef3608）は、画面の項目をすべて書き起こした。
# ほかの画面は、画面の題名と主な項目だけを書いた（細かい表示値は省略した）。

06c59411:
  alt: 画面ツリー（全体）
  text: |
    セッティングPCの画面の構成図。メインメニュー（運転、パラメータ、表示設定、バージョン情報、終了）から、運転画面（運転操作パネル）、サーボパラメータ設定、ピッチエラー補正データ、工具長補正データ、工具径補正データ、補間前加減速パラメータ、バックアップデータ初期化、通信設定、セッティングPC動作設定、ポジション表示形式設定、入出力表示設定、バージョン情報の各画面へ分かれる。縮小図のため、細かい文字は判読できない。

40f45c5b:
  alt: 運転画面の操作メニュー
  text: |
    運転画面の操作メニューのボタンと、この節の記号の対応: ポジション(A)、入出力(B)、制御軸(C)、プログラム設定(D)、ティーチング(E)、マクロ変数(F)、オプション(G)、エラー情報(H)。

ab43e94d:
  alt: ポジション表示のメニュー
  text: |
    ポジション表示のメニュー項目: 指令位置、機械位置、偏差量、アブソ位置、相対移動量、トルク情報。

c0ed6c90:
  alt: 指令位置の表示画面（縮小）
  text: |
    指令位置の表示画面。X、Y、Z、A 軸の値（0.000）を緑の背景で表示する。

695fa1cb:
  alt: アブソ位置の表示画面（縮小）
  text: |
    「■アブソ位置」の見出しと、X、Y、Z、A 軸の値（0.000）を青の背景で表示する画面。

4a593177:
  alt: 入出力のメニュー
  text: |
    入出力のメニュー項目: 汎用入出力。

afe0b206:
  alt: 汎用入出力画面（縮小）
  text: |
    入力と出力の一覧（アドレス、チャンネル、標準信号名、ユーザー信号名）と、ショートカットのボタンが並ぶ画面。詳細は 5-2-3-1。

26a2dacd:
  alt: 機械位置の表示画面（縮小）
  text: |
    X、Y、Z、A 軸の値（0.000）を黄色の背景で表示する画面。

287363df:
  alt: 偏差量の表示画面（縮小）
  text: |
    X、Y、Z、A 軸の値（0.000）を赤の背景で表示する画面。

47a861af:
  alt: 相対移動量の表示画面（縮小）
  text: |
    X、Y、Z、A 軸の値（0.000）を灰色の背景で表示する画面。

dd0c8dd0:
  alt: トルク情報の表示画面（縮小）
  text: |
    X、Y、Z、A 軸の値（0.0）をオレンジの背景で表示する画面。

4aeec0c2:
  alt: 制御軸のメニュー（RTMC64-M3）
  text: |
    制御軸のメニュー項目: 軸設定、各軸ステータス、サーボステータスモニタ、メカトロリンクデータモニタ。

c01b3b72:
  alt: 制御軸のメニュー（RTMC64-EC）
  text: |
    制御軸のメニュー項目: 軸設定、各軸ステータス、サーボステータスモニタ、PDOデータモニタ。

1604cd65:
  alt: 軸設定画面（縮小）
  text: |
    無効軸、インタロック軸、サーボオフ軸を軸ごとにチェックする画面。詳細は 5-2-4-1。

3f1624bc:
  alt: 各軸ステータス画面（縮小）
  text: |
    軸ごとのステータス（位置決め完了、サーボオン、原点復帰済など）を表示する画面。詳細は 5-2-4-2。

3d22caec:
  alt: メカトロリンクデータモニタリング画面（縮小）
  text: |
    軸を選び、送信データと受信データを Offset と Data の表で表示する画面。詳細は 5-2-4-4。

112f4df8:
  alt: プログラム設定画面（縮小）
  text: |
    運転プログラムの一覧と編集欄がある画面。詳細は 5-2-5。

48881ddc:
  alt: ティーチング画面（縮小）
  text: |
    プログラム（例: LIN X1000 Y1000 F1000 WNR0000 ONR1856; OFR1856; END;）を表示し、ステップ変更や挿入・削除などのボタンがある画面。詳細は 5-2-6。

280ded9e:
  alt: サーボステータスモニタ画面（縮小）
  text: |
    全体情報、軸ごとのエラーコード、信号の状態の一覧を表示する画面。詳細は 5-2-4-3。

24ddce4a:
  alt: マクロ変数表示画面（縮小）
  text: |
    マクロ変数（#1000～#1199 (WORD)：グローバルマクロ変数）の値を一覧で表示し、一括アップロード・一括ダウンロードのボタンがある画面。詳細は 5-2-7-1。

9df56605:
  alt: マクロ変数書き込み画面（縮小）
  text: |
    マクロ変数番号（# 1000）に値を書き込む画面。DEC / HEX を選ぶ。詳細は 5-2-7-2。

26b5fe97:
  alt: 主軸操作画面（縮小）
  text: |
    速度指令、操作（正転(M3)、逆転(M4)、停止(M5)）、回転数モニタがある画面。詳細は 5-2-8-1。

62335970:
  alt: TPCロギング画面（縮小、64CH）
  text: |
    TPCロギング画面の 64CH タブを表示したもの。画面の項目は 5-2-8-2 の図と同じ（ロギング中、バッファデータ、保存データ、ロギング設定の一覧、ロギング周期、ファイル保存(アップロード)方法、ロギングファイル、開始・停止のボタン）。

338199a4:
  alt: 手動パルサモード画面（縮小）
  text: |
    手動パルサモード、ジョイスティックモード、倍率（X1、X10、X100、X1000）、手動パルサー軸を設定する画面。詳細は 5-2-8-3。

0685e157:
  alt: 工具長補正情報画面（縮小）
  text: |
    長補正中の表示と長補正No. を表示する画面。

9b0faf05:
  alt: センサーラッチモニタ画面（縮小）
  text: |
    「■センサーラッチモニタ」の見出しと、軸ごとの機械位置・アブソ位置のラッチ値を表示する画面。

512d49d6:
  alt: 工具径補正情報画面（縮小）
  text: |
    径補正中の表示と径補正No. を表示する画面。

0a77a2b3:
  alt: 独立位置決め画面（縮小）
  text: |
    「■独立位置決め ◆1.1」の見出しと、移動種別（インクレ、論理座標系アブソ、機械座標系アブソ、トルク指令）、軸ごとの移動量/目標位置と速度を入力する画面。

4117bf4d:
  alt: 制御周期モニタ画面（縮小）
  text: |
    「■制御周期モニタ」の見出しと、RtcMonitor 画面（計測周期の最大値・平均値・現在値 [μsec]）。詳細は 5-2-8-8。

d5d76aa0:
  alt: 工具径補正エラー情報画面（縮小）
  text: |
    「■工具径補正エラー情報」の見出しと、エラー発生ステップ番号、エラー内容を表示する画面。

83a82b1c:
  alt: 位置決めポイントテーブル作成画面（縮小）
  text: |
    ポイント（P1～）ごとの各軸の値を入力する表の画面。詳細は 5-2-8-10。

c64ab66e:
  alt: エラー情報画面（縮小）
  text: |
    タスクと軸ごとのエラー（例: タスク0 第1軸(X軸) [第1物理軸] サーボ主電源OFF）を一覧で表示する画面。詳細は 5-2-9。

29c7d873:
  alt: 位置決めポイントテーブルモニタ画面（縮小）
  text: |
    ポイントごとの各軸の値と移動のボタンが並ぶ画面。詳細は 5-2-8-11。

993cbb85:
  alt: メインメニュー（RTMC64-M3）
  text: |
    タイトル「標準RTMC64-M3 セッティングP Cソフト ( C:¥RT64M3¥rt64m3drv.ini )」。ボタン: 運転、パラメータ、表示設定、バージョン情報、終了。タイトルの括弧内（※）が、参照している INI ファイル名。

12e3e510:
  alt: メインメニュー（RTMC64-EC）
  text: |
    タイトル「標準RTMC64-EC セッティングP Cソフト ( C:¥RT64EC¥rt64ecdrv.ini )」。ボタン: 運転、パラメータ、表示設定、バージョン情報、終了。◆1.1

e3f8be6b:
  alt: 運転画面の構成
  text: |
    運転画面は、上から「ポジション表示」（X、Y、Z、A の値）、「操作メニュー」、「運転操作画面」（運転操作パネル）で構成される。

84cb3bb0:
  alt: 運転操作画面
  text: |
    運転操作パネル。本文の番号と記号に対応する。
    - 上部: 操作メニュー（A ポジション ～ H エラー情報）
    - ① タスク選択、② 動作モード、③ プログラム情報（実行モード、動作状態、選択プログラム番号、実行ステップ番号）
    - ④⑤ オーバライド、補間オーバライド、主軸オーバライド、⑯ 接線制御
    - ⑥ 軸キー（各軸の手動操作。X-、X+、Y-、Y+、Z-、Z+、A-、A+）、送りモード（JOG、インチング×1000、×100、×10、×1、手動原点復帰、自動原点復帰）
    - ⑨ Mコード（M、出力）
    - 下部のボタン: スタート⑦、ストップ⑧、1ショット位置決め⑩、原点設定⑪⑫、原点復帰⑬、ホーム位置⑭、リセット⑮、閉じる

3cffef00:
  alt: 1ショット位置決め画面
  text: |
    - 位置決めモード: インクレPTP、論理座標系アブソPTP、機械座標系アブソPTP、インクレ直線補間、論理座標系アブソ補間、機械座標系アブソ補間、SPIN(無限回転軸回転動作)、同期軸無視 インクレPTP、同期軸無視 論理アブソPTP、同期軸無視 機械アブソPTP
    - 移動量/目標位置: 軸（X、Y、Z、A ほか）ごとに入力 [パルス]
    - 補間速度 [パルス/秒]
    - ボタン: 移動開始、移動再開、移動停止、閉じる

d83d4367:
  alt: 指令位置の表示画面
  text: |
    「指令位置」画面。X、Y、Z、A の値（0.000）を緑の背景で表示する。

2da998d9:
  alt: 機械位置の表示画面
  text: |
    「機械位置」画面。X、Y、Z、A の値（0.000）を黄色の背景で表示する。

e812ae2e:
  alt: アブソ位置の表示画面
  text: |
    「アブソ位置」画面。X、Y、Z、A の値（0.000）を青の背景で表示する。

c030c396:
  alt: 偏差量の表示画面
  text: |
    「偏差量」画面。X、Y、Z、A の値（0.000）を赤の背景で表示する。

62c4ef52:
  alt: 相対移動量の表示画面
  text: |
    「相対移動量」画面。X、Y、Z、A の値（0.000）を灰色の背景で表示する。

7fa12a05:
  alt: トルク情報の表示画面
  text: |
    「トルク情報」画面。X、Y、Z、A の値（0.0）をオレンジの背景で表示する。

d2369d71:
  alt: 汎用入出力画面
  text: |
    「入出力状態」画面。左が入力、右が出力。
    - ショートカット: Rio、+OT、-OT、DEC、Task0～Task7（入力）。Rio、Task0～Task7（出力）
    - 一覧の列: アドレス、チャンネル、標準信号名、ユーザー信号名（例: 入力 Rio0832 = T0EMS、出力 Rio2368 = T0READY）。信号の ON/OFF を色で表示する。

902652a1:
  alt: 軸設定画面
  text: |
    「軸設定」画面。無効軸、インタロック軸、サーボオフ軸の 3 つの枠に、X 軸、Y 軸、Z 軸、A 軸、B 軸、C 軸、R 軸、Q 軸、T 軸のチェックボックスがある。ボタン: 閉じる。

bdd462a7:
  alt: 各軸ステータス画面
  text: |
    「各軸ステータス」画面。軸（X、Y、Z、A、B、C、R、Q、T）ごとに、位置決め完了、加減速たまり、サーボオン、原点復帰済、原点確定済、独立位置決中、独立位置決停止中、SPIN動作中、SPIN停止中、トルク制御中を表示する。FG状態（FG完了、FG停止中、FG分配中）、各種シーケンス完了の表示もある。

879d9ae6:
  alt: サーボステータスモニタ画面（RTMC64-M3）
  text: |
    「サーボステータスモニタ」画面。論理軸/物理軸の選択、全体情報（初期化エラーコード、通信エラー詳細ビットなど）、軸ごとの情報（通信エラーコード、共通モニタのステータスなど）を表示する。

b28cc91a:
  alt: サーボステータスモニタ画面（RTMC64-EC）
  text: |
    「サーボステータスモニタ」画面（RTMC64-EC）。全体情報（初期化エラーコード、マスター通知コード、EtherCAT State Machine など）と、軸ごとの Control Word、Status Word のビット、Modes Of Operation を表示する。

459cbe47:
  alt: メカトロリンクデータモニタリング画面
  text: |
    「メカトロリンクデータモニタリング」画面。軸（第1軸 (X)）と論理軸/物理軸を選び、送信データと受信データを Offset（0 (0x00)～）と Data の表で表示する。

95e0b404:
  alt: PDOデータモニタリング画面
  text: |
    「PDOデータモニタリング」画面（RTMC64-EC）。軸（第1軸 (X)）と論理軸/物理軸を選び、RxPDO と TxPDO を Offset（0 (0x00)～）と Data の表で表示する。◆1.1

db4f0395:
  alt: プログラム管理画面
  text: |
    プログラム管理画面。注記つき:
    - 読み出しみファイル名（ファイル名の欄）
    - テクノコード/Gコード選択
    - 対象タスク選択
    - 運転プログラム編集（編集欄。例: CIRL X0 Y0 I50000 J0 F50000; CIRR X50000 Y-50000 I0 J-50000 F50000; … END;）
    - 下部のボタン: ファイルから読出、ファイルに保存、アップロード、ダウンロード、閉じる

439e2e68:
  alt: ティーチング画面
  text: |
    「ティーチング」画面。プログラム（1: LIN X1000 Y1000 F1000 WNR0000 ONR1856; 2: OFR1856; 3: END;）を表示する。ボタン: ステップ変更(+/-)、サイクル、シングル、ティーチング、逆行、スキップ、挿入、置換、原点シフト、削除、実行、閉じる。ティーチング開始ステップの入力欄がある。

a0ce0017:
  alt: マクロ変数表示画面
  text: |
    「マクロ変数」画面。範囲（#1000 - #1199 (WORD) : グローバルマクロ変数）を選び、DEC/HEX を選んで #1000～#1019 の値を表示する。ボタン: 一括アップロード RTMC64-M3->win、一括ダウンロード win->RTMC64-M3、閉じる。

15cd98b1:
  alt: マクロ変数書き込み画面
  text: |
    「マクロ変数書き込み」画面。# 1000 の現在値（0）と、書き込む値の入力欄、書込ボタン。DEC / HEX の選択、閉じるボタン。

d0d3e3b4:
  alt: 主軸操作画面
  text: |
    「主軸操作」画面。速度指令 [rpm/Hz/%] と速度指令送信ボタン、操作（正転(M3)、逆転(M4)、停止(M5)）と操作指令送信ボタン、回転数モニタ [rpm/Hz/%]、閉じるボタン。

6b88e2d2:
  alt: TPCロギング画面（ポジション＝2ch形式）
  text: |
    「TPCロギング」画面の「ポジション」タブ。
    - 上部: 「ロギング中」の表示、バッファデータ [ポイント]、保存データ [ポイント]（どちらも 0）
    - タブ: ポジション、64CH
    - ポジションタブ: 2 つのデータそれぞれに、軸番号（1、◀▶ で変更）と、指令位置 / 機械位置の選択（例では両方とも機械位置）
    - ロギング周期: 0 msec（注記「0msec:制御周期毎」）
    - ファイル保存(アップロード)方法: 手動([ファイルに保存]ボタン)（選択）、ロギング停止時、常時
    - ロギングファイル: ファイル名の欄と参照ボタン
    - ボタン: 開始(新規)、開始(追加)、停止、ファイルに保存、閉じる

96e21926:
  alt: TPCロギング画面（64CH形式）
  text: |
    「TPCロギング」画面の「64CH」タブ。
    - 上部: 「ロギング中」の表示、バッファデータ [ポイント]、保存データ [ポイント]（どちらも 0）
    - ロギング設定の一覧（例）:
      - CH01:指令位置(DEC) [TASK0;AX1] ～ CH04:指令位置(DEC) [TASK0;AX4]
      - CH05:機械位置(DEC) [TASK0;AX1] ～ CH08:機械位置(DEC) [TASK0;AX4]
      - CH09:トルク情報(DEC) [TASK0;AX1] ～ CH12:トルク情報(DEC) [TASK0;AX4]
    - 一覧の右のボタン: 追加...、挿入...、編集...、コピー、上に移動、下に移動、削除
    - 一覧の下のボタン: 設定読出、設定保存
    - ロギング周期: 0 msec（注記「0msec:制御周期毎」）
    - ファイル保存(アップロード)方法: 手動([ファイルに保存]ボタン)（選択）、ロギング停止時、常時
    - ロギングファイル: ファイル名の欄と参照ボタン
    - ボタン: 開始(新規)、開始(追加)、停止、ファイルに保存、閉じる

eaef3608:
  alt: ロギング項目設定画面（64CH形式）
  text: |
    「ロギング項目設定」画面。
    - ロギング項目: 指令位置（ドロップダウンで選ぶ）
    - CSV Out Type: DEC（選択）、HEX、TIME
    - 軸項目設定: タスク番号（タスク0）、論理軸番号（第1軸）
    - ボタン: OK、キャンセル

05f28c3e:
  alt: 手動パルサモード画面
  text: |
    「手動パルサモード」画面。手動パルサモード、ジョイスティックモードのチェック、状態表示（手パ/ジョイスティック 無効）、倍率（X1、X10、X100、X1000）、手動パルサー軸（1: 第1軸 (X)、2: 第1軸 (X)）、閉じるボタン。

a25f167d:
  alt: センサーラッチモニタリング画面
  text: |
    「センサーラッチモニタリング」画面。X、Y、Z、A 軸ごとに、ラッチした機械位置とアブソ位置（0.000）を表示する。センサーラッチ完の表示と閉じるボタン。

2ac77f2c:
  alt: 工具長補正情報画面
  text: |
    「工具長補正情報」画面。長補正中の表示、長補正No.（0）、閉じるボタン。

dd4abe45:
  alt: 工具径補正情報画面
  text: |
    「工具径補正情報」画面。径補正中の表示、径補正No.（0）、閉じるボタン。

098c83cf:
  alt: 独立位置決め画面
  text: |
    「独立位置決め」画面。
    - 移動種別: インクレ（選択）、論理座標系アブソ、機械座標系アブソ、トルク指令（移動量：トルク指定[%]、速度：速度制限[パルス/sec]）
    - 軸（X、Y、Z、A ほか）ごとの 移動量/目標位置[パルス] と 速度[パルス/sec] の入力欄
    - ボタン: 移動開始、移動リセット、閉じる

88b52dfa:
  alt: 制御周期モニタ画面
  text: |
    「RtcMonitor」画面。RTC / Foreground の選択（RTC を選択）。計測周期: 最大値 254 μsec、平均値 73 μsec、現在値 70 μsec。ボタン: 計測値クリア、閉じる。

f840014b:
  alt: 工具径補正エラー情報画面
  text: |
    「工具径補正エラー情報」画面。エラー発生ステップ番号、エラー内容の表示欄、閉じるボタン。

e77fc1bb:
  alt: 位置決めポイントテーブル作成画面
  text: |
    位置決めポイントテーブル作成画面。ポイント P1～P20 ごとに X、Y、Z、A ほかの値を入力する表。テーブル編集（ポイント番号、挿入、削除、全表示クリア）、ファイルから読出、ファイルに保存、全ポイントアップロード、全ポイントダウンロード、閉じるのボタン。

8132e7a1:
  alt: 位置決めポイントテーブルモニタ画面
  text: |
    位置決めポイントテーブルモニタ画面。移動時速度 [パルス/秒] の入力欄と、ポイント P1～P20 ごとの各軸の値と「P□へ移動」ボタンが並ぶ。

dfe204ea:
  alt: エラー表示画面
  text: |
    「エラー情報」画面。対象（全タスク）を選び、エラーを一覧で表示する（例: タスク0 第1軸(X軸) [第1物理軸] サーボ主電源OFF、… 第4軸(A軸) [第4物理軸] サーボ主電源OFF、タスク0 割り当て軸エラー、タスク0 サーボOFFエラー）。ボタン: リセット、閉じる。

64a63489:
  alt: ピッチエラー補正データ設定画面
  text: |
    「ピッチエラー補正データ」画面。物理軸（第1物理軸）の選択、軸割り当て（タスク0 第1軸(X)）、補正倍率、補正間隔（1000）、-区間数、+区間数、補正データ No.0～19 の入力欄。ボタン: 前、次、CSVファイルから読出、CSVファイルに保存、ファイルから読出、ファイルに保存、アップロード RTMC64-M3->win、ダウンロード win->RTMC64-M3、編集前に戻す、閉じる。

13710b53:
  alt: 工具長補正データ設定画面
  text: |
    「工具長補正機能パラメータ」画面。タスク（タスク0）を選び、工具長補正データ No.0～19 を入力する。ボタン: ファイルから読出、ファイルに保存、アップロード RTMC64-M3->win、ダウンロード win->RTMC64-M3、編集前に戻す、閉じる。

fea1c95b:
  alt: 工具径補正データ設定画面
  text: |
    「工具径補正機能パラメータ」画面。タスク（タスク0）を選び、工具径補正データ No.0～19 を入力する。ボタンは工具長補正データ設定画面と同じ。

dc768623:
  alt: 補間前加減速パラメータ設定画面
  text: |
    「補間前加減速パラメータ」画面。タスクの選択、補間前加減速時定数 [msec]（0: 補間前加減速無効）、最小オーバライド設定（加速度 [pls/sec^2] の範囲ごとの最小オーバライド [%]、加速度小から大へ 7 段）。注記「※加速度は昇順で設定して下さい。」。ボタン: ファイルから読出、ファイルに保存、アップロード、ダウンロード、編集前に戻す、閉じる。

9d0bd771:
  alt: バックアップデータ初期化画面
  text: |
    「バックアップデータ初期化」画面。ボタン: パラメータ初期化、プログラム初期化、全軸アブソポジション初期化、各軸アブソポジション設定（タスクと X、Y、Z、A の値）、マクロ変数初期化、位置決めポイントテーブル初期化、運転プログラムバックアップ、絶対値エンコーダオフセット（アップロード、ダウンロード）、位置決めポイントテーブルバックアップ、閉じる。

d156e7ef:
  alt: 通信設定画面
  text: |
    「通信設定」画面。
    - 通信形態: 共有メモリ
    - INtime設定: ノード名（NodeA）
    - 通信エラーログ: ログファイル名、チェック（ログ無効、全てロギング、初期化/終了、データ送信、データ受信、コマンド、通信エラー（全て）、通信エラー（伝送）、通信リトライ）、ログファイルサイズ 5242880 [Byte]、ログファイル数 6 (1-100)
    - ボタン: 設定、閉じる

162aa740:
  alt: セッティングPC動作設定画面
  text: |
    「セッティングPCソフト動作設定」画面。運転プログラム設定: DNC送信データ長（8192）、DNC実行開始データ長（16384）、DNC運転プログラムタイプ（テクノコード / Gコード）、起動時編集プログラムタイプ（テクノコード / Gコード）。起動位置 X、Y（0、0）と現在位置取得ボタン。ボタン: 設定、編集前に戻す、閉じる。

b9f8cf54:
  alt: ポジション表示形式設定画面
  text: |
    「ポジション表示形式設定」画面。タスクの選択。第1軸～第9軸ごとに軸名称（X、Y、Z、A、B、C、R、Q、T）と パルス/表示単位（1000）。トルク情報（10）、円弧処理（RTMC64-M3内）、円弧精度（1）、運転プログラム小数点桁数（1000）、補間送り速度単位（1 パルス/sec）、X-Z円弧平面（XZ平面 / ZX平面）。注記「※ 軸名称を変更しても運転プログラムの軸アドレスは変わりません。(X,Z,Y,…R,Q,T のまま) セッティングPC/ROMSW設定ソフトの表示が変わりますので御注意下さい。」。ボタン: 設定、編集前に戻す、閉じる。

6d71425b:
  alt: 補間送り速度単位の設定例
  text: |
    | 設定 | 速度単位 |
    |---|---|
    | ①:1 ②:sec | pps(pulse/sec) |
    | ①:1000 ②:min | 1000p/min |

42d371fb:
  alt: X-Z円弧平面の回転方向
  text: |
    - XZ平面（横軸 +X、縦軸 +Z）: G03/CIRL は反時計回り、G02/CIRR は時計回り。
    - ZX平面（横軸 +Z、縦軸 +X）: G03/CIRL は反時計回り、G02/CIRR は時計回り。

afc42851:
  alt: 入出力表示設定画面
  text: |
    「入出力表示設定」画面。入力と出力それぞれに、ショートカット（Rio、+OT、-OT、DEC、Task0～Task7）と、アドレス、チャンネル、標準信号名、ユーザー信号名の一覧（例: Rio0000 i#1600 000 Rio0000）。ボタン: 設定、編集前に戻す、閉じる。

98b492c2:
  alt: バージョン情報画面（RTMC64-M3）
  text: |
    「バージョン情報(Rt64m3drv)」画面。標準RTMC64-M3運転ソフト。
    - パッケージ Version 1.6.0A
    - セッティングPC Version 1.4.0、CommDLL Version 1.3.0、TcnvDLL Version 1.3.0、GcnvDLL Version 1.3.0
    - ファームウェア (motion controller) Version 1.6.0
    - シリアル番号: RT64M3-00029、SUM(Flash): 0000
    - Copyright (C) 2015-2020

c8e0b05a:
  alt: バージョン情報画面（RTMC64-EC）
  text: |
    「バージョン情報(Rt64ecdrv)」画面。標準RTMC64-EC運転ソフト。
    - パッケージ Version 2.2.0A
    - セッティングPC Version 1.4.0、CommDLL Version 1.3.0、TcnvDLL Version 1.2.0、GcnvDLL Version 1.2.0
    - ファームウェア (motion controller) Version 2.2.0
    - シリアル番号: RT64EC-00036、SUM(Flash): 0000
    - Copyright (C) 2016-2020
