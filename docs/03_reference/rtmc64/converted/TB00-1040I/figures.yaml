# TB00-1040I の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

c6afa442:
  alt: PTPの速度モニタ
  text: |
    PTP 移動の速度波形（横軸: 時間、縦軸: 速度）の模式図。
    - 速度は台形状に立ち上がり、一定速度で進んだあと下がって 0 に戻る。
    - (A) PTP時定数: 立ち上がり始めから、速度が (B) に達するまでの時間（両矢印で示す）。
    - (B) PTP速度: 一定速度の部分の高さ（破線で示す）。
    - (C) オーバーシュート: 立ち上がり直後に (B) を超えて波打つ部分と、停止直後に 0 を下回って波打つ部分（2 か所を矢印で示す）。

b9122466:
  alt: 直線補間の速度モニタ
  text: |
    直線補間の速度波形（横軸: 時間、縦軸: 速度）の模式図。
    - 実線: 実際の速度。破線: 指令の速度（台形）。実線は破線より遅れて立ち上がり、遅れて下がる。
    - (A) 補間時定数: 加速の始めと、減速の始めの 2 か所に両矢印で示す。
    - (B) 補間速度（運転プログラムによる指令）: 一定速度の部分の高さ。
    - (C) オーバーシュート: 立ち上がり直後に (B) を超えて波打つ部分と、停止直後に 0 を下回って波打つ部分。

b84fe008:
  alt: 負荷電流の波形（加速・定速・減速）
  text: |
    モータ負荷電流の波形（横軸: 時間）の模式図。横軸の下に「加速」「定速」「減速」の区間を示す。
    - (A) 加速時の負荷電流: 加速の区間で正の大きな値になる。
    - 定速の区間では、(A) より小さい正の一定値になる。
    - (B) 減速時の負荷電流: 減速の区間で負の値になる。
    - 本文: (A)、(B) ≦ 最大負荷電流 となるように調整する。

0c7a4a42:
  alt: サーボ応答解析のグラフ例（TPC-Excel）
  text: |
    TPC-Excel のサーボ応答解析の出力例。
    - 横軸: データ番号 1〜41。縦軸: 速度（目盛 -50〜450、50 刻み。単位の表示なし）。
    - 「指令速度」（緑の三角）: データ番号 1 から直線的に上がり、6 付近で 400 に達する。21 付近から下がり、25 付近で 0 になる。
    - 「応答速度」（赤紫の四角）: 指令速度より 2〜3 点遅れて上がり、9 付近で 400 前後に達する。23 付近から下がり、28 付近で 0 になる。一定速度の部分と停止後に、小さな揺れがある。
    - グラフ中央にある小さな文字の枠は（判読できず）。

fe97f2bc:
  alt: 真円精度解析のグラフ例（TPC-Excel）
  text: |
    TPC-Excel の真円精度解析の出力例。
    - 中心で交わる縦横の軸の上に、同心円が描かれている。黒の円 2 本（外側と内側）と、その間の赤紫の円 1 本（理想円と見られる）。
    - 赤紫の点の列（測定した軌跡のずれを拡大したもの）が、理想円の周りを波打ちながら一周している。
    - 上（12 時の少し右）と下（6 時の少し左）に、軌跡が大きく外側・内側に飛び出す箇所がある。
