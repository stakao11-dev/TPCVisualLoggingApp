# TB00-1040H（RTMC64 ユーザーズマニュアル Ⅲ 試運転・調整編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
# 縮小された図や画面で小さくて読めない箇所は「（判読できず）」とした。
# 7-8 の原点復帰の図にある a、b、c、S、A の記号の意味は、図にも本文の Markdown にも書かれていない（PDF の図の周りの説明による）。

929af9e4:
  alt: 2 試運転・調整までの作業フロー（概略）
  text: |
    （RTMC64の購入）から（実稼働）までの流れを箱と矢印で示した図。関連マニュアル（RTMC64 ユーザーズマニュアル、セッティングPCマニュアル、ROMSW設定ソフトマニュアル、ProConOS サンプルラダープログラム説明書、サンプル運転プログラム）の確認 → 初期導入作業 → ROMSWの設定 → 制御盤/モータ単体試運転 → メカ組合せ試運転 → PLCのラダー設計 → 実機での運転、の順。
    縮小されていて、各箱の細かい文字は判読できず。

a525527a:
  alt: 4 サーボパラメータ設定画面
  text: |
    「サーボパラメータ」画面（タスク0、第1物理軸～第4物理軸＝タスク0 第1軸(X)～第4軸(A)）。項目: 軸割付け、INPOS量、偏差上限値、補間加減速時定数、S字加減速、PTP時定数、PTP速度、JOG速度、+側ソフトリミット、-側ソフトリミット、原点復帰方向、原点距離、原点復帰逃げ量、原点復帰早送り速度、原点復帰アプローチ速度、原点復帰最終サーチ速度、原点復帰順位、ホームポジション距離、ホームポジション順位、バックラッシュ補正量、形状補正係数（灰色）、原点復帰時論理座標、手動パルサ最大送り速度、手動パルサ加減速時定数。
    表示されている値の例: 偏差上限値 4000、補間加減速時定数 30、PTP時定数 200、PTP速度・JOG速度 30000、ソフトリミット 1000000、原点距離 1000、原点復帰早送り速度 30000、アプローチ速度 7500、最終サーチ速度 2000。
    ボタン: ファイルから読出、ファイルに保存、アップロード RTMC64-M3->win、ダウンロード win->RTMC64-M3、編集前に戻す、閉じる。

8e0ac20f:
  alt: 4-1 PTP 時定数の計算式
  text: |
    PTP時定数[msec] ＝ 加速時間[msec] × 100000[pps] ／ PTP速度[pps]

e2e5932c:
  alt: 4-1 PTP 時定数と加速時間（PTP 速度が 100Kpps より大きい場合）
  text: |
    縦軸「指令速度」。台形の速度で、「PTP速度」まで上がる時間が「加速時間[msec]」。100Kpps に達するまでの時間を矢印で示している。「100Kpps以下でもPTP時定数の計算式は同じ」。

fc081430:
  alt: 4-1 PTP 時定数（PTP 時定数基準の場合）
  text: |
    縦軸「指令速度」。台形の速度で、0 から「PTP速度」に達するまでの時間が「PTP時定数[msec] ＝加速時間[msec]」。

0d9987ef:
  alt: 4-1 指数形の補間時定数
  text: |
    縦軸「指令速度」。指数関数的に上がる速度の曲線で、立ち上がりの接線と「指令速度」の線の交点までの時間が補間時定数。そのとき実際の速度は「63%」に達している。

34387780:
  alt: 4-1 直線形補間加減速の時定数の範囲
  text: |
    - 左: 「直線形補間加減速」。範囲（直線）: 0～上限。右表のように制御周期により上限が変わります。
    - 中央: LIN命令が 3 つ続くときの速度。加減速の区間が「直線形補間時定数」
    - 右の表:
      | 制御周期[ms] | 上限[ms] |
      |---|---|
      | 0.5 | 1000 |
      | 1.0 | 2000 |
      | 2.0 | 4000 |
      | 4.0 | 8000 |

4c8fae2d:
  alt: 4-1 S 字加減速（Ta と Ts）
  text: |
    台形の速度（破線）の角を丸めた S 字の速度（実線）。加速と減速のそれぞれで、全体の時間が「Ta : 直線形補間時定数[ms]」、角を丸める区間が「Ts」（始めと終わりに 1 つずつ）。左端に本文の一部「…減速」。

87f1d0cf:
  alt: 4-2 ストロークリミット（ソフト OT とハード OT）
  text: |
    - 中央が「正常領域」、両側が「ソフトOT領域」、さらに外側が「ハードOT領域」、両端に「マシンエンド」
    - 「機械原点」から左右の境界までが「ｿﾌﾄOTﾊﾟﾗﾒﾀ ＋側」「ｿﾌﾄOTﾊﾟﾗﾒﾀ －側」（図ではこの向きに書かれている）
    - ソフトOT領域: 「ソフトウェアにて停止。」状態 SVM ON(サーボ主電源オン)、SV ON(サーボオン)
    - ハードOT領域: 「ハードウェアにて停止。ソフトウェア処理で」状態 SVM OFF、SV OFF(ブレーキ動作)
    - 「復旧は「OT無視」モードで」SVM ON、SV ON（ブレーキ解除）

1e0944ac:
  alt: 見出し「参考」

0afc1b2a:
  alt: 4-4 全軸原点復帰の逃げ動作
  text: |
    縦軸「速度」、横軸「時間」。最初に逆方向（下側、斜線の台形）へ「原点位置 + 逃げ量 － 現在位置」だけ動き、その後 a)、b) の速度で「原点」へ向かう。

2c96ffdd:
  alt: 4-4 原点復帰逃げ動作の範囲
  text: |
    - 中央が「正常領域」、両側が「ソフトOT領域」、両端に「マシンエンド」。機械原点の左右に「ソフトOTパラメータ －側」「＋側」
    - 「原点付近（逃げ動作実施範囲）」は、ある位置（⇑）から右の範囲
    - 「逃げ動作」で機械原点より左へ「原点復帰逃げ量」だけ離れてから、「原点復帰」で機械原点へ向かう
    - 機械原点からソフトOTパラメータ ＋側までが「A」

4b5d412c:
  alt: 5-2 RTMC64-M3/EC の起動（INtime の Start NodeA）
  text: |
    1) タスクトレイの「∧」を押して隠れたアイコンを表示し、INtime のアイコン（黄色）を選ぶ（赤丸）。
    2) INtime のメニューで「Start NodeA」を選ぶ（赤丸）。メニュー: Start NodeA、Stop NodeA、Restart NodeA、イベントビューワ(V)、INtime Explorer(E)、INtime Configuration(C)、イベント通知表示(S)、常駐アイコン自動起動(A)、INtimeバージョン情報(B)、終了(X)。
    本文: アイコンが黄色から紫色に変わります。

8cb026ce:
  alt: 5-2 認証デーモンのアイコン
  text: |
    タスクトレイの隠れたアイコン。認証デーモンのアイコン（青）が赤丸で囲まれている。上部に「116 KB」の表示がある。

4887bafb:
  alt: 5-4 セッティング PC ソフトの練習（画面の構成）
  text: |
    セッティング PC の画面: 「ポジション表示」「操作メニュー」「運転操作画面」。練習内容:
    - ■ 各画面の切り換え
    - ■ ポジション表示の切り換え（指令位置（論理系の座標）、アブソ位置（機械系の座標））
    - ■ エラー情報の確認（サーボアラーム、±OT など、発生しているアラーム原因をチェック）

28f3e98f:
  alt: 5-4 入出力状態画面
  text: |
    「入出力状態」画面。入力と出力それぞれに「ショートカット」（Rio、+OT、-OT、DEC、Task0～Task7）と、アドレス、チャンネル、標準信号名、ユーザー信号名の一覧。ON の信号が緑で表示されている。
    細部は小さくて判読できず。

06752fed:
  alt: 5-5 RTMC64-M3/EC のバックアップ情報
  text: |
    - **ファイル(バックアップ)**: 運転プログラム .TXT、P.E補正データ .PIT、サーボパラメータ .PRM、工具長補正データ .TOL、工具径補正データ .TOD、補間前加減速データ .ACO、ROMSWファイル .ROM、INIファイル .INI
    - **PCアプリ**: 「セッティングPCソフト」（PC通信ライブラリ）と「ROMSW設定ソフト」
    - **RTMC64バックアップデータ**: 「バックアップメモリ」に ROMSW〈オプション〉、ROMSW〈ユーザ〉、サーボパラメータ、P.E補正データ、工具長補正データ、工具径補正データ、補間前加減速データ、運転プログラム
    - PCアプリ → RTMC64: 「初期化」「ダウンロード」、RTMC64 → PCアプリ: 「アップロード」
    - 「●お客様がファイル管理(保管)すべき情報」

50adcbaa:
  alt: 6-2 制御系の良さ
  text: |
    「制御系の良さ」←「軌跡指令どおりに正確にメカが動く」。その中身:
    - 応答性: 指令の変化に高速に追従
    - 精度: 指令どうりの速度、位置
    - 安定性: 外力などの影響を受けない

855c21a0:
  alt: 6-3 サーボ系の 3 重ループ
  text: |
    「速度パターン」から、「偏差カウンタ」→「Kp」（位置ループ）→「速度 Kv 制御部 Ti」（速度ループ）→「電流制御部」→「電力変換部」（電流ループ）→ モータ(M)。エンコーダ（PG）の信号が各ループに戻る。
    点線の枠は「位置制御の場合」と「速度制御の場合」のサーボアンプ側の範囲。下に「モーションコントローラ（1～16軸）」と「サーボアンプ」の範囲。

8b85c3de:
  alt: 6-4 RTMC64-M3/EC とサーボ系の関係
  text: |
    「RTMC64」の「軌跡発生」から「MECHATROLINK[M3]」または「EtherCAT[EC]」で「MECHATROLINK型[M3]、EtherCAT型[EC]サーボアンプ」へ。アンプの中は「位置制御」→「速度制御」→「電流制御」→ モータ(M)、PG。

97aebbf7:
  alt: 7 制御盤／モータ単体試運転の手順
  text: |
    「詳細説明の項目」と「制御盤/モータ単体試運転」の手順。7-1 配線チェック、7-2 制御電源投入、7-3 セッティングPC起動、7-4 RTMC64のパラメータ設定、7-5 入力信号(ラダー動作確認)、7-6 サーボアンプのパラメータ設定、7-7 サーボ主電源投入、7-8 原点復帰、7-10 メモリー運転、7-12 サーボ系の調整、7-13 パラメータの保存、完了、の流れと、各項目の説明。
    縮小されていて細かい説明文は判読できず。

c15d8dc1:
  alt: 7 メカ組合せ試運転の手順
  text: |
    「詳細説明の項目」: 7-2 制御電源投入、7-3 セッティングPC起動、7-4 RTMC64のパラメータ設定、7-5 入力信号(ラダー動作確認)、7-7 サーボ主電源投入、7-8 原点復帰、7-9 ソフトリミットの確認、7-10 メモリー運転、7-12 サーボ系の調整、7-14 精度チェック、7-13 パラメータの保存、完了。
    縮小されていて細かい文字は判読しにくい。

77507c48:
  alt: 7-4 サーボパラメータ設定画面
  text: |
    「サーボパラメータ」画面（タスク0、第1物理軸～第4物理軸）。4 章の画面と同じ項目と値（偏差上限値 4000、補間加減速時定数 30、PTP時定数 200、PTP速度・JOG速度 30000 など）。
    細部は小さくて判読しにくい。

33fb262c:
  alt: 7-5-4 汎用入出力（入出力状態画面）
  text: |
    「入出力状態」画面。5-4 の画面と同じ構成（ショートカット、アドレス、チャンネル、標準信号名、ユーザー信号名。ON の信号は緑）。
    細部は小さくて判読できず。

91af2b29:
  alt: 「注意」の絵

a3d623d1:
  alt: 7-6 サーボアンプのパラメータ設定の流れ
  text: |
    「サーボの電源を入れます」→「PCや設定器でパラメータ設定」→「可能であれば、パラメータをバックアップ(PCファイル)」→「仮設定完了(調整は別途)」

e9df5397:
  alt: 7-8-1/7-8-2 FB ラッチ方式（原点信号あり）の速度とラッチ信号
  text: |
    縦軸「速度(原点復帰方向)」（a、b の高さ）、横軸「時間」。速度 a で進み、原点信号（DEC）が ON になると b に下がり、OFF になったあと最初の「ラッチ信号(C(Z)相、EXT1～3)」から距離 A、S を動いて止まる。破線は 1 段原点復帰の場合の速度。

00efeb08:
  alt: 7-8-1/7-8-2 FB ラッチ方式（原点信号あり、逆方向から始まる場合）
  text: |
    速度 a で原点復帰と逆の方向（下側、破線）へ動いて原点信号（DEC）の外に出てから、原点復帰方向へ a で進み、b に下がり、ラッチ信号のあと A、S を動いて止まる。縦軸の上下に a、b の目盛りがある。

33b3d063:
  alt: 7-8-3 FB ラッチ方式（原点信号無し）
  text: |
    縦軸「速度(原点復帰方向)」（a、b）。速度 a まで上がって進み、「ラッチ信号(C(Z)相、EXT1～3)」のあと S を動いて止まる。

bddf3451:
  alt: 7-8-4/7-8-5 DEC サーチ方式
  text: |
    縦軸「速度(原点復帰方向)」（a、b、c）。速度 a で進み、原点信号（DEC）が ON で b に下がり、OFF で逆方向へ戻り、再び ON になったら c で進んで、OFF のあと S を動いて止まる。破線は 1 段原点復帰の場合。

73a12662:
  alt: 7-8-4/7-8-5 DEC サーチ方式（逆方向から始まる場合）
  text: |
    速度 a で逆方向（下側、破線）へ動いて原点信号（DEC）の外に出てから、原点復帰方向へ a で進み、DEC の ON/OFF に合わせて方向を変え、最後に S を動いて止まる。

b0e5cb85:
  alt: 7-8-6 FB ラッチ（OT 信号）
  text: |
    縦軸「速度(原点復帰方向)」（a、b）。速度 a で進んで OT信号が ON になると止まり、逆方向へ b で戻る。OT信号が OFF になったあとの「ラッチ信号(C(Z)相、EXT1～3)」から S を動いて止まる。
    本文: 【注】a:OTに突入するので、原点復帰早送り速度は、低めにして下さい。

1c0c127c:
  alt: 7-8-7 OT サーチ原点復帰
  text: |
    縦軸「速度(原点復帰方向)」（a、c）。速度 a で進んで OT信号が ON になると止まり、逆方向へ c で戻る。OT信号が OFF になったあと、さらに a の速度で S を動いて止まる。

c876383d:
  alt: 右向きの矢印

3fd136fc:
  alt: 7-9 ソフトリミットの設定
  text: |
    中央が「正常領域」、両側が「ソフトOT領域」、外側が「ハードOT領域」、両端に「マシンエンド」。「機械原点」の左右に「ソフトOTパラメータ －側」「＋側」。マシンエンドからソフトOTの境界までが A（左）、B（右）。

57e3bde9:
  alt: 7-10 メモリー運転の概略手順
  text: |
    1. 運転プログラム作成（編集）
    2. ローディング
    3. 自動運転モード、シングルステップ
    4. スタート信号（1ステップ動作）
    5. 停止位置や出力信号の確認
    6. 運転プログラム完了？ N なら 4 に戻る。Y なら次へ
    7. シングルステップ解除
    8. スタート信号（連続動作）
    9. 運転完了
