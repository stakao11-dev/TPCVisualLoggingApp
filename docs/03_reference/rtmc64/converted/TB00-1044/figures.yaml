# TB00-1044 の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
# ビット図のビット番号は LSB=D0 として、画像の画素から引き出し線の位置を検出して求めた。

0fde5fc4:
  alt: 表記の説明図（PLC通信時）データタイプ・パラメータ
  text: |
    PLC(ProConOS/C言語ソフト)との通信時の、各項目の読み方。
    - 《データタイプ》`DAT_***** / 16#□□`
      - `16#□□`: 通信機能を表す16進数。データレジスタの「通信データタイプ」にこの値を書き込む。
      - `DAT_*****`: PLCとの通信では使用しない（PC通信時の機能を表す名前）。
    - 《パラメータ》: データ書込/読込時に指定するパラメータ。データレジスタの「通信パラメータ」に書き込む（"なし"の時は"0"を書き込む）。動作指示コマンドではパラメータはない。

71086fd6:
  alt: 表記の説明図（PLC通信時）タスク指定・データフォーマット
  text: |
    - 《タスク指定》: データレジスタの「タスク指定」の有効/無効を表す。有効の時はタスク毎のコマンドで、対象タスク番号を指定する（無効の時は"0"を書き込む）。
    - 《説明》: 機能/データの説明。
    - 《データフォーマット》○PLC(ProConOS)データレジスタ
      - 「データサイズ:8byte」: 使用するデータのサイズ。データ書込/動作指示時はデータレジスタの「全書込データサイズ」にこの値を書き込む。データ読込時は通信終了後にRTMC64が「全読込データサイズ」にこの値を書き込む。必ずこのサイズ分の領域を確保すること。
      - 表（オフセット[Byte]／データ名称／データサイズ／データ範囲[単位]、例: 0 データ1 short、2 データ2 short、4 データ3 long）: 実際に読込/書込を行うデータ。書込/動作指示時はデータレジスタの「通信データ」に書き込み、読込時は「通信データ」から読み込む。「オフセット」はデータ先頭からのbyte単位のオフセット、「データサイズ」は各データのデータ長。
    - ○C言語構造体: PLCとの通信では使用しない（通信ライブラリ使用時のデータ型）。
    - 《データ詳細》: PLCデータレジスタやC言語構造体の各データの詳細説明が必要な場合に記述する。

f1ab8933:
  alt: 表記の説明図（PCアプリ通信時・通信ライブラリ使用）
  text: |
    通信ライブラリを使用するPCアプリでの、各項目の読み方。
    - 《データタイプ》`DAT_***** / 16#□□`
      - `DAT_*****`: 通信機能を表す名前。通信関数の引数「データタイプ」にこの値を指定する。
      - `16#□□`: 通信ライブラリ使用時は使用しない（PLC通信時の機能を表す16進数）。
    - 《パラメータ》: データ書込/読込関数(SendData/ReceiveData)使用時に指定するパラメータ。通信関数の引数「通信パラメータ」に指定する（"なし"の時は"0"）。動作指示コマンドではパラメータはない。
    - 《タスク指定》: 有効の時はタスク毎のコマンドで、対象タスク番号を指定する（無効の時は"0"を指定）。
    - 《説明》: 機能/データの説明。
    - 《データフォーマット》○PLC(ProConOS)データレジスタ: 通信ライブラリ使用時は使用しない（PLC通信で使用する場合のデータ並び）。
    - ○C言語構造体: データ送受信/動作指示コマンドで使用するデータ型。通信関数の引数のデータポインタに、この構造体変数へのポインタを指定する。
    - 《データ詳細》: PLCデータレジスタやC言語構造体の各データの詳細説明が必要な場合に記述する。

21dce244:
  alt: 運転プログラム書込/読出のパラメータのビット構成
  text: |
    パラメータ(32bit)の構成:

    | ビット | 内容 |
    |---|---|
    | D00～D15（下位16bit） | プログラム番号 |
    | D16～D31（上位16bit） | 先頭ブロック番号（書き込み時のみ） |

873e7fcc:
  alt: 全体ステータスのビット割り当て
  text: |
    全体ステータス(long)のビット割り当て（図中の◆1.1は改訂マーク）:

    | ビット | 内容 |
    |---|---|
    | D0 | アラーム発生中 |
    | D1 | 全タスクセッティングモード |
    | D4 | 高速センサーラッチ完（予約） |
    | D6 | 運転プログラムデータ変更 |
    | D7 | 制御周期負荷ワーニング |
    | D8 | 制御周期負荷過大 |
    | D9 | FDT読込ワーニング |
    | D10 | サイクルタイム有効 [EC] |

    上記以外のビットは未使用。

18b67392:
  alt: 全体アラームのビット割り当て
  text: |
    全体アラーム(long)のビット割り当て（図中の◆1.1は改訂マーク）:

    | ビット | 内容 |
    |---|---|
    | D1 | バックアップエラー |
    | D2 | パラメータ未設定エラー |
    | D3 | ROMSWバックアップエラー |
    | D4 | メカトロリンク初期化エラー [M3] ／ EtherCAT初期化エラー [EC] |
    | D5 | メカトロリンク全体通信エラー [M3] ／ EtherCAT全体通信エラー [EC] |
    | D7 | FDT読込エラー |
    | D8 | メカトロリンク通信ボード無しエラー |
    | D9 | メカトロリンクIO通信エラー |
    | D15 | システムエラー |

    上記以外のビット（D0を含む）は未使用。

2bed17c2:
  alt: 軸ステータスのビット割り当て
  text: |
    軸ステータス(long)のビット割り当て（図中の◆1.1は改訂マーク）:

    | ビット | 内容 |
    |---|---|
    | D0 | インポジション |
    | D1 | 加減速たまり有り |
    | D2 | サーボオン |
    | D3 | 原点復帰完了 |
    | D4 | 独立位置決め中 |
    | D5 | 独立位置決め停止中 |
    | D6 | SPIN動作中 |
    | D7 | SPIN停止中 |
    | D8 | トルク制御中 |
    | D9 | 原点確定済み |

    上記以外のビットは未使用。

77bc4da6:
  alt: 軸アラームのビット割り当て
  text: |
    軸アラーム(long)のビット割り当て（図中の◆1.1は改訂マーク）:

    | ビット | 内容 |
    |---|---|
    | D0 | +方向偏差過大 |
    | D1 | -方向偏差過大 |
    | D2 | サーボアンプアラーム |
    | D3 | +方向ソフトリミット |
    | D4 | -方向ソフトリミット |
    | D5 | +方向ハードリミット |
    | D6 | -方向ハードリミット |
    | D7 | +方向パルス発生過大（予約） |
    | D8 | -方向パルス発生過大（予約） |
    | D9 | サーボ主電源OFF |
    | D10 | メカトロリンク各軸通信エラー [M3] ／ EtherCAT各軸通信エラー [EC] |
    | D11 | メカトロリンク多重コマンド [M3] ／ EtherCAT多重コマンド [EC] |
    | D12 | EtherCAT未対応コマンド [EC] |

    上記以外のビットは未使用。

33f2d315:
  alt: タスクステータスのビット割り当て
  text: |
    タスクステータス(long)のビット割り当て:

    | ビット | 内容 |
    |---|---|
    | D0 | アラーム発生中 |
    | D1 | 軌跡発生完（FG完了） |
    | D2 | 途中停止中（FG途中停止中） |
    | D3 | 軌跡発生中（途中停止中はOFF） |
    | D4 | プログラム運転中 |
    | D5 | プログラム停止中 |
    | D6 | ステップ途中停止 |
    | D7 | 各種シーケンス完 |
    | D8 | シングルステップモード |
    | D9 | ティーチングモード |
    | D10 | サイクル運転モード |
    | D11 | マシンロック（未対応） |
    | D12～D15 | 運転モード（4bitの値: 0=セッティング、1=手動、2=自動、3=OT無視、4=DNC） |
    | D16 | 割当軸INPOS |
    | D17 | 割当軸ACCたまり有り |
    | D18 | 割当軸サーボON |
    | D19 | 割当軸原点復帰完 |
    | D20 | 割当軸独立位置決め中 |
    | D21 | 割当軸独立位置決め停止中 |
    | D24 | 高速センサーラッチ完 |
    | D25 | 接線制御ON |
    | D26 | 最終層巻数異常警告 |
    | D27 | ポイントテーブル変更フラグ |

    上記以外のビット（D22、D23、D28～D31）は未使用。

84132f61:
  alt: FG(軌跡関数発生)ステータスのタイミングチャート
  text: |
    軸移動コマンド → ストップ（軸移動停止）→ スタート（再開）→ 移動完了、の各時点での信号の変化。

    | 信号 | コマンド受付時 | ストップ時 | スタート（再開）時 | 移動完了（次コマンド受付可）時 |
    |---|---|---|---|---|
    | 軌跡発生 | ON | OFF | ON | OFF |
    | 補間加減速（指数） | 指数関数的に加速 | 指数関数的に減速 | 再び加速 | 減速 |
    | タスクステータス D0 軌跡発生完 | OFF | OFFのまま | OFFのまま | ON |
    | タスクステータス D1 途中停止中 | OFF | ON | OFF | OFF |
    | タスクステータス D2 軌跡発生中 | ON | OFF | ON | OFF |
    | 軸ステータス D0 インポジション | OFF | 減速後に偏差がINPOS量以内でON(*) | OFF | 減速後に偏差がINPOS量以内でON(*) |
    | 軸ステータス D1 加減速たまり有り | ON | 減速が終わるとOFF | ON | 減速が終わるとOFF |

    *: インポジションがONするタイミングはサーボパラメータのINPOS量によって変わる。
    次のコマンドは、タスクステータス D0 軌跡発生完 がONになった時点から受け付け可能。

325cecd1:
  alt: タスクアラームのビット割り当て
  text: |
    タスクアラーム(long)のビット割り当て:

    | ビット | 内容 |
    |---|---|
    | D0 | プログラム実行エラー |
    | D1 | Mコード実行エラー |
    | D2 | 割り当て軸エラー |
    | D3 | FG内部演算エラー |
    | D4 | サーボOFFエラー |
    | D5 | 外部アラームAエラー |
    | D6 | 外部アラームBエラー |
    | D7 | 外部アラームCエラー |
    | D8 | 非常停止 |

    上記以外のビットは未使用。

30f78cc1:
  alt: 入出力状態データのビット構成
  text: |
    各入出力データ(16bit)は、ビットDn(n=0～15)が入出力信号Dnの状態を表す（1=オン）。
    D0=D0オン、D1=D1オン、…、D14=D14オン、D15=D15オン。

95c1c98e:
  alt: 強制入出力状態データのビット構成
  text: |
    各入出力データ(16bit)は、ビットDn(n=0～15)が入出力信号Dnの強制入出力中を表す（1=強制入出力中）。
    D0=D0強制入出力中、D1=D1強制入出力中、D2=D2強制入出力中、…、D13、D14、D15=D15強制入出力中。

b0f01a6c:
  alt: プログラム変換ライブラリに渡すデータの構成
  text: |
    プログラム変換ライブラリに渡すデータは、次の2つを連続して並べたもの（計208byte）。

    | 順 | 内容 | サイズ | 備考 |
    |---|---|---|---|
    | 1 | ヘッダ情報（BINPRG_LABEL構造体） | 104byte | 呼び出し側で初期化して用意する |
    | 2 | ステップ情報（BINPRG_BLOCK構造体） | 104byte | 本コマンド（DAT_ONEBLOCK）で読み出したデータ |

93f94091:
  alt: ティーチングステータスのビット割り当て
  text: |
    ティーチングステータスのビット割り当て:

    | ビット | 内容 |
    |---|---|
    | D0 | ティーチングモード |
    | D1 | ティーチング開始ステップ |
    | D2 | ティーチング可能ステップ |
    | D3 | ティーチング開始の前ステップ |

    上記以外のビットは未使用。

6879f6e0:
  alt: マクロ変数書込/読出のデータタイプとパラメータのビット構成
  text: |
    - 《データタイプ》`DAT_VARIABLE / 16#19`
    - 《パラメータ》書き込み/読み出しを行うマクロ変数を指定する(32bit)。

    | ビット | 内容 |
    |---|---|
    | D00～D15（下位16bit） | データ数 |
    | D16～D31（上位16bit） | 先頭マクロ変数番号 |

75506b36:
  alt: WORDデータバッファをDWORDとして使う場合の例
  text: |
    データバッファはWORD単位で、連続した2WORDを結合してDWORDとして扱う（下位WORDが先、上位WORDが後）。

    | データバッファ | 値 |
    |---|---|
    | 1WORD目 | 1234H |
    | 2WORD目 | 5678H |
    | 3WORD目 | 9ABCH |
    | 4WORD目 | DEF0H |

    DWORDとして使用する場合の値（図では隣り合う2WORDずつを1WORDずらして結合している）:
    - 1WORD目+2WORD目 → 56781234H
    - 2WORD目+3WORD目 → 9ABC5678H
    - 3WORD目+4WORD目 → DEF09ABCH

155b19da:
  alt: TPCデータのリングバッファのイメージ図
  text: |
    TPCデータの流れ:
    1. RTMC64の「制御」がTPCデータをRTMC64内の「リングバッファ」に書き込む（リングバッファは循環して使われる）。
    2. リングバッファのデータは、次のどちらかが読み出す。
       - PCアプリ: 通信（通信ライブラリ）で読み出し、PCアプリ側でデータを保存する。
       - PLC: 読み出して、PLC側でデータを保存する。

    読み出した分のバッファは解放される。読み出しが間に合わずバッファが一杯になるとロギングは停止する（4-1-15の《説明》参照）。

f0d1ab40:
  alt: ネグレクト軸フラグのビット割り当て
  text: |
    ネグレクト軸フラグは、ビットDn が第(n+1)軸の設定を表す（1=ネグレクト設定）。
    D0=第1軸、D1=第2軸、…、D8=第9軸（以降も同様に1ビット1軸）。

af244d1d:
  alt: インタロック軸フラグのビット割り当て
  text: |
    インタロック軸フラグは、ビットDn が第(n+1)軸の設定を表す（1=インタロック設定）。
    D0=第1軸、D1=第2軸、…、D8=第9軸（以降も同様に1ビット1軸）。

35d1301a:
  alt: サーボON軸フラグのビット割り当て
  text: |
    サーボON軸フラグは、ビットDn が第(n+1)軸の設定を表す（1=サーボON設定）。
    D0=第1軸、D1=第2軸、…、D8=第9軸（以降も同様に1ビット1軸）。

ab81566e:
  alt: 略記号アイコン「W／A」（Whole／Axis）
  text: |
    略記号。Ｗ = Whole（全軸指定）、Ａ = Axis（各軸指定）。以降のデータフォーマットで、どちらの指定の場合かを示すために使われる。

826f6964:
  alt: 略記号アイコン「P／L」（Physical／Logical）
  text: |
    略記号。Ｐ = Physical（物理軸）、Ｌ = Logical（論理軸）。

ea1c9461:
  alt: 略記号アイコン「W」（全軸指定）
  text: |
    略記号Ｗ（全軸指定）の場合を示す印。

552d88d0:
  alt: 略記号アイコン「W」（全軸指定）
  text: |
    略記号Ｗ（全軸指定）の場合を示す印。

5d14588f:
  alt: エラー発生軸フラグの割り付け（タスク指定有り・論理軸）
  text: |
    ① タスク指定有り（Ｌ: 論理軸）の場合のフラグ（64bit）。ビットDn が第(n+1)論理軸を表す（1=エラー発生）。
    D0=第1論理軸、D1=第2論理軸、D2=第3論理軸、…、D8=第9論理軸。

65f5f42a:
  alt: エラー発生軸フラグの割り付け（タスク指定無し・物理軸）
  text: |
    ② タスク指定無し（Ｐ: 物理軸）の場合のフラグ（64bit）。ビットDn が第(n+1)物理軸を表す（1=エラー発生）。
    D0=第1物理軸、D1=第2物理軸、D2=第3物理軸、…、D61=第62物理軸、D62=第63物理軸、D63=第64物理軸。

cacf7d6d:
  alt: 受信共通コマンドステータス情報のビット割り当て
  text: |
    Σサーボから読み出した共通ステータスフラグ(16bit)のビット割り当て:

    | ビット | 内容 |
    |---|---|
    | D0 | アラーム発生中 |
    | D1 | ワーニング発生中 |
    | D2 | コマンド受け付け可 |
    | D3 | アラームクリア完了 |
    | D4～D5 | 未使用 |
    | D6～D7 | 受信コマンドID（2bit） |
    | D8～D11 | コマンド異常（4bit） |
    | D12～D15 | 通信異常（4bit） |

215fc760:
  alt: 受信サーボコマンドステータス・サーボコマンドI/O・サブコマンドステータスのビット割り当て
  text: |
    **(3) 受信サーボコマンドステータス情報**（Σサーボから読み出したサーボステータスフラグ、32bit）

    | ビット | 内容 |
    |---|---|
    | D0 | 移動指令一時停止完了 |
    | D1 | 移動指令中断完了 |
    | D4～D5 | 加減速フィルター種類（2bit） |
    | D8 | ラッチ完了1 |
    | D9 | ラッチ完了2 |
    | D10 | 位置情報有効 |
    | D11 | 主電源ON |
    | D12 | モータ通電準備完 |
    | D13 | サーボON |
    | D16～D19 | モニタ1（モニタ種類選択情報） |
    | D20～D23 | モニタ2（モニタ種類選択情報） |
    | D24～D27 | モニタ3（モニタ種類選択情報） |

    **(4) 受信サーボコマンドI/O情報**（Σサーボから読み出した入力信号状態、32bit）

    | ビット | 内容 |
    |---|---|
    | D1 | 減速LSスイッチ入力 |
    | D2 | 正転駆動禁止入力 |
    | D3 | 逆転駆動禁止入力 |
    | D4 | 第1外部ラッチ信号 |
    | D5 | 第2外部ラッチ信号 |
    | D6 | 第3外部ラッチ信号 |
    | D7 | 非常停止信号 |
    | D9 | ブレーキ出力 |
    | D10 | 正側ソフトリミット |
    | D11 | 逆側ソフトリミット |
    | D12 | 払い出し完了 |
    | D13 | 位置決め近傍 |
    | D14 | 位置決め完了 |
    | D15 | 原点位置 |
    | D16 | トルク制限中 |
    | D17 | 速度制限中 |
    | D18 | 速度一致 |
    | D19 | 0速 |
    | D24～D31 | 入力信号1～8 |

    **(5) 受信サブコマンドステータス情報**（Σサーボから読み出したサブコマンドステータスフラグ、32bit）

    | ビット | 内容 |
    |---|---|
    | D2 | サブコマンドレディー |
    | D8～D11 | サブコマンドアラーム（4bit） |
    | D16～D19 | モニタ4（モニタ種類選択情報） |
    | D20～D23 | モニタ5（モニタ種類選択情報） |
    | D24～D27 | モニタ6（モニタ種類選択情報） |

    各表に記載のないビットは未使用。

6297e871:
  alt: EtherCATマスターエラー軸フラグのビット割り当て
  text: |
    ビットDn が第(n+1)軸を表す（1=エラー発生）。D0=第1軸設定、…、D8=第9軸設定。

0daa18a3:
  alt: サーボ通信送受信データ読出 [M3] のパラメータのビット構成
  text: |
    DAT_ML_MON のパラメータ(32bit):

    | ビット | 内容 |
    |---|---|
    | D00～D03 | 軸番号 |
    | D15 | 送信データフラグ |

    上記以外のビットは未使用。

e26232ac:
  alt: サーボ通信送受信データ読出 [EC] のパラメータのビット構成
  text: |
    DAT_ECT_MON のパラメータ(32bit):

    | ビット | 内容 |
    |---|---|
    | D00～D03 | 軸番号 |
    | D15 | 送信データフラグ（0: 受信データ、1: 送信データ） |

    上記以外のビットは未使用。

4aefcedb:
  alt: ポイントテーブル書込/読出のパラメータのビット構成
  text: |
    パラメータ(32bit):

    | ビット | 内容 |
    |---|---|
    | D00～D09（10bit） | ③ 書込/読出ポイント数（1～400） |
    | D10～D19（10bit） | ② 書込/読出開始ポイント番号（1～400） |
    | D20～D28（9bit） | ① 対象軸（軸フラグ） |

    例: 0x01b4b003 → 対象軸=0x01b（X/Y/A/B）、開始ポイント=0x12c(300)、ポイント数=0x003(3)。

0f092828:
  alt: ポイントテーブルのパラメータの対象軸フラグ（D20～D28）
  text: |
    対象軸（軸フラグ）は D20～D28 の9bitで、D20=第1軸設定、…、D28=第9軸設定（1=ダウンロード/アップロード対象）。

d522ba49:
  alt: ポイントテーブルのダウンロードデータ例
  text: |
    ダウンロードデータ（ポイントテーブル）の例。対象軸 X/Y/A/B、開始ポイント300、ポイント数3。
    データは「ポイントごとに対象軸の順（X, Y, A, B）」で long を並べる。

    | ポイント | X | Y | A | B |
    |---|---|---|---|---|
    | 第300ポイント | 10000 | 10010 | 10020 | 10030 |
    | 第301ポイント | 20000 | 0x80000000 | 20020 | 20030 |
    | 第302ポイント | 30000 | 30010 | 0x80000000 | 30030 |

    A軸は対象タスクの有効軸（割り当て軸）でないため、実質無効。

24e681ba:
  alt: 有効軸フラグ（軸割り当て情報）のビット割り当て
  text: |
    有効軸フラグ(64bit)。ビットDn が第(n+1)物理軸を表す（1=有効軸）。
    D0=第1軸設定、D1=第2軸設定、D2=第3軸設定、…、D61=第62軸設定、D62=第63軸設定、D63=第64軸設定。

4eece441:
  alt: 第n軸割り当てテーブルのビット構成
  text: |
    第n軸割り当てテーブルの各要素(16bit、ASS_AXIS構造体):

    | ビット | 内容 |
    |---|---|
    | D0～D7（下位バイト、tsk） | タスク番号 |
    | D8～D15（上位バイト、axn） | 論理軸番号 |

b1aed2e9:
  alt: 工具径補正エラー情報のエラーコードのビット割り当て
  text: |
    工具径補正エラー情報（エラーコード）のビット割り当て:

    | ビット | 内容 |
    |---|---|
    | D0 | 正体不明エラー |
    | D1 | 円弧指令での径補正モード変換エラー |
    | D2 | 径補正中の禁止命令指定エラー |
    | D3 | マクロ変数エラー |
    | D4 | 径指定範囲外エラー |
    | D5 | 移動量なしエラー |
    | D6 | 始点/終点一致エラー |
    | D7 | 円弧中心点演算エラー |
    | D8 | 交点なしエラー（LIN→LIN） |
    | D9 | 交点なしエラー（LIN→CIR, CIR→LIN） |
    | D10 | 交点なしエラー（CIR→CIR） |
    | D11 | 移動方向反転エラー（LIN） |
    | D12 | 移動方向反転エラー（CIR） |

    上記以外のビットは未使用。

97dd5db0:
  alt: 初期化データ選択フラグのビット割り当て
  text: |
    初期化データ選択フラグのビット割り当て（"1"を設定した種別のデータを初期化する）:

    | ビット | 内容 |
    |---|---|
    | D0 | 各種パラメータ初期化指定 |
    | D1 | 運転プログラム初期化指定 |
    | D2 | アブソ座標初期化指定 |
    | D3 | マクロ変数初期化指定 |
    | D4 | ポイントテーブル初期化指定 |

    上記以外のビットは未使用。

c759514f:
