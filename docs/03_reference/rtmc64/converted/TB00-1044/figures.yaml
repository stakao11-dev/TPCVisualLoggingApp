    | ビット | 内容 |
    |---|---|
    | D0～D1（2bit） | 制御コマンド（0: 無変更、1: 強制指定解除、2: 強制ON指定、3: 強制OFF指定） |

    汎用出力ビット直接制御コマンドでは「強制指定解除」は無視される。

