1876c6cf:
  alt: 6-2-3 軸設定パラメータ（局設定画面）
  text: |
    局設定画面（サーボ軸局）。(1) 有効局選択（楕円で囲まれた上部）、(2) 局選択、(3) 軸設定の欄。
    画面の細部は小さくて判読できず。

9625d567:
  alt: 6-2-3 軸設定パラメータ（RTMC64-EC の局設定画面）
  text: |
    RTMC64-EC の局設定画面（サーボ軸局）。(1) 有効局選択、(2) 局選択、(3) 軸設定の欄。下部に「トルク制御関連オブジェクト」（Index、Sub-Index、単位）の欄がある。
    画面の細部は小さくて判読できず。

5bafb368:
  alt: 6-2-4 各項目の設定（RTMC64-M3）
  text: |
    サーボ軸局の局設定画面に、本文の項目番号が付いている: ①局選択、②仮想局、③局アドレス/拡張アドレス、④ML Board ID、⑤局タイプ、⑥サブコマンド、⑦論理軸、⑧電子ギヤ、⑨1周パルス、⑩原点方式、⑪マルチターン、⑫ラッチ信号、⑬同期軸、⑭接線軸、⑮工具長補正、⑯工具径補正、⑰絶対値エンコーダ、⑱ソフトリミット、⑲直径指令、⑳主軸。
    画面の値は小さくて判読できず。

31fa1094:
  alt: 6-2-4 各項目の設定（RTMC64-EC）
  text: |
    RTMC64-EC のサーボ軸局の局設定画面に、本文の項目番号が付いている: ①局選択、②仮想局、③Station Alias、⑤局タイプ、⑦論理軸、⑧電子ギヤ、⑨原点方式、⑫ラッチ信号、⑬同期軸、⑭接線軸、⑮工具長補正、⑯工具径補正、⑰絶対値エンコーダ、⑱ソフトリミット、⑲直径指令、⑳主軸、㉑トルク制御時速度制限 などと、1周パルス、マルチターンの欄。
    画面の値は小さくて判読できず。

b8b25401:
  alt: 6-3 手動パルサ／ジョイスティック画面
  text: |
    「手動パルサ/ジョイスティック」画面（タスク 0）。
    - 手動パルサ/ジョイスティック使用数: 1
    - 手動パルサ（手動パルサ1／手動パルサ2）: FB入力極性 標準、CNT局 無し、CNTデータオフセット 000、CNTデータサイズ 2
    - ジョイスティック（ジョイスティック1／2）: AD入力極性 標準、AD入力最小電圧 -20000、AD入力最大電圧 20000、AD入力不感帯 4000、AD局 無し、ADデータオフセット 000、ADデータサイズ 2
    - 軸選択設定（0～15）: 種別と動作軸1・動作軸2。表示されている例は、1: 手動パルサ 第1軸(X)、2: 手動パルサ 第2軸(Y)、4: 手動パルサ 第3軸(Z)、8: 手動パルサ 第4軸(A)、ほかは無効
    - ボタン: 設定、編集前に戻す、閉じる

03457576:
  alt: 6-3 ジョイスティックの電圧と速度の関係
  text: |
    横軸「入力電圧」、縦軸「指令速度」。
    - 「A/D最小電圧」以下では「－最大速度」、「A/D最大電圧」以上では「＋最大速度」
    - 中央の「0速」の区間が「不感帯」
    - 「ジョイスティック有効立ち上がり時A/Dの電圧」が中央

fe3b5f0d:
  alt: 6-3 軸選択設定（種別の選択）
  text: |
    「軸選択設定」の表（種別、動作軸1、動作軸2）で、種別のドロップダウンを開いた状態。選べるもの: 無効、手動パルサ、ジョイスティック。
    表示されている例: 1: 第1軸(X)・第2軸(Y)、2: 第3軸(Z)・第4軸(A)、4: 手動パルサ 第5軸(B)・第6軸(C)。

0bfaea53:
  alt: 6-3 軸選択設定（動作軸の選択）
  text: |
    同じ表で、動作軸1のドロップダウンを開いた状態。選べるもの: 第1軸(X)、第2軸(Y)、第3軸(Z)、第4軸(A)、第5軸(B)、第6軸(C)、第7軸(R)、第8軸(Q)、第9軸(T)。

32b01c94:
  alt: 6-4 オプション画面
  text: |
    「オプション」画面。オプションのチェック欄（灰色で表示のみ）: 補間ブロックつなぎ処理、パネルによるティーチング操作、プログラム逆行操作、ポイント位置決め、手動パルサ/ジョイスティック、DNC運転、ピッチエラー補正、高精度輪郭制御(形状補正)、同一指令2軸制御、工具長補正、摩耗補正、トルク指令、マルチタスク（マルチタスク有効、最大タスク数 8）、定時直線型補間加減速、S字補間加減速、接線制御、直径指令、高精度ラッチ(センサーラッチ:G31/SLIN)、マクロ機能、フレキシブル電子カム、工具径補正、補間前加減速、巻線、主軸 ON/OFF(信号出力)、主軸 サーボ、最大軸数 64。
    「ファイル名」、「シリアルナンバ RT64EC - 00036」。ボタン: ファイルから読出、ファイルに保存（灰色）、アップロード RTMC64-EC->win、ダウンロード（灰色）、設定（灰色）、閉じる。
    どれにチェックが入っているかは小さくて判読できず。
