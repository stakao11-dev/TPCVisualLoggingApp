# TB00-1042（RTMC64-M3/RTMC64-EC ROMSW 設定ソフト マニュアル）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# 図の多くは画面のスクリーンショット。画面の項目の説明は本文（丸数字）にあるので、ここでは画面に表示されている値と、
# 丸数字・矢印が指す箇所を中心に書いた。縮小された画面で小さくて読めない箇所は「（判読できず）」とした。

9bdb63c6:
  alt: 3-1 RTMC64 で記憶しているデータ
  text: |
    - **ファイル(バックアップ)**: 運転プログラム .TXT、P.E補正データ .PIT、サーボパラメータ .PRM、工具長補正データ .TOL、工具径補正データ .TOD、補間前加減速データ .ACO、ROMSWファイル .ROM、INIファイル .INI
    - **PCアプリ**: 「セッティングPCソフト」（通信ライブラリを含む）と「ROMSW設定ソフト」（どちらも CD で提供）。運転プログラム～補間前加減速データはセッティングPCソフト、ROMSWファイルと INIファイルは ROMSW設定ソフトが読み書きする
    - **RTMC64バックアップデータ**: ROMSW〈オプション〉、ROMSW〈ユーザ〉、サーボパラメータ ※1、P.E補正データ ※1、工具長/径補正データ ※1、補間前加減速データ ※1、運転プログラム ※2、ポイントテーブル ※2、アブソ位置オフセット。「上記は、PCアプリ側でもファイル管理して下さい。」
    - PCアプリ → RTMC64: 「初期化」「ダウンロード」、RTMC64 → PCアプリ: 「アップロード」。PCアプリと RTMC64 の間は「共有メモリ」
    - ※1 ROMSWの"各種パラメータのバックアップ方法"で保存の有/無を選択
    - ※2 ROMSWの"運転プログラム保存方法"で保存の有/無を選択
    - RTMC64 の下に「記憶の不良」（× の付いた矢印）

9e45eb95:
  alt: 「注意！」の絵

901f884e:
  alt: 中かっこ（本文の項目をまとめる記号）

79f9bb6d:
  alt: 5 メインメニュー
  text: |
    ウィンドウ「標準RTMC64-EC ROMSW設定ソフト（C:¥RT64EC¥rt64ecdrv.ini）」。
    「ファイル名」の欄、ボタン: 基本、局設定、手動パルサ ジョイスティック、ファイルから読出、ファイルに保存、アップロード RTMC64-EC->win、ダウンロード win->RTMC64-EC、オプション、閉じる。

56eeeabb:
  alt: 6-1-1-1 「基本」画面（RTMC64-M3 の場合）
  text: |
    - サーボ制御周期(msec) 2.000、サーボ制御周期ワーニングレベル(%) 87.50（※ 0の時は87.50%）
    - MECHATROLINK通信設定: C2マスタ有効（チェックあり）、全軸サブコマンド有効（伝送バイト数48バイト）、全局仮想アンプ機能、通信異常許容回数 0、最大リトライ回数 3
    - ユーザーフリーオプション: システム起動時サーボオン、ONSW(オンスイッチ)、自動原点復帰、OT時のサーボオフ（チェックあり）、PTP時定数PTP速度基準、原点復帰時論理座標系「クリアする」、原点復帰時ホーム位置、原点復帰時ソフトリミット（灰色）、アブソ位置ステータス指令基準指定（チェックあり）、MOK入力、M00/M01停止、Gコード途中再開、補間オーバーライド個別指定、主軸オーバーライド個別指定、プログラム実行時原点復帰チェック条件「原点確定済」
    - バックアップ方法: 運転プログラム・各種パラメータ・位置決めのポイントテーブルとも「自動バックアップ」
    - 機械パネル:コード仕様（オーバライド選択、動作軸選択）、巻線命令設定（トラバース軸移動無し巻数 0）、主軸機能選択（タスク選択 タスク 0、主軸機能選択「無し」、主軸指令Mコード出力・主軸オーバライドは灰色）
    - エラー発生/リセット時の軸停止方法選択「全て減速停止」（サーボOFFしないエラー発生時にリセット操作時の移動軸停止方法を選択します。）
    - 自動原点復帰ディレー(msec) 2048、サーボ主電源OFF無視時間(msec) 2048、工具径補正 角度一致閾値 3000 [1/1000pls]（0の時は3000）
    - ボタン: 設定、編集前に戻す、閉じる

5d250bd1:
  alt: 6-1-1 「基本」画面（RTMC64-EC の場合）
  text: |
    RTMC64-M3 の画面との違い:
    - サーボ制御周期(msec) 1.000（表示値）、サーボ制御周期ワーニングレベル(%) 87.50
    - 「MECHATROLINK通信設定」の代わりに「EtherCAT通信設定」: 全局仮想アンプ機能（チェックあり）、通信異常許容回数 0
    - ユーザーフリーオプション: OT時のサーボオフ、PTP時定数PTP速度基準、アブソ位置ステータス指令基準指定、補間オーバーライド個別指定、主軸オーバーライド個別指定にチェックあり
    そのほかの項目と値は RTMC64-M3 の画面と同じ。
    本文（6-1-1-5）: EtherCATの通信周期はEtherCATのマスタースタックの設定で変更します。

bfda7741:
  alt: チェックボックスの絵（チェックあり）

37ba1ff7:
  alt: チェックボックスの絵（チェックあり）と「します。」

64553e17:
  alt: チェックボックスの絵（チェックあり）

47cba335:
  alt: 6-1-9 工具径補正角度一致閾値
  text: |
    2 本の直線のなす角 θ と「円弧半径」。開きの大きさが「角度一致閾値(pls)（判定は円弧の長さ）」。

4e9412ed:
  alt: 6-1-11 サーボ ON 動作（状態遷移の表）
  text: |
    | トリガー | サーボOFFにするエラー発生中 | サーボOFFにするエラー未発生 |
    |---|---|---|
    | リセット入力ON、リセットコマンド、ONSW(オンスイッチ)入力 ON ※1 | （斜線） | サーボON許可（サーボOFFエラー解除） |
    | 全軸サーボONコマンド | （斜線） | （同上の欄に含まれる） |
    | サーボOFFにするエラー発生 ※2、全軸サーボOFFコマンド、ONSW(オンスイッチ)入力 OFF | サーボON不許可（サーボOFFエラー） | サーボON不許可（サーボOFFエラー） |

    見出しは「サーボON許可/不許可状態遷移」。

6e86cb3b:
  alt: 6-2 局設定画面（サーボ軸局の場合）
  text: |
    「局設定」画面。丸数字の指す箇所:
    - ① 有効局選択（上部の局のチェック欄。楕円で囲まれている）
    - ② 局選択
    - ③ 局タイプ "軸"
    - ④ 局アドレス、⑤ 拡張アドレス [M3]のみ、⑥ ML Board ID [M3]のみ（下部の矢印）
    画面の細部（各軸設定の値）は小さくて判読できず。

70fa98e5:
  alt: 6-2 局設定画面（入出力ユニットの場合）
  text: |
    「局設定」画面で、③ 局タイプ "IO" を選んだ場合。下半分に「デジタル入力」「デジタル出力」の信号割り付けの表（Byte:Bit、信号番号、標準信号名など）がある。
    画面の細部は小さくて判読できず。

6fb23210:
  alt: 6-2-1 入力信号の割り付け（RTMC64-M3 と RTMC64-EC の画面）
  text: |
    上が RTMC64-M3、下が RTMC64-EC の局設定画面（入出力局）。丸数字で、① 局選択、② 仮想局設定、③ ボードID設定、④ 局タイプ、⑤ 局アドレス設定（EC は Station Alias）、⑥ 伝送バイト数（EC は PDO オフセット）、⑦ 同期通信設定 / ユニット機能、⑧ 信号割り付けなどが示されている。
    画面の細部は小さくて判読できず。

d0795ab4:
  alt: 「[M3]のみ」の印

d71ae50a:
  alt: 6-2-1 IO 信号選択（信号の種類）
  text: |
    「IO信号選択」画面のドロップダウン。選べる種類: タスク制御入力、補助機能入力、汎用入力、軸制御入力、機械操作パネル入力、全入力信号。

0eebc953:
  alt: 6-2-1 IO 信号選択（入力信号の例）
  text: |
    - タスク制御入力 → タスク0: Rio0836(T0RESET)、Rio0838(T0STOP)、Rio0844(T0CRCLR)、Rio0845(T0REWND)、Rio0832(T0EMS)、Rio0843(T0RETURN)
    - 補助機能入力 → タスク0: Rio0834(T0MFIN)、Rio0835(T0MOK)、Rio0842(T0MOPT)。ほかにタスク1～3
    - 汎用入力 → 汎用入出力: i#1600:Rio0000(Rio0000)-Rio00…、Rio0000(Rio0000)～Rio0004(Rio0004)
    - 軸制御入力 → 第1軸: Rio0640(DEC01)、Rio0512(OTP01)、Rio0576(OTM01)。ほかに第2軸～第4軸

1ef3e0e2:
  alt: 「[M3]」の印

6352d383:
  alt: 6-2-1 IO 信号選択（機械操作パネル入力・全入力信号）
  text: |
    - 機械操作パネル入力 → タスク0: 手動パルサ軸選択:Rio0932(T0MP…、手動パルサ倍率／インチング送り: Rio0928(T0MP_INCH0)、Rio0929(T0MP_INCH1)、Rio0930(T0MP_INCH2)、Rio0931(T0MP_INCH3)
    - 全入力信号 → 汎用入出力: +OT、i#1632:Rio0512(OTP01)-Rio0527、Rio0512(OTP01)～Rio0515(OTP04)

c3373068:
  alt: 6-2-2 出力信号の割り付け（RTMC64-M3 の画面）
  text: |
    「RTMC64-M3の場合」の局設定画面。① 局選択（第22局(IO)）、② 仮想局設定、③ ボードID設定、④ 局タイプ（IO）、⑤ 局アドレス設定（局アドレス、拡張アドレス）、⑥ 伝送バイト数（48 [Byte]）、⑦ ユニット機能。

c0f14cc2:
  alt: 6-2-2 出力信号の割り付け（RTMC64-EC の画面）
  text: |
    RTMC64-EC の局設定画面。① 局選択（第22局(IO)）、② 仮想局設定、④ 局タイプ（IO）、⑤ Station Alias（22）、⑦ ユニット機能、⑩ PDO オフセット数（デジタル入力・デジタル出力の PDOオフセット [Byte]）。

5cb30e12:
  alt: 6-2-2 デジタル出力の信号割り付け
  text: |
    ⑧ 信号割り付けの表（ML出力）:
    | Byte:Bit | 信号番号 | 標準信号名 | オンアクティブ | オフアクティブ |
    |---|---|---|---|---|
    | 04 : D0 | 2368 | T0READY | ● | |
    | 04 : D1 | 2369 | T0ALARM | | ● |
    | 04 : D2 | 2370 | T0RUN | ● | |
    | 04 : D3 | 2371 | T0PAUSE | ● | |
    | 04 : D4 | 2372 | T0INPOS | ● | |
    | 04 : D5 | 2373 | T0PRGRDY | ● | |

    ⑨ の矢印がオンアクティブ／オフアクティブの選択を指している。

