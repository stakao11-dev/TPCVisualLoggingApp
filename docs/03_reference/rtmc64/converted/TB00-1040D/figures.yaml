# TB00-1040D の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
# [M3]、[EC] は、PDF では白抜き文字のマークで、RTMC64-M3 だけ、RTMC64-EC だけに当てはまることを表す。
# 信号名の先頭の「T0」「T3」などの数字はタスク番号（T0 はタスク0。T1MP_ENABLE ならタスク1）。
# 図のフォントではオー(O)とゼロ(0)を区別できないが、タスク番号なのでゼロとして書いた（2026-11-19 Shunsuke 確認）。

e88f22e1:
  alt: RTMC64 全体ブロック図
  text: |
    RTMC64 とその周辺の全体ブロック図。破線の枠は、Windows 側、INtime 側（RTMC64 が動く側）、別 PC を表す。

    **RTMC64 の外（Windows と INtime のユーザソフト）**
    - 別PC の Windows: PCアプリ ⇔ DLL ⇔（イーサネット）⇔ "Network"(6) スタック(TCP/IP) ◆1.3。Win-IF。
    - 同じ PC の Windows: PCアプリ（テクノ セッティングPC、専用アプリ）⇔ DLL ⇔ 共有メモリの (4-1) 通信領域 Windows用。Win-IF。※1
    - Windows のバックアップ（ディスク）⇔ データ管理(3)。※2
    - INtime のユーザ制御ソフト（PLC、C言語ソフト）⇔ PLC-IF / C-IF ⇔ 共有メモリの (4-2) 通信領域 INtime用、(4-3) RTMC64専用レジスタ、(4-4) 入出力局直接アクセス（局割付）。※1
    - ユーザ制御ソフトから EtherCAT マスタを直接 CALL できる（Ⓔ で EtherCAT マスタースタックとつながる）。

    **RTMC64 の中**
    - 共有メモリ(4): (4-1) 通信領域 Windows用、(4-2) 通信領域 INtime用、(4-3) RTMC64専用レジスタ、(4-4) 入出力局直接アクセス(局割付)。
    - データ管理(3): 運転プログラム、サーボパラメータ、ROMSW設定情報、各種補正データ etc。(4-1)、(4-2)、"Network" とデータをやりとりする。
    - モーション制御(1)（8タスク）: サーボマネージャ（自動/手動運転、マルチタスク制御、運転プログラム実行、マクロ変数管理 etc）、多軸同期制御（軌跡発生、各種同期制御、加減速制御、座標/位置管理、軸ステータス etc）。
      - (4-1)、(4-2)、"Network" からのコマンドを OR してモーション制御へ送る。モーション制御からステータスを返す。
      - (4-3) とマクロ変数・手パ etc をやりとりする。
    - 入出力制御(2): 論理入力、論理出力。
      - 論理入力: (4-1)、(4-2)、(4-3) からの入力と、ROMSW入力割付を通った M/E 通信の入力を OR する。
      - 論理出力: (4-3) へ出力し、ROMSW出力割付を通って M/E 通信へ出力する。
    - (4-4) 入出力局直接アクセス: M/E 通信と直接出力・直接入力をやりとりする。

    **M/E 通信**
    - EtherCAT マスタースタック or MECHATROLINK-Ⅲ 通信ドライバ(5) が、MECHATROLINK/EtherCAT で、入出力局（DI/DO カウンタ DA/AD）とサーボアンプ（最大64軸）につながる。
    - モーション制御とは「軸制御」でやりとりする。

    **図の注記**
    - EtherCATマスタースタックは、RTMC64とは独立しています。RTMC64以外のソフトから直接に制御できます。
    - ※1 共有メモリへの排他制御: DLL経由は同一プロセスについて排他制御しています。他については、PLC/C言語にて排他制御して下さい。
    - ※2 RTMC64データのバックアップ(*.fdt): 電源断でも記憶しておくべき情報は、Windows側にバックアップファイルを作成します。バックアップのタイミングはROMSWで選択します。

e14e8c49:
  alt: セッティングPCによる運転の構成
  text: |
    セッティングPC の画面 ⇔ 通信ライブラリ(DLL) ⇔ RTMC64 ⇔ サーボ/IO制御（MECHATROLINK-Ⅲ[M3]、EtherCAT[EC]）。

8afae194:
  alt: 専用PCアプリによる運転の構成
  text: |
    日常運転・保守 DLLなど（CD で提供）→ PCアプリ（ユーザ殿開発ソフトウェア）⇔ 通信ライブラリ(DLL) ⇔ RTMC64 ⇔ サーボ/IO制御（MECHATROLINK-Ⅲ[M3]、EtherCAT[EC]）。

3c14ce78:
  alt: システム構成例（PCアプリと RTMC64）
  text: |
    - PCアプリ（オリジナルソフト、市販ソフトウェア）は、関数コールで通信ライブラリ DLL（テクノ）を呼ぶ。
    - 通信ライブラリから、INtime部のモーションコントローラ RTMC64（テクノ）へ「●動作指示」「●データ送信」を送り、RTMC64 から「●データ受信」で受け取る。
    - RTMC64 ⇔ サーボ/IO制御（MECHATROLINK-Ⅲ[M3]、EtherCAT[EC]）。

ab5a7676:
  alt: 共有メモリを経由した論理入出力（ラダー）
  text: |
    INtime ユーザ制御ソフトのラダーと、RTMC64 の論理入出力信号の関係。
    - (ラダー出力) T0START、T3START、T0ONSW、T0EMS、T3MFIN … → 共有メモリ 入力 → (モーション制御) 論理入力信号 T0START、T3START、T0ONSW、T0EMS、T3MFIN …
    - (モーション制御) 論理出力信号 T0READY、T3RUN、T0MSTRB、T3M0、T3M1 … → 共有メモリ 出力 → (ラダー入力) T0READY、T3RUN、T0MSTRB、T3M0、T3M1 …
    - 論理入出力は、M/E通信の入力局・出力局ともつながる（破線）。

0e8de030:
  alt: ラダーによる操作例（タスク0のプログラム番号3のスタート）
  text: |
    ラダー図。各行の左が条件（接点）、右が出力（コイル）と説明。
    | 条件 | 出力 | 説明 |
    |---|---|---|
    | 機械パネル | T0MP_ENABLE | 機械パネル選択 |
    | T0MP_ENABLE AND 自動運転モード | T0MP_MDAUTO | 自動運転モード |
    | タスク0 プログラム選択3 ← ONにする | PSEL_T0P03 | プログラム3選択 |
    | T0MP_ENABLE AND (PSEL_T0P01 OR PSEL_T0P03 OR PSEL_T0P05) | T0MP_PSEL00 | プログラム番号を選択 |
    | T0MP_ENABLE AND (PSEL_T0P02 OR PSEL_T0P03) | T0MP_PSEL01 | プログラム番号を選択 |
    | T0MP_ENABLE AND (PSEL_T0P04 OR PSEL_T0P05) | T0MP_PSEL02 | プログラム番号を選択 |
    | T0MP_ENABLE AND T0MP_MDAUTO AND スタート | T0START | 自動運転スタート |

d60f0455:
  alt: 入出力局（M/Eスレーブ）を経由した論理入出力
  text: |
    - スイッチの入力 T0START、T3START、T0ONSW、T0EMS、T3MFIN … → 入力局 → M/E通信 → (モーション制御) 論理入力信号。
    - (モーション制御) 論理出力信号 T0READY、T3RUN、T0MSTRB、T3M0、T3M1 … → M/E通信 → 出力局 → リレーなどの出力 T0READY、T3RUN、T0MSTRB、T3M0、T3M1 …
    - 共有メモリの入出力と、INtime ユーザ制御ソフトのラダーは破線（この例では使わない）。

48ea2175:
  alt: 通信領域INtime用のパケット通信シーケンス
  text: |
    共有メモリの通信領域の、要求コマンド(DComQeq)、通信データ、応答コマンド(DComAck) のタイミング図。番号は本文の①〜⑩に対応する。
    1. ① 応答コマンド(DComAck) が OFF であることを確認。
    2. ユーザー制御ソフトが ② 通信データ書込。
    3. ③ 要求コマンド(DComQeq) を ON。
    4. RTMC64 が ④ 通信データ読出 → ⑤ 通信応答処理 → ⑥ 通信データ書込。
    5. ⑦ RTMC64 が応答コマンド(DComAck) を ON。
    6. ユーザー制御ソフトが ⑧ 通信データ読出。
    7. ⑨ 要求コマンド(DComQeq) を OFF。
    8. ⑩ RTMC64 が応答コマンド(DComAck) を OFF。

ee34bd3d:
  alt: 共有メモリ読み書き処理のタイミング
  text: |
    M/E通信割込ごとの、RTMC64 の処理の順序（同じ処理が周期ごとにくり返される）。
    1. ① M/E通信の受信データ読出し（EtherCAT マスタスタック or MECHATROLINK-Ⅲ 通信ドライバから）。
    2. ② 共有メモリ「RTMC64専用レジスタ」「入出力局直接アクセス」の読出し。
    3. ③ 入出力制御。
    4. ④ モーション制御。
    5. ⑤ 共有メモリへの書込み。
    6. ⑥ M/E通信の送信データ書込み。そのあと M/E通信で M/Eスレーブとやりとりする。
    - ユーザー制御ソフトは、この間に共有メモリを読み書きする。

d51184cd:
  alt: 機械パネル入力（ティーチング、軸動作、プログラム選択）
  text: |
    | 信号 | 説明 |
    |---|---|
    | T□MP_TEACH (ティーチング) <開発中> | 自動モードかつ運転プログラムがステップ間で一時停止中の場合、ONでティーチングモード、OFFでティーチング解除 |
    | T□MP_AXSEL0～7 (軸動作) | (ジョグ、各軸手動、原点復帰、インチング)。軸移動の立上がりエッジで動作開始。JOG、原点復帰は立下り検出で移動停止 |
    | T□MP_PSEL 0～15 (プログラム選択) | 【Code仕様】全入力OFF: 選択無し。その他: バイナリーコードでタスク毎にP番号指定 |

    T□MP_AXSEL の【Bit仕様】（+X～-A: 各軸移動）:
    | ビット | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |
    |---|---|---|---|---|---|---|---|---|
    | 移動 | -A | +A | -Z | +Z | -Y | +Y | -X | +X |

    T□MP_AXSEL の【Code仕様】（表の"*"は "T□MP_AX" の省略）:
    | *SEL5 | *SEL4 | *SEL3 | *SEL2 | *SEL1 | *SEL0 | 軸選択 |
    |---|---|---|---|---|---|---|
    | -方向移動 ※1 | +方向移動 ※1 | OFF | OFF | OFF | OFF | 第1軸 |
    | | | OFF | OFF | OFF | ON | 第2軸 |
    | | | ～ | ～ | ～ | ～ | ～ |
    | | | ON | OFF | OFF | OFF | 第9軸 |

d899a79c:
  alt: ROMSW設定ソフトの入出力局の信号割り付け画面（RTMC64-M3）
  text: |
    ROMSW設定ソフトの画面例（局選択: 第21局(IO)）。番号は本文の説明に対応する。
    - ① 局番号（局選択）
    - ② 局アドレス・拡張アドレス（例: 17H、00H）
    - ③ ボードID（ML Board ID）
    - ④ バイト数（MECHATROLINK の伝送バイト数、例: 48 [Byte]）
    - ⑤ IO局役割（例: DI）
    - ⑥ 入力信号割り付け（デジタル入力。ML入力 Byte:Bit ごとに信号番号と標準信号名。例: 04:D0 に 832 TOEMS、04:D1 に 834 TOMFIN）
    - ⑦ 入力信号論理（A接点 / B接点）
    - ⑧ 出力信号割り付け（デジタル出力）
    - ⑨ 出力信号論理（オンアクティブ / オフアクティブ）

32c07c2d:
  alt: ROMSW設定ソフトの入出力局の信号割り付け画面（RTMC64-EC）
  text: |
    ROMSW設定ソフトの画面例（RTMC64-ECの場合、局選択: 第21局(IO)）。番号は本文の説明に対応する。
    - ① 局番号（局選択）
    - ② Station Alias・局内連番（例: 21、0）
    - ⑤ IO局役割（例: DI）
    - ⑥ 入力信号割り付け（PDO入力 Byte:Bit ごとに信号番号と標準信号名。例: 00:D0 に 832 TOEMS、00:D1 に 834 TOMFIN）
    - ⑦ 入力信号論理（A接点 / B接点）
    - ⑧ 出力信号割り付け（デジタル出力）
    - ⑨ 出力信号論理（オンアクティブ / オフアクティブ）
    - ⑩ PDOオフセット [Byte]
    - ⑪ PDO読出し専用局

