# 「※1」は最後の行（補間 → 補間）に付いた印
- after: 【インポジションチェック動作比較表】
  table: |
    | 実行ステップ | 次ステップ | インポジションチェック無効 | インポジションチェック有効（デフォルト） |
    |---|---|---|---|
    | 補間以外 | 補間以外 | インポジションチェック無し | インポジションチェック有り |
    | 補間 | 補間以外 | インポジションチェック無し | インポジションチェック有り |
    | 補間以外 | 補間 | インポジションチェック無し | インポジションチェック有り |
    | 補間 ※1 | 補間 | つなぎ(補間命令をなめらかに連続させる。) | つなぎ(補間命令をなめらかに連続させる。) |

# 5-16-1 ON/OFF(信号出力)主軸: 方式と指令方式 (PDF 31 ページ)
# 見出しの「指令方式」が 2 列にまたがる結合セルで、「方式」の見出しと混ざっていた。Tコードの欄は斜線（該当なし）
- after: 通信指令時のSON信号は下記になります。
  table: |
    | 方式 | 内容・特徴 | ハード | 指令方式 - Gコード | 指令方式 - Tコード |
    |---|---|---|---|---|
    | 2ビット出力信号制御方式（主軸 ON/OFF） | I/O 信号のみ、アナログI/F不要 | 汎用出力 SON1、SON2 | S0 停止、S1 速度 1、S2 速度 2、S3 速度 3 | （斜線: 該当なし） |

# 5-16-1 ON/OFF(信号出力)主軸: 指令と SON 信号の関係 (PDF 31 ページ)
# REQ_SPCMND の「パラメータ= 1:正転 2:逆転」が 3 行の結合セルで、行ごとに分かれていた
- after: S0相当の出力となります。
  table: |
    | Gコードプログラム - Mコード | Gコードプログラム - Sコード | 通信コマンド - REQ_SPCMND | 通信コマンド - REQ_SPREVSET | SON2 | SON1 | 主軸動作指定 |
    |---|---|---|---|---|---|---|
    | M05 | S0 | パラメータ=0 | パラメータ=0 | OFF | OFF | 停止 |
    | M03/M04 | S1 | パラメータ= 1:正転 2:逆転 | パラメータ=1 | OFF | ON | 速度1 |
    | M03:正転 | S2 | パラメータ= 1:正転 2:逆転 | パラメータ=2 | ON | OFF | 速度2 |
    | M04:逆転 | S3 | パラメータ= 1:正転 2:逆転 | パラメータ=3 | ON | ON | 速度3 |

# 5-22-1 各軸の原点復帰方式の選択: ROMSW設定と原点復帰方式の関係 (PDF 77 ページ)
# 2 段の見出し（特徴: 速度・精度、要求機能※2: ﾗｯﾁ機能・原点信号・OT信号）が 2 行に分かれ、「特徴」の速度と精度が 1 列にまとまっていた
- after: '[ROMSW設定と原点復帰方式の関係]'
  table: |
    | 原点復帰方式 | 原点復帰段数 | 特徴 - 速度 | 特徴 - 精度 | 想定される代表的な機構 | 要求機能※2 - ﾗｯﾁ機能 | 要求機能※2 - 原点信号 | 要求機能※2 - OT信号 |
    |---|---|---|---|---|---|---|---|
    | FBラッチ方式（原点信号あり） | 2段 | 高速 | 高精度 | ・ボールネジを使用した直動軸 ・ギヤ等で減速するターンテーブル | ○ | ○ | △ |
    | FBラッチ方式（原点信号あり） | 1段 | 中速 | 高精度 | ・ボールネジを使用した直動軸（ベタドグの場合） | ○ | ○ | － |
    | FBラッチ方式（原点信号なし） | 2段※1 1段※1 | 低速 | 高精度 | ・リニアスケールを使用する直動軸 ・ダイレクトドライブモータで回すターンテーブル | ○ | － | △ |
    | DECサーチ方式 | 2段 | 高速 | △ | ・直動軸（ﾗｯﾁ機能が無い場合） ・ターンテーブル（ﾗｯﾁ機能が無い場合） | － | ○ | ○ |
    | DECサーチ方式 | 1段 | 中速 | △ | ・直動軸(ベタドグの場合)（ﾗｯﾁ機能が無い場合） | － | ○ | － |
    | FBラッチ方式（OT信号） | 2段※1 1段※1 | 中速 | 高精度 | ・直動軸（原点信号が無い場合） | ○ | － | ○ |
    | OTサーチ原点復帰 | 2段※1 1段※1 | 低速 | △ | ・直動軸（ﾗｯﾁ機能・原点信号が無い場合） | － | － | ○ |
