# TB00-1040E（RTMC64 取扱説明書 4 章 INtime ユーザ制御ソフトとのインターフェース、5 章 サーボ制御）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

9b091ebc:
  alt: 4-1 PLC/C と RTMC64-M3/EC の関係（ブロック図）
  text: |
    - **【別PC】【Windows】**: セッティングPC、ROMSW設定、ユーザソフト → 通信ライブラリ(DLL)（Win-IF）。イーサネットで【RTMC64】につながる
    - **【PC】【Windows】**: セッティングPC、ROMSW設定、ユーザソフト → 通信ライブラリ(DLL)（Win-IF）→【RTMC64】
    - **【PC】【INtime】**
      - **ユーザ制御ソフト**: 「PLC(ラダー制御)」または「C言語ソフト」
        - PLC(ラダー制御)の扱うもの: 入出力データ（i#1600～i#1715、o#1716～o#1779）、通信領域（コマンドデータ送受信）、手動パルサ、ジョイステック、ラダー共有マクロ変数、ステータスデータ
      - **PLC-IF/C-IF**: 共有メモリ
        - 【Tmi0】【Tei0】共有メモリ(入力): ユーザ制御ソフト →【RTMC64】。通信制御、非常停止、ONSW、MOK、MFIN、Rio0000～Rio1855、その他
        - 【Tmo0】【Teo0】共有メモリ(出力):【RTMC64】→ ユーザ制御ソフト。通信制御、SVM、Mコード、Rio1856～Rio2879、その他
      - **【RTMC64】モーション制御**
        - モーションコントロール機能: 自動運転、コマンド運転、各種移動命令、入出力操作命令、マクロ機能、マルチタスクなど
        - 各種データ管理: 運転プログラム、各種補正データ、マクロ変数、パラメータ
        - 通信: MECHATROLINK-Ⅲ [M3]、EtherCAT [EC]
    - RTMC64 の通信から: サーボアンプ → モータ(M)、入出力局／カウンタモジュールなど（入力信号、出力信号、外部PG）

    注記: ※ [M3] のときは入力【Tmi0】、出力【Tmo0】。[EC] のときは入力【Tei0】、出力【Teo0】

ed60b3c5:
  alt: 5-2 A→B への移動命令
  text: |
    X-Y 座標（原点は「論理原点」）上で、A(500, 500) から B(1500, 1000) へ向かう矢印。

40415c66:
  alt: 5-2 インクレ指令の考え方
  text: |
    A 点から B 点へ向かう線の途中に「現在位置(X、Y)」があり、A 点を基準にした x、y の距離が示されている。

ff008553:
  alt: 5-2 機械原点と論理原点（PTPA 命令）
  text: |
    「機械原点(0, 0, 0)」と、そこから a、b ずれた位置にある「論理原点(0, 0, 0)」。
    「PTPB Xa Yb」は機械原点を基準に (a, b) の点を指し、「PTPA命令(アブソ命令)」は論理原点を基準にした指令であることを示す（破線の矢印が論理原点から出ている）。

b189219b:
  alt: 5-3 指数形加減速の軸速度の様子
  text: |
    LIN 命令が 2 つ続くときの軸速度。速度は指数関数的に上がって一定になり、次の LIN 命令でさらに上がり、最後は指数関数的に下がる。
    横軸の区間: 「時定数」「LIN命令」「LIN命令」。

567de356:
  alt: 5-3 直線形加減速の軸速度の様子
  text: |
    LIN 命令が 3 つ続くときの軸速度。速度は直線的に上がり下がりし、命令の切り替わりで速度が変わる。
    加減速にかかる区間に「直線形補間時定数」と書かれている。横軸の区間: 「LIN命令」「LIN命令」「LIN命令」。

ebac1173:
  alt: 5-3 S 字加減速の軸速度の様子
  text: |
    台形の速度（破線）の角を丸めた S 字の速度（実線）。加速の始めと終わり、減速の始めと終わりに、それぞれ「TS」の区間がある。

8eece797:
  alt: 5-4 直線形加減速（PTP 命令の速度）
  text: |
    縦軸「指令速度 FP」、横軸は時間。「PTP命令」の速度は台形で、0 から「100Kpps」に達するまでの時間が「PtpT(msec)」、0 から指令速度 FP に達するまでの時間が「T」。
    続いて「次のPTP命令」の台形がある。

c33290b9:
  alt: 5-5 PTP X1,Y1 の例
  text: |
    始点から「目標点(X1, Y1)」への動き。始めは斜めに進み、途中から X 方向だけに進んで目標点に着く（各軸が独立に動くため、移動量の少ない軸が先に止まる）。X1、Y1 は各軸の移動量。

0cae5aa0:
  alt: 5-6 LIN Xa Yb F□ の例
  text: |
    始点から「目標点(a, b)」へ「送り速度 F」で直線に進む。各軸の速度:
    - fx ＝ a × F ／ √(a² ＋ b²)
    - fy ＝ b × F ／ √(a² ＋ b²)
    - F ＝ √(fx² ＋ fy²)

da6d0a75:
  alt: 5-6 直線補間の X 軸速度と Y 軸速度
  text: |
    「X軸速度」は fx、「Y軸速度」は fy まで同時に上がり、同時に下がる（目標点への到達は全軸が同時）。

57c43aaa:
  alt: 5-6 PTP の X 軸速度と Y 軸速度
  text: |
    「X軸速度」は「PTP速度（X軸）」まで上がる台形。「Y軸速度」は移動量が少ないため、「PTP速度（Y軸）」に達する前に減速を始める三角形になる。横軸は「時間」。

329a897a:
  alt: 5-9 インポジションチェックあり
  text: |
    縦軸は速度、横軸は t。「ステップN」の速度が下がって 0 になった時点が ①、「ステップN+1」が始まる時点が ②。① と ② の間が ③。
    本文: ①軌跡発生完了、②次命令開始、③INPOS待ち。

a109f884:
  alt: 5-9 インポジションチェックなし
  text: |
    縦軸「F(速度)」、横軸 t。「ステップN」の速度が 0 になった時点で、すぐに「ステップN+1」が始まる（① と ② が同じ時点）。

2edd6d3e:
  alt: 5-9 速度を落とさずに次のステップへ移る場合
  text: |
    縦軸「F(速度)」、横軸 t。「ステップN」の終わりで速度が 0 まで下がらず（破線で、下がる場合の形を示す）、そのまま「ステップN+1」に移る。

6b08caf6:
  alt: 5-10 なめらかな送り制御（パス機能）
  text: |
    曲線を細かい矢印でつないだ図。
    - 「微小連続ブロック(ステップ)」
    - 「微小なLIN命令(直線補間)の連続」
    - 「各々の移動ステップ(ブロック)の例 ブロック長 ℓ＝1mm F＝2m/min 1ステップ時間＝約30msec」

cb773c52:
  alt: 5-11 シングルステップ動作のタイミング
  text: |
    - 「シングルステップ」信号: 「シングルステップ モード」の間 ON、「通常モード(自動運転)」で OFF
    - 「スタート信号」: シングルステップ モード中に 4 回パルスが入る
    - 「動作ステップ」: スタート信号ごとに n、n+1、n+2 を 1 つずつ実行して止まる（「移動 停止」）。通常モードでは n+3、n+4、n+5 を続けて実行する（「連続動作」）

e0e0ce22:
  alt: 5-12 サイクル運転モードのタイミング
  text: |
    - 「サイクル運転モード」: 起動の前から ON、途中で OFF になり、短く ON に戻り、また OFF になる
    - 「運転プログラム」: 「起動」から「1サイクル」をくり返す。モードが OFF になると、実行中の 1 サイクルが終わったところで止まる（矢印）

1a6e7c15:
  alt: 5-14 ストロークリミット（ソフト OT とハード OT）
  text: |
    - 中央が「正常領域」、その両側が「ソフトOT領域」、さらに外側が「ハードOT領域」。両端に「マシンエンド」
    - 正常領域の中に「機械原点」があり、機械原点から左右の境界までが「ｿﾌﾄOTﾊﾟﾗﾒﾀ ＋側」「ｿﾌﾄOTﾊﾟﾗﾒﾀ －側」（図ではこの向きに書かれている）
    - ソフトOT領域に入ったとき: 「ソフトウェアにて停止。SVM ON(サーボ主電源オン) SV ON(サーボオン)」
    - ハードOT領域に入ったとき: 「ソフトにて、SVM OFF，SV OFF。（ブレーキ動作）」→「復旧 OT無視モードにて SVM ON，SV ON，（ブレーキ解除）」

c9865cb0:
  alt: 5-15-2 回転軸の角度
  text: |
    円の右が 0°、上が 90°（－270°）、左が 180°（－180°）、下が 270°（－90°）。左上に「(パ)ルス数」の文字の一部がある。

d0a3d309:
  alt: 5-15-3 ねじ切りの G コード
  text: |
    【Gコード】 G32 X＿ Y＿ F＿;
    - X＿: X軸インクレ移動量(±)
    - Y＿: Y軸インクレ移動量(±)
    - F＿: ねじピッチ

9f52a301:
  alt: 5-15-5 接線制御軸の動きの例（L1、L2）
  text: |
    X-Y 平面で、X 方向に L1 進み、その後 －Y 方向に L2 進む経路。

b3ea4dba:
  alt: 5-15-5 接線制御軸の速度の様子
  text: |
    経路は ①（X 方向）から A 点で ②（斜め下）に向きを変える。
    - k:X軸速度: A 点で下がる
    - l:Y軸速度: A 点から上がる
    - m:Z軸速度: A 点で短いパルス状に動く（Z 軸を回転させて向きを合わせる）

4a6931c3:
  alt: 5-15-5 接線制御軸の ROMSW と座標
  text: |
    左の文:
    - 関連する ROMSW
    - θ軸(m軸)の以下のROMSWは必ず設定して下さい。
      - 「メカ機構1回転パルス数」 θ軸が360°するパルス量
      - 「ソフトリミット」を無効
    - 詳細は、「ROMSW設定ソフトマニュアル」<5-2-3軸設定パラメータ>(TB00-1042)を参照下さい。

    右の図: 横軸 X（(k)）、縦軸 (j) の座標に円があり、「接線制御基準位置」から角度 θ を測る。「指令極性」の矢印、「メカ機構一周パルス」の表示がある。

212b9b33:
  alt: 5-15-7 コンベア追従送り（同調・同期送り）
  text: |
    - 【X軸】: 「X軸原点」から、「同調送り」「追従送り」で進み、「もどり」で戻る。原点から Ⓐ までが「lm」、Ⓑ（「ここまで来たらエラー」）までが「lb」
    - 【コンベア軸(Y)】(ベルト駆動): 「ベルトコンベア」上を「ワーク」が流れる。「コンベア軸原点」からワークの検出位置までが「LM」
    - 「コンベア軸原点」の信号はパルス状（「(ワーク毎に発生)」）

6177db22:
  alt: 5-15-9 フレキシブル電子カム制御のデータの流れ
  text: |
    1. カム曲線（動作タイミングチャート）の図から、
    2. 「EXCEL編集」: ②「Ⅰ～Ⅴ」の「コンディションデータ」と「ポイントデータ(全6種)」を作り、③「各軸のグラフ表示 Ⅰ～Ⅱ」で確かめ（②と③を行き来する）、「テクノコードプログラム」（PTPA X～）を作る
    3. 「セッティングPCソフト」: 「ファイル選択」で読んだテクノコードプログラムを「編集」し、④「RTMC64-M3/EC コントローラ」へ「ダウンロード」する。コントローラから「アップロード」したものは「読出したプログラム」になる

2a056019:
  alt: 5-15-10 巻線指令の軸の割り当て
  text: |
    第1軸～第9軸の名前: X、Y、Z、A、B、C、R、Q、T。
    - A（第4軸）が「主軸」
    - X、Y、Z と B、C、R、Q、T のうち「トラバース軸（何れか1軸）」

5b28efbf:
  alt: 5-15-10 RE0（自然終了）
  text: |
    縦軸「トラバース位置」「主軸角度」、横軸「時間」。
    主軸角度はのこぎり波（1 回転ごとに 0 に戻る）、トラバース位置は三角形に往復する。「RE0（自然終了）」では、トラバースが戻る途中で終了している。

412593c4:
  alt: 5-15-10 RE1（トラバース始端側終了）
  text: |
    縦軸「トラバース位置」「主軸角度」、横軸「時間」。
    「RE1（トラバース始端側終了）」では、トラバースが始端（0）に戻ったところで終了する。戻りの部分に「2)のピッチ調整」の矢印がある。

54adcee9:
  alt: 5-15-10 RE2（トラバース終端側終了）
  text: |
    縦軸「トラバース位置」「主軸角度」、横軸「時間」。
    「RE2（トラバース終端側終了）」では、始端に戻ったあと、もう一度終端まで進んで終了する。最後の往路に「3)のピッチ調整」の矢印がある。

1989a8d3:
  alt: 5-15-10 3)のピッチ調整
  text: |
    横軸「時間」、縦軸「トラバース位置」。主軸角度ののこぎり波と、トラバース位置の往復。最後の往路が「3)のピッチ調整」で、傾きが変わっている。

8c6100e6:
  alt: 5-15-10 2)のピッチ調整
  text: |
    横軸「時間」、縦軸「トラバース位置」。トラバースが戻る部分が「2)のピッチ調整」で、傾きが急になっている（矢印）。

78e6604b:
  alt: 5-15-10 終端側のピッチ調整
  text: |
    横軸「時間」。主軸角度ののこぎり波と、トラバース位置の往復。最後の往路の傾きが変わっている箇所を矢印が指している。

73c3dec9:
  alt: 5-15-10 セッティング PC の「巻線 最終層異常」表示
  text: |
    セッティング PC ソフト（標準SLM8000）の運転操作パネル。タスク選択「タスク0」、動作モード「自動運転」、オーバライド 100、補間オーバライド 100、主軸オーバライド 100。
    右側の表示「巻線 最終層異常」が丸で囲まれている。

94e11bf2:
  alt: 5-17-1 バックラッシュ補正の概念図
  text: |
    上段: 機構（テーブル）が右へ動くとき、モータも同じだけ動く。
    下段: 左へ向きを変えるとき、モータは「ガタの量」だけ先に動き（「バックラッシュ補正による動作」の太い矢印）、その後で機構が動く。
    凡例: ガタの量、機構(テーブル)、モータ軸位置、機構の動き（実線の矢印）、モータの動き（点線の矢印）、バックラッシュ補正による動作（太い矢印）。

920d8d2e:
  alt: 5-17-2 工具長補正（Z の論理座標で見た動き）
  text: |
    横軸 X（3000 まで）、縦軸 Z（-1000～2000）。機械原点から ①②③④⑤⑥⑦ の点を通る経路。
    点の横に括弧付きの値がある（図の下の凡例「( )Zの論理座標」）: ②③「(1000)」「(3000)」、④⑤「(1000)」「(-2000)」、⑥⑦「(1000)」「(2000)」。

be2413f0:
  alt: 5-17-2 工具長補正（機械座標で見た動き）
  text: |
    横軸 X（3000 まで）、縦軸 Z（-1000～2000）。機械原点から ②③ で上がり、④ で X 方向に進み、⑤ で下がり、⑥ で X 方向に進み、⑦ で上がる。

3090273a:
  alt: 5-17-3-1 G41（左側）と G42（右側）
  text: |
    「指令プログラム」の直線に対し、進行方向の左側に工具（半径 D）が来るのが「G41(左側)」、右側に来るのが「G42(右側)」。座標は +X、+Y。

407cdf7b:
  alt: 5-17-3-3 径補正モードへの入り方
  text: |
    凡例: 青の一点鎖線「指令軌跡」、緑の一点鎖線「移動軌跡」、破線「指令軌跡を法線方向に径補正分シフトした線」、黒点「－－－の交点」。
    指令軌跡は左上から右下へ進み、そこから +X 方向へ曲がる。「DL / G41」では移動軌跡が上側の交点を、「DR / G42」では下側の交点を通る。各交点に「工具」の円（破線）がある。

f50c1852:
  alt: 5-17-3-4 径補正の終了
  text: |
    - 例1. G40 G01 X＿ Y＿（終了）
    - 例2. G40 / G01 Z＿ / ～ / G00 X＿（終了）

    図: G41 で補正していた工具の円が、「プログラム指令」の点へ向かう。「G01での終了」は直線で、「G00での終了」は各軸独立の折れ線（破線）で終点に着く。

6b052df0:
  alt: 5-17-3-4 終了時の移動（① と ②）
  text: |
    工具の円が ① で A 点まで右へ進み、② で斜め下へ向きを変える。破線は指令の経路。

d64c36fa:
  alt: 5-17-3-5 X/Y 指令なしのステップの例
  text: |
    例:
    ```
    ～
    G41 G01 X＿ Y＿ D＿
    G01 Z＿
    ～
    G00 Z＿
    G01 X＿ Y＿
    ```
    G01 Z＿ から G00 Z＿ までが「X／Y指令なしのステップ(9ステップ以下)」。

33133864:
  alt: 5-17-3-5 先読みステップカウント
  text: |
    例（右は「先読みステップカウント」）:
    | プログラム | カウント |
    |---|---|
    | ～ | |
    | G41 G01 X＿ Y＿ D＿ | |
    | G01 Z＿ | ① |
    | M98 Pxx | ② |
    | ～ | |
    | G01 X＿ Y＿ | |
    | Nxx G90 G01 Z＿ | ③ |
    | ～ | ④⑤⑥⑦⑧⑨ |
    | G01 X＿ Y＿ | ⑩ |

0bfc86e9:
  alt: 5-17-3-6 補正中の G00 の動作
  text: |
    工具の円が、波線（実際の動き）でオフセット位置に向かう。G00 指定のステップは、最終的なオフセット位置に向かって各軸独立に動くので、経路は指令の直線（実線の矢印）からずれる。

acb21232:
  alt: 5-17-3-7 工具径補正データ設定画面
  text: |
    ダイアログ「工具径補正機能パラメータ」。「工具径補正データ」のタスク選択（タスク0）と、No.0～19 の入力欄（すべて 0）。
    ボタン: 「ファイルから読出」「ファイルに保存」「アップロード SLM8000->PC」「ダウンロード PC->SLM8000」「編集前に戻す」「閉じる」。

6bc56332:
  alt: 5-17-3-9 ROMSW 設定ソフト「基本」画面
  text: |
    ROMSW 設定ソフトの「基本」画面。「工具径補正 角度一致閾値 [3000] [1/1000pls]」が赤丸で囲まれている。
    画面のほかの項目（表示されている値）:
    - サーボ制御周期(msec) 2.0、サーボ制御周期ワーニングレベル 87.50 %、パルスジェネレータクロック(kHz) 512
    - イーサネット設定: IPアドレス 192.168.0.2、サブネットマスク 255.255.255.0、デフォルトゲートウェイ 192.168.0.1
    - 自動原点復帰ディレイ(msec) 2048、サーボアラーム無視時間(msec) 2048、サーボリセット保持時間(msec) 128、サーボオン遅延時間(msec) 0、アラーム時サーボオフ遅延時間(msec) 0
    - ユーザーフリーオプション（チェックあり: OT時のサーボオフ、アラーム時のサーボオフ、アブソ位置ステータス指令基準指定）、システム起動時論理座標系「クリアしない」、原点復帰時論理座標系「クリアしない」、プログラム実行時原点復帰チェック条件「原点確定済」
    - 機械パネル:コード仕様（オーバライド選択、動作軸選択）、巻線命令設定（トラバース軸移動無し巻数 0）、エラー発生/リセット時の軸停止方法選択「全て減速停止」
    - バックアップ方法: 運転プログラム／各種パラメータとも「自動バックアップ」（【注意】バックアップは10万回の回数制限があります。）
    - ボタン: 設定、編集前に戻す、閉じる

36a89919:
  alt: 5-17-3-9 角度一致閾値
  text: |
    2 本の直線のなす角 θ と、「円弧半径」方向の開きが「角度一致閾値(pls)」であることを示す図。

7f7df6c0:
  alt: 5-17-3-10 工具径補正情報画面
  text: |
    ダイアログ「工具径補正情報」。「径補正中」のラジオ表示（OFF）、「径補正No. [0]」、「閉じる」ボタン。

# 5-17-3-12 の図は、エラーになる軌跡と対策後の軌跡を組で示している。
# 実線は補正前（指令）の経路、破線（DL①… / DR①…）は補正後の経路。「⇩」は「エラーの例 → 対策」の流れを示す矢印で、
# docling が矢印だけを別の図として切り出したものもある。

f9f4d120:
  alt: 5-17-3-11 工具径補正エラー情報（PC 画面）
  text: |
    ダイアログ「工具径補正エラー情報」。「エラー発生ステップ番号」の欄、「エラー内容」の欄、「閉じる」ボタン。

0eb5be8f:
  alt: 下向きの矢印（エラーの例 → 対策）

ffea0f0b:
  alt: 下向きの矢印（エラーの例 → 対策）

9d346e9b:
  alt: 5-17-3-12 補正後の経路（DL①、DL②）
  text: |
    左右に往復する経路で、補正後の DL①（破線）と DL②（実線）が重なる向きに並んでいる。下に「⇩」。

5c879333:
  alt: 5-17-3-12 補正後の経路（DL①、DL②、DL③）
  text: |
    細長い経路（実線）の外側を、補正後の DL①（斜めの破線）、DL②（縦の破線）、DL③（下の破線、左向き）が回っている。

7eeb9bbd:
  alt: 5-17-3-12 交点ができない例（直線と円弧）
  text: |
    上向きの直線のあとに円弧が続く経路。補正後の DL①（直線の左の破線）と DL②（円弧の内側の破線）の間に交点ができない。下に「⇩」。

9b93db0d:
  alt: "5-17-3-12 対策: ステップ間に直線を入れる"
  text: |
    直線と円弧の間に短い直線を入れた経路。補正後の経路は DL①、DL②（入れた直線の上の破線）、DL③（円弧の内側）となり、交点ができる。

82a7c960:
  alt: 5-17-3-12 交点ができない例（円弧と直線、DR）
  text: |
    円弧のあとに上向きの直線が続く経路。補正後の DR①（円弧の内側の破線）と DR②（直線の右の破線）。下に「⇩」。左上に本文の一部「J0;」。

e7d7050a:
  alt: "5-17-3-12 対策: ステップ間に直線を入れる（DR）"
  text: |
    円弧と直線の間に短い直線を入れた経路。補正後の経路は DR①（円弧の内側）、DR②（入れた直線の下）、DR③（直線の右）。

0cc736aa:
  alt: "5-17-3-12 対策: 円弧と円弧の間に直線を入れる"
  text: |
    2 つの円弧の間に短い直線を入れた経路。補正後の経路は DL①（左の円弧の内側）、DL②（入れた直線の上）、DL③（右の円弧の内側）。

dd174920:
  alt: 5-17-3-12 DR② の移動方向がステップ② と逆になる例
  text: |
    右へ進み、下へ折り返して左へ戻る経路。補正後の DR①（斜めの破線）、DR②（縦の破線）、DR③（上の破線、左向き）。下に「⇩」。
    「※線「－－－－」は交点を出すための補助線」

5317e517:
  alt: 5-17-3-12 DR② の移動方向がステップ② と逆になる例（交点）
  text: |
    コの字形の経路の内側で、DR①（斜めの破線）、DR②（交点付近の短い動き）、DR③（左向きの破線）。補助線（破線）で交点を求めている。

45cb803e:
  alt: 5-17-3-12 DR② の移動方向がステップ② と逆になる例（短い移動）
  text: |
    右へ進んでから上へ曲がる経路で、補正後の DR①、DR②（上向きの破線）。DR② の向きがステップ② と逆になる。下に「⇩」。
    「※線「－－－－」は交点を出すための補助線」

06d525d0:
  alt: "5-17-3-12 対策: 径が移動できるように変更"
  text: |
    ステップ② の移動量を大きくした経路（本文: ②LIN Y10000; 移動にする）。補正後の DR①、DR② が同じ向きになる。
    「※線「－－－－」は交点を出すための補助線」

acfe399d:
  alt: 5-17-3-12 円弧どうしで DL② が逆向きになる例
  text: |
    2 つの円弧がつながる経路（補助線の大きな破線の円が 2 つ）。補正後の DL①、DL②（2 つの円弧の間で逆向きに戻る動き）、DL③。下に「⇩」。
    「※線「－－－－」は交点を出すための補助線」

fdb059c4:
  alt: 5-17-3-12 円弧どうしの例（対策後）
  text: |
    2 つの円弧がつながる経路で、補正後の DL①、DL②（短い弧）、DL③ が同じ向きにつながる。

8ef1fa5a:
  alt: 5-17-3-12 直線と円弧で DR② が逆向きになる例
  text: |
    下向きの直線のあとに大きな円弧が続く経路。補正後の DR①、DR②（逆向きの短い動き）、DR③（円弧の外側）。下に「⇩」。
    「※線「－－－－」は交点を出すための補助線」

a0f6bea7:
  alt: 5-17-3-12 直線と円弧の例（対策後）
  text: |
    下向きの直線と大きな円弧の経路で、補正後の DR①、DR②、DR③ がつながる。左上に本文の一部「軌跡です。」。

b4dffd07:
  alt: 5-17-3-12 DL② が 1 周以上移動する例
  text: |
    直線から小さな円弧を回り、また直線に出る経路。補正後の DL①（下向き）、DL②（円弧の内側を回る）、DL④（右向き）。
    左に「DL②軌跡」「DL③軌跡」の拡大図（小さく回る動き）。
    「※線「－－－－」は交点を出すための補助線」

4c47150d:
  alt: 5-17-3-12 DL② が 1 周以上移動する例（全体）
  text: |
    同じ経路で、補正後の DL①（下向き）、DL②（円の内側を 1 周以上回る）、DL③（右向き）。本文: "DL②"は１周以上移動します。

afbb4ada:
  alt: 下向きの矢印（エラーの例 → 対策）

8957e9e9:
  alt: 5-17-3-13 円弧の中心の調整
  text: |
    「始点」から「運転プログラムで指定された終点」への円弧。「運転プログラムで指定された中心」と「調整後の中心」が別の点として描かれている。

ec952a9d:
  alt: 5-17-3-13 円弧の中心の調整の例（指定値）
  text: |
    X 軸上に、「始点」(0, 0)、「運転プログラムで指定された終点」(800, 0)、「運転プログラムで指定された中心座標」(1000, 0)。

5eacd8e0:
  alt: 5-17-3-13 円弧の中心の調整の例（調整後）
  text: |
    「始点」(0, 0) から「運転プログラムで指定された終点」(800, 0) への円弧。「調整後の中心座標」は (400, 447)、半径は R600。

0a5f30c7:
  alt: 5-17-3-13 円弧の半径の調整
  text: |
    「始点」から「運転プログラムで指定された終点」への半円。始点からの距離として「運転プログラムで指定された半径」と「調整後の半径」の 2 つが示されている（中心の位置が違う）。

081e17c9:
  alt: 5-17-3-13 補正後の軌跡が交差する例（例1）
  text: |
    2 つの円弧（実線）が重なる経路と、補正後の経路（破線）。「補正前図形の終点」と「補正前図形の終点に近い補正後の交点」が示されている。左上に本文の一部「75000 Y19365 I35000 J19365;」。

c5922510:
  alt: 下向きの矢印（エラーの例 → 対策）

d10108f9:
  alt: 5-17-3-13 補正後図形の交点と補正前図形の終点
  text: |
    2 つの円弧がつながる経路で、「補正後図形の交点」と「補正前図形の終点」が示されている。補助線は破線の円。

9a4ffdff:
  alt: 5-17-3-13 円弧から直線への例（交点の選び方）
  text: |
    円弧のあとに上向きの直線が続く経路。補正後の経路（破線）と補助線の円（破線）。2 つの矢印が、補正前の終点と補正後の交点を指している。左上に本文の一部「J0;」。

39b7991c:
  alt: 下向きの矢印（エラーの例 → 対策）

4d01a1e6:
  alt: 5-17-3-13 円弧から直線への例（対策後）
  text: |
    円弧のあとに上向きの直線が続く経路で、「補正後図形の交点」と「補正前図形の終点」が示されている。

f8d60047:
  alt: 5-17-4 ピッチエラー補正の区間
  text: |
    横軸「X軸座標」（－ ← 0 → ＋）、縦軸「ピッチエラー」（＋ 0 －）。「基点＝機械原点」を境に、－側に ①区間、②区間、③区間、＋側に ①区間～⑧区間がある。
    曲線は「ピッチエラー計測誤差」。区間の幅は「補正間隔＝１０００００ﾊﾟﾙｽ」。

e1f14672:
  alt: 5-17-4 ピッチエラー補正の設定例
  text: |
    X軸の設定:
    - 補正倍率: 1
    - 補正間隔: 100000
    - 補正データ先頭番号: 0
    - －側補正区間数: 3
    - ＋側補正区間数: 8

    補正データ:
    | No. | 補正値 |
    |---|---|
    | 000 | 3 |
    | 001 | 2 |
    | 002 | 0 |
    | 003 | 0 |
    | 004 | -2 |
    | 005 | -3 |
    | 006 | -4 |
    | 007 | -5 |
    | 008 | -5 |
    | 009 | -6 |
    | 010 | -6 |
    | 011 | （空） |
    | 012 | （空） |
    | … | |
    | 519 | （空） |

    000～002 が －側補正区間数、003～010 が ＋側補正区間数に対応する（矢印）。000～010 は「X軸で使用」、011～519 は「X軸の予備」。

f011b053:
  alt: 5-17-5 形状補正の効果（指令への追従）
  text: |
    「指令」は直角に立ち上がる。「従来の軌跡」（破線）はゆっくり追いつき、「補正有の場合の軌跡」（実線）は指令にすばやく追いつく。

f9743e14:
  alt: 5-17-5 円弧の縮みをなくす
  text: |
    実線の円（指令）の内側に破線の円（実際の軌跡）がある。「この縮みを小さくします。」

9b5e1b29:
  alt: 5-17-5 形状補正なしの軌跡
  text: |
    6 の字に似た複雑な形の経路。指令（実線）と実際の軌跡（破線）がずれている箇所を「指示と実軌跡のずれ」の矢印が指している。

1afc56c3:
  alt: 5-17-5 形状補正ありの軌跡
  text: |
    同じ形の経路で、「指令と実軌跡のずれなし」。

f30832b7:
  alt: 5-17-5 円弧動作での各軸の速度（通常）
  text: |
    「サーボ応答チェック FILE: サンプリング: 8msec」の画面。グラフが 2 つ（上下、各軸）。
    縦軸 [PPS]（99875、49937.5、0、-49937.5、-99875）、横軸 0～5 [sec]（2.5 に目盛り）。
    どちらも正弦波状の速度（円弧動作）で、始めと終わりで速度が急に変わる。

8cf82260:
  alt: 5-17-5 円弧動作での各軸の速度（プリ解加減速）
  text: |
    「サーボ応答チェック FILE: サンプリング: 8msec」の画面。
    - 上のグラフ: 縦軸 [PPS]（100000、50000、0、-50000、-100000）、横軸 0～5 [sec]。正弦波状の速度で、始めと終わりがなめらかに上がり下がりする
    - 下のグラフ: 縦軸 [KPPS]（100、50、0、-50、-100）、横軸 0～5 [sec]。もう一方の軸の速度

5659cc35:
  alt: 5-17-5 モーションアナライザでの真円精度解析の例
  text: |
    「真円度チェック FILE: サンプリング: 8msec」の画面が 3 つ。どれも 3 重の円の目盛りで、X軸の目盛りは外側の円が「+100」、内側の円が「-100」（真ん中の円が 0、理想円）。赤い線が実際の軌跡。

    | 条件 | 補間時定数 | Kp | R | F | 結果 |
    |---|---|---|---|---|---|
    | プリ解加減速無し・形状補正無し | 30ms | 30 | 50000p | 100Kpps | 半径縮小=130p（130μm）。赤い線は内側の円の近くにある |
    | プリ解加減速有り・形状補正無し（補間前加減速(自動コーナオーバーライド)） | 0 | 30 | 50000p | 100Kpps | 半径縮小=70p（70μm） |
    | プリ解加減速有り・形状補正有り | 0 | 30 | 50000p | 100Kpps | 半径縮小=0。赤い線は真ん中の円に重なる |

    1 つめの画面では、X軸の -100 側（左）で、軌跡が外へ飛び出している（開始点付近）。

9dd02faf:
  alt: 5-17-5 加速ステップへの分解
  text: |
    - 【元の指令】: L1(F)、L2(F) の 2 つの直線。X速度・Y速度はそれぞれ Fx1→Fx2、Fy1→Fy2 と階段状に変わる
    - 【L1を加速した例】: L1 を L11、L12、L13 の「加速ステップに分解」する。X速度は Fx11、Fx12、Fx13、Fx2、Y速度は Fy11、Fy12、Fy13、Fy2 と段階的に上がる（「加速区間としてブロックを分解」）

9bea7cd8:
  alt: 5-17-5 CAD/CAM による加減速と加減速なし
  text: |
    - 【CAD/CAMによる加減速】（高精度輪郭制御の精度良好）: 経路を F1、F2、F3、F4 の短いブロックに分け、速度を F1→F2→F3→F4→F と階段状に上げる
    - 【加減速なし】: F1、F2、F3、F4、F がすぐに切り替わる

f0ed0fc9:
  alt: 5-18-1 ティーチング画面
  text: |
    ダイアログ「ティーチング」の「プログラム」欄:
    ```
    1: LIN X40000 Y20000 F40000;
    2: LIN X40000 Y-20000 F40000;   （選択中）
    3: LIN X-40000 Y-20000 F40000;
    4: LIN X-40000 Y20000 F40000;
    5: END;
    ```
    操作: 「ステップ変更 ＋ －」、チェック「サイクル」「シングル」「ティーチング」、ボタン「逆行」「スキップ」「挿入」「置換」「原点シフト」「削除」「実行」「閉じる」、「ティーチング開始ステップ」の欄。

e13630c5:
  alt: 5-18-2 逆行（JOG／インチングで動かしたとき）
  text: |
    ステップn で A から B へ向かう途中、「JOG/ｲﾝﾁﾝｸﾞ」で動かした太い経路と、「ティーチング移動量の戻り」（破線）で A へ戻る経路。

dec8c3cb:
  alt: 5-18-2 逆行
  text: |
    A →（ステップn-1）→ B →（ステップn）→ C。「逆行」で B から A へ戻る。

ad5d75b1:
  alt: 5-18-4 挿入（インクレの場合）
  text: |
    A から A' を経て、ステップn で B、ステップn+1 で C へ。破線は挿入後の経路で、ステップn+1 の行き先が C' になる。

5aca9c71:
  alt: 5-18-4 挿入（D を挿入）
  text: |
    「ステップn-1」で A に着いたあと、「挿入されたステップn」で D へ進み、「ステップn+1」で B' へ進む。もとの経路は「ステップn（もとのn）」で A から「B（元々の目標値）」へ向かう（破線）。

9559c5d5:
  alt: 5-18-5 置換（インクレの場合）
  text: |
    A から「JOG/ｲﾝﾁﾝｸﾞ」で「B'（修正したい位置）」へ動かす。もとの「ステップn」は A から「B 元の目標値」へ、置換後の「ステップn'」は A から B' へ。その後の行き先は C と C' が示されている。

5d18791f:
  alt: 5-18-5 置換（JOG／インチングで B' へ）
  text: |
    A から「ステップn-1」で B へ向かう代わりに、「JOG/ｲﾝﾁﾝｸﾞ」で「B'（修正したい位置）」へ動かす。破線の「ステップn-1'」は A から B' への置換後の経路。
    続く「ステップn」は B から C（元）、または B' から C' へ。「B 元の目標値」。

658a77e7:
  alt: 5-18-7 削除
  text: |
    「ステップn-1」で A に着いたあと、「削除したステップ」（A から B）を飛ばし、「ステップn（元のn+1）」で C' へ進む（インクレの場合）。破線は元の経路（A → B → C）。

c5e257de:
  alt: 5-18-6 原点シフト
  text: |
    A(1000, 2000) から「JOG/ｲﾝﾁﾝｸﾞ」で A' へ動かし、「(1000, 3000) ↓ 座標シフト (1000, 2000)」として座標をシフトする。
    元の「ステップn」は A から B(3000, 4000) を経て C へ（破線）、シフト後は A' から B'(3000, 4000) を経て C' へ（実線）。

b20b155f:
  alt: 5-19-2 補間前加減速の処理の流れ
  text: |
    「加速度判定&補間前加減速(自動コーナオーバライド) 今回追加」→「軌跡発生（直線補間、円弧補間など）」→ X、Y それぞれの「加減速」→「X軸指令」「Y軸指令」。
    右上: 「従来の各軸加減速(例:10msec)」は、軌跡発生のあとの各軸の加減速を指す。

4b3131ce:
  alt: 5-19-3 補間前加減速をしているときの速度変化
  text: |
    「補間1」「補間2」「補間3」の速度の台形。① と ② のつなぎ目で、速度が「最小オーバライド」まで下がる。台形の傾きの幅が「補間前加減速(自動コーナオーバライド)時定数」。

593ea5eb:
  alt: 5-19-5 加速度（速度変化量）の算出
  text: |
    速度ベクトル V1 のあとに V2 が続く。V1 から V2 への変化分が VA（破線の矢印）。本文: 加速度VA ＝ V2 － V1。

14060149:
  alt: 5-19-6 補間前加減速パラメータ画面
  text: |
    ダイアログ「補間前加減速パラメータ」（タスク0）。
    - 「補間前加減速時定数 [0] msec」（0:補間前加減速無効）
    - 「最小オーバライド設定」: 加速度([pls/sec^2]) の範囲「□ ～ □」と、それに対応する「最小オーバライド [%]」の組が 7 行。上が「加速度小」、下が「加速度大」。表示されている値は加速度がすべて 0、最小オーバライドがすべて 100
    - 「※加速度は絶対値を設定して下さい。」
    - ボタン: 「ファイルから読出」「ファイルに保存」「アップロード」「ダウンロード」「編集前に戻す」「閉じる」

0daa8207:
  alt: 5-19-6 加速度と最小オーバライドの関係
  text: |
    棒グラフ。中央の「オーバーライド(%)」が 100% で、左右に離れるほど（加速度が大きいほど）段階的に低くなり、「最小オーバライド」まで下がる。0% の目盛りがある。右上に「補間前加減速(自動コーナオーバライド)時定数」。

a5885a43:
  alt: 5-19-7 動作例（直角に曲がる）
  text: |
    V1（右向き）のあと、円弧を通って V2（上向き）へ曲がる経路。

2dd83ced:
  alt: 5-19-7 動作例の合成速度（最小OVR20%、最小OVR40%）
  text: |
    縦軸「合成速度 [pps]」、横軸「時間」。① の区間の終わりで速度が「最小OVR20%」まで下がり、② の区間の終わりで「最小OVR40%」まで下がって止まる。

3f0c8440:
  alt: 5-19-7 動作例（直線から円弧へ）
  text: |
    V1（右向き）のあと、V2 の方向へ接するように円弧へ入る経路（破線は V2 の方向）。

e20395ef:
  alt: 5-19-7 動作例の合成速度（最小OVR100%、最小OVR40%）
  text: |
    縦軸「合成速度 [pps]」、横軸「時間」。① と ② のつなぎ目では速度が下がらない（「最小OVR100%」）。② の終わりで「最小OVR40%」まで下がって止まる。

0d644285:
  alt: 5-19-7 動作例の合成速度（最小OVR80%、最小OVR40%）
  text: |
    縦軸「合成速度 [pps]」、横軸「時間」。① と ② のつなぎ目で速度が「最小OVR80%」まで下がり、② の終わりで「最小OVR40%」まで下がって止まる。

1a9ee6fd:
  alt: 5-19-8 動作例（斜めに曲がる）
  text: |
    V1（右向き）のあと、斜め上（破線の方向）に向かって円弧で曲がる経路。

092cd93f:
  alt: 5-20 独立位置決めのステータス
  text: |
    「STATUS.ax[].AxStatus：各物理軸(0～15)ステータス情報」の 16 ビット（左が MSB、右が LSB）。
    右から数えたビットのうち 2 つに「独立位置決め中」と「独立位置決め停止中」が割り当てられている（図からは、どのビットかは読み取れない）。

3b6c45e3:
  alt: 5-21-5 手動パルサー・ジョイスティックの信号の流れ（構成）
  text: |
    - 「手動パルサー」→「パルスカウンタ」
    - 「ジョイスティック」→「A/D変換器」
    - どちらも「MECHATROLINK / EtherCAT」を経て、「共有メモリ」と「PLC/C」を通り（破線）、「RTMC64」へ届く

67fa3c86:
  alt: 5-22-1-1 FB ラッチ方式（原点信号あり）
  text: |
    -OT から +OT までのストローク。「開始位置」から ① で進み、DEC信号を検出して ②③ と動き、④ で「機械原点」に止まる。
    - 「DEC信号」は途中の一部だけ ON
    - 「ラッチ信号(C(Z)相、EXT1～3)」はストローク中に一定間隔で何回も出る
    - 最後のラッチ位置から機械原点までが「原点距離」

6e4bbb3a:
  alt: 5-22-1-1 FB ラッチ方式（原点信号あり、+機械端の近く）
  text: |
    「-機械端」から「+機械端」まで。「開始位置」から ① で進み、DEC信号を検出して ②③ と動き、「機械原点」に止まる。DEC信号は +機械端の近くから ON。
    「ラッチ信号(C(Z)相、EXT1～3)」と「原点距離」は前の図と同じ。

10932cc1:
  alt: 5-22-1-2 FB ラッチ方式（原点信号無し）
  text: |
    -OT から +OT まで。「開始位置」から ① で進み、② で「機械原点」に止まる。「ラッチ信号(C(Z)相、EXT1～3)」はストローク中に 1 回だけ出る。ラッチ位置から機械原点までが「原点距離」。

d3dbfb35:
  alt: 5-22-1-3 DEC サーチ方式
  text: |
    -OT から +OT まで。「開始位置」から ① で高速に進み、DEC信号を検出して ②③ で戻り、④⑤ で低速に進んで「機械原点」に止まる。
    DEC信号は途中から ON。DEC信号の切り替わり位置から機械原点までが「原点距離」。

25e64199:
  alt: 5-22-1-3 DEC サーチ方式（+機械端の近く）
  text: |
    「-機械端」から「+機械端」まで。「開始位置」から ① で進み、DEC信号を検出して ②③④ と動き、「機械原点」に止まる。DEC信号は +機械端の近くから ON。

0aa2f43e:
  alt: 5-22-1-4 FB ラッチ方式（OT 信号）
  text: |
    -OT から +OT まで。「開始位置」から ① で +OT まで進み、②③ で戻り、④⑤ と動いて「機械原点」に止まる。
    「ラッチ信号(C(Z)相、EXT1～3)」はストローク中に何回も出る。ラッチ位置から機械原点までが「原点距離」。

117a3722:
  alt: 5-22-1-5 OT サーチ原点復帰
  text: |
    -OT から +OT まで。「開始位置」から ① で +OT まで進み、②③ で戻り、④ で「機械原点」に止まる。+OT から機械原点までが「原点距離」。

f66531e1:
  alt: 5-22-1-7 原点復帰未完で OT に到達した場合（原点信号あり）
  text: |
    「開始位置 Ⓐ」から ① で +OT まで進み、② で -OT 側へ戻り、③ で DEC信号の位置を越えて「機械原点」へ向かう。DEC信号は機械原点の手前で ON。

27002ba1:
  alt: 5-22-1-8 原点復帰未完で OT に到達した場合（原点信号なし）
  text: |
    「開始位置 Ⓐ」から ① で +OT まで進み、② で戻り、③ で再び進んで「機械原点」へ向かう。「ラッチ信号」は途中で 1 回出る。

72974c28:
  alt: 5-22-1-9 ベタドグ（原点信号）
  text: |
    「-方向機械端」から「+方向機械端」まで。「原点(DEC)信号」は途中から +方向機械端まで ON のまま（ベタドグ）。
    開始位置 Ⓐ（DEC信号の手前）と Ⓑ（DEC信号の範囲）のどちらから始めても、「機械原点」へ向かう。

f32c5932:
  alt: 5-22-2 原点復帰逃げ動作
  text: |
    - 中央が「正常領域」、両側が「ソフトOT領域」、両端に「マシンエンド」
    - 「機械原点」の左右に「ソフトOTパラメータ －側」「ソフトOTパラメータ ＋側」
    - 「原点付近（逃げ動作実施範囲）」は、ある位置（⇑）から右の範囲
    - 「逃げ動作」で機械原点より左へ「原点復帰逃げ量」だけ離れてから、「原点復帰」で機械原点へ向かう
    - 機械原点からソフトOTパラメータ ＋側までの距離が「A」

4922f2e0:
  alt: 5-22-4 全軸原点復帰の流れ
  text: |
    1. 全軸原点復帰開始
    2. 「原点復帰順位」毎に各軸原点復帰を繰り返す（ここから「各軸原点復帰」）
       1. 要逃げ動作？ 要 → 原点復帰逃げ動作（※オーバーライド有効）。不要 → 次へ
       2. 原点復帰実行（※オーバーライド無効）
       3. ROMSW設定「原点復帰時論理座標系」: クリアする・座標設定する → 論理座標設定。クリアしない → 次へ
    3. 全軸の繰り返しが終わったら、ROMSW設定「原点復帰時ホーム位置」: 有効 → ホーム位置決め（※オーバーライド有効）。無効 → 次へ
    4. 終了
