# TB00-1045（RTMC64-M3/RTMC64-EC テクノコード変換ライブラリ リファレンスマニュアル）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

0f5be918:
  alt: 3 概要（システム構成）
  text: |
    - **Windows**: 「セッティングPC」「ユーザー専用アプリ」が「メモリ」または「ファイル」のテキスト運転プログラムを「Tコード変換DLL」（太枠）でバイナリーデータに変換する。「Gコード変換DLL」は破線で描かれている（このマニュアルの対象外）。バイナリーデータは「通信DLL」を経て INtime 側へ送る
    - **INtime**: 「RTMC64-M3 または RTMC64-EC」が軸制御・入出力制御を行い、「M/E通信」（MECHATROLINK [M3] ／ EtherCAT [EC]）で「サーボモータ」「入出力ユニット」とつながる。「共有メモリ」を経て「ユーザ制御ソフト(PLC)」とつながる
    - 注記: ※「Tコード」はテクノコード。太枠はテクノ処理

e1e360ee:
  alt: 戻り値のビット構成（エラー発生ステップ番号と発生エラーコード）
  text: |
    16 ビット（D15～D0）。ビットの範囲は図の括弧の位置から求めた。
    - D15～D12: 発生エラーコード
    - D11～D0: エラー発生ステップ番号

f5b37fff:
  alt: 戻り値のビット構成（エラー発生ステップ番号と発生エラーコード）
  text: |
    16 ビット（D15～D0）。D15～D12 が発生エラーコード、D11～D0 がエラー発生ステップ番号（前の図と同じ構成）。

