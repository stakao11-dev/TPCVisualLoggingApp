# TB00-1043 の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
# ビット図のビット番号は LSB=D0 として、画像の画素から引き出し線の位置を検出し、本文の記載と照合した。

00256120:
  alt: 通信ロギングフラグ(fLogging)のビット割り当て
  text: |
    InitCommProc の通信定義構造体 SXDEF のメンバー fLogging のビット割り当て:

    | ビット | 内容 |
    |---|---|
    | D0 | ロギング無効 |
    | D1 | 常時ロギング |
    | D2 | 常時ロギング（初期化/終了のみ） |
    | D3 | 常時ロギング（データ送信のみ） |
    | D4 | 常時ロギング（データ受信のみ） |
    | D5 | 常時ロギング（コマンド要求のみ） |
    | D6 | エラーロギング |
    | D7 | エラーロギング（伝送エラーのみ） |
    | D8 | リトライロギング |

    上位の未定義ビットはすべて0にする。全ビットを0にするとロギング無効になる。

16af372b:
  alt: SendData の付加パラメータ（DAT_PROGRAM）のビット構成
  text: |
    データタイプ DAT_PROGRAM の付加パラメータ prm(32bit):

    | ビット | 内容 |
    |---|---|
    | D0～D15（下位16bit） | プログラム番号（1～32767） |
    | D16～D31（上位16bit） | 先頭ブロック番号（0～63） |

85dbcdac:
  alt: SendData の付加パラメータ（DAT_POINTTABLE）のビット構成
  text: |
    データタイプ DAT_POINTTABLE の付加パラメータ prm(32bit):

    | ビット | 内容 |
    |---|---|
    | D0～D9（10bit） | 書込ポイント数（1～400） |
    | D10～D19（10bit） | 書込開始番号（1～400） |
    | D20～D28（9bit） | 対象軸（軸フラグ） |

bd6efd89:
  alt: ReceiveData の付加パラメータ（DAT_ML_MON）のビット構成
  text: |
    データタイプ DAT_ML_MON の付加パラメータ prm(32bit):

    | ビット | 内容 |
    |---|---|
    | D0～D3 | 軸番号（0～軸数-1） |
    | D15 | 送受信の選択（0: 受信、1: 送信） |

    上記以外のビットは未使用。

5548b25a:
  alt: ReceiveData の付加パラメータ（DAT_POINTTABLE）のビット構成
  text: |
    データタイプ DAT_POINTTABLE の付加パラメータ prm(32bit):

    | ビット | 内容 |
    |---|---|
    | D0～D9（10bit） | 読出ポイント数（1～400） |
    | D10～D19（10bit） | 読出開始番号（1～400） |
    | D20～D28（9bit） | 対象軸（軸フラグ） |
