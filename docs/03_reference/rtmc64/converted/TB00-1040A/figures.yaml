4264d1e3:
  alt: 3-6 ACMst.ini の設定（[A]）
  text: |
    メモ帳で開いた「ACMst.ini」。赤丸と番号で示された箇所:
    - (1) `[MASTER]` の `InstanceNum=1`（矢印で (2) の `[BOARD_1]` を指す）
    - (2) `[BOARD_1]` の `BusCycleTime=1000`
    - (3) `[MASTER]` の `AutoComm=0`

    ファイルの内容（読める範囲）:
    ```
    [MASTER]
    ;; Master Instance Number
    InstanceNum=1
    ;; Automatic communication return
    AutoComm=0
    ;; Automatic communication return t…
    AutoCommTimeout=50000
    ;; Automatic communication return R…
    AutoCommRetry=1

    [BOARD_0]
    ;; Bus cycle time in microseconds
    BusCycleTime=1000
    ;; Master clock multiplier to deter…
    SlaveMultiplier=1
    …
    DcmMaxValidVal=3000

    [BOARD_1]
    BusCycleTime=1000
    SlaveMultiplier=1MaxBusSlaves=256
    CmdTimeout=30
    CmdMaxRetries=5
    MaxQueuedFrames=32
    MaxSlaveCmdPerFrame=32
    MaxSentQueuedFramesPerCyc=2

    DcTimeout=15000
    DcDevLimit=10
    DcSettleTime=1000
    DcTotalBurstLength=10000
    DcBurstBulk=8

    DcmCtlSetVal=500000
    DcmCtlGain=3
    DcmCtlDriftErrorGain=7
    DcmMaxValidVal=3000

    [BOARD_2]
    BusCycleTime=1000
    SlaveMultiplier=1
    ```
    （「SlaveMultiplier=1MaxBusSlaves=256」は画面で 2 行が重なって見えるもの。行末が切れたコメントは「…」とした。）

