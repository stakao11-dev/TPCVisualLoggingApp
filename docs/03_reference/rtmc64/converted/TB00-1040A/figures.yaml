# TB00-1040A（RTMC64 ユーザーズマニュアル Ⅰ 導入編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# - この冊の図の多くは、INtime・Windows・設定ソフトの画面のスクリーンショット。赤丸や番号で示された操作箇所と、
#   読める表示を中心に書いた。縮小されて小さい文字は「（判読できず）」とした。
# - 見出しの [M] は RTMC64-M3、[R] は RTMC64-EC（RSI-ECAT-Master）、[A] は RTMC64-EC（AlgoEtherCAT）の手順。

