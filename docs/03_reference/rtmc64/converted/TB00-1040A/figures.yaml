231c8cef:
  alt: 3 RTMC64-M3/EC のシステム構成
  text: |
    - **FAPC**: 「Windows」の「各種操作 状態モニタ」「PCアプリ」→「通信DLL ※1」。「INtime」の「RTMC64」（軸制御、入出力制御）→「M/E通信 ※2」（MECHATROLINK-Ⅲ [M3] ／ EtherCAT [EC]）→「サーボモータ」「入出力ユニット」。「INtime」の「ユーザ制御ソフト(PLC)」は「共有メモリ」を経て RTMC64 とつながる
    - **別PC**: 「Windows」の「PCアプリ」→「通信DLL」→「イーサネット ◆1.3」で FAPC の RTMC64 へ
    - 凡例: 青枠は「テクノ処理」

5ee34130:
