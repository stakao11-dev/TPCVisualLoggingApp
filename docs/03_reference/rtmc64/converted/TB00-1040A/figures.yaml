  text: |
    「納品書／出荷表　ＲＴＭＣ－Ｍ３用」、出荷日 ２０１４年 □□月 □□日。
    - 受注先: ＡＢＣ商事 株式会社 様
    - ユーザ: ＤＥＦ工業 株式会社 様
    - オーダーNO. ＴＨ００－０８□□□、注番: □□□-□□□、見積書: TB02-□□□□
    - ソフトバージョン: 標準RTMC64-M3 Ｖｅｒｓｉｏｎ１．０．０Ａ
    - 初回オーダー TH00-08□□□、前回オーダー TH00-08□□□、オーダー担当者、出荷担当者（空欄）
    - 製品 内容: ★ボード「RTMC64-M3 [RTMC64M3_00*** ]」○ 数 1、「年間サポート（～　年　月迄） 出荷月から１年間」
    - ソフト オプション 他:
      - セッティングPC（初回のみ）(○)、アプリケーションライブラリ（初回のみ）(○)
      - 加減速: 定時直線型補間加減速、Ｓ字補間加減速（定時直線型補間加減速に加えて）、補間前加減速
      - 同期送り: 同期軸制御(同一指令制御)、手動パルサインターフェース
      - 特殊指令: 高精度ラッチ（Ｇ３１／ＳＬＩＮ）、接線制御、直径指令（旋盤用）、ポイント位置決め
      - 主軸制御: 主軸ＯＮ／ＯＦＦ、インバータ主軸
      - 補正: ピッチエラー補正、工具長補正、工具径補正、高精度輪郭制御(形状補正)
      - 付加機能: ＤＮＣ運転、マルチタスク、マクロ、プログラム逆行動作（PTP/LINのみ）、フレキシブル電子カム

