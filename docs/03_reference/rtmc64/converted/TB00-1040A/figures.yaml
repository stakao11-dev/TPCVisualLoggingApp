  alt: 3-8-1 認証デーモンのアイコン（[A]）
  text: |
    タスクトレイの隠れたアイコン。認証デーモンのアイコン（青）が赤丸で囲まれている。

6d1e6d37:
  alt: 4-1 ROMSW 設定ソフトの画面
  text: |
    ウィンドウ「標準RTMC64-M3 ROMSW設定ソフト ( C:¥RT64M3¥rt64m3drv.ini )」。ファイル名欄と、ボタン: 基本、局設定、手動パルサ ジョイスティック、ファイルから読出、ファイルに保存、アップロード、ダウンロード、オプション、閉じる。

9f26dabb:
  alt: 4-1-3 タスクトレイの INtime アイコン
  text: |
    タスクトレイの隠れたアイコンを表示したところ。INtime のアイコン（黄色）と、通知領域を開く「∧」ボタンが赤丸で囲まれている。

9e782702:
  alt: 4-1-3 INtime のメニュー（Restart NodeA）
  text: |
    INtime のメニューで「Restart NodeA」（選択中）が赤丸で囲まれている。Stop NodeA は灰色。

a0659064:
  alt: 4-2 セッティングPCソフトの運転画面とエラー表示
  text: |
    セッティングPCソフトの運転画面（X、Y、Z、A、B、C、R、Q、T の位置はすべて 0.000）。画面右の欄が丸で囲まれ、その下に別ウィンドウ（エラーの一覧）が表示されている。細部は小さくて判読できず。

ab2d090b:
  alt: 4-2 バックアップの概念図
  text: |
    - 「セッティングPC」「PCアプリ」は「通信ライブラリ」を、「PLC」「C言語ソフト」は「共有メモリ(通信領域)」を経て、【INtime】の「パラメータ」と「運転プログラム」の両方を読み書きする
    - 【INtime】の「パラメータ」と【Windows】の「ファイル(バックアップ) パラメータ」の間: 起動時読み出し（Windows → INtime）、自動バックアップ（INtime → Windows）、新規バックアップ無し
    - 【INtime】の「運転プログラム」と【Windows】の「運転プログラム」の間: 起動時読み出し（Windows → INtime）、自動バックアップ、手動バックアップ（INtime → Windows）、バックアップ無し
    - 【INtime】の「パラメータ」「運転プログラム」→「運転」
    - 注記: バックアップ方式はROMSW設定で選択して下さい。「RTMC64-M3/EC ROMSW設定ソフト」(TB00-1042)<2-1.RTMC64で記憶している情報>を参照下さい。

f986ee23:
  alt: 4-2-2 セッティングPCソフトのメニュー（パラメータ）
  text: |
    ウィンドウ「標準RTMC64-M3 セッティングPCソフト ( C:¥RT64M3¥rt64m3drv.ini )」のメニュー: 運転、パラメータ（丸で囲み）、表示設定、バージョン情報、終了。

e694afb3:
  alt: 4-2-2 バックアップデータ初期化の画面
  text: |
    画面「バックアップデータ初期化」。ボタン: パラメータ初期化、プログラム初期化、全軸アブソポジション初期化、各軸アブソポジション設定（タスク0、X・Y・Z・A の入力欄、「各軸アブソポジション設定」ボタン）、マクロ変数初期化、位置決めポイントテーブル初期化、運転プログラムバックアップ、絶対値エンコーダオフセット（アップロード RTMC64-M3->win、ダウンロード win->RTMC64-M3）、位置決めポイントテーブルバックアップ、閉じる。

ae894c94:
  alt: 4-2-2 サーボパラメータの画面
  text: |
    画面「サーボパラメータ」。タスク0 の 第1軸(X)〜第4軸(A) の列に、INPOS幅、最高速度、補間加減速時定数、S字加減速、PTP時定数、PTP速度、JOG速度、+側ソフトリミット、-側ソフトリミット、原点復帰方向、原点距離、原点復帰速度 などの値が並ぶ。右側にボタン: ファイルから読出、ファイルに保存、アップロード RTMC64-M3->win、ダウンロード win->RTMC64-M3、編集前に戻す、閉じる。
    値は小さくて判読しにくい。

4b733f47:
  alt: 「注意」の吹き出し

1283123d:
  alt: 4-3 通信設定の画面（共有メモリ）
  text: |
    画面「通信設定」。
    - 通信形態: 共有メモリ
    - INtime設定: ノード名 NodeA
    - イーサネット設定（灰色）: IPアドレス 0.0.0.0、設定履歴
    - 通信エラーログ: ログファイル名（空）、チェック: ログ無効、全てロギング、初期化/終了、データ送信、データ受信、コマンド、通信エラー(全て)、通信エラー(伝送)、通信リトライ
    - ログファイルサイズ 5242880 [Byte]、ログファイル数 6 (1-100)
    - ボタン: 設定、閉じる

a39d7a1f:
  alt: 4-3 セッティングPCソフト動作設定の画面
  text: |
    画面「セッティングPCソフト動作設定」。
    - 運転プログラム設定: DNC送信データ長 8192、DNC実行開始データ長 16384、DNC運転プログラムタイプ（テクノコード / Gコード）、起動時編集プログラムタイプ（テクノコード / Gコード）
    - 起動位置: X 0、Y 0、「現在位置取得」ボタン
    - ボタン: 設定、編集前に戻す、閉じる

c080be41:
  alt: 4-3 ポジション表示形式設定の画面
  text: |
    画面「ポジション表示形式設定」。タスク0。第1軸〜第9軸の軸名称（X、Y、Z、A、B、C、R、Q、T）とパルス/表示単位（すべて 1000）。トルク情報 10、円弧処理 RTMC64-M3内部、円弧精度 1、運転プログラム小数点桁数 1000、補間送り速度単位 1 パルス/sec、X-Z円弧平面（XZ平面 / ZX平面）。
    注記: 軸名称を変更しても運転プログラムの軸アドレスは変わりません。(X,Z,Y…R,Q,T のまま) セッティングPC/ROMSW設定ソフトの表示が変わるだけですので御注意下さい。
    ボタン: 設定、編集前に戻す、閉じる。

079b3776:
  alt: 4-3 入出力表示設定の画面
  text: |
    画面「入出力表示設定」。左が入力、右が出力。それぞれ上にショートカット（Rio、+OT、-OT、DEO など / Task0〜Task7）、下に一覧（アドレス、チャンネル、標準信号名、ユーザー信号名。入力は Rio0000〜Rio0015、出力は Rio1856〜Rio1871 など）。ボタン: 設定、編集前に戻す、閉じる。
    細部は小さくて判読しにくい。

bd3c1d3d:
  alt: 4-3 「注意」の吹き出しと注記
  text: |
    「設定」をクリックしないと反映されません。「設定」のクリックによって、INIファイル内の情報が更新されます。

74a89824:
  alt: 5-1 セッティングPCソフトのメニュー（表示設定）
  text: |
    ウィンドウ「標準RTMC64-M3 セッティングPCソフト ( C:¥RT64M3¥rt64m3drv.ini )」のメニュー: 運転、パラメータ、表示設定（丸で囲み）、バージョン情報、終了。

33e28e70:
  alt: 5-1 通信設定の画面（共有メモリ）
  text: |
    画面「通信設定」。通信形態: 共有メモリ、INtime設定のノード名 NodeA、イーサネット設定（灰色、IPアドレス 0.0.0.0）、通信エラーログ（チェックはすべて未選択）、ログファイルサイズ 5242880 [Byte]、ログファイル数 6 (1-100)。ボタン: 設定、閉じる。

9b89fbce:
  alt: 5-1 「注意」の吹き出しと注記
  text: |
    「設定」をしないと反映されません。「設定」によって、INIファイル内の情報が更新されます。

b2d548ba:
  alt: 5-2 イーサネット通信の構成
  text: |
    - FAPC の「RTMC64」に NIC2 と NIC1 がある
    - NIC2 →「イーサネット」→ 別PC の NIC →「セッティングPC」
    - NIC1 →「EtherCAT」→「EtherCAT スレーブ」が数珠つなぎ（…）

2d2d3ee8:
  alt: 5-2-1 タスクトレイの INtime アイコン
  text: |
    タスクトレイの隠れたアイコン。① INtime のアイコン（黄色）が赤丸で囲まれている。

dd80e5e4:
  alt: 5-2-1 INtime のメニュー（INtime Configuration）
  text: |
    INtime のメニューで ② 「INtime Configuration(C)」が赤丸で囲まれている。

5e47af52:
  alt: 5-2-1 INtime Device Manager（NIC を INtime へ移す・IRQなし/MSI）
  text: |
    「ネットワーク アダプター」の下の「Intel(R) PRO/1000 GT Desktop Adapter #3」を右クリックしたメニューで、「INtimeへ移す(IRQなし/MSI)(M)」が赤丸で囲まれている。

0146c9e7:
  alt: 5-2-1 INtime Device Manager（デバイス設定情報の保存）
  text: |
    ツールバーの「!」ボタン（ツールチップ「デバイス設定情報の保存」）が赤丸で囲まれている。

77f53ab6:
  alt: 5-2-1 INtime Device Manager（INtime へのパス完了後）
  text: |
    「INtime devices」→「NodeA」→「ネットワーク アダプター」の下に「INtime Intel(R) PRO/1000 GT Desktop Adapter #3」が表示されている。

c2742a11:
  alt: 5-2-2 タスクトレイの INtime アイコン
  text: |
    タスクトレイの隠れたアイコン。INtime のアイコン（黄色）が赤丸で囲まれている。

66f334f1:
  alt: 5-2-2 INtime のメニュー（INtime Configuration）
  text: |
    INtime のメニューで「INtime Configuration(C)」が赤丸で囲まれている。

96fad67a:
  alt: 5-2-2 INtime Node Management（Network タブ）
  text: |
    「INtime Node Management」画面。① 「Network」タブ、② 設定項目（ホスト名の行と思われる）の値、③ 「NIC 設定」の「ネットワークインターフェース(NIC)リスト」の行の「…」ボタンが赤丸で囲まれている。ほかの項目（Configuration、DNS、ルーティング設定など）の値は小さくて判読できず。

0b4581cf:
  alt: 5-2-2 NIC管理設定（追加）
  text: |
    画面「NIC管理設定」。一覧（Interface、Driver、インスタンス）は空。④ 「追加(A)」ボタンが赤丸で囲まれている。ほかのボタン: 編集(E)、上に移動(U)、下に移動(D)、削除(D)、OK、キャンセル(C)、ヘルプ(H)。

dfb1114c:
  alt: 5-2-2 NICプロパティ（インターフェース種類）
  text: |
    画面「NIC プロパティ - ie1g1」。⑤ インターフェース種類「Intel Gigabit, PCI/PCIe Ethernet (ie1g)」、⑥ インスタンス（値は判読できず）、⑦ 「IPv4 アドレス ネットマスク」の一覧の「追加」ボタンが赤丸で囲まれている。ほかに エイリアス(A)、DHCP有効(E)、割り込み使用（選択）、ポーリング使用、IPv6 アドレス プリフィクス長 の一覧。

e4c27ed7:
  alt: 5-2-2 IPv4 アドレス設定
  text: |
    画面「IPv4 アドレス設定」。⑧ IPv4アドレス 192.168.000.100、⑨ ネットマスク 255.255.255.0、⑩ 「OK」ボタンが赤丸で囲まれている。

2d1f8301:
  alt: 5-2-2 NICプロパティ（IPv4 アドレス追加後）
  text: |
    画面「NIC プロパティ - ie1g1」。インターフェース種類「Intel Gigabit, PCI/PCIe Ethernet (ie1g)」、インスタンス 1、割り込み使用。IPv4 アドレスの一覧に「192.168.0.100 255.255.255.0」。⑪ 「OK」ボタンが赤丸で囲まれている。

80852aa7:
  alt: 5-2-2 NIC管理設定（追加後）
  text: |
    画面「NIC管理設定」。一覧に Interface「ie1g1」、Driver「Intel Gigabit, PCI/PCIe Ethernet」、インスタンス「1」。⑫ 「OK」ボタンが赤丸で囲まれている。

3ebfede7:
  alt: 5-2-2 INtime Node Management（Network 設定の保存）
  text: |
    「INtime Node Management」画面の「Network」タブ。NIC リストの値に「ie1g1」が入っている。⑬ 「保存」ボタンが赤丸で囲まれている。ほかの値は小さくて判読できず。

bd582890:
  alt: 5-2-3 スタートメニューの「設定」
  text: |
    Windows のスタートメニュー（ドキュメント、ピクチャ、設定、電源）で、「設定」が赤丸で囲まれている。

2c4a170a:
  alt: 5-2-3 Windows の設定（ネットワークとインターネット）
  text: |
    Windows の「設定」画面で、「ネットワークとインターネット」（Wi-Fi、機内モード、VPN）が赤丸で囲まれている。ほかに システム、デバイス、電話、個人用設定、アプリ、アカウント、時刻と言語、ゲーム。

9259edd9:
  alt: 5-2-3 ネットワークの状態（アダプターのオプションを変更する）
  text: |
    「設定」の「状態」画面。「ネットワークの詳細設定」の「アダプターのオプションを変更する」が赤丸で囲まれている。

5c2467ac:
  alt: 5-2-3 ネットワーク接続（プロパティ）
  text: |
    「コントロール パネル > ネットワークとインターネット > ネットワーク接続」画面。「イーサネット」アダプターと、右クリックメニューの「プロパティ(R)」が赤丸で囲まれている。

0e4cb548:
  alt: 5-2-3 イーサネットのプロパティ（TCP/IPv4）
  text: |
    「イーサネット 2のプロパティ」画面（接続の方法: ASIX AX88179 USB 3.0 to Gigabit Ethernet Adapter）。項目一覧の「インターネット プロトコル バージョン 4 (TCP/IPv4)」と「プロパティ(R)」ボタンが赤丸で囲まれている。

4618026e:
  alt: 5-2-3 インターネット プロトコル バージョン 4 (TCP/IPv4) のプロパティ
  text: |
    「次の IP アドレスを使う」を選び、IP アドレス 192.168.0.200、サブネット マスク 255.255.255.0（赤丸で囲み）。デフォルト ゲートウェイと DNS サーバーは空。「OK」ボタンが赤丸で囲まれている。

c95d45e4:
  alt: 5-2-4 RT64EC Installer
  text: |
    ダイアログ「RT64EC Installer」。「インストールするフォルダを設定して下さい。」、フォルダ「c:¥Rt64ec」、ボタン: 参照、OK、キャンセル。

4fea705b:
  alt: 5-2-4 セッティングPCソフトのメニュー（表示設定）
  text: |
    ウィンドウ「標準RTMC64-M3 セッティングPCソフト ( C:¥RT64M3¥rt64m3drv.ini )」のメニュー: 運転、パラメータ、表示設定（丸で囲み）、バージョン情報、終了。

2129cbe8:
  alt: 5-2-4 通信設定の画面（イーサネット通信）
  text: |
    画面「通信設定」。
    - 通信形態: イーサネット通信（切り替えの「< >」ボタンが赤丸で囲み）
    - INtime設定（灰色）: ノード名 NodeA
    - イーサネット設定: IPアドレス 192.168.0.100（赤丸で囲み）、設定履歴
    - 通信エラーログ: チェックはすべて未選択、ログファイルサイズ 5242880 [Byte]、ログファイル数 6 (1-100)
    - 「設定」ボタンが赤丸で囲まれている

d4808ab8:
  alt: 「注意」の吹き出し

41857e90:
  alt: 「設定」ボタンの絵

218f9f7f:
  alt: 5-3 セッティングPCソフトのメニュー（運転）
  text: |
    ウィンドウ「標準RTMC64-M3 セッティングPCソフト ( C:¥RT64M3¥rt64m3drv.ini )」のメニュー: 運転（丸で囲み）、パラメータ、表示設定、バージョン情報、終了。

41a2ff61:
  alt: 5-3 正しく動作しているときの運転画面
  text: |
    セッティングPCソフトの運転画面。上部に X、Y、Z、A、B、C、R、Q、T の位置（すべて 0.000）。下部の運転操作パネルに タスク選択（タスク0）、動作モード（自動運転）、プログラム情報（実行モード 自動運転、動作状態 プログラム実行待機、選択プログラム番号、実行ステップ番号）、Mコード、オーバライド（100）、送りモード（JOG、インチングx1000〜x1、手動原点復帰、自動原点復帰）、軸キー（X-/X+ 〜 T-/T+）、ボタン（スタート、ストップ、1ショット位置決め、原点設定、原点復帰、ホーム位置、リセット、閉じる）。

2f1955b2:
  alt: 5-3 通信ライブラリの初期化エラー
  text: |
    ダイアログ「Rt64m3drv」に警告アイコンと「通信ライブラリの初期化エラーです」、OK ボタン。

4e329c84:
  alt: 6 通信デバイスが初期化されていないエラー
  text: |
    ダイアログ「Rt64m3drv」に警告アイコンと「通信デバイスが初期化されていません。」、OK ボタン。

8c2efa9d:
  alt: 注意を促す亀の絵

fc933457:
  alt: 7-1 ROMSW 設定ソフトのアイコン（RTMC64-M3）

febfe94a:
  alt: 7-1 ROMSW 設定ソフトのアイコン（RTMC64-EC）

2cf37e4e:
  alt: 7-2 セッティングPCソフトのアイコン（RTMC64-M3）

41817d7f:
  alt: 7-2 セッティングPCソフトのアイコン（RTMC64-EC）

4c90d5ba:
  alt: 7-3 セッティングPCソフトの運転画面の構成
  text: |
    運転画面の各部の名前: 「メインメニュー」（上部のメニュー）、「位置表示」（X、Y、Z、A の位置）、「操作メニュー」（運転操作パネルのタブ）、「軸キー」（右側の X-/X+ などのボタン）、「操作ボタン」（下部のボタン列）。

b1d7a49b:
  alt: 7-3-2 1ショット位置決めの画面
  text: |
    画面「1ショット位置決め」。
    - 位置決めのモード: インクレPTP（選択）、論理座標系アブソPTP、機械座標系アブソPTP、インクレ直線補間、論理座標系アブソ補間、機械座標系アブソ補間、SPIN(無限回転軸回転動作)、同期軸無視 インクレPTP、同期軸無視 論理アブソPTP、同期軸無視 機械アブソPTP（最後の 3 つは灰色）
    - 移動量/目標位置: X、Y、Z、A（単位 パルス）、ほかの軸は灰色
    - 補間速度: パルス/秒
    - ボタン: 移動開始、移動再開、移動停止、閉じる

c1b8d6a8:
  alt: 注意を促す亀の絵

67ce8405:
  alt: 7-3-4 プログラム管理の画面
  text: |
    画面「プログラム管理」。ファイル名「C:¥RT64M3¥l_PTP.txt」。左にプログラムメモリ使用状況（BLK、TSK、PNO。BLK 0 は TSK 0・PNO 1、BLK 1 は TSK 0・PNO 10、ほかは --）。「タスク0(カレントタスク)」、Tコード（選択）/ Gコード。プログラム:
    ```
    PNO10;
    /****************************/
    /*  L_PTP.TXT              */
    /****************************/
    PTP X40000 Y20000;      /* (0,0)から、(40000,20000)へ
    PTP X40000 Y-20000;     /* (40000,20000)から、(80000…
    PTP X-40000 Y-20000;    /* (80000,0)から、(40000,-20…
    PTP X-40000 Y20000;     /* (40000,-20000)から、(0,0)…
    END;
    ```
    （行末のコメントは画面で切れている。）ボタン: 移動、コピー、削除、ファイルから読出、ファイルに保存、アップロード RTMC64-M3->win、ダウンロード win->RTMC64-M3、閉じる。

