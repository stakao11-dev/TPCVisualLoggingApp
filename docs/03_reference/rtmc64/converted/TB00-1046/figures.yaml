# TB00-1046（RTMC64-M3/RTMC64-EC Gコード変換ライブラリ リファレンスマニュアル）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

463717f1:
  alt: 3 概要（システム構成）
  text: |
    - **Windows**: 「セッティングPC」「ユーザー専用アプリ」が「メモリ」または「ファイル」のテキスト運転プログラムを「Gコード変換DLL」（太枠）でバイナリーデータに変換する。「Tコード変換DLL」は破線で描かれている（このマニュアルの対象外）。バイナリーデータは「通信DLL」を経て INtime 側へ送る
    - **INtime**: 「RTMC64-M3 または RTMC64-EC」が軸制御・入出力制御を行い、「M/E通信」（MECHATROLINK [M3] ／ EtherCAT [EC]）で「サーボモータ」「入出力ユニット」とつながる。「共有メモリ」を経て「ユーザ制御ソフト(PLC)」とつながる
    - 注記: ※「Tコード」はテクノコード。太枠はテクノ処理

68898b33:
  alt: 戻り値のビット構成（エラー発生ステップ番号と発生エラーコード）
  text: |
    16 ビット（D15～D0）。ビットの範囲は図の括弧の位置から求めた（TB00-1045 の同じ図と同じ構成）。
    - D15～D12: 発生エラーコード
    - D11～D0: エラー発生ステップ番号

74bb4ed4:
  alt: 戻り値のビット構成（エラー発生ステップ番号と発生エラーコード）
  text: |
    16 ビット（D15～D0）。D15～D12 が発生エラーコード、D11～D0 がエラー発生ステップ番号。

b919ca4c:
  alt: 戻り値のビット構成（エラー発生ステップ番号と発生エラーコード）
  text: |
    16 ビット（D15～D0）。D15～D12 が発生エラーコード、D11～D0 がエラー発生ステップ番号。

d02e2f21:
  alt: 円弧精度
  text: |
    円弧の両端の点を結ぶ弦と、円弧との最大のずれが円弧精度。中心から両端へ半径の線が引かれている（ラベルは画像の右端で切れて「円弧」までしか写っていない）。
