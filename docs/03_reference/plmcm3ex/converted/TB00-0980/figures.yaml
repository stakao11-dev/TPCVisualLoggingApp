# TB00-0980（PLMC-M3EX ユーザーズマニュアル 目次・用語集）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

265e27fc:
  alt: 座標系と移動指令(アブソ/インクレ)の図
  text: |
    - 「機械原点（原点復帰）」: 機械座標系（アブソ位置）の原点。「原点復帰」の矢印がここを指す
    - 「論理原点（原点設定）」: 論理座標系（指令位置／機械位置）の原点。機械原点から ①b、②b 離れた位置
    - 論理原点から ①a、②a 離れた位置が目標。その手前から「LIN指令」の矢印で ①、② 移動する

    **移動指令**
    - インクレ指令（PTP/LIN）: LIN X① Y②（G91 G01）
    - 論理座標系アブソ指令（PTPA/LINA）: LINA X①a Y②a（G90 G01）
    - 機械座標系アブソ指令（PTPB/LINB）: LINB X①b Y②b

    **位置データ**（座標／表示）
    - 論理座標系: 指令位置、機械位置（FB位置）
    - 機械座標系: アブソ位置
    - ※FB：フィードバック
