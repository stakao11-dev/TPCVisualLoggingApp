# TB00-0982（PLMC-M3Ex ROMSW 設定ソフト ユーザーズマニュアル）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
# 縮小された画面で小さくて読めない箇所は「（判読できず）」とした。

04e9fa64:
  alt: 1-1 PLMC-M3Ex で記憶している情報
  text: |
    - **ファイル(バックアップ)**: 動作プログラム .TXT、P.E補正データ .PIT、サーボパラメータ .PRM、工具長補正データ .TOL、工具径補正データ .TOD、ROMSWファイル .ROM、INIファイル .INI
    - **Windows XP/Vista/7**: 「セッティングPCソフト」（PC通信LIB）と「ROMSW設定ソフト」（どちらも CD で提供）。イーサネットまたは RS232C で PLMC-M3Ex とつながる
    - **PLMC-M3Ex**: 「FLASH(バックアップ) ※2」に ROMSW〈オプション〉、ROMSW〈ユーザ〉、サーボパラメータ、P.E補正データ、工具長/径補正データ、補間前加減速パラメータ、動作プログラム ※1。「上記は、PC側でもファイル管理下さい。」。ほかに Σアブソ位置オフセット
    - Windows → PLMC-M3Ex: 「初期化」「ダウンロード」、PLMC-M3Ex → Windows: 「アップロード」
    - ※1 ROMSWの"運転プログラム保存方法"で保存の有/無選択
    - 下に「記憶の不良」（× の付いた矢印）

d1d38f18:
  alt: 1-2 ROMSW の目的
  text: |
    「PC」の「ROMSW」（設定ソフト）から、「FA-M3R パソコンリンク（イーサネット RS232C）」を経て「PLMC-M3Ex」の「ROMSW設定」を「フラッシュメモリ」に書き込む。

fec024e1:
  alt: CD の絵

78fcc60f:
  alt: 「注意！」の絵

19d2b6e7:
  alt: 3 メインメニュー
  text: |
    ウィンドウ「標準PLMC-M3Ex ROMSW設定ソフト（C:¥PLMC-M3¥plm3exdrv.ini）」。タイトルに、使っている ini ファイルのパスが表示される。
    「ファイル名」の欄、ボタン: 基本、入力、出力、軸設定、手動パルサー、ファイル読出、ファイル保存、アップロード、ダウンロード、ｵﾌﾟｼｮﾝ、閉じる。

d21b1716:
  alt: 4-1 基本パラメータ画面
  text: |
    「基本」画面。サーボ制御周期(msec) 2.0、サーボ制御周期ワーニングレベル(%) 87.50（※ 0の時は87.50%）、MECHATROLINK通信設定（C2マスタ有効、サブコマンド有効（伝送バイト数48バイト）、仮想アンプ（全局共通）、通信異常許容回数、最大リトライ回数）、ユーザーフリーオプション、機械パネル:コード仕様、主軸機能選択、バックアップ方法、巻線命令設定、エラー発生/リセット時の軸停止方法選択、自動原点復帰ディレイ(msec) 2048、サーボ主電源OFF無視時間(msec) 2048、工具径補正 角度一致閾値 3000 [1/1000pls]。ボタン: 設定、編集前に戻す、閉じる。
    ほかの細部の値は小さくて判読できず。

d37f4490:
  alt: チェックボックスの絵（チェックあり）

54ceaa39:
  alt: チェックボックスの絵（チェックあり）

1cab73f9:
  alt: チェックボックスの絵（チェックあり、2 つ）

85389fc8:
  alt: 4-1-10 工具径補正角度一致閾値
  text: |
    2 本の直線のなす角 θ と「円弧半径」。開きの大きさが「角度一致閾値(pls)（判定は円弧の長さ）」。

b3f145e7:
  alt: 4-1-12 サーボ ON 動作（状態遷移の表）
  text: |
    見出しは「サーボON許可/不許可状態遷移」。

    | トリガー | サーボOFFにするエラー発生中 | サーボOFFにするエラー未発生 |
    |---|---|---|
    | リセット入力ON、リセットコマンド、ONSW(オンスイッチ)入力 ON ※1 | （斜線） | サーボON許可（サーボOFFエラー解除） |
    | 全軸サーボONコマンド | （斜線） | （上の行と同じ欄） |
    | サーボOFFにするエラー発生 ※2、全軸サーボOFFコマンド、ONSW(オンスイッチ)入力 OFF | サーボON不許可（サーボOFFエラー） | サーボON不許可（サーボOFFエラー） |

50f8350d:
  alt: 4-2 入力信号の設定画面
  text: |
    「入力論理」画面。矢印の説明:
    - 「入力信号アドレス」（左の列）
    - 「入力ピンに割り当てる入力信号はこの信号名で選択します。」（標準信号名の欄）
    - 「この信号名はユーザーが自由に変更できます。（セッティングPCソフトから変更可能）」（ユーザー信号名の欄）
    - 「A接又はB接を選択」（右の列）
    表示されている信号の例: COMREQ0、COMREQ1、NC、NC、EMS、ONSW、MOK、MFIN、T0REWND、Ri49～Ri55 など。細部は小さくて判読できず。

a07a90e9:
  alt: 4-3 出力信号の設定画面
  text: |
    「出力論理」画面。矢印の説明:
    - 「出力信号アドレス」（左の列）
    - 「出力ピンに割り当てる出力信号はこの信号名で選択します。」（標準信号名の欄）
    - 「この信号名はユーザーが自由に変更できます。（セッティングPCソフトから変更可能）」（ユーザー信号名の欄）
    - 「ONアクティブ又はOFFアクティブを選択」（右の列）
    表示されている信号の例: COMACK0、COMACK1、NC、NC、SVM、SOUT0、SOUT1、MSTRB、M0～M7。細部は小さくて判読できず。

d484fec9:
  alt: 4-4 軸設定パラメータ画面
  text: |
    「軸設定」画面。(1) 有効物理軸選択（第1軸～第16軸のチェック。楕円で囲まれている）、(2) 物理軸の選択（物理軸 第1軸）、(3) 各軸設定（局アドレス、拡張アドレス、軸割り当て（タスク0 論理軸 第1軸(X)）、メカ機構1回転パルス数、マルチターンリミット、絶対値エンコーダ、ソフトリミット、電子ギヤ、原点復帰方式（FBラッチ+原点信号検出）、原点復帰ラッチ信号（C相ラッチ）、同期制御軸、接線制御軸、工具径補正 径/横選択など）。ボタン: 設定、編集前に戻す、閉じる。
    値は小さくて判読できず。

bacda7e1:
  alt: 4-5 手動送り設定（手動パルサ／ハンドル）画面
  text: |
    「手動送り/ハンドル」画面。
    - 手パ使用数 1、「軸選択設定」ボタン
    - ハンドル: FB入力極性 標準（ハンドル1）
    - ジョイスティック: A/D入力極性 標準、A/D入力最小値 -20000、A/D入力最大値 20000、A/D入力不感帯 4000（ジョイスティック1）
    - 軸動作: タスク0 第1論理軸(X)～第4論理軸(A)、第5物理軸～第16物理軸のそれぞれの最大送り速度 1000、加減速時定数 30
    - ボタン: 設定、編集前に戻す、閉じる

5622612f:
  alt: 4-5 ジョイスティックの電圧と速度の関係
  text: |
    横軸「入力電圧」、縦軸「指令速度」。「A/D最小電圧」以下では「－最大速度」、「A/D最大電圧」以上では「＋最大速度」。中央の「0速」の区間が「不感帯」。「ジョイスティック有効立ち上がり時A/Dの電圧」が中央。

b8a5a12d:
  alt: 4-5-1 手パ軸選択設定画面
  text: |
    「手パ軸選択設定」画面（タスク0）。軸選択設定 0～15 の種別と動作軸1・動作軸2:

    | 番号 | 種別 | 動作軸1 | 動作軸2 |
    |---|---|---|---|
    | 0 | 無効 | （灰色） | （灰色） |
    | 1 | 手パ | 第1論理軸(X) | 第1論理軸(X) |
    | 2 | 手パ | 第2論理軸(Y) | 第2論理軸(Y) |
    | 3 | 手パ | 第3論理軸(Z) | 第3論理軸(Z) |
    | 4 | 手パ | 第4論理軸(A) | 第4論理軸(A) |
    | 5 | 手パ | 第5論理軸(B) | 第5論理軸(B) |
    | 6 | 手パ | 第6論理軸(C) | 第6論理軸(C) |
    | 7 | 手パ | 第7論理軸(R) | 第7論理軸(R) |
    | 8 | 手パ | 第8論理軸(Q) | 第8論理軸(Q) |
    | 9 | 手パ | 第9論理軸(T) | 第9論理軸(T) |
    | 10 | Joystick | 第1論理軸(X) | 第1論理軸(X) |
    | 11 | Joystick | 第2論理軸(Y) | 第2論理軸(Y) |
    | 12 | Joystick | 第3論理軸(Z) | 第3論理軸(Z) |
    | 13 | Joystick | 第4論理軸(A) | 第4論理軸(A) |
    | 14 | Joystick | 第5論理軸(B) | 第5論理軸(B) |
    | 15 | 無効 | （灰色） | （灰色） |

    動作軸の表示は小さくて読みにくく、自信がない。ボタン: 設定、編集前に戻す、閉じる。

81d11d6f:
  alt: 4-6 オプション画面
  text: |
    「オプション」画面。オプションのチェック欄（灰色で表示のみ）: 補間ブロックつなぎ処理、パネルによるティーチング操作、プログラム逆行操作（PTP/LIN）、ポイント位置決め機能、手パ/ジョイスティック、DNC運転、ピッチエラー補正、高精度輪郭制御（形状補正）、同期制御（同一指令2軸制御）、工具長補正、摩耗補正、トルク指令、定時直線型補間加減速、S字補間加減速（定時直線型補間加減速に加えて）、マルチタスク、接線制御、直径指令、高精度ラッチ（センサーラッチ:G31/SLIN）、マクロ機能、フレキシブル電子カム、工具径補正、補間前加減速、巻線、最大軸数 16、主軸 ON/OFF（信号出力）。
    「シリアルナンバー PLM3 - 00000」。ボタン: ファイル読出、ファイル保存（灰色）、アップロード、ダウンロード（灰色）、ROMSWデータに反映（灰色）、閉じる。
    どれにチェックが入っているかは小さくて判読できず。
