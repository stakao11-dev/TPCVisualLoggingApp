# TB00-0980H（PLMC-M3EX ユーザーズマニュアル Ⅳ 試運転・調整編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# - 7-9 の原点復帰の図の a・b・c・S・A は、7-9 の冒頭の本文にある凡例（原点復帰の各速度、原点距離、
#   原点信号とC(Z)相間の距離）を指す。図には記号だけが書かれている。

83f25e65:
  alt: 2 試運転・調整までの作業フロー(概略)
  text: |
    (PLMC-M3EXの購入) から (実稼働) までの流れ:
    1. PLMC-M3EX 関連マニュアルの一通りのチェック — ■ PLMC-M3EX ユーザーズマニュアル、■ セッティングPCマニュアル、■ ROMSW設定ソフトマニュアル、■ FA-M3□ サンプルラダープログラム説明書、■ サンプル運転プログラム
    2. 初期導入作業、操作の練習〈導入編〉2.初期導入作業、7.ダミー運転 操作に慣れてください、8.モータ単体運転の準備、9.モータ単体運転 — PC関連準備やとりあえずの練習。
    3. ROMSWの設定(ROMSW設定ソフトマニュアル) — 使用するサーボアンプや周辺接続に応じた設定 入/出力論理。あわせて「Σサーボのパラメータ設定 (Σ-Win)」と「周辺設計(ユーザ殿) 周辺回路 制御盤、強電回路 ラダー設計、アンプ～モータ/PG接続、メカ制作」
    4. 操作の練習（基本操作に慣れる）
    5. モータ単体 試運転（ユーザーズマニュアル 試運転・調整編） — メカ駆動させずに、モータの回転のみによるテストと調整(仮調整)。安川電機Σ-Winソフト。セッティングPC操作の習熟
    6. メカ組み合わせ試運転（ユーザーズマニュアル 試運転・調整編） — メカ駆動を含めたサーボ調整。安川電機Σ-Winソフト。チューニング動作
    7. FA-M3□ラダー設計 サンプルラダー参考 — 実稼働のためのいろいろな準備
    8. FA-M3□との連動 実動作確認

7a3a59b2:
  alt: 4 サーボパラメータの画面
  text: |
    画面「サーボパラメータ」。タスク0 の 第1軸(X)～第4軸(A) の列に、INPOS量、偏差上限値、MPOS偏差上限値、補間加減速時定数、S字加減速時定数、PTP時定数、PTP速度、JOG速度、+側ソフトリミット、−側ソフトリミット、原点復帰方向、原点距離、原点復帰逃げ量、原点復帰早送り速度、原点復帰アプローチ速度、原点復帰最終サーチ速度、原点復帰順位、ホームポジション距離、ホームポジション順位、バックラッシュ補正量 などの値が並ぶ。ボタン: ファイルから読出、ファイルに保存、アップロード、ダウンロード、編集前に戻す、閉じる。
    値は小さくて判読しにくい。

f2510930:
  alt: 4-1 PTP時定数の計算式
  text: |
    PTP時定数[msec] ＝ 加速時間[msec] × 100000[pps] ／ PTP速度[pps]

1b730ee5:
  alt: 4-1 PTP時定数と加速時間（PTP速度が100Kpps以上の場合）
  text: |
    指令速度の台形。PTP速度まで上がる時間が「加速時間[msec]」、100Kpps に達するまでの時間が「PTP時定数[msec]」。注記: 100Kpps以下でもPTP時定数の計算式は同じ。

a47017d6:
  alt: 4-1 PTP時定数と加速時間（PTP速度に達するまでの時間）
  text: |
    指令速度の台形。PTP速度に達するまでの時間が「PTP時定数[msec] ＝ 加速時間[msec]」。

9d86dc97:
  alt: 4-1 指数形補間加減速
  text: |
    指令速度へ向かって指数関数的に立ち上がる曲線。指令速度の 63% に達するまでの時間（原点での接線（点線）が指令速度と交わるまでの時間）が補間時定数。

2fd50325:
  alt: 4-1 直線形補間加減速
  text: |
    LIN命令が 3 つ続くときの速度の変化。各 LIN命令の速度変化（加速・減速）が、それぞれ一定の時間（「直線形補間時定数」、下の矢印）の直線で行われる。

b4e79cda:
  alt: 4-2 ストロークリミットの領域
  text: |
    - 左から: ハードOT領域（マシンエンド）、ソフトOT領域、正常領域、ソフトOT領域、ハードOT領域（マシンエンド）
    - 正常領域の両端が「ソフトOTパラメータ +側」と「ソフトOTパラメータ −側」。その間に機械原点
    - ソフトOT領域: ソフトウェアにて停止。SVM ON（サーボ主電源オン）、SV ON（サーボオン）
    - ハードOT領域: ソフトウェアにて、SVM OFF、SV OFF（ブレーキ動作）
    - 復旧: OT無視モードにて SVM ON、SV ON（ブレーキ解除）

e240f0dc:
  alt: 「参考」の見出しの絵

757d2eea:
  alt: 4-4 全軸原点復帰の逃げ動作（速度）
  text: |
    横軸 時間、縦軸 速度。原点付近に軸がある場合、まず逆方向へ移動し（斜線部の面積 ＝ 原点位置 ＋ 逃げ量 － 現在位置）、その後 a) または b) の速度で原点方向へ進んで原点に止まる。

b89ceddc:
  alt: 4-4 全軸原点復帰の逃げ動作（領域）
  text: |
    4-2 の領域の図（マシンエンド、ソフトOT領域、正常領域、ソフトOTパラメータ +側／−側、機械原点）に、「逃げ動作」「原点復帰」の矢印と、「原点復帰逃げ量」「A」の範囲を書き加えたもの。

b1e51b31:
  alt: 5-4 セッティングPCソフトの練習（運転画面）
  text: |
    セッティングPCソフトの運転画面。各部の名前: 「ポジション表示」（X、Y、Z、A、B、C、R、Q、T の位置、すべて 0.000）、「操作メニュー」、「運転操作画面」。
    練習内容:
    - 各画面の切り換え
    - ポジション表示の切り換え: 指令位置(論理系の座標)、アブソ位置(機械系の座標)
    - エラー情報の確認: サーボアラーム、±OT など、発生しているアラーム原因をチェック

793d5c60:
  alt: 5-4 入出力状態の画面
  text: |
    画面「入出力状態」。左が入力（入力CH、ピンNo.、標準信号名、ユーザー信号名）、右が出力（出力CH、ピンNo.、標準信号名、ユーザー信号名）。
    - 入力は I000 D00～D15。標準信号名 COMRED0、COMRED1、NC、NC、EMS、MOPT、VCAMSON、RWNDSW、MFIN、MOK、RSTSW、STOPSW、ZSETSW、ZRTNSW、STARTSW、ONSW（ピンNo. は M3-Ys33～M3-Ys48）。COMRED1 が緑（ON）
    - 出力は O000 D00～D15。標準信号名 COMACK0、COMACK1、NC、NC、MZSTP、PAUSE、PRDY、INPOS、ALARM、RUN、READY、SVM、NC、NC、NC、NC（ピンNo. は M3-Xs01～M3-Xs16）。PRDY、INPOS、READY が緑（ON）
    - 各行の左に強制入出力のチェックボックス。ボタン: 前、次、閉じる

5355ac19:
  alt: 5-5 PLMC-M3EXのバックアップ情報
  text: |
    - 「ファイル(バックアップ)」: 動作プログラム .TXT、P.E補正データ .PIT、サーボパラメータ .PRM、工具長補正データ .TOL は「セッティングPCソフト（PC通信LIB）」と読み書き。ROMSWファイル .ROM、INIファイル .INI は「ROMSW設定ソフト」と読み書き（セッティングPCソフトからは点線の矢印）
    - 「PC-AT (Win-XP/VISTA/7)」のセッティングPCソフト・ROMSW設定ソフトは、それぞれ CD から入れる
    - 「パソコンリンク」（RS232C）で「PLMC-M3EX」の「フラッシュメモリ(バックアップ)」へ 初期化、ダウンロード。フラッシュメモリから アップロード
    - フラッシュメモリの中身: ROMSW〈オプション〉、ROMSW〈ユーザ〉、サーボパラメータ、P.E補正データ、工具長補正データ、運転プログラム。● は「PC側でファイル管理すべき情報」

13c8147b:
  alt: 6-2 制御系の良さ
  text: |
    制御系の良さ ＝ 軌跡指令どおりに正確にメカが動く。その要素:
    - 応答性: 指令の変化に高速に追従
    - 精度: 指令どうりの速度、位置
    - 安定性: 外力などの影響を受けない

92aa7a11:
  alt: 6-3 サーボ系の3重ループ
  text: |
    「モーションコントローラ」の速度パターン（1～16軸）→「サーボパック」の 偏差カウンタ → Kp →（速度制御部 Kv Ti）→ 電流制御部 → 電力変換部 → モータ（M）。エンコーダ（PG）からのフィードバックで、内側から 電流ループ、速度ループ、位置ループの 3 重ループになる。点線の枠は「位置制御の場合」と「速度制御の場合」の範囲。

711042bd:
  alt: 6-4 PLMC-M3EXとサーボ系の関係
  text: |
    「PLMC-M3EX 軌跡発生」→「メカトロリンク」→「メカトロリンク型サーボアンプ」（位置制御 → 速度制御 → 電流制御）→ モータ（M）、PG。

240cb778:
  alt: 7 制御盤/モータ単体試運転の流れ
  text: |
    | 詳細説明の項目 | 作業 | 内容 |
    |---|---|---|
    | 7-1. | 配線チェック | 特に強電関係の配線を充分にチェックします。 |
    | 7-2. | 制御電源投入 | サーボ主電源以外の電源投入をおこないます。AC・DC各部の電圧をテスターチェックします。 |
    | 7-3. | WideField□接続 | WideField□(FA-M3□ツールソフト)を使って、FA-M3□の通信設定をします。PCとFA-M3□をイーサネット/RS232Cで接続。 |
    | 7-4. | セッティングPC接続 | セッティングPCを接続してモニタします。NC部(PLMC-M3EX)が正常動作していることを確認します。 |
    | 7-5. | PLMC-M3EX パラメータ設定（■サーボパラメータ ■ROMSW再チェック） | 初期段階でのパラメータをセットします。(仮設定) ROMSW設定も未完であれば、更新して完成させます。 |
    | 7-6. | 入力信号&ラダー動作確認 | 非常停止、各軸OT、その他入力信号の動作、及び入出力信号をPLMCへ渡すラダー動作の確認を行います。FA-M3□の入力:WideField□のデバイスモニタで確認。Σサーボの入力:安川電機Σ-Winソフトで確認 |
    | 7-7. | サーボアンプパラメータ(設定) | サーボアンプのパラメータの設定をおこないます。 |
    | 7-8. | サーボ主電源投入 | サーボを動作させます。手動運転の確認をします。(ゲインの仮調整) |
    | 7-9. | 原点復帰 | 原点復帰動作を確認します。 |
    | 7-11 | メモリー運転 | シングルステップ動作と連続運転をおこないます。 |
    | 7-12 | サーボ系の調整 | 実機用の位置ループゲインや加減速パラメータを設定します。最終的にはメカを駆動する状態で調整します。 |
    | 7-13 | パラメータの保存 | 設定したサーボパラメータをファイルに保存します。 |

    最後に「完了」。

61452d2f:
  alt: 7 メカ組み合わせ試運転の流れ
  text: |
    詳細説明の項目の順: 7-2. 制御電源投入 → 7-3. WideField□接続 → 7-4. セッティングPC接続 → 7-5. PLMC-M3EX パラメータ設定（確認）→ 7-6. 入力信号&ラダー動作確認 → 7-8. サーボ主電源投入 → 7-9. 原点復帰 → 7-10. ソフトリミットの確認 → 7-11. メモリー運転 → 7-12 サーボ系の調整 → 7-14 精度チェック → 7-13 パラメータの保存 → 完了

f9182a6c:
  alt: 7-5 サーボパラメータの画面
  text: |
    4 章と同じ「サーボパラメータ」画面（タスク0 の第1軸～第4軸）。値は小さくて判読しにくい。

d6ba2e76:
  alt: 7-6-4 入出力状態の画面
  text: |
    5-4 と同じ「入出力状態」画面。入力 COMRED1、出力 PRDY、INPOS、READY が緑（ON）。

d39c78cd:
  alt: 「注意」の吹き出し

78f07fea:
  alt: 7-7 サーボアンプのパラメータ設定の流れ
  text: |
    「サーボの電源を入れます」→「PCや設定器でパラメータ設定」→「可能であれば、パラメータをバックアップ(PCファイル)」→「仮設定完了(調整は別途)」

ab1c02ba:
  alt: 7-9-1 FBラッチ方式(原点信号あり) ±2段原点復帰の速度と原点信号・ラッチ信号
  text: |
    速度 a で進み、原点信号(DEC)が ON で速度 b に減速し、原点信号の変化から距離 A の後のラッチ信号（C(Z)相、EXT1～3）をラッチして、原点距離 S の位置で止まる。

55c2d939:
  alt: 7-9-2 FBラッチ方式(原点信号あり) ±1段原点復帰の速度と原点信号・ラッチ信号
  text: |
    速度 a で進み（原点信号の状態により逆方向へ速度 a で戻る場合を点線で示す）、原点信号の変化から距離 A の後のラッチ信号（C(Z)相、EXT1～3）をラッチして、原点距離 S の位置で止まる。

3360268e:
  alt: 7-9-3 FBラッチ方式(原点信号なし)の速度とラッチ信号
  text: |
    速度 a で進み、ラッチ信号（C(Z)相、EXT1～3）の位置をラッチし、そこから原点距離 S の位置で止まる（減速しながら移動）。

cd317701:
  alt: 7-9-4 DECサーチ方式 ±2段原点復帰の速度と原点信号
  text: |
    速度 a で進み、原点信号(DEC)が ON になると減速して速度 b で逆方向に戻り、原点信号が OFF になると速度 c で再び原点方向へ進み、原点信号の変化で止まったあと、原点距離 S だけ移動する。

80cc0982:
  alt: 7-9-5 DECサーチ方式 ±1段原点復帰の速度と原点信号
  text: |
    速度 a で進み（原点信号の状態により逆方向へ速度 a で戻る場合を点線で示す）、原点信号の変化から速度 b・c でサーチし、原点距離 S だけ移動する。

49c5b797:
  alt: 7-9-6 FBラッチ(OT信号)の速度と OT信号・ラッチ信号
  text: |
    速度 a で進み、OT信号が ON で逆方向へ速度 b で戻り、OT信号 OFF の後のラッチ信号（C(Z)相、EXT1～3）をラッチし、原点距離 S だけ移動する（S は逆方向で、速度 a まで下がる）。

9705ce94:
  alt: 7-9-7 OTサーチ原点復帰の速度と OT信号
  text: |
    速度 a で進み、OT信号が ON になると止まって逆方向へ速度 c で戻り、OT信号が OFF になったあと原点距離 S だけ移動する（S は逆方向で、速度 a まで下がる）。

25ce76ee:
  alt: 7-9-8 原点復帰未完でOTに到達した場合（DEC信号）
  text: |
    -OT と +OT の間。開始位置 Ⓐ から ① +OT まで進み、② 逆方向へ戻って DEC信号を通り過ぎ、③ 再び原点方向へ進んで DEC信号の位置で機械原点を決める。

7c9f29da:
  alt: 7-9-9 原点復帰未完でOTに到達した場合（ラッチ信号）
  text: |
    開始位置 Ⓐ から ① +OT まで進み、② 逆方向へ戻ってラッチ信号を通り過ぎ、③ 再び原点方向へ進んでラッチ信号を確認し、機械原点を決める。

5dbb9a02:
  alt: 7-9-10 1段原点復帰でベタドグの場合
  text: |
    -OT と +OT の間。原点(DEC)信号は機械原点の手前から +OT 側まで ON のまま（ベタドグ）。開始位置 Ⓐ（原点信号 ON の側）からは一度戻ってから原点へ、開始位置 Ⓑ（原点信号 OFF の側）からはそのまま原点へ進み、機械原点に止まる。

67e6b9ec:
  alt: 7-10 ソフトリミットの設定
  text: |
    4-2 の領域の図（マシンエンド、ハードOT領域、ソフトOT領域、正常領域、機械原点、ソフトOTパラメータ +側／−側）。左のマシンエンドからソフトOTパラメータ +側までが A、ソフトOTパラメータ −側から右のマシンエンドまでが B。

20201d75:
  alt: 7-11 メモリー運転の概略手順
  text: |
    プログラム作成(編集) → ローディング → 自動運転モード シングルステップ → スタート信号（1ステップ動作）→ 停止位置や出力信号の確認 → プログラム完了?（N ならスタート信号へ戻る）→ Y: シングルステップ解除 → スタート信号（連続動作）→ 運転完了
