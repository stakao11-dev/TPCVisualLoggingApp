# TB00-0980D（PLMC-M3Ex ユーザーズマニュアル 機能編 1～2 章）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
# 縮小された図で小さくて読めない箇所は「（判読できず）」とした。

10a69c63:
  alt: 1-1 FA-M3R のラダー制御による運転
  text: |
    「FA-M3□」の【ラダー制御】と「PLMC-M3EX」の【モーション制御】の対応:
    - 操作 → 自動・手動各種操作
    - 動作コマンド → 移動・入出力など
    - ステータス読出 ← 位置、内部情報
    - ダイナミックデータローディング ⇄ 運転プログラムなど（保存）
    PLMC-M3EX の外側: サーボ制御 MECHATROLINK-Ⅲ、入力 M3I/Oモジュール経由、出力 M3I/Oモジュール経由、外部PG M3カウンタ経由。

5d1e816d:
  alt: 1-1-2 入出力による運転（簡単操作）
  text: |
    左の「FA-M3□」の出力（SRY02D02、SRY14D02、Ysss38、Ysss37、Ysss40）が、I/Oオープン接続（破線）で「PLMC-M3EX」の入力 T0START、T3START、ONSW、EMS、MFIN につながる。
    PLMC-M3EX の出力 T0READY、T3RUN、MSTRB、M0、M1 が、I/Oオープン接続で右の「FA-M3□」の入力 SRX2D00、SRX5D02、Xsss08、Xsss09、Xsss10 につながる。
    凡例: 破線の箱「I/Oオープン接続」。

38846ff8:
  alt: 1-1-4 FA-M3□ ライン制御
  text: |
    1 台の「FA-M3□」から「I/Oオープン」で、「PLMC-M3EX NO.1 搬送」「PLMC-M3EX NO.2 組立」「PLMC-M3EX NO.3 加工」の 3 台を制御する。

8e84f6d1:
  alt: 1-2 PC からの運転・操作（パソコンリンク経由）
  text: |
    「日常運転・保守 DLLなど」（CD）の PC から、「パソコンリンク（・イーサネット ・RS232）」で「FA-M3□」につながり、FA-M3□ の中の「PLMC-M3EX」から「サーボ制御 MECHATROLINK-Ⅲ」へ。

76e5c9b6:
  alt: 1-2-1 セッティング PC ソフトによる運転
  text: |
    「画面例」: PC から「パソコンリンク（・イーサネット ・RS232）」で FA-M3□ の PLMC-M3EX につながり、「サーボ制御 MECHATROLINK-Ⅲ」へ。

61504540:
  alt: 1-2-2 専用 PC アプリケーションによる運転
  text: |
    - 左の用途: ■CAD/CAM、■生産管理、■オリジナルNC、■人工知能/データベース
    - Windows の「ユーザアプリケーションソフト（・オリジナルソフト ・市販ソフトウェア）」が「関数コール」で「アプリケーションライブラリー DLL（テクノ）」を呼ぶ
    - ライブラリから【RS232C】【イーサネット】の「パソコンリンク」（破線）を経て「PLMC-M3EX」の「テクノMC ※ PLMCシリーズ（テクノ）」へ。やりとりは「データ送信」「動作指示」と「データ受信」
    - PLMC から「サーボ制御 MECHATROLINK-Ⅲ」へ
    - 「※ MCはモーションコントローラの略記です」

020c06e8:
  alt: 2-1-5 機械操作パネル入力（T□MP_AXSEL0～7、T□MP_PSEL）
  text: |
    - T□MP_AXSEL0～7（軸動作）: 軸移動の立ち上がりエッジで動作開始（ジョグ、各軸手動、原点復帰、インチング）。JOG、原点復帰は立ち下がり検出で移動停止
      - 【Bit仕様】+X～-A: 各軸移動。ビット 7～0 が -A、+A、-Z、+Z、-Y、+Y、-X、+X ※1
      - 【Code仕様】*SEL5～*SEL0 の組み合わせで「-方向移動」「+方向移動」と軸選択（第1軸～第9軸）。表の「*」は「T□MP_AX」の省略です
    - T□MP_PSEL 0～15（プログラム選択）: 【Code仕様】全入力OFF:選択無し、その他:バイナリーコードでタスク毎にP番号指定
    表の細部は小さくて判読できない箇所がある。

d262c2a8:
  alt: 2-2 出力信号の名称と機能（T□MODE0～T□MODE2、SOUT0/1）
  text: |
    - 上の欄（条件の続き）: ・軸移動中でない ・プログラム実行待機状態（プログラム運転中でない） ・各種シーケンス完了 ・手動パルサ無効 ・自動モードで選択中プログラムが有効、もしくはDNCモード
    - T□MODE0～T□MODE2（モード出力）: 【説明】PLMC-M3EXの動作モードを出力します。【動作条件】の表:

    | 動作モード | MODE2 | MODE1 | MODE0 |
    |---|---|---|---|
    | セッティングモード | 0 | 0 | 0 |
    | 手動モード | 0 | 0 | 1 |
    | 自動モード | 0 | 1 | 0 |
    | OT無視モード | 0 | 1 | 1 |
    | DNC運転モード | 1 | 0 | 0 |

    （0:OFF、1:ON）
    - SOUT0/1（主軸出力）: 信号出力主軸（オプション）時に主軸へ回転指令を指示する出力です。詳細は「5-16. 主軸機能」を参照下さい。

2189041f:
  alt: 2-4 標準入出力の割り当て（入力論理画面）
  text: |
    「入力論理」画面。入力チャンネル、ピン番号、標準信号名、ユーザー信号名、A接点/B接点。表示されている例: I#00 D00 COMREQ0、D01 COMREQ1、D02 NC、D03 NC、D04 EMS、D05 ONSW、D06 MOK、D07 MFIN、D08～D15 Ri48～Ri55（すべて A接点）。ボタン: 前、次、設定、編集前に戻す、閉じる。
    ピン番号などの細部は小さくて判読しにくい。

3ed8ba0a:
  alt: 2-4 標準入出力の割り当て（出力論理画面）
  text: |
    「出力論理」画面。出力チャンネル、ピン番号、標準信号名、ユーザー信号名、ONｱｸﾃｨﾌﾞ/OFFｱｸﾃｨﾌﾞ。表示されている例: O#00 D00 COMACK0、D01 COMACK1、D02 NC、D03 NC、D04 SVM、D05 SOUT0、D06 SOUT1、D07 MSTRB、D08～D15 M0～M7（すべて ONｱｸﾃｨﾌﾞ）。ボタン: 前、次、設定、編集前に戻す、閉じる。

8e2b1dab:
  alt: 2-4 入出力信号チェック（重複の警告）
  text: |
    ダイアログ「入出力信号チェック」。「以下の信号が重複しています。」
    ```
    T7START  i#01 D10 － i#32 D02
    T7STOP   i#01 D11 － i#32 D01
    T7RESET  i#01 D12 － i#32 D00
    ```
    「閉じる」ボタン。
