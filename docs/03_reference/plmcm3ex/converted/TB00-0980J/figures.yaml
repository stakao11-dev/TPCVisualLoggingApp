# TB00-0980J（PLMC-M3EX ユーザーズマニュアル メンテナンス編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

c70ecc2a:
  alt: 1-1-1 「ALM」点滅タイミング
  text: |
    パルス波形。点灯（パルス）が 3 回続き、長い消灯をはさんで、また 3 回の点灯が続く。
    - 上の矢印: 1 回の点灯の幅（本文の 250ms）と、点滅のまとまりの間の消灯（本文の 1500ms）
    - 下の括弧: 1 まとまりの点灯の回数。本文: この回数でエラー要因を示す。
    （図の 2 つの矢印と本文の 250ms・1500ms の対応は、図中に数値がないため配置から読んだもの。）

6ed0cbad:
  alt: 番号「3」の記号

1ee456b3:
  alt: 3-1 一部の入力が不可の時の調査（チェック箇所）
  text: |
    - 「センサ」→「中継端子台」→ FA-M3□ の「入力モジュール」→「PLMC-M3EX」→「通信モジュール」→「通信」→ PC の「セッティングPCソフト 入出力モニター画面」
    - FA-M3□ の下部は「CPUモジュール（ラダー）」
    - チェック箇所: ※A（センサと中継端子台の間）、※B（中継端子台と入力モジュールの間）。「センサにLED等あれば ON/OFFチェック」

84d6e2cd:
  alt: 3-1 センサーの状態と I/Oモニター画面の表示色
  text: |
    | センサー | I/Oモニター画面 A接 | I/Oモニター画面 B接 |
    |---|---|---|
    | ON | 緑／赤 | 黒 |
    | OFF | 黒 | 緑／赤 |

    （「緑／赤」は 1 つのセルが斜線で分けられ、緑と赤が書かれているもの。）

f10262e6:
  alt: 3-2 一部の出力が不可の時の調査（チェック箇所）
  text: |
    - PC の「セッティングPCソフト 入出力モニタリング画面（強制出力）」→「通信」→ FA-M3□ の「通信モジュール」→「PLMC-M3EX」→「I/Oモジュール」→「中継端子台」→「ソレノイド、リレーコイル等」
    - FA-M3□ の下部は「CPUモジュール（ラダー）」
    - チェック箇所: ※B（I/Oモジュールと中継端子台の間）、※A（中継端子台の先）。「出力回路の ON/OFF状態」
    - 下に「制御盤回路図」「機体配線図」の範囲を示す括弧

84c0225a:
  alt: 4-2-2 FLASH書き込みソフトの画面
  text: |
    ウィンドウ「標準PLMC-M3Ex FLASH書込ソフト ( D:¥…」。
    - ファイル名: C:¥PLMC-M3Ex¥PlmM3ExV130.ufd（矢印で「FLASHシステムファイル名」）
    - ｼﾘｱﾙNo.: PLM3 － 00001、SUM: 1167
    - ボタン: グループファイル読出、ファイルから読出、ダウンロード、終了

a8f93e49:
  alt: 4-3 PLMC-M3Ex Installer
  text: |
    ダイアログ「PLMC-M3Ex Installer」。「インストールするフォルダを設定して下さい。」、フォルダ「c:¥PlmcM3Ex」、ボタン: 参照、OK、キャンセル。
