# TB00-0983（PLMC-M3Ex 通信ライブラリ リファレンスマニュアル）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
# ビット図のビット番号は LSB=D0 として、引き出し線と括弧の位置から求めた。フラグの値はパッケージのヘッダー
# （Plm3excomnt.h の COML_*、COM_PCLCF_*）とも一致することを確かめた。

a085777c:
  alt: 通信ロギングフラグのビット割り当て
  text: |
    「尚、全ビットを0にすると、ロギング無効になります。」
    | ビット | 内容 |
    |---|---|
    | D0 | ロギング無効 |
    | D1 | 常時ロギング |
    | D2 | 常時ロギング（初期化/終了のみ） |
    | D3 | 常時ロギング（データ送信のみ） |
    | D4 | 常時ロギング（データ受信のみ） |
    | D5 | 常時ロギング（コマンド要求のみ） |
    | D6 | エラーロギング |
    | D7 | エラーロギング（伝送エラーのみ） |
    | D8 | リトライロギング |

120ca1b4:
  alt: パソコンリンクプロトコル選択（fComFlag）のビット割り当て
  text: |
    | ビット | 内容 |
    |---|---|
    | D0 | サムチェック有効：COM_PCLCF_SUMCHK |
    | D1 | 終端文字(0Dh)有り：COM_PCLCF_TERMEN |

7d2c4dba:
  alt: 付加パラメータの例（運転プログラム）
  text: |
    32 ビット。
    | ビット | 内容 |
    |---|---|
    | D0～D15 | プログラム番号（1～32767） |
    | D16～D31 | 先頭ブロック番号（0～63） |

5ef31b2b:
  alt: 付加パラメータの例（ポイントテーブル書込）
  text: |
    32 ビット。
    | ビット | 内容 |
    |---|---|
    | D0～D9 | 書込ポイント数（1～400） |
    | D10～D19 | 書込開始番号（1～400） |
    | D20～D28 | 対象軸（軸フラグ） |

f90f056f:
  alt: 付加パラメータの例（軸番号と送受信、ポイントテーブル読出）
  text: |
    上の図（32 ビット）:
    | ビット | 内容 |
    |---|---|
    | D0～D3 | 0～軸数-1 |
    | D15 | 0:受信、1:送信 |
    本文: DAT_ML2MON は軸番号(D0～D3)、送受信データフラグ。

    図の中の文:
    - DAT_ACOPARAM : 0:1タスク分の受信、1:全タスク分の受信
    - DAT_POINTTABLE : 書込ポイント数(D0～D9)、書込開始番号(D10～D19)、軸フラグ(D20～D28)

    下の図（32 ビット、ポイントテーブル読出）:
    | ビット | 内容 |
    |---|---|
    | D0～D9 | 読出ポイント数（1～400） |
    | D10～D19 | 読出開始番号（1～400） |
    | D20～D28 | 対象軸（軸フラグ） |

91632212:
  alt: DatEndianChange 方式1（PLMC-M3Ex 内部で自動的に変換する）
  text: |
    - 「PCアプリ」の (1)PCデータ と、「FA-M3R」の (2)FA-M3Rデータ の間を、DatEndianChange（PCデータ→FA-M3Rデータ: (1)→(2)、PCデータ←FA-M3Rデータ: (1)←(2)）で変換する。注1（メモリモジュールやイーサネットモジュールなどで PC と FA-M3R の間でデータを授受）
    - FA-M3R のデータは、ラダーから参照や変更を出来ます
    - FA-M3R と「PLMC-M3Ex」の (3)PLMC-M3Exデータ の間は DDL で送り、PLMC-M3Ex 内部の DatEndianChange（FA-M3Rデータ→PLMC-M3Exデータ: (2)→(3)、逆: (2)←(3)）で変換する

fd6d13b2:
  alt: DatEndianChange 方式2（PLMC-M3Ex 内部では変換を行わない）
  text: |
    - 「PCアプリ」の (1)PCデータ と、FA-M3R 上の (3)PLMC-M3Exデータ の間を、DatEndianChange（PCデータ→PLMC-M3Exデータ: (1)→(3)、PCデータ←PLMC-M3Exデータ: (1)←(3)）で変換する。注1
    - FA-M3R 上のデータは PLMC-M3Ex の並びのままなので、ラダーから参照や変更出来ません
    - PLMC-M3Ex 内部の DatEndianChange は取り消し線で消されている（変換しない）

    本文: 方式2 になるデータタイプは DAT_PROGRAM、DAT_DNCDATA、DAT_ADLOG、DAT_TPCDATA。ただし「通信ライブラリを使用してPLMC-M3Exと直接通信する場合は、本関数を使用する必要はありません」。
