ca298290:
  alt: 4-1-6 タスクステータス・軸ステータスのタイミングチャート
  text: |
    イベント: 「コマンド」→「ストップ」→「スタート（再開）」→「次コマンド受付可」。
    - 軌跡発生、補間加減速(指数): コマンドで立ち上がり、ストップで止まり、スタート（再開）で再び立ち上がり、次コマンド受付可で終わる
    - タスクステータス「D0 軌跡発生完」「D1 途中停止中」「D2 軌跡発生中」、軸ステータス「D0 インポジション」「D1 加減速たまり有り」の ON/OFF の変化
    この図のタスクステータスのビット番号（D0～D2）は、ビット割り当ての図（D1 軌跡発生完、D2 途中停止中、D3 軌跡発生中）と 1 つずれている（SLM8000 の TB00-1134 と同じ）。原文のまま写した。

