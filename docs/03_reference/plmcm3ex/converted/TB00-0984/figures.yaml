7427b2c5:
  alt: 4-1-24 メカトロリンク Σ サーボ情報のビット構成
  text: |
    PDF 55 ページを拡大して、引き出し線と括弧の位置から求めた。

    (2) 受信 共通コマンドステータス情報（16 ビット）
    | ビット | 内容 |
    |---|---|
    | D0 | アラーム発生中 |
    | D1 | ワーニング発生中 |
    | D2 | コマンド受け付け可 |
    | D3 | アラームクリア完了 |
    | D6～D7 | 受信コマンドID |
    | D8～D11 | コマンド異常 |
    | D12～D15 | 通信異常 |

    (3) 受信 サーボコマンドステータス情報（32 ビット。Σサーボから読み出したサーボステータスフラグ）
    | ビット | 内容 |
    |---|---|
    | D0 | 移動指令一時停止完了 |
    | D1 | 移動指令中断完了 |
    | D4～D5 | 加減速フィルター種類 |
    | D8 | ラッチ完了1 |
    | D9 | ラッチ完了2 |
    | D10 | 位置情報有効 |
    | D11 | 主電源ON |
    | D12 | モータ通電準備完 |
    | D13 | サーボON |
    | D16～D27 | モニタ種類選択情報（右からモニタ1、モニタ2、モニタ3） |

    (4) 受信 サーボコマンド I/O 情報（32 ビット。Σサーボから読み出した入力信号状態）
    | ビット | 内容 |
    |---|---|
    | D1 | 減速LSスイッチ入力 |
    | D2 | 正転駆動禁止入力 |
    | D3 | 逆転駆動禁止入力 |
    | D4 | 第1外部ラッチ信号 |
    | D5 | 第2外部ラッチ信号 |
    | D6 | 第3外部ラッチ信号 |
    | D7 | 非常停止信号 |
    | D9 | ブレーキ出力 |
    | D10 | 正側ソフトリミット |
    | D11 | 逆側ソフトリミット |
    | D12 | 払い出し完了 |
