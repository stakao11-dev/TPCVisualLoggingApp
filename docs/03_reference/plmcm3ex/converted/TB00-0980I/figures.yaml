# TB00-0980I（PLMC-M3Ex ユーザーズマニュアル 試運転・調整編 7-12～7-15）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁

2b2d5039:
  alt: 7-12-1 PTP の速度モニター
  text: |
    台形の速度の波形。(A) PTP時定数（立ち上がりの傾き）、(B) PTP速度（一定の高さ）、(C) オーバーシュート（立ち上がりと停止のあとの揺れ）。

f79aef6e:
  alt: 7-12-1 直線補間の速度モニター
  text: |
    補間の速度の波形。(A) 補間時定数（立ち上がりと立ち下がりの幅）、(B) 補間速度（運転プログラムによる指令）、(C) オーバーシュート。

12227de8:
  alt: 7-12-2 負荷電流の確認
  text: |
    モータの負荷電流の波形。区間: 加速、定速、減速。(A) 加速時の負荷電流（加速の区間で高い）、(B) 減速時の負荷電流（減速の区間で逆向き）。本文: (A) (B) ≦ 最大負荷電流。

6b396014:
  alt: 7-14 サーボ応答解析の例
  text: |
    TPC-EXCEL のサーボ応答解析のグラフ。「指令速度」（緑）と「応答速度」（ピンク）の台形の速度。縦軸 -50～450、横軸はデータの番号（1～41）。応答速度は指令速度に 2～3 点遅れて追従する。グラフ中に小さな表示（判読できず）がある。

a9e854f0:
  alt: 7-14 真円精度解析の例
  text: |
    TPC-EXCEL の真円精度解析のグラフ。理想円（ピンク）の内側と外側に目盛りの円（灰色）があり、実際の軌跡（紫）が理想円の周りで凹凸を持って一周している。
