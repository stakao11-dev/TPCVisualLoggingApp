# TB00-0980A（PLMC-M3EX ユーザーズマニュアル Ⅰ 導入編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# - 図の多くはセッティングPCソフト・ROMSW設定ソフト・Windows の画面。丸や矢印で示された操作箇所と、読める表示を中心に書いた。
# - 縮小されて小さい文字は「（判読できず）」とした。

08cc0cc2:
  alt: 注意を促す亀の絵

e49d5ce9:
  alt: 2-1 出荷表の見方
  text: |
    「出荷表」の各欄の説明:
    - 「御社/ディーラ」→ 宛先の欄（様）
    - 「オーダNO.」「ソフトバージョン」の欄 →「オーダNO. TH00-□□□□□（問い合わせ時に必要）」
    - 「ハードウェア」「付属品」「ソフトウェア」「オプション」の各行 →「員数/オプションを確認!」

5980c92b:
  alt: 注意を促す亀の絵（【重要1】シリアルナンバー）

7ac22f4d:
  alt: 注意を促す亀の絵（【重要2】ソフトウェアバージョン）

eec68dcb:
  alt: 2-2 マニュアル「PLMC-M3Ex ユーザーズマニュアル」の絵

3449879f:
  alt: 2-2 マニュアル「セッティングPC マニュアル」の絵

0349e086:
  alt: 2-3 PLMC-M3Ex Installer
  text: |
    ダイアログ「PLMC-M3Ex Installer」。「インストールするフォルダを設定して下さい。」、フォルダ「c:¥PlmcM3Ex」、ボタン: 参照、OK、キャンセル。

df4d9b48:
  alt: 2-3 マニュアル「ROM SW設定 マニュアル」の絵

195f3016:
  alt: 2-3 マニュアル「PLMC-M3Ex サンプルラダープログラム説明書」の絵

6ce6af8c:
  alt: 2-4 FA-M3□のモジュール構成例
  text: |
    (ア) ベースモジュールに、左から slot1 (イ) 電源モジュール、(ウ) CPUモジュール、slot2 (エ) PLMC-M3EX、空き …、slot9 (オ) イーサネットモジュール。

326241bd:
  alt: 2-5 WideField□によるFA-M3□とPCの接続
  text: |
    CD から WideField□ を PC にインストールし、PC と FA-M3□ を「・イーサネット ・RS232 ・USB」でつなぐ。FA-M3□ の「ラダーCPU/通信モジュール」（斜線）と PLMC-M3EX。PLMC-M3EX から MECHATROLINK-Ⅲ で「サーボ制御」。

ae918f36:
  alt: 2-6 PLMC-M3EXとの通信確立までの全体の流れ
  text: |
    「PLMC-M3EXとの通信形態の選択」から:
    - Ethernet → 2-6-1-1.
    - RS232C → 2-6-1-2.
    （ここまでが「WideField□を使った通信設定・確認※1※2 2-6-1.」）
    - 2-6-1-1. →「イーサネット通信の確認 2-6-2.」→ 2-6-3.
    - 2-6-1-2. → 2-6-3.
    - 2-6-3. は「PLMC-M3EXとの通信設定・確認」

5cad2692:
  alt: 2-6 CD からのインストール
  text: |
    CD の絵と右向きの矢印。

8891e5e2:
  alt: 2-6 PC と FA-M3□・PLMC-M3EX の通信
  text: |
    PC と FA-M3□ を「・イーサネット ・RS232 ・USB」でつなぐ。FA-M3□ の通信モジュール（斜線）を経て PLMC-M3EX と通信する。PLMC-M3EX から MECHATROLINK-Ⅲ で「サーボ制御」。

3583af4e:
  alt: 2-6-3 初期設定ファイルがないときのメッセージ
  text: |
    ダイアログ「Sxdrv Windows アプリケーション」。警告アイコンと「初期設定ファイル"C:¥PLMC-M3¥plm3exdrv.ini"がありません。デフォルト情報で実行しますか？」、ボタン: OK、キャンセル。

4ce3a452:
  alt: 2-6-3 通信ライブラリの初期化エラー
  text: |
    ダイアログ「Sxdrv Windows アプリケーション」。警告アイコンと「通信ライブラリの初期化エラーです」、OK ボタン。

69da6bdc:
  alt: 2-6-3 通信デバイスが初期化されていないエラー
  text: |
    ダイアログ「Sxdrv Windows アプリケーション」。警告アイコンと「通信デバイスが初期化されていません。」、OK ボタン。

70f4511f:
  alt: 2-6-3 通信設定の画面（初期状態）
  text: |
    画面「通信設定」。
    - 通信形態: パソコンリンク(イーサネット)
    - パソコンリンク設定: CPU(FA-M3) 番号 1、PLMC ユニット番号 0、PLMC スロット番号 2、「通信フラグに特殊モジュールを使用」にチェック
    - パソコンリンクモジュール(RS232C)設定（灰色）: シリアルポート COM1、ステーション番号、サムチェック、終端文字、通信速度・パリティチェック 9600bps, パリティ偶数
    - イーサネットモジュール設定: IPアドレス 0.0.0.0、ポート番号 12289、バイナリーモード（チェックなし）、設定履歴（空）
    - 通信エラーログ: チェックはすべて未選択
    - ボタン: 設定、閉じる
    細部は小さくて判読しにくい。

bff61a3b:
  alt: 2-6-3 セッティングPCソフトのメニュー（終了）と注意
  text: |
    ウィンドウ「標準PLMC-M3Ex セッティングPCソフト ( C:¥PLMC-M3¥plm3exdrv.ini )」のメニュー: 運転、パラメータ、表示設定、バージョン情報、終了（丸で囲み）。
    注意！ PCがサスペンドモードの場合、通信エラー（タイムアウト）が発生する場合があります。■サスペンドモードをオフにする方法 Windowsの「コントロールパネル」にて「電源管理」を選択 電源設定 :常時ON、システムスタンバイ :なし

7da3d990:
  alt: 2-7 ROMSW設定ソフトの画面
  text: |
    ウィンドウ「標準PLMC-M3Ex ROMSW設定ソフト ( C:¥PLMC-M3¥plm3exdrv.ini )」。ファイル名欄と、ボタン: 基本、入力、出力、軸設定、手動パルサー、ファイル読出、ファイル保存、アップロード、ダウンロード、オプション、閉じる。

ae9aef9d:
  alt: 2-8 セッティングPCソフトの運転画面（エラー情報）
  text: |
    「標準PLMC-M3Ex セッティングPCソフト」の運転画面。位置表示（X、Y、Z、A、B、C、R、Q、T すべて 0.000）。運転操作パネルのタブ「エラー情報」が丸で囲まれている。タスク選択 タスク0、動作モード 自動運転、実行モード メモリ運転、動作状態 プログラム実行待機。

4f5c7958:
  alt: 2-8 エラー情報の画面
  text: |
    画面「エラー情報」。「全タスク」を選択。表示: 「パラメータ未設定エラー」「タスク0 サーボOFFエラー」。ボタン: リセット、閉じる。

d405f74c:
  alt: 2-8-1 セッティングPCソフトのメニュー（パラメータ）
  text: |
    メニュー: 運転、パラメータ（丸で囲み）、表示設定、バージョン情報、終了。

09ebc8b5:
  alt: 2-8-1 データ初期化の画面
  text: |
    画面「データ初期化」。ボタン: パラメータ初期化、運転プログラム初期化、全軸アブソポジション初期化、各軸アブソポジション設定（タスク0、X・Y・Z・A・B・C・R・Q・T）、マクロ変数初期化、位置決めのポイントテーブル（タスク0、アップロード、ダウンロード）、運転プログラムバックアップ、閉じる。

9580e958:
  alt: 2-8-1 サーボパラメータの画面
  text: |
    画面「サーボパラメータ」。タスク0 の 第1軸(X)～第4軸(A) の列に、INPOS量、偏差上限値、MPOS偏差上限値、補間加減速時定数、S字加減速時定数、PTP時定数、PTP速度、JOG速度、+側ソフトリミット、−側ソフトリミット、原点復帰方向、原点距離、原点復帰逃げ量、原点復帰早送り速度 などの値が並ぶ。ボタン: ファイルから読出、ファイルに保存、アップロード、ダウンロード、編集前に戻す、閉じる。
    値は小さくて判読しにくい。

ce760bbb:
  alt: 「注意」の吹き出し

b68189fb:
  alt: 2-9 通信設定の画面
  text: |
    画面「通信設定」。
    - 通信形態: パソコンリンク(イーサネット)
    - パソコンリンク設定: CPU(FA-M3) 番号 1、PLMC ユニット番号 0、PLMC スロット番号 2、「通信フラグに特殊モジュールを使用」にチェック
    - パソコンリンクモジュール(RS232C)設定（灰色）
    - イーサネットモジュール設定: IPアドレス 192.168.0.20、ポート番号 12289、バイナリーモード（チェックなし）、設定履歴 192.168.0.20 : 12289 , text mode
    - 通信エラーログ: チェックはすべて未選択
    - ボタン: 設定、閉じる

5f6b3e04:
  alt: 2-9 セッティングPCソフト動作設定の画面
  text: |
    画面「セッティングPCソフト動作設定」。
    - 運転プログラム設定: DNC送信データ長 8192、DNC実行開始データ長 16384、DNC運転プログラムタイプ（テクノコード / Gコード）、起動時編集プログラムタイプ（テクノコード / Gコード）
    - 起動位置: X 0、Y 0、「現在位置取得」ボタン
    - ボタン: 設定、編集前に戻す、閉じる

a257a12b:
  alt: 2-9 ポジション表示形式設定の画面
  text: |
    画面「ポジション表示形式設定」。タスク0。第1軸～第9軸の軸名称（X、Y、Z、A、B、C、R、Q、T）とパルス/表示単位（すべて 1000。第4軸以降は灰色）。円弧処理 MC内部、円弧精度 1、動作プログラム小数点桁数 1000、補間送り速度単位 1 パルス/sec、XZ円弧平面（XZ平面 / ZX平面）。
    注記: 軸名称を変更しても動作プログラムの軸アドレスは変わりません。(X,Y,Z…R,Q,T のまま) セッティングPC/ROMSW設定ソフトの表示が変わるだけですので御注意下さい。

7eb0f0ac:
  alt: 2-9 入出力表示設定の画面
  text: |
    画面「入出力表示設定」。左が入力（入力CH、ピンNo.、標準信号名、ユーザー信号名）、右が出力。
    - 入力 I000 D00～D15: COMRED0、COMRED1、NC、NC、EMS、ONSW、MOK、MFIN、RI40～RI55（と読める）。ピンNo. は M3-Ys33～
    - 出力 O000 D00～D15: COMACK0、COMACK1、NC、NC、SVM、DOUT0、DOUT1、MSTRB、M1～M7（と読める）。ピンNo. は M3-Xs01～
    - 各行にチェックボックス。ボタン: 設定、編集前に戻す、閉じる
    細部は小さくて判読しにくい。

08629a2c:
  alt: 2-9 「注意」の吹き出しと注記
  text: |
    「設定」をクリックをしないと反映されません。「設定」のクリックによって、INIファイル内の情報が更新されます。

66f3008a:
  alt: 4-1 セッティングPCソフトのメニュー（表示設定）
  text: |
    ウィンドウ「標準PLMC-M3Ex セッティングPCソフト ( C:¥PLMC-M3¥plm3exdrv.ini )」のメニュー: 運転、パラメータ、表示設定（丸で囲み）、バージョン情報、終了。

fad74efc:
  alt: 4-1 通信設定の画面
  text: |
    画面「通信設定」。
    - 通信形態: パソコンリンク(イーサネット)
    - パソコンリンク設定: CPU(FA-M3) 番号 1、PLMC ユニット番号 0、PLMC スロット番号 2、「通信フラグに特殊モジュールを使用」はチェックなし
    - パソコンリンクモジュール(RS232C)設定（灰色）: シリアルポート COM1、ステーション番号 1、サムチェック、終端文字、通信速度・パリティチェック 9600bps, パリティ偶数
    - イーサネットモジュール設定: IPアドレス 169.254.68.31、ポート番号 12289、バイナリーモード（チェックなし）、設定履歴 169.254.68.31 : 12289 , text mode
    - 通信エラーログ: ログファイル名（空）、チェックはすべて未選択
    - ボタン: 設定、閉じる

025a6907:
  alt: 「注意」の吹き出し

1420bfb1:
  alt: 「設定」ボタンの絵

2399b094:
  alt: 4-2 セッティングPCソフトのメニュー（運転）
  text: |
    メニュー: 運転（丸で囲み）、パラメータ、表示設定、バージョン情報、終了。

c529d920:
  alt: 4-2 正しく接続できたときの運転画面
  text: |
    「標準PLMC-M3Ex セッティングPCソフト」の運転画面。位置表示（X、Y、Z、A、B、C、R、Q、T すべて 0.000）、運転操作パネル（タスク選択 タスク0、動作モード 自動運転、実行モード メモリ運転、動作状態 プログラム実行待機、オーバーライド 100、送りモード JOG・インチングX1000～X1・手動原点復帰・自動原点復帰、軸キー X-/X+ ～ T-/T+、ボタン: スタート、ストップ、1ショット位置決め、原点設定、原点復帰、ホーム位置、リセット、閉じる）。

c4b4c530:
  alt: 注意を促す亀の絵

d407901e:
  alt: 7-2 セッティングPCソフトのアイコン

c494e393:
  alt: 7-3 セッティングPCソフトの運転画面の構成
  text: |
    運転画面の各部の名前: 「メインメニュー」、「位置表示」、「操作メニュー」、「軸キー」（右側の X-/X+ などのボタン）、「操作ボタン」（下部のボタン列）。

c8481b18:
  alt: 7-3-2 1ショット位置決めの画面
  text: |
    画面「1ショット位置決め」。
    - 位置決めのモード: インクリメンタルPTP（選択）、論理座標系アブソPTP、機械座標系アブソPTP、インクリメンタル補間、論理座標系アブソ補間、機械座標系アブソ補間
    - 移動量/目標位置: X、Y、Z、A（単位 パルス）、ほかの軸は灰色
    - 補間速度: パルス/秒
    - ボタン: 移動開始、移動再開、移動停止、閉じる

4d55a745:
  alt: 注意を促す亀の絵

7986539f:
  alt: 7-3-4 プログラム管理の画面
  text: |
    画面「プログラム管理」。左にプログラムメモリ使用状況（BLK、TSK、PNO。すべて --）、ファイル名（空）、「タスク0(カレントタスク)」、Tコード（選択）/ Gコード、プログラムの編集欄（空）。ボタン: 移動、コピー、削除、ファイルから読出、ファイルに保存、アップロード MⅢ→PC、ダウンロード PC→MⅢ、閉じる。

f64d7c68:
  alt: 7-3-5 X/Y軸の合成軌跡
  text: |
    軌跡表示ウィンドウ。青い線で、左端から右上へ上がり、水平に進み、右端へ下がる台形と、左端から右下へ下がり、水平に進み、右端へ上がる台形が描かれ、全体で六角形の軌跡になっている。

4c01e366:
  alt: 注意を促す亀の絵

b554739b:
  alt: 8-3 ΣⅤのアドレス設定部
  text: |
    サーボアンプ前面の絵。ロータリースイッチ S1、S2（0〜F）、DIP スイッチ S3（1〜4、ON）、7 セグメント表示 1 桁、端子。

c8e73dc9:
  alt: 10-1 出荷リストサンプル
  text: |
    出荷リスト（納品書／出荷表 PLMC-M3Ex用）のサンプル。受注先「ＡＢＣ商事 株式会社 様」、ユーザ「ＤＥＦ工業 株式会社 様」、オーダーNO. ＴＨ００－０８□□□、ソフトバージョン「標準PLMC-M3EX Version1.3.0A」と読める。製品内容（PLMC-M3EX、年間サポート）と、ソフト オプション（セッティングPC、アプリケーションライブラリ、加減速、同期送り、特殊指令、主軸制御、補正、付加機能）の一覧。
    細部は小さくて判読しにくい。

3e110cf5:
  alt: 10-4-2 セッティングPCソフトのメニュー（バージョン情報）
  text: |
    メニュー: 運転、パラメータ、表示設定、バージョン情報（丸で囲み）、終了。

781634b5:
  alt: 10-4-2 バージョン情報（PLMC-M3Ex）
  text: |
    ダイアログ「バージョン情報」。標準ＰＬＭＣ－Ｍ３Ｅｘ運転ソフト。
    - パッケージ: Version 1.3.0A（丸で囲み）
    - Plm3exdrv.exe Version 1.1.0（丸に重なって読みにくい）、plm3excomnt.dll Version 1.3.0、plm3extcnv.dll Version 1.1.0、plm3exgcnv.dll Version 1.1.0
    - ROMソフト Version 1.3.0、シリアルナンバー: 21-00000、SUM(Flash): 6829
    - Copyright (C) 2011
