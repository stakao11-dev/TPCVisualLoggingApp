# TB00-0981（PLMC-M3Ex セッティングPC マニュアル）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# 4-1 画面ツリーの図（66dfc1ae～e44c14e8 の多く）は、各画面の縮小画像。画面の詳しい内容は 5 章の同じ画面の図に書いた。
# 縮小された画面で小さくて読めない箇所は「（判読できず）」とした。

66dfc1ae:
  alt: 4-1 画面ツリー（全体）
  text: |
    メインメニュー（運転、パラメータ、表示設定、バージョン情報、終了）から開く画面のつながりを、縮小画像で示した図。運転操作パネル、1ショット位置決め、サーボパラメータ設定画面、バックアップデータ初期化、ピッチエラー補正データ、工具長補正機能データ、工具径補正機能データ、補間前加減速パラメータ、通信設定、セッティングPC動作設定、ポジション表示設定、入出力表示設定、バージョン情報など。
    縮小画像の文字は小さくて判読できず。

02662680:
  alt: 4-1 運転操作パネルのメニュー
  text: |
    運転操作パネルのメニュー: ポジション(A)、入出力(B)、制御軸(C)、プログラム設定(D)、ティーチング(E)、マクロ変数(F)、オプション(G)、エラー情報(H)。右に「運転画面」の縮小画像。

48ab0260:
  alt: 4-1 A ポジション表示のメニュー
  text: |
    指令位置、機械位置、偏差量、アブソ位置、相対移動量。

