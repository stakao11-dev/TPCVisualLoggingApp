# TB00-0980E（PLMC-M3EX ユーザーズマニュアル 機能説明編）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# - ビット図は LSB = D0 として、引き出し線の位置を画素から求めた（5-20 の AxStatus）。
#   結果は TB00-0984（送受信データ説明書）の AxStatus の D4・D5 と一致する。

9734e08f:
  alt: 4-1 FA-M3□とPLMCの関係
  text: |
    - **PC** ←→（RS232C / イーサネット）→ FA-M3□ の「パソコンリンク」→ PLMC-M3EX の「PCインタフェース機能」→「モーション制御」
    - FA-M3□ の「ラダー制御」:
      - 入力リレー X□□□□□（割り込み可）← PLMC の「共通出力」（共通:全タスク共通）: 通信制御, SVM、Mコード, Ro00～□□、その他
      - 出力リレー Y□□□□□ → PLMC の「共通入力」: 通信制御, 非常停止、ONSW, MOK, MFIN、Ri00～□□、その他
      - 特殊モジュールレジスタ ←→ WRITE/READ
    - PLMC-M3EX の「モーション制御」: モーションコントロール機能（自動運転、コマンド運転、各種移動命令、入出力操作命令、マクロ機能、マルチタスクなど）、各種データ管理（運転プログラム、各種補正データ、マクロ変数、パラメタ）。サーボ制御は MECHATRPOLINK-Ⅲ（図の表記のまま）
    - 特殊モジュールレジスタのデータ位置番号:

      | データ位置番号 | 内容 |
      |---|---|
      | 1 ～ 704 | 通信領域 コマンド、データ送受信 |
      | 705 ～ 950 | 予約 |
      | 951 | RTC動作カウンタ |
      | 952 | フォアグランド動作カウンタ |
      | 953 ～ 962 | 拡張入力レジスタ SRX□ タスク毎出力, Ro16～47 |
      | 963 ～ 996 | 拡張出力レジスタ SRY□ タスク毎入力, Ri16～47 |
      | 997 ～ 998 | 手動パルサカウンタ |
      | 999 ～1000 | ジョイスティックAD値 |
      | 1001 ～1100 [501 ～ 550] | ラダー共有マクロ変数(R) #1200～#1299 |
      | 1101 ～1200 [551 ～ 600] | ラダー共有マクロ変数(W) #1300～#1399 |
      | 1201 ～1510 [601 ～ 755] | ステータスデータ 全体情報, 軸情報, タスク情報 |

      ［ ］は [DWORD] 単位の番号。
    - そのほか: 「I/Oモジュールなど」← 入力信号、→ 出力信号。「カウンタモジュールなど」← 外部PG、手動パルサー

ed60b3c5:
  alt: 5-2 A→Bへの移動命令
  text: |
    論理原点を原点とする X-Y 座標。A(500, 500) から B(1500, 1000) への矢印。

40415c66:
  alt: 5-2 インクレ指令（現在位置からの移動量）
  text: |
    A から現在位置 (X、Y) を経て B へ。x、y は A からの移動量。

c66bf8f8:
  alt: 5-2 機械座標系と論理座標系のアブソ指令
  text: |
    機械原点 (0, 0, 0) と論理原点 (0, 0, 0)。「PTPB Xa Yb」は機械原点からの a、b の位置へ、「PTPA命令（アブソ命令）」は論理原点基準の位置へ移動する。

878f4b23:
  alt: 5-3 指数形補間加減速の軸速度
  text: |
    LIN命令が 2 つ続くときの軸速度。各 LIN命令の速度変化が、指数関数の曲線（時定数）で行われる。

93b56a78:
  alt: 5-3 直線形補間加減速の軸速度
  text: |
    LIN命令が 3 つ続くときの軸速度。各速度変化が一定の時間（直線形補間時定数）の直線で行われる。

b6c8b9f1:
  alt: 5-3 S字加減速
  text: |
    台形の速度（点線）の角を、速度の変化点ごとに Ｔs の区間で丸めた曲線（実線）。

a26d7db1:
  alt: 5-4 PTP命令の直線形加減速
  text: |
    縦軸 指令速度 FP、横軸 時間。PTP命令の台形と、次のPTP命令の台形。100Kpps に達するまでの時間が PtpT(msec)、FP に達するまでの時間が T。

c33290b9:
  alt: 5-5 PTP X1,Y1 の例
  text: |
    始点から目標点 (X1, Y1) へ。X1 と Y1 の移動量。始めは斜め 45° に進み、移動量の少ない Y 軸が先に到着したあと X 軸だけが進む軌跡。

62694108:
  alt: 5-6 LIN Xa Yb F□ の例
  text: |
    目標点 (a, b) へ送り速度 F で直線補間。各軸の速度:
    - fx = a × F ／ √(a² + b²)
    - fy = b × F ／ √(a² + b²)
    - F = √(fx² + fy²)
    右に X軸速度（fx）と Y軸速度（fy）の時間変化。

57c43aaa:
  alt: 5-6 X軸・Y軸の速度（PTP速度）
  text: |
    X軸速度は台形で PTP速度（X軸）に達し、Y軸速度は移動量が少ないため三角形で、PTP速度（Y軸）に届かない。横軸 時間。

f595e8ec:
  alt: 5-9 インポジションチェック（INPOS待ちあり）
  text: |
    ステップN からステップN+1 への速度。① 軌跡発生完了、② 次命令開始。①と②の間が ③ INPOS待ち。

1f660926:
  alt: 5-9 インポジションチェック（F(速度)、①②が同時）
  text: |
    ステップN からステップN+1 への F(速度)。①② が同じ時刻（INPOS待ちなし）。

e71c03c1:
  alt: 5-9 インポジションチェック（速度が重なる場合）
  text: |
    ステップN の速度が下がる途中（点線）でステップN+1 が始まる。

4f4a8ca0:
  alt: 5-10 微小連続ブロック（パス制御）
  text: |
    曲線を細かい矢印でつないだ軌跡。「微小連続ブロック(ステップ)」「微小なLIN命令(直線補間)の連続」。各々の移動ステップ(ブロック)の例: ブロック長 ℓ=1mm、F=2m/min、1ステップ時間=約30msec。

cb773c52:
  alt: 5-11 シングルステップ動作
  text: |
    シングルステップ: シングルステップ モードの間は ON、通常モード(自動運転) で OFF。スタート信号のパルスごとに、動作ステップ n、n+1、n+2 を 1 つずつ実行（移動 → 停止）。通常モードでは n+3、n+4、n+5 を連続動作。

deeada7b:
  alt: 5-12 サイクル運転
  text: |
    サイクル運転モードが ON の間、起動で運転プログラムが 1サイクルずつ繰り返す。OFF にするとその回のサイクルの終わりで止まる。

285790ad:
  alt: 5-14 ストロークリミットの領域
  text: |
    - 左から: ハードOT領域（マシンエンド）、ソフトOT領域、正常領域、ソフトOT領域、ハードOT領域（マシンエンド）
    - 正常領域の両端が「ソフトOTパラメタ +側」と「ソフトOTパラメタ −側」。その間に機械原点
    - ソフトOT領域: ソフトウェアにて停止。SVM ON（サーボ主電源オン）、SV ON（サーボオン）
    - ハードOT領域: ソフトにて、SVM OFF、SV OFF。（ブレーキ動作）
    - 復旧: OT無視モードにて SVM ON、SV ON。（ブレーキ解除）

23877e53:
  alt: 5-15-2 回転軸の角度
  text: |
    円の右が 0°、上が 90°(−270°)、左が 180°(−180°)、下が 270°(−90°)。左上に「…ルス数」（パルス数と思われる、左が切れている）。

317a8856:
  alt: 5-15-3 ねじ切りの Gコード
  text: |
    【Gコード】G32 X＿ Y＿ F＿;
    - X＿: X軸インクレ移動量(±)
    - Y＿: Y軸インクレ移動量(±)
    - F＿: ねじピッチ

48306045:
  alt: 5-15-5 接線制御軸（L1、L2）
  text: |
    X-Y 座標。L1（右向き）のあと L2（下向き）へ曲がる経路。

00d16303:
  alt: 5-15-5 接線制御の各軸速度
  text: |
    X は右、Y は下の向き。① 右へ移動して A で ② 右下へ向きを変える。k: X軸速度は A で下がり、l: Y軸速度は A から始まり、m: Z軸速度は A で向きを変えるためのパルス状の動き。

79136f64:
  alt: 5-15-5 接線制御軸の関連ROMSW
  text: |
    関連する ROMSW: θ軸 (m軸) の以下のROMSWは必ず設定して下さい。
    - 「メカ機構1回転パルス数」θ軸が360°するパルス量
    - 「ソフトリミット」を無効
    詳細は、「ROMSW設定ソフトマニュアル」<4-4.軸設定パラメタ>(TB00-0982)を参照して下さい。
    右の図: X 軸を基準に角度 θ、「接線制御基準位置」、「(k)」、「指令極性」、「メカ機構一周パルス」。

212b9b33:
  alt: 5-15-7 コンベア追従送り同調
  text: |
    - 【X軸】X軸原点から Im の位置で「同調送り」を開始し、「追従送り」で ワーク A → B を追う。Ib は「ここまで来たらエラー」の距離。終了後に「もどり」
    - 【コンベア軸(Y)】(ベルト駆動): ベルトコンベア上のワーク。LM はコンベア軸原点からの距離
    - コンベア軸原点の信号はワーク毎に発生

33d077d3:
  alt: 5-15-9 フレキシブル電子カムのデータの流れ
  text: |
    ① EXCEL編集（② I～V のコンディションデータ・ポイントデータ（全6種）、③ 各軸のグラフ表示 I～II）→ テクノコードプログラム（PTPA X～）。セッティングPCソフトでファイル選択・編集し、④ PLMC-M3EX コントローラへダウンロード。コントローラから読出したプログラムをアップロード。

0607bdb6:
  alt: 5-17-1 バックラッシュ補正の概念図
  text: |
    凡例: ガタの量、機構(テーブル)、モータ軸位置、機構の動き（実線の矢印）、モータの動き（点線の矢印）、バックラッシュ補正による動作（太い矢印）。移動方向が反転するときに、モータをガタの量だけ余分に動かして機構の位置を合わせる。

4f374bda:
  alt: 5-17-2 工具長補正の例（Z の論理座標）
  text: |
    Z の論理座標（( )は Z の論理座標）。機械原点から ②(1000) ③(3000)、④(1000) ⑤(−2000)、⑥(1000) ⑦(2000) へ移動する軌跡。

762db3b8:
  alt: 5-17-2 工具長補正の例（補正後）
  text: |
    同じ動作の補正後の軌跡。②→③→④→⑤→⑥→⑦ と、Z 方向の移動が段状になる。

70fa9e96:
  alt: 5-17-3 工具径補正のテクノコード例
  text: |
    ```
    LIN  X__  Y__  F__  DL__   ;左側補正
     ～
    LIN  X__  Y__  F__  DR__   ;右側補正
     ～
    DC                          ;径補正キャンセル
    ```

ae75760b:
  alt: 5-17-3 工具径補正（G41・G42）
  text: |
    「指令プログラム」の直線に対し、工具（半径 D）が G41（左側）または G42（右側）にずれた位置を通る。

f8d60047:
  alt: 5-17-4 ピッチエラー補正の区間
  text: |
    基点＝機械原点。X軸座標の − 側に ③区間～①区間、+ 側に ①区間～⑧区間。各区間の補正間隔＝100000パルス。ピッチエラー計測誤差の階段状のグラフ。

08102b6b:
  alt: 5-17-4 ピッチエラー補正の設定例
  text: |
    X軸: 補正倍率 :1、補正間隔 :100000、補正データ先頭番号 :0、−側補正区間数 :3、+側補正区間数 :8。
    補正データ（No. → 補正値）: 000 → 3、001 → 2、002 → 0、003 → 0、004 → −2、005 → −3、006 → −4、007 → −5、008 → −5、009 → −6、010 → −6（ここまで X軸で使用）、011～3999 は他の軸で使用。

f011b053:
  alt: 5-17-5 形状補正（コーナー部の軌跡）
  text: |
    直角のコーナーで、「指令」の軌跡に対して「従来の軌跡」（点線）は大きく内側を回り、「補正有の場合の軌跡」は指令に近い。

f9743e14:
  alt: 5-17-5 形状補正（円弧の縮み）
  text: |
    円弧の指令（実線）と実軌跡（点線）。「この縮みを小さくします。」

23782e39:
  alt: 5-17-5 形状補正なしの軌跡
  text: |
    複雑な曲線の指令と実軌跡。「指示と実軌跡のずれ」が見える。

69638fde:
  alt: 5-17-5 形状補正ありの軌跡
  text: |
    同じ曲線の指令と実軌跡。「指令と実軌跡のずれなし」。

f30832b7:
  alt: 5-17-5 円弧動作での各軸の速度（通常）
  text: |
    「サーボ応答チェック」画面（サンプリング 8msec）。上が X軸、下が Y軸の速度 [PPS]（±99875、±49937.5 の目盛、横軸 0～5 [sec]）。正弦波状の速度で、始まりと終わりに角がある。

66b59eac:
  alt: 5-17-5 円弧動作での各軸の速度（プリ解加減速）
  text: |
    「サーボ応答チェック」画面（サンプリング 8msec）。上の速度（±100000 [PPS]）、下（±100 [KPPS] と読める）。始まりと終わりがなめらかな正弦波状の速度。

5bbf8685:
  alt: 5-17-5 真円精度解析の例
  text: |
    当社モーションアナライザでの真円精度解析の例。3 つの条件ごとに、円の指令（黒）と実軌跡（赤）を拡大した図と、条件の文字。
    条件の文字は小さくて判読できず。

a8bdb604:
  alt: 5-17-5 加速ステップへの分解
  text: |
    - 【元の指令】L1 (F) のあと L2 (F)。X速度は Fx1 → Fx2、Y速度は Fy1 → Fy2 に段で変わる
    - 【L1を加速した例】L1 を L11、L12、L13 の加速ステップに分解。X速度は Fx11 → Fx12 → Fx13 → Fx2、Y速度は Fy11 → Fy12 → Fy13 → Fy2。「加速区間としてブロックを分解」

cac3ed18:
  alt: 5-17-5 CAD/CAMによる加減速と加減速なし
  text: |
    - 【CAD/CAMによる加減速】(高精度輪郭制御の精度良好): F1、F2、F3、F4 と速度が段階的に上がり F に達する
    - 【加減速なし】F1～F4 のブロックが同じ速度 F

6ee9a68b:
  alt: 5-18-1 ティーチングの画面
  text: |
    画面「ティーチング」。プログラム:
    ```
    1: LIN X40000 Y20000 F40000;
    2: LIN X40000 Y-20000 F40000;   （選択中）
    3: LIN X-40000 Y-20000 F40000;
    4: LIN X-40000 Y20000 F40000;
    5: END;
    ```
    ステップ変更（+、−）、ティーチング開始ステップ 2、チェック: サイクル、シングル（チェック）、ティーチング（チェック）。ボタン: 逆行、ステップ、挿入、置換、原点シフト、削除、実行、閉じる。

e13630c5:
  alt: 5-18-2 「逆行」動作（JOG/インチング後）
  text: |
    A からステップn で B へ向かう途中で JOG/インチングで移動したあと、「ティーチング移動量の戻り」で A へ戻る。

c7625a5a:
  alt: 5-18-2 「逆行」動作（ステップn-1）
  text: |
    A → B（ステップn-1）→ C（ステップn）。B から「逆行」で A へ戻る。

b81e5589:
  alt: 5-18-4 「挿入」動作（A 脇・B 脇・C 脇）
  text: |
    A → ステップn → B → ステップn+1 → C。JOG で A 脇へ移動したあと、挿入により A脇 → B脇 → C脇（ステップn+1）と点線で示す経路。

5aca9c71:
  alt: 5-18-4 「挿入」された ステップn
  text: |
    A（ステップn-1）から D への「挿入されたステップn」、D から B′ へのステップn+1。もとのステップn は A から B（元々の目標値）。

83416c61:
  alt: 5-18-5 「置換」動作（修正したい位置）
  text: |
    A から B（元の目標値）へのステップn を、JOG/インチングで B 脇（修正したい位置）へ移動して置き換える。次は C′ または C へ。

5f4e8041:
  alt: 5-18-5 「置換」動作（ステップn-1）
  text: |
    A から B（元の目標値）へのステップn-1 を、JOG/インチングで B 脇（修正したい位置）へ置き換える。次のステップn は C′ または C へ。

658a77e7:
  alt: 5-18-7 「削除」動作
  text: |
    A（ステップn-1）から B への「削除したステップ」を削除すると、次の移動命令がPTP/LIN(インクレ)の場合は C′ へ、元の n+1 であるステップn は C へ移動する。

64d758d3:
  alt: 5-18-7 「削除」動作（座標シフト）
  text: |
    A(1000, 2000) から JOG/インチングで A脇へ。(1000, 3000) → (1000, 2000) に座標シフト。ステップn で B脇(3000, 4000) → C脇、または B(3000, 4000) → C。

c24a22be:
  alt: 5-19-2 補間前加減速の処理の流れ
  text: |
    「加速度判定&補間前加減速（自動コーナオーバーライド）今回追加」→「軌跡発生 直線補間 円弧補間など」→「従来の各軸加減速(例:10msec)」の 加減速 → X軸指令、加減速 → Y軸指令。

8cbc29dc:
  alt: 5-19-3 補間前加減速(自動コーナオーバーライド)の速度
  text: |
    補間1、補間2、補間3 の速度。補間の境目 ①、② で速度が最小オーバーライドまで下がる。補間前加減速(自動コーナオーバーライド)時定数で加減速する。

9f2b0dd9:
  alt: 5-19-5 加速度(速度変化量)
  text: |
    V1 から V2 へ向きが変わる。速度変化量 VA = V2 − V1（点線の矢印）。

d45d650b:
  alt: 5-19-6 補間前加減速パラメータの画面
  text: |
    画面「補間前加減速パラメータ」。タスク0。補間前加減速時定数 330 msec（0:補間前加減速無効）。最小オーバーライド設定（加速度 [pls/sec2] → 最小オーバーライド [%]）:

    | 加速度 | 最小オーバーライド |
    |---|---|
    | 0 ～ 500000 | 100 |
    | 500000 ～ 700000 | 80 |
    | 700000 ～ 1000000 | 70 |
    | 1000000 ～ 1200000 | 40 |
    | 1200000 ～ 1500000 | 20 |
    | 1500000 ～ 2000000 | 10 |
    | 2000000 ～ 2500000 | 5 |

    ※加速度は絶対値を設定して下さい。ボタン: ファイル読出、ファイル保存、アップロード、ダウンロード、編集前に戻す、閉じる。

0e155f3b:
  alt: 5-19-6 補間前加減速の時定数とオーバーライド
  text: |
    オーバーライド(%) が 100% から 0% まで、補間前加減速(自動コーナーオーバーライド)時定数で階段状に下がり、最小オーバーライドで止まる。

a5885a43:
  alt: 5-19-7 動作例（V1 から V2 へ 90° の曲がり）
  text: |
    V1（右向き）から V2（上向き）へ曲がる。

45bb95b3:
  alt: 5-19-7 動作例の合成速度（最小OVR20%）
  text: |
    合成速度 [pps]。① と ② の境目で最小OVR20% まで下がり、② の終わりで最小OVR40%。横軸 時間。

6a1ef822:
  alt: 5-19-7 動作例（V1 から V2 へ下向きに曲がる）
  text: |
    V1（右向き）から V2（下向き）へ曲がる。

71d24166:
  alt: 5-19-7 動作例の合成速度（最小OVR100%）
  text: |
    合成速度 [pps]。① と ② の境目は最小OVR100%（速度が下がらない）、② の終わりで最小OVR40%。

7eed9ba8:
  alt: 5-19-7 動作例の合成速度（最小OVR80%）
  text: |
    合成速度 [pps]。① と ② の境目で最小OVR80% まで下がり、② の終わりで最小OVR40%。

eef3fc18:
  alt: 5-19-8 動作例（V1 から V2 へ緩やかに曲がる）
  text: |
    V1（右向き）から V2（右上向き）へ緩やかに曲がる。

202fcc70:
  alt: 5-20 STATUS.ax[].AxStatus の独立位置決めのビット
  text: |
    STATUS.ax[].AxStatus : 各物理軸(0～15)ステータス情報。16 ビット（MSB ～ LSB）のうち:
    - D4: 独立位置決め中
    - D5: 独立位置決め停止中
    ほかのビットは「:」で省略。

d4623349:
  alt: 5-21-5 信号の流れ（手動パルサー・ジョイスティック）
  text: |
    構成: 手動パルサー →「パルスカウンタ」、ジョイスティック →「A/D」。それぞれ「ラダー経由」で PLMC-M3Ex へ渡る。
