# TB04-1478-V11（モーションアナライザ TPC-Excel 説明書 Ver1.1）の図の書き起こし
# scripts/convert_pdf.py が変換時に、各図の直下へ「図の内容」として差し込む。
# キー: 画像ファイル名 (image_NNNNNN_<hash>.png) のハッシュ値の先頭 8 桁
#
# 読み方の注意:
# - 画面の図の多くは、図の外（本文側）にある吹き出しへ矢印が出ている。吹き出しの文は本文に入っているが、
#   docling の読み取りで語順が崩れている箇所がある。設定画面（9-1、10-1、11-1）の吹き出しは PDF と照合して、ここに書いた。
# - この説明書は 2011 年のもので、対象はセッティング PC の 2ch ロギング（POS）と Excel 2000/2003。

c129e226:
  alt: 2-1 システム構成
  text: |
    3 つの箱と CSV ファイルからなる構成図。
    - **ＴＰＣ－Ｅｘｃｅｌ（Ｅｘｃｅｌソフト）**: 解析処理（・合成軌跡 ・サーボ応答精度 ・真円精度 ・直線精度）
    - **セッティングＰＣソフト**: 「ＴＰＣ ロギング操作」
    - **オープンＭＣ**: 「ﾛｷﾞﾝｸﾞﾊﾞｯﾌｧ」（各軸位置情報（時系列ﾃﾞｰﾀ））

    つながり:
    - セッティングＰＣソフト → オープンＭＣ: 「ロギング 開始・停止」
    - オープンＭＣ → セッティングＰＣソフト: 「ロギング データの保存」
    - セッティングＰＣソフト → CSV ﾌｧｲﾙ: 「ﾌｧｲﾙへ保存」
    - CSV ﾌｧｲﾙ → ＴＰＣ－Ｅｘｃｅｌ: 「ﾛｷﾞﾝｸﾞﾃﾞｰﾀ 読み出し」

    図の下の注記: 「CSV ﾌｧｲﾙ：Excel ﾃﾞｰﾀの汎用的な形式です」

f9c8d7c2:
  alt: 5-1 TPC ロギングの原理
  text: |
    オープンＭＣの中の TPC 機能が、位置ループ制御の入力をそのまま時系列データにする様子を示す図。
    - オープンＭＣ内: 「ΔCR」（指令）が位置ループ制御の ＋ 入力へ、「ΔFB」（フィードバック）が － 入力へ入る。位置ループ制御の出力が「指令」としてサーボアンプへ行く
    - サーボアンプからモータ・エンコーダを経て「PG FB」が戻り、ΔFB になる（破線）
    - ΔCR と ΔFB は分岐して「ＴＰＣ機能（時系列データの作成）」にも入る
    - ＴＰＣ機能 → PC（Windows）の「時系列データのファイル化（ｾｯﾃｨﾝｸﾞPC）」: 「TPCﾃﾞｰﾀのｱｯﾌﾟﾛｰﾄﾞ」
    - 時系列データのファイル化 → 「解析処理（TPC－Excel）」

ff59593f:
  alt: 5-3 セッティング PC の TPC ロギングダイアログ
  text: |
    ダイアログ「TPCﾛｷﾞﾝｸﾞ」。丸数字は本文の ①～⑧ の説明に対応する。
    - ①「ロギング中」ラジオボタン
    - ②「バッファデータ [0] ﾎﾟｲﾝﾄ」
    - ③「保存データ [0] ﾎﾟｲﾝﾄ」
    - タブ「ポジション」の中に左右 2 組:
      - ④「軸番号」（左 1、右 2。◀ ▶ ボタンで変える）
      - ⑤「指令位置」「機械位置」のラジオボタン（左右とも指令位置が選ばれている）
    - ⑥「ロギング周期 [0] msec」「（0msec：制御周期毎）」
    - ⑦「ファイル保存(アップロード)方法」: 「手動([ファイルに保存]ボタン)」（選択中）、「ロギング停止時」、「常時」
    - ⑧「ロギングファイル」の入力欄と「参照」ボタン（手動のときは灰色）
    - 下のボタン: 「開始(新規)」「開始(追加)」「停止」「ファイルに保存」「閉じる」

b759a96d:
  alt: 5-4 CSV データ形式
  text: |
    TPC ロギングダイアログの左側（軸番号 1・指令位置）と右側（軸番号 2・指令位置）の選択が、
    矢印で CSV の 1 列目と 2 列目に対応づけられている。CSV の例:

    | サンプリング No. | 1 列目 , 2 列目 |
    |---|---|
    | 1 | 0 , 14 |
    | 2 | 0 , 14 |
    | 3 | 0 , 14 |
    | 4 | 0 , 14 |
    | 5 | 533 , 14 |
    | 6 | 1529 , 50 |
    | （中略） | |
    | 4094 | 6712 , 1799 |
    | 4095 | 17172 , 8276 |

    サンプリング No. はファイルの列ではなく、行の順番を示している。

6c52c905:
  alt: 6-1 合成軌跡
  text: |
    横軸「第１列データ」、縦軸「第２列データ」の座標に円が描かれ、円の中心から両軸へ破線が引かれている。
    吹き出し（一部が切れている）: 「２軸で円を描いた場合は、中心位置や半径などが確認できます。」

66842d75:
  alt: 6-2 サーボ応答精度解析のグラフの例
  text: |
    速度の時間変化のグラフ。縦軸 pps（-60000～60000）、横軸 0～1600。
    - 紺の線（指令）は -40000 と 40000 の間を台形状に行き来する（およそ 250、750、1250 で切り替わる）
    - ピンクの線（FB）は紺の線に少し遅れて追従し、切り替わりの直後にオーバーシュート（約 47000）があり、定常部分にも細かい揺れがある
    - 注記: 「※量子化誤差1000pps」

b195070d:
  alt: 6-3 真円精度解析の考え方
  text: |
    中心 (ｘC、ｒC) から半径 R の理想円の弧と、黒点（サンプルデータ）を結んだ実際の軌跡が描かれている。
    一部を拡大した図では、中心から伸ばした半径の方向に、理想円から実際の点までの距離が「誤差」として示されている（理想円の法線方向の誤差）。
    図中の中心の表記は「(ｘC、ｒC)」と書かれている（yC の誤記とみられる）。

2f4b176f:
  alt: 6-4 直線精度解析の考え方
  text: |
    (Ｘ1，Ｙ1) と (Ｘ2，Ｙ2) を結ぶ「理想直線」と、黒点の「サンプルデータ」を結んだ「軌跡」が描かれている。
    - 「誤差ベクトル」は、理想直線からサンプルデータへ、理想直線に垂直に引いた矢印
    - 拡大図: 誤差ベクトル「L」を、X 方向の成分「Ex」と Y 方向の成分「Ey」に分けている

0160ba79:
  alt: 7-1 ロギング機能の選択（セッティング PC のメニュー）
  text: |
    セッティング PC ソフト（標準SPX）の運転操作パネル。メニュー「OPTION」を開き、「TPCﾛｷﾞﾝｸﾞ」を選んでいる。
    OPTION メニューの項目: ADモニタリング、ADﾛｸﾞｷﾞﾝｸﾞ、DA出力、主軸操作、TPCﾛｷﾞﾝｸﾞ、手ﾊﾟﾙﾓｰﾄﾞ、センサーラッチモニター、FBカウンターモニタ（TPCﾛｷﾞﾝｸﾞ と FBカウンターモニタ以外は灰色）

a3ab7752:
  alt: 7-2 ロギング機能の選択（設定する箇所）
  text: |
    TPC ロギングダイアログ。本文の ①～④ の手順で設定する箇所が丸で囲まれ、矢印が出ている:
    「軸番号」（左右）、「指令位置」「機械位置」の選択（左右）、「ロギング周期」、「ファイル保存(アップロード)方法」（手動を選択）。

bbcf7d46:
  alt: 7-3 ロギングの開始・停止・保存（押すボタン）
  text: |
    TPC ロギングダイアログ。本文の ①～③ に対応して、「開始(新規)」「停止」「ファイルに保存」の各ボタンが丸で囲まれている。

5c61702b:
  alt: 7-4 ロギングデータをファイルに保存
  text: |
    「名前を付けて保存」ダイアログ（保存する場所 test-data）。手順:
    1. 保存先ﾌｫﾙﾀﾞを選択します。
    2. 適当なﾌｧｲﾙ名を入力します。
    3. ﾌｧｲﾙの種類に Log File (*.csv) 選択します。（ﾃﾞﾌｫﾙﾄでこの設定です。）
    4. 「保存(S)」を押して、ﾛｷﾞﾝｸﾞﾃﾞｰﾀを保存します。

fff4d6b5:
  alt: 8-2 マクロの許可
  text: |
    Excel のダイアログ「C:\ASIS\TPC-Excel\TPC-Excel.XLT はマクロを含んでいます。」
    ボタン: 「マクロを無効にする(D)」「マクロを有効にする(E)」「詳細(M)」。
    吹き出し: 「① マクロを有効にする(E) を押してマクロを有効にします。」

a62bf9ce:
  alt: 8-3 解析方法の選択ダイアログの表示（起動直後のシート）
  text: |
    TPC-Excel11.XLT を開いた直後のシート「CSVデータ」。
    - A1「CSVデータ」、A2「X」、B2「Y」（データはまだない）
    - F4～H7 の設定欄: 「ファイル名」、「サーボ応答精度」、「サーボ応答設定」「制御周期」「4」
    - ボタン: 「解析方法選択」（丸で囲み）、「ﾛｷﾞﾝｸﾞﾃﾞｰﾀ読み込み」「解析実行」（灰色）、「データクリア」
    - グラフ「簡易軌跡表示」（空）
    - 下のボタン: 「第1列グラフへ」「第2列グラフへ」「第1,2列グラフへ」
    - シートのタブ: CSVデータ、測定結果
    吹き出し: 「① 解析方法選択 を押すとﾀﾞｲｱﾛｸﾞが表示されます。」

c2a31bea:
  alt: 8-4 解析方法の選択ダイアログ
  text: |
    ダイアログ「解析方法選択」。ラジオボタン「サーボ応答精度」「真円精度」「直線精度」と「変更」ボタン。
    1. 目的とする解析方法を選択します。
    2. 選択後に「変更」を押します。

ec4c8386:
  alt: 8-5 ロギングデータファイルの読み込み
  text: |
    解析方法を選んだあとのシート「CSVデータ」。「ﾛｷﾞﾝｸﾞﾃﾞｰﾀ読み込み」ボタンが丸で囲まれている（本文の ①）。
    設定欄はファイル名「linxa0.csv」、サーボ応答設定の制御周期「4」。
    シートのタブ: CSVデータ、測定結果、第1列データ速度、第2列データ速度、第1,2列データ速度。

6cbfd1a6:
  alt: 8-6 ロギングデータの選択
  text: |
    ダイアログ「ﾛｷﾞﾝｸﾞﾃﾞｰﾀﾌｧｲﾙを開く」（ファイルの場所 test-data、ファイルの種類 Log File (*.csv)）。
    1. 読込み先ﾌｫﾙﾀﾞを選択します。
    2. 目的のﾌｧｲﾙ名を入力します。サンプルデータの servosmpl1.csv を選択します。※
    3. 「開く(O)」を押して、ﾛｷﾞﾝｸﾞﾃﾞｰﾀを読み込みます。

3b1d1148:
  alt: 8-6 解析方法ごとの以後の手順
  text: |
    - サーボ応答精度解析 → ９．サーボ応答精度解析
    - 真円精度解析 → １０．真円精度解析
    - 直線誤差精度 → １１．直線精度解析

d91529a6:
  alt: 9-1 設定項目の入力と解析の実行（サーボ応答精度）
  text: |
    ロギングデータ（a-kp30-3000mm.csv）を読み込んだシート「CSVデータ」。
    - A 列「X」、B 列「Y」にデータ（例: 5087742, 5087975 …）が入る（本文: 「ﾛｷﾞﾝｸﾞﾃﾞｰﾀを読み込むと A,B 列にﾃﾞｰﾀが表示され簡易軌跡が表示されます。」）
    - 設定欄: ファイル名「a-kp30-3000mm.csv」、サーボ応答精度、サーボ応答設定「制御周期」「4」
    - グラフ「簡易軌跡表示」に X-Y の軌跡（右上がりの直線）
    - シートのタブ: CSVデータ、測定結果、第1列データ速度、第2列データ速度、第1,2列データ速度

    吹き出し（PDF 11 ページ）:
    - ①設定項目を入力します。ｻｰﾎﾞ応答の場合は、制御周期を入力します。単位は msec です。（サンプルファイルでは 4msec を設定します。）※制御周期は ROMSW 設定ｿﾌﾄのｾﾐｶｽﾀﾑ画面で確認できます。
    - ②設定項目の入力が完了したら、「解析実行」を押します。解析処理が実行されます。設定項目に不足がある場合はﾒｯｾｰｼﾞが表示されます。
    - 各ﾃﾞｰﾀ毎のｼｰﾄへ移動する場合は「第1列ﾃﾞｰﾀへ」「第2列ﾃﾞｰﾀへ」「第1,2列グラフへ」の各ﾎﾞﾀﾝを押します。

a7cc8b03:
  alt: 9-2 解析結果の表示（サーボ応答精度）
  text: |
    シート「第1,2列データ速度」のグラフ「サーボ応答表示」（03/10/20 16:42:22、a-kp30-3000mm.csv）。
    - 縦軸 pps（-15000～15000）、横軸 msec（0～7000）
    - 凡例: 第1列ﾃﾞｰﾀ（紺）、第2列ﾃﾞｰﾀ（ピンク）。-10000 と 10000 の間を台形状に行き来し、ピンクは切り替わり直後にオーバーシュートがある
    - ボタン: 「グラフ印刷」「グラフ表示設定変更」「設定項目変更」、右下に「設定画面へ」「第1列グラフへ」「第2列グラフへ」

    吹き出し:
    - 見たい部分を拡大するには「グラフ表示設定変更」を押します。（→ ９－３）
    - 設定項目を変更し再度解析するには「設定項目変更」を押します。
    - 設定画面への移動は「設定画面へ」を、第１列ﾃﾞｰﾀの速度ｶｰﾌﾞｸﾞﾗﾌへは「第1列グラフへ」、第２列ﾃﾞｰﾀの速度ｶｰﾌﾞｸﾞﾗﾌへは「第2列グラフへ」の各ﾎﾞﾀﾝを押します。
    - 「グラフ印刷」を押すと、表示中のｸﾞﾗﾌが印刷できます。

0a13db67:
  alt: 9-3 グラフ表示設定変更
  text: |
    ダイアログ「グラフの表示設定」。
    - 座標範囲: 「横軸の最小値を自動にする」「横軸の最大値を自動にする」（チェックあり）、横軸最小値 0 ～ 横軸最大値 4500
    - 「縦軸の最小値を自動にする」「縦軸の最大値を自動にする」（チェックあり）、縦軸最小値 0 ～ 縦軸最大値 1.2
    - 「目盛り線を追加」: 目盛り線を追加する場合はﾁｪｯｸします。
    - 「コメントを追加」とコメント欄: ｸﾞﾗﾌへコメントを追加できます。
    - 「反映」: 押すと設定した変更を反映できます。

57b37a2b:
  alt: 9-4 設定項目変更（サーボ応答精度）
  text: |
    ダイアログ「設定項目変更」。「制御周期 [4]」と「設定」ボタン。
    - サーボ応答精度解析の場合は制御周期のみ変更可能です。
    - 「設定」を押すと、変更した設定で再計算します。

e3d12cad:
  alt: 10-1 設定項目の入力と解析の実行（真円精度）
  text: |
    ロギングデータ（cirsmpl2.csv）を読み込んだシート。
    - A 列「X」、B 列「Y」にデータ（例: 799991, 799995 …）
    - 設定欄（真円精度設定）: ファイル名「cirsmpl2.csv」、半径「50000」、X中心点「750000」、Y中心点「800000」、標準偏差スケール「50」
    - グラフ「簡易軌跡表示」に円の軌跡（縦横の目盛りの違いで楕円に見える）
    - ボタン「円全体グラフへ」。シートのタブ: ﾛｷﾞﾝｸﾞﾃﾞｰﾀ、測定結果、円全体

    吹き出し（PDF 13 ページ）:
    - ①設定項目を入力します。真円精度解析の場合は、半径、X 中心点、Y 中心点、標準偏差スケールの 4 項目を設定します。サンプルデータでは 半径 50000、X 中心点 750000、Y 中心点 800000、標準偏差ｽｹｰﾙ 50 を設定します。※標準偏差スケールについては１０－３を参照
    - ②設定項目の入力が完了したら、「解析実行」を押します。解析処理が実行されます。設定項目に不足がある場合はﾒｯｾｰｼﾞが表示されます。

a8012d56:
  alt: 10-2 解析結果の表示（真円精度）
  text: |
    シート「円全体」のグラフ「真円精度（半径:50000 スケール:50）」（04/01/09 19:39:28、cirsmpl2.csv）。
    - 凡例: 理想円（ピンクの線）、ﾛｷﾞﾝｸﾞﾃﾞｰﾀ（点）、開始30°範囲（赤茶の太い点）、スタート点（○）
    - 理想円の内側と外側に、点線の円が 1 本ずつある
    - ボタン: 「グラフ表示設定変更」「設定項目変更」「グラフ印刷」「設定画面へ」

    吹き出し:
    - 見たい部分を拡大するには「グラフ表示設定変更」を押します。（→ ９－３）
    - 設定項目を変更し再度解析するには「設定項目変更」を押します。（→ １０－３）
    - スタート点は○で表示、開始点から 30°は太線で表示されます。
    - ピンク：理想円。破線：標準偏差スケールで設定した目盛り。この例では理想円と破線間は 50pls、両破線間は 100pls です。
    - 設定画面へ移動する場合は「設定画面へ」を押します。
    - 「グラフ印刷」を押すと、表示中のｸﾞﾗﾌが印刷できます。

e83ad441:
  alt: 10-3 設定項目変更（真円精度）
  text: |
    ダイアログ「設定項目変更」: 半径 [50000]、X軸中心 [750000]、Y軸中心 [800000]、標準偏差スケール [70]、ボタン「標準偏差スケールのみ変更」「全設定項目変更」。
    - 真円精度解析の場合は半径、X 軸中心、Y 軸中心、偏差スケールが変更可能です。
    - 標準偏差スケールのみの変更であれば「標準偏差スケールのみ変更」を押します。
    - 標準偏差スケール以外も変更する場合は、「全設定項目変更」を押します。

538ae1c9:
  alt: 10-3 標準偏差スケールの説明図
  text: |
    ピンクの弧（理想円）の内側と外側に、破線の弧が 1 本ずつある。理想円から破線までの幅が「偏差スケール」。
    本文の説明: 標準偏差スケールは真円精度の解析結果グラフの目盛りで、理想円からの誤差を拡大表示している。

d3e6653c:
  alt: 11-1 設定項目の入力と解析の実行（直線精度）
  text: |
    ロギングデータ（ptpxa20.csv）を読み込んだシート。
    - A 列「X」、B 列「Y」にデータ（例: 0, 15 / 0, 17 …）
    - 設定欄（直線精度）: ファイル名「ptpxa20.csv」、基準直線 始点 X座標 0・Y座標 0、終点 X座標 500000・Y座標 500000、解析データ範囲 開始(1～)、終了(～4097)（値は判読できず）
    - グラフ「簡易軌跡表示」に右上がりの直線（0～500000）
    - ボタン: 「軌跡グラフへ」「軸別直線精度グラフへ」。シートのタブ: ﾛｷﾞﾝｸﾞﾃﾞｰﾀ、測定結果、軌跡、軸別直線精度

    吹き出し（PDF 14 ページ）:
    - ①設定項目を入力します。直線精度解析の設定項目（→ １１－２）
    - ②設定項目の入力が完了したら、「解析実行」を押します。解析処理が実行されます。設定項目に不足がある場合はﾒｯｾｰｼﾞが表示されます。

6ffa9536:
  alt: 「解析実行」ボタン
  text: |
    「解析実行」ボタンの画像（本文中のボタン名の代わり）。

af683520:
  alt: 11-3 解析結果の表示（軸別直線精度）
  text: |
    シート「軸別直線精度」（04/01/08 18:06:29、ptpxa20.csv）。グラフが縦に 3 つ並ぶ。横軸はどれも ﾃﾞｰﾀpoint（0～1200）、縦軸は pls。
    - 「L:XY合成誤差」（0～6000。約 220～550 で約 4800 まで上がる）: 理想直線との法線方向の誤差です。（→ ６－４）
    - 「Ex:X方向誤差」（-1000～4000。同じ区間で約 3400）: 誤差の X 軸成分（→ ６－４）
    - 「Ey:Y方向誤差」（-4000～1000。同じ区間で約 -3400）: 誤差の Y 軸成分（→ ６－４）
    - ボタン: 「グラフ印刷」「グラフ表示設定変更」「設定項目変更」「設定画面へ」「軌跡グラフへ」

    吹き出し:
    - 見たい部分を拡大するには「グラフ表示設定変更」を押します。（→ １１－５）
    - 設定項目を変更し再度解析するには「設定項目変更」を押します。（→ １１－４）
    - 設定画面への移動は「設定画面へ」を、軌跡グラフへの移動は「軌跡グラフへ」を押します。
    - 「グラフ印刷」を押すと、表示中のｸﾞﾗﾌが印刷できます。

a4527144:
  alt: 11-4 設定項目変更（直線精度）
  text: |
    ダイアログ「データ範囲設定」:
    | 項目 | x座標 | y座標 |
    |---|---|---|
    | 基準直線の始点 | 0 | 0 |
    | 基準直線の終点 | 799997 | 800000 |
    | 開始(1～) | 1 | |
    | 終了(～4097) | 998 | |

    - １１－２で設定した値を変更できます。
    - 「設定」を押すと、変更した設定で再計算します。

ba5b349b:
  alt: 11-5 「軸別直線誤差」グラフの表示範囲設定
  text: |
    ダイアログ「「軸別直線誤差」グラフの表示範囲設定」。
    - 横軸（3 つのグラフで共通）: 「横軸の最小値を自動にする」「横軸の最大値を自動にする」（チェックあり）、横軸最小値 0 ～ 横軸最大値 1200
    - 「Lの設定」「EXの設定」「EYの設定」の 3 組。それぞれに「目盛り線を追加」「縦軸の最小値を自動にする」「縦軸の最大値を自動にする」と、縦軸最小値～縦軸最大値（L: 0～6000、EX: -1000～4000、EY: -4000～1000）
    - 「反映」ボタン

51011a77:
  alt: 11-6 「軌跡」グラフ
  text: |
    シート「軌跡」のグラフ（04/01/08 21:56:15、ptpxa20.csv）。縦軸・横軸とも pls（0～600000）。
    - 凡例: ｻﾝﾌﾟﾘﾝｸﾞﾃﾞｰﾀ（点）、理想直線（ピンクの線）。(0,0) から約 (500000, 500000) までの直線で、サンプリングデータは理想直線のわずかに下を通る
    - ボタン: 「グラフ印刷」「グラフ表示設定変更」「設定項目変更」「設定画面へ」「軸別直線精度グラフへ」

    吹き出し:
    - 設定項目を変更し再度解析するには「設定項目変更」を押します。（→ １１－４）
    - 設定画面へは「設定画面へ」を、軸別直線精度ｸﾞﾗﾌは「軸別直線精度グラフへ」を押すと移動できます。
    - 「グラフ印刷」を押すと、表示中のｸﾞﾗﾌが印刷できます。

bb6b4649:
  alt: 12-1 サーボ応答精度解析用ファイル servosmpl1.csv の結果
  text: |
    グラフ「サーボ応答精度」（04/01/09 20:54:33、servosmpl1.csv）。縦軸 pps（-15000～15000）、横軸 msec（0～7000）。
    第1列ﾃﾞｰﾀ（紺）は -10000 と 10000 の間を台形状に行き来し、第2列ﾃﾞｰﾀ（ピンク）は切り替わり直後に約 12000 までのオーバーシュートがある。
    注記: 「※量子化誤差250pps」。本文: ゲインが高すぎてｵｰﾊﾞｼｭｰﾄ、ｱﾝﾀﾞｰｼｭｰﾄが発生しています。

4d767834:
  alt: 12-2 サーボ応答精度解析用ファイル servosmpl2.csv の結果
  text: |
    グラフ「サーボ応答精度」（04/01/09 20:55:09、servosmpl2.csv）。縦軸 pps（-250000～250000）、横軸 msec（0～12000）。
    第1列ﾃﾞｰﾀ（紺）は -200000、0、200000 の間をほぼ垂直に切り替わり、第2列ﾃﾞｰﾀ（ピンク）は指数関数的にゆっくり追いつく。
    注記: 「※量子化誤差250pps」。本文: 位置ループゲインが低いのでサーボの応答がゆるやかです。

9e52d57f:
  alt: 12-3 サーボ応答精度解析用ファイル servosmpl3.csv の結果
  text: |
    グラフ「サーボ応答精度」（04/01/09 20:55:34、servosmpl3.csv）。縦軸 pps（-40000～40000）、横軸 msec（0～3000）。
    0、30000、0、-30000 をくり返す台形の速度で、第1列ﾃﾞｰﾀ（紺）と第2列ﾃﾞｰﾀ（ピンク）がほぼ重なっている。
    注記: 「※量子化誤差250pps」。本文: ゲインを最適に調整することで応答性を上げます。

7a9812a3:
  alt: 12-4 真円精度解析用ファイル cirsmpl1.csv の結果
  text: |
    グラフ「真円精度（半径:50000 スケール:50）」（04/01/09 20:57:29、cirsmpl1.csv）。
    ロギングデータの円は、理想円（ピンク）の内側にほぼ一様にずれている（円弧縮み）。左側（X の負の側）に、開始 30°範囲（赤茶の太線）とスタート点がある。
    本文: サーボの遅れによる円弧縮みは発生していますが、２軸のゲインバランスは良好です。

a9111281:
  alt: 12-5 真円精度解析用ファイル cirsmpl2.csv の結果
  text: |
    グラフ「真円精度（半径:50000 スケール:50）」（04/01/09 21:20:01、cirsmpl2.csv）。
    ロギングデータは理想円（ピンク）の周りで細かくうねり、上下左右の象限の切り替わりで外へ突き出ている。右側（X の正の側）に、開始 30°範囲（赤茶の太線）とスタート点がある。
    グラフ上にデータ点のツールチップ（系列 2 要素 "-30668.48612" (-30668.48612, 34060.8045)）が表示されている。
    本文: ２軸のゲインバランスは良好です。象限切り換わり時に突起性の誤差（約 50 パルス＝5μm）、モータ回転周期に同期した周期性の軌跡誤差（1μm 程度のうねり）が見られる。※1p＝0.1μm のシステムです。
